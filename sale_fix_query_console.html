             WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
             WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
             WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
             WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
             WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
             WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
             WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
             WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
               OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
             WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
             WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
             WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
              AND B.TOT_DC_AMT <> S.DC_AMT + NVL(E.ETC_DC,0)      THEN '8801'
             WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
             WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
             WHEN B.REAL_SALE_AMT <> NVL(HP.AMT,0)                THEN '7001'
             WHEN B.TOT_DC_AMT    <> NVL(HD.AMT,0)                THEN '6001'
             WHEN B.TOT_DC_AMT    <> NVL(DD.AMT,0)                THEN '6002'
             WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
             WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
             WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
             WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
             WHEN D.OVER_DC_CNT > 0                               THEN '6405'
             WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
             WHEN D.ERR_5001 > 0                                  THEN '5001'
             WHEN Z.ERR_FIXED > 0                                 THEN '5003'
             WHEN B.HQ_OFFICE_CD = 'A0001'
              AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                 OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                 OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
             ELSE '0000' END AS FIXED_CD
      FROM BILLS B
      LEFT JOIN D      ON D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
      LEFT JOIN DD5003 Z ON Z.STORE_CD=B.STORE_CD AND Z.SALE_DATE=B.SALE_DATE AND Z.POS_NO=B.POS_NO AND Z.BILL_NO=B.BILL_NO
      LEFT JOIN S      ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
      LEFT JOIN E      ON E.STORE_CD=B.STORE_CD AND E.SALE_DATE=B.SALE_DATE AND E.POS_NO=B.POS_NO AND E.BILL_NO=B.BILL_NO
      LEFT JOIN HP     ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
      LEFT JOIN DP     ON DP.STORE_CD=B.STORE_CD AND DP.SALE_DATE=B.SALE_DATE AND DP.POS_NO=B.POS_NO AND DP.BILL_NO=B.BILL_NO
      LEFT JOIN HD     ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
      LEFT JOIN DD     ON DD.STORE_CD=B.STORE_CD AND DD.SALE_DATE=B.SALE_DATE AND DD.POS_NO=B.POS_NO AND DD.BILL_NO=B.BILL_NO
)
SELECT SALE_DATE, FIXED_CD, COUNT(*) CNT
      ,SUM(CASE WHEN ORIG_CD = FIXED_CD THEN 1 ELSE 0 END) AS SAME_AS_ORIG
      ,SUM(CASE WHEN ORIG_CD <> FIXED_CD THEN 1 ELSE 0 END) AS NEWLY_FOUND
  FROM JUDGE
 GROUP BY SALE_DATE, FIXED_CD
 ORDER BY SALE_DATE, FIXED_CD;`
},

qs3:{ tag:"S-3", kind:"SELECT", scope:"대상 본사", name:"통합 판정 — 전표별 대표 코드 (ORIG_CD vs FIXED_CD)",
  desc:"전표별 대표 코드 1건. 프로시저의 \"첫 오류에서 RETURN\" 을 CASE 순서로 재현한 것이라 한 전표당 한 코드만 나옵니다. ORIG_CD = 프로시저가 반환했을 코드(결함 포함), FIXED_CD = 결함 제거 후, DIFF=Y 는 놓치던 건. 순서: 1404→4404→3404→[4414→5404]→6404→7404→9211→9212→9023→9001~9004→8001/8801(벤슨)→8002→8003→7001→6001→6002→6103→6102→6303→6305→6405→6505→5001→5003→NE01(A0001 만). 결제수단별(3xxx)·세트(5Pxx)·절대값 검사(VAT00 등)는 여기 없고 P-1, D-5, H-5 로 봅니다. 코드 → 조치: 8801 케이스 1·2, 8002/9023/VAT00 케이스 4, 5003/6405 케이스 3, 6102 새 유형.",
  sql:
`WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, HQ_OFFICE_CD, SALE_YN
          ,TOT_SALE_AMT, TOT_DC_AMT, VAT_AMT, NET_SALE_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
D AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
            ,SUM(SALE_AMT) SALE_AMT, SUM(DC_AMT) DC_AMT, SUM(REAL_SALE_AMT) REAL_AMT, SUM(VAT_AMT) VAT_AMT
            ,SUM(CASE WHEN VAT_AMT       < 0 THEN 1 ELSE 0 END)                 MINUS_VAT_CNT
            ,SUM(CASE WHEN REAL_SALE_AMT < 0 THEN 1 ELSE 0 END)                 MINUS_REAL_CNT
            ,SUM(CASE WHEN DC_AMT        < 0 THEN 1 ELSE 0 END)                 MINUS_DC_CNT
            ,SUM(CASE WHEN ABS(SALE_AMT) < ABS(DC_AMT) THEN 1 ELSE 0 END)       OVER_DC_CNT
            ,SUM(CASE WHEN SALE_AMT - DC_AMT <> REAL_SALE_AMT THEN 1 ELSE 0 END) ERR_5001
            ,SUM(DECODE(SUBSTRB(PROD_CD,1,4),'LYNK',ERP_SEND_AMT,SALE_AMT))     ERP_SEND_AMT
        FROM TB_SL_SALE_DTL WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DD5003 AS (
    SELECT A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO
          ,SUM(CASE WHEN X.SUM_DC IS NOT NULL AND A.DC_AMT <> X.SUM_DC THEN 1 ELSE 0 END) ERR_ORIG
          ,SUM(CASE WHEN A.DC_AMT <> NVL(X.SUM_DC,0) THEN 1 ELSE 0 END)                   ERR_FIXED
      FROM TB_SL_SALE_DTL A
      LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO,SUM(DC_AMT) SUM_DC
                   FROM TB_SL_SALE_DTL_DC WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                  GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO) X
        ON X.STORE_CD=A.STORE_CD AND X.SALE_DATE=A.SALE_DATE AND X.POS_NO=A.POS_NO AND X.BILL_NO=A.BILL_NO
       AND X.BILL_DTL_NO=A.BILL_DTL_NO
     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
     GROUP BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO),
S AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
            ,SUM(DECODE(PAY_CD,'05',0,'12',0,PAY_AMT))       REAL_AMT
            ,SUM(DECODE(PAY_CD,'05',PAY_AMT,'12',PAY_AMT,0)) DC_AMT
            ,SUM(VAT_AMT)                                    VAT_AMT
            ,SUM(DECODE(PAY_CD,'04',VAT_AMT,0))              POINT_VAT
            ,SUM(PAY_AMT)                                    PAY_ALL
        FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
E AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, SUM(DC_AMT) ETC_DC
        FROM TB_SL_SALE_HDR_DC
       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} AND DC_CD NOT IN ('02','12','05')
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_HDR_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_DTL_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_HDR_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_DTL_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
JUDGE AS (
    SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
          ,B.TOT_SALE_AMT, B.TOT_DC_AMT, B.VAT_AMT, B.NET_SALE_AMT, B.REAL_SALE_AMT
          ,D.SALE_AMT DTL_SALE, D.DC_AMT DTL_DC, D.VAT_AMT DTL_VAT, D.REAL_AMT DTL_REAL
          ,S.REAL_AMT SEQ_REAL, S.DC_AMT SEQ_DC, S.VAT_AMT SEQ_VAT, E.ETC_DC
          ,HP.AMT HDRPAY_AMT, HD.AMT HDRDC_AMT, DD.AMT DTLDC_AMT
          -- ---------------- 원본 프로시저 판정 (결함 그대로) ----------------
          ,CASE
             WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'
             WHEN D.CNT IS NULL                                   THEN '4404'
             WHEN S.CNT IS NULL                                   THEN '3404'
             WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
             WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
             WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
             WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
             WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
             WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
             WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
             WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
               OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
             WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
             WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
             WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
              AND E.ETC_DC IS NOT NULL                                              -- NULL 이면 통과(결함)
              AND B.TOT_DC_AMT <> S.DC_AMT + E.ETC_DC              THEN '8801'
             WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
             WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
             WHEN HP.AMT IS NOT NULL AND B.REAL_SALE_AMT <> HP.AMT THEN '7001'      -- NULL 이면 통과(결함)
             WHEN B.TOT_DC_AMT <> 0 AND B.TOT_DC_AMT <> NVL(HD.AMT,0) THEN '6001'   -- 할인 0 이면 미조회(결함)
             WHEN B.TOT_DC_AMT <> 0 AND B.TOT_DC_AMT <> NVL(DD.AMT,0) THEN '6002'
             WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
             WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
             WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
             WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
             WHEN D.OVER_DC_CNT > 0                               THEN '6405'
             WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
             WHEN D.ERR_5001 > 0                                  THEN '5001'
             WHEN Z.ERR_ORIG > 0                                  THEN '5003'
             WHEN B.HQ_OFFICE_CD = 'A0001'
              AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                 OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                 OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
             ELSE '0000' END AS ORIG_CD
          -- ---------------- 결함 제거 판정 ----------------
          ,CASE
             WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'
             WHEN D.CNT IS NULL                                   THEN '4404'
             WHEN S.CNT IS NULL                                   THEN '3404'
             WHEN HP.CNT IS NULL                                  THEN '4414'
             WHEN DP.CNT IS NULL                                  THEN '5404'
             WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
             WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
             WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
             WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
             WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
             WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
             WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
             WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
               OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
             WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
             WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
             WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
              AND B.TOT_DC_AMT <> S.DC_AMT + NVL(E.ETC_DC,0)      THEN '8801'
             WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
             WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
             WHEN B.REAL_SALE_AMT <> NVL(HP.AMT,0)                THEN '7001'
             WHEN B.TOT_DC_AMT    <> NVL(HD.AMT,0)                THEN '6001'
             WHEN B.TOT_DC_AMT    <> NVL(DD.AMT,0)                THEN '6002'
             WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
             WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
             WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
             WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
             WHEN D.OVER_DC_CNT > 0                               THEN '6405'
             WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
             WHEN D.ERR_5001 > 0                                  THEN '5001'
             WHEN Z.ERR_FIXED > 0                                 THEN '5003'
             WHEN B.HQ_OFFICE_CD = 'A0001'
              AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                 OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                 OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
             ELSE '0000' END AS FIXED_CD
      FROM BILLS B
      LEFT JOIN D      ON D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
      LEFT JOIN DD5003 Z ON Z.STORE_CD=B.STORE_CD AND Z.SALE_DATE=B.SALE_DATE AND Z.POS_NO=B.POS_NO AND Z.BILL_NO=B.BILL_NO
      LEFT JOIN S      ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
      LEFT JOIN E      ON E.STORE_CD=B.STORE_CD AND E.SALE_DATE=B.SALE_DATE AND E.POS_NO=B.POS_NO AND E.BILL_NO=B.BILL_NO
      LEFT JOIN HP     ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
      LEFT JOIN DP     ON DP.STORE_CD=B.STORE_CD AND DP.SALE_DATE=B.SALE_DATE AND DP.POS_NO=B.POS_NO AND DP.BILL_NO=B.BILL_NO
      LEFT JOIN HD     ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
      LEFT JOIN DD     ON DD.STORE_CD=B.STORE_CD AND DD.SALE_DATE=B.SALE_DATE AND DD.POS_NO=B.POS_NO AND DD.BILL_NO=B.BILL_NO
)
SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN
      ,ORIG_CD, FIXED_CD
      ,CASE WHEN ORIG_CD <> FIXED_CD THEN 'Y' ELSE ' ' END AS DIFF
      ,TOT_SALE_AMT, TOT_DC_AMT, VAT_AMT, NET_SALE_AMT, REAL_SALE_AMT
      ,DTL_SALE, DTL_DC, DTL_VAT, DTL_REAL
      ,SEQ_REAL, SEQ_DC, SEQ_VAT, ETC_DC
      ,HDRPAY_AMT, HDRDC_AMT, DTLDC_AMT
  FROM JUDGE
 WHERE FIXED_CD <> '0000'                 -- 정상까지 보려면 이 줄 삭제
 ORDER BY SALE_DATE, FIXED_CD, STORE_CD, POS_NO, BILL_NO;`
},

qh1:{ tag:"H-1", kind:"SELECT", scope:"대상 본사", name:"존재 여부 (1404 · 4404 · 3404 · 4414 · 5404 · 6404 · 7404)",
  desc:"[판별] 헤더 기준으로 하위 6테이블에 행이 있는지 COUNT 로 셉니다. 1404 헤더 금액 NULL · 4404 DTL 없음 · 3404 PAY_SEQ 없음 · 4414 HDR_PAY 없음(신규코드) · 5404 DTL_PAY 없음 · 6404/7404 헤더 할인≠0 인데 HDR_DC/DTL_DC 없음. 원본은 HDR_PAY/DTL_PAY 를 SUM 으로 읽어 행이 없어도 NULL 만 와서 4414·5404 를 한 번도 못 잡았고 이어지는 7001 도 통과합니다. ORIG_DETECT = 원본 검출 가능 여부. [상세] 걸린 전표의 6테이블 행수·금액합을 테이블별 행으로 펼쳐 어디가 비었는지 보여 줍니다.",
  sql:
`/* ═══ [판별] 존재 여부 (1404 · 4404 · 3404 · 4414 · 5404 · 6404 · 7404) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN, TOT_SALE_AMT, TOT_DC_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
CNT AS (
    SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
          ,(SELECT COUNT(*) FROM TB_SL_SALE_DTL     X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) DTL_CNT
          ,(SELECT COUNT(*) FROM TB_SL_SALE_PAY_SEQ X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) SEQ_CNT
          ,(SELECT COUNT(*) FROM TB_SL_SALE_HDR_PAY X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) HPAY_CNT
          ,(SELECT COUNT(*) FROM TB_SL_SALE_DTL_PAY X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) DPAY_CNT
          ,(SELECT COUNT(*) FROM TB_SL_SALE_HDR_DC  X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) HDC_CNT
          ,(SELECT COUNT(*) FROM TB_SL_SALE_DTL_DC  X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) DDC_CNT
      FROM BILLS B
)
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
      ,B.TOT_SALE_AMT, B.TOT_DC_AMT, B.REAL_SALE_AMT
      ,C.DTL_CNT, C.SEQ_CNT, C.HPAY_CNT, C.DPAY_CNT, C.HDC_CNT, C.DDC_CNT
      ,CASE WHEN B.TOT_SALE_AMT IS NULL                  THEN '1404'
            WHEN C.DTL_CNT  = 0                          THEN '4404'
            WHEN C.SEQ_CNT  = 0                          THEN '3404'
            WHEN C.HPAY_CNT = 0                          THEN '4414'
            WHEN C.DPAY_CNT = 0                          THEN '5404'
            WHEN B.TOT_DC_AMT <> 0 AND C.HDC_CNT = 0     THEN '6404'
            WHEN B.TOT_DC_AMT <> 0 AND C.DDC_CNT = 0     THEN '7404'
       END AS RESULT_CD
      ,CASE WHEN B.TOT_SALE_AMT IS NULL OR C.DTL_CNT=0 OR C.SEQ_CNT=0
              OR (B.TOT_DC_AMT<>0 AND (C.HDC_CNT=0 OR C.DDC_CNT=0)) THEN 'Y'
            ELSE 'N (원본 미검출)' END AS ORIG_DETECT
  FROM BILLS B, CNT C
 WHERE C.STORE_CD=B.STORE_CD AND C.SALE_DATE=B.SALE_DATE AND C.POS_NO=B.POS_NO AND C.BILL_NO=B.BILL_NO
   AND (  B.TOT_SALE_AMT IS NULL
       OR C.DTL_CNT=0 OR C.SEQ_CNT=0 OR C.HPAY_CNT=0 OR C.DPAY_CNT=0
       OR (B.TOT_DC_AMT<>0 AND (C.HDC_CNT=0 OR C.DDC_CNT=0)) )
 ORDER BY B.SALE_DATE, B.STORE_CD, B.POS_NO, B.BILL_NO;

/* ═══ [상세] 존재 여부에 걸린 전표의 각 테이블 실제 행 — 어느 테이블이 비었는지 한눈에 ═══ */
WITH BILLS AS (
    SELECT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN, TOT_SALE_AMT, TOT_DC_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
)
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, B.SALE_YN, B.TOT_SALE_AMT, B.TOT_DC_AMT, B.REAL_SALE_AMT
      ,T.테이블, T.행수, T.금액합
  FROM BILLS B
  CROSS JOIN LATERAL (
        SELECT 'TB_SL_SALE_DTL' 테이블, COUNT(*) 행수, SUM(SALE_AMT) 금액합 FROM TB_SL_SALE_DTL X
         WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO
        UNION ALL SELECT 'TB_SL_SALE_PAY_SEQ', COUNT(*), SUM(PAY_AMT) FROM TB_SL_SALE_PAY_SEQ X
         WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO
        UNION ALL SELECT 'TB_SL_SALE_HDR_PAY', COUNT(*), SUM(PAY_AMT) FROM TB_SL_SALE_HDR_PAY X
         WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO
        UNION ALL SELECT 'TB_SL_SALE_DTL_PAY', COUNT(*), SUM(PAY_AMT) FROM TB_SL_SALE_DTL_PAY X
         WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO
        UNION ALL SELECT 'TB_SL_SALE_HDR_DC', COUNT(*), SUM(DC_AMT) FROM TB_SL_SALE_HDR_DC X
         WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO
        UNION ALL SELECT 'TB_SL_SALE_DTL_DC', COUNT(*), SUM(DC_AMT) FROM TB_SL_SALE_DTL_DC X
         WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO
  ) T
 WHERE B.TOT_SALE_AMT IS NULL
    OR NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL     X WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO)
    OR NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ X WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO)
    OR NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR_PAY X WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO)
    OR NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL_PAY X WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO)
    OR (B.TOT_DC_AMT <> 0 AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR_DC X WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO))
    OR (B.TOT_DC_AMT <> 0 AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL_DC X WHERE X.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO))
 ORDER BY B.STORE_CD, B.POS_NO, B.BILL_NO, T.테이블;`
},

qh2:{ tag:"H-2", kind:"SELECT", scope:"대상 본사", name:"고아 자식행 (ORPH) — 헤더 없이 자식만",
  desc:"[판별] H-1 의 반대 방향 (ORPH). 헤더는 없는데 자식 9테이블에만 행이 남은 고아행 수. 테이블 9줄이 항상 나오고 RESULT_CD 는 고아행이 있을 때만 ORPH 입니다(S-0 는 그 줄만 셉니다). 전부 0 이어야 합니다. 원인은 헤더만 삭제된 수기 작업. [상세] 고아행의 전표 키와 행수·금액합을 테이블별로.",
  sql:
`/* ═══ [판별] 고아 자식행 (ORPH) — 헤더 없이 자식만 ═══ */

 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS
  (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.STORE_CD=x.STORE_CD AND h.SALE_DATE=x.SALE_DATE

    AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)
UNION ALL SELECT CASE WHEN COUNT(*) > 0 THEN 'ORPH' END, 'TB_SL_SALE_HDR_PAY', COUNT(*) FROM TB_SL_SALE_HDR_PAY x
 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS

    AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)
UNION ALL SELECT CASE WHEN COUNT(*) > 0 THEN 'ORPH' END, 'TB_SL_SALE_DTL_PAY', COUNT(*) FROM TB_SL_SALE_DTL_PAY x
 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS
  (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.STORE_CD=x.STORE_CD AND h.SALE_DATE=x.SALE_DATE

UNION ALL SELECT CASE WHEN COUNT(*) > 0 THEN 'ORPH' END, 'TB_SL_SALE_DTL_DC', COUNT(*) FROM TB_SL_SALE_DTL_DC x
 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS

    AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)
UNION ALL SELECT CASE WHEN COUNT(*) > 0 THEN 'ORPH' END, 'TB_SL_SALE_PAY', COUNT(*) FROM TB_SL_SALE_PAY x
 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS
  (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.STORE_CD=x.STORE_CD AND h.SALE_DATE=x.SALE_DATE
    AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)
UNION ALL SELECT CASE WHEN COUNT(*) > 0 THEN 'ORPH' END, 'TB_SL_SALE_PAY_COUPN', COUNT(*) FROM TB_SL_SALE_PAY_COUPN x
 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS

/* ═══ [상세] 고아 자식행의 실제 키 — [판별] 과 같은 9개 테이블, 어느 전표 키가 헤더 없이 남았는지 ═══ */

SELECT 'TB_SL_SALE_PAY_COUPN', x.STORE_CD, x.SALE_DATE, x.POS_NO, x.BILL_NO, COUNT(*), SUM(x.DC_AMT)

 WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}}
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD=x.HQ_OFFICE_CD AND h.STORE_CD=x.STORE_CD AND h.SALE_DATE=x.SALE_DATE AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)

SELECT 'TB_SL_SALE_HDR_PAY', x.STORE_CD, x.SALE_DATE, x.POS_NO, x.BILL_NO, COUNT(*), SUM(x.PAY_AMT)

SELECT 'TB_SL_SALE_DTL_PAY', x.STORE_CD, x.SALE_DATE, x.POS_NO, x.BILL_NO, COUNT(*), SUM(x.PAY_AMT)

SELECT 'TB_SL_SALE_DTL_DC', x.STORE_CD, x.SALE_DATE, x.POS_NO, x.BILL_NO, COUNT(*), SUM(x.DC_AMT)

SELECT 'TB_SL_SALE_PAY', x.STORE_CD, x.SALE_DATE, x.POS_NO, x.BILL_NO, COUNT(*), SUM(x.PAY_AMT)

   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD=x.HQ_OFFICE_CD AND h.STORE_CD=x.STORE_CD AND h.SALE_DATE=x.SALE_DATE AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)

   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD=x.HQ_OFFICE_CD AND h.STORE_CD=x.STORE_CD AND h.SALE_DATE=x.SALE_DATE AND h.POS_NO=x.POS_NO AND h.BILL_NO=x.BILL_NO)
