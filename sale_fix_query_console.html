qh3:{ tag:"H-3", kind:"SELECT", scope:"대상 본사", name:"헤더 항등식 (9211 · 9212 · 9023)",
  desc:"[판별] 조인 없이 헤더 한 행만 보는 항등식. 9211 매출인데 실매출 음수 · 9212 반품인데 양수 · 9023 NET_SALE_AMT + VAT_AMT ≠ REAL_SALE_AMT. 9023 은 VAT 만 고치고 NET 을 안 고쳤을 때 나오며 케이스 4 B-2 가 NET = REAL − VAT 로 맞춥니다. 대량 기간 점검은 이것부터. [상세] 걸린 전표의 상세 VAT 행과 결제 VAT 행을 같이 보여 어느 쪽이 어긋났는지.",
  sql:
`/* ═══ [판별] 헤더 항등식 (9211 · 9212 · 9023) ═══ */
SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN
      ,TOT_SALE_AMT, TOT_DC_AMT, NET_SALE_AMT, VAT_AMT, REAL_SALE_AMT
      ,NET_SALE_AMT + VAT_AMT AS NET_PLUS_VAT
      ,(NET_SALE_AMT + VAT_AMT) - REAL_SALE_AMT AS DIFF
      ,CASE WHEN SALE_YN='Y' AND REAL_SALE_AMT < 0 THEN '9211'
            WHEN SALE_YN='N' AND REAL_SALE_AMT > 0 THEN '9212'
            ELSE '9023' END AS RESULT_CD
  FROM TB_SL_SALE_HDR
 WHERE HQ_OFFICE_CD = '{{HQ}}'
   AND {{OPT:datecond}}
   {{LINE:store:}}
   {{LINE:extra:}}
   AND (  (SALE_YN='Y' AND REAL_SALE_AMT < 0)
       OR (SALE_YN='N' AND REAL_SALE_AMT > 0)
       OR (NET_SALE_AMT + VAT_AMT <> REAL_SALE_AMT) )
 ORDER BY SALE_DATE, STORE_CD, POS_NO, BILL_NO;

/* ═══ [상세] 걸린 전표의 상세 VAT 행과 결제 VAT 행 — 헤더 항등식이 깨진 원인이 어느 쪽인지 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN
      ,h.NET_SALE_AMT, h.VAT_AMT AS 헤더VAT, h.REAL_SALE_AMT
      ,(h.NET_SALE_AMT + h.VAT_AMT) - h.REAL_SALE_AMT AS DIFF
      ,'DTL' 구분, d.BILL_DTL_NO AS 행, d.PROD_CD AS 코드, d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT AS 행_REAL, d.VAT_AMT AS 행_VAT
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_DTL d
    ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND (  (h.SALE_YN='Y' AND h.REAL_SALE_AMT < 0)
       OR (h.SALE_YN='N' AND h.REAL_SALE_AMT > 0)
       OR (h.NET_SALE_AMT + h.VAT_AMT <> h.REAL_SALE_AMT) )
UNION ALL
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN
      ,h.NET_SALE_AMT, h.VAT_AMT, h.REAL_SALE_AMT
      ,(h.NET_SALE_AMT + h.VAT_AMT) - h.REAL_SALE_AMT
      ,'PAY_SEQ', TO_CHAR(s.PAY_SEQ), s.PAY_CD, s.PAY_AMT, NULL, s.TAX_AMT, s.VAT_AMT
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_PAY_SEQ s
    ON s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND (  (h.SALE_YN='Y' AND h.REAL_SALE_AMT < 0)
       OR (h.SALE_YN='N' AND h.REAL_SALE_AMT > 0)
       OR (h.NET_SALE_AMT + h.VAT_AMT <> h.REAL_SALE_AMT) )
 ORDER BY 1, 2, 3, 9, 10;`
},

qh4:{ tag:"H-4", kind:"SELECT", scope:"대상 본사", name:"헤더 과세+면세 = 실매출 (9024)",
  desc:"[판별] 9023 이 안 보는 분해식. TAX_SALE_AMT + NO_TAX_SALE_AMT ≠ REAL_SALE_AMT (9024). 면세 상품 분류나 집계 오류에서 나옵니다. [상세] 상세 행 중 VAT 0 인데 금액 있는 행을 \"면세?\" 로 표시.",
  sql:
`/* ═══ [판별] 헤더 과세+면세 = 실매출 (9024) ═══ */
SELECT STORE_CD, POS_NO, BILL_NO, SALE_YN
      ,REAL_SALE_AMT, TAX_SALE_AMT, NO_TAX_SALE_AMT, NET_SALE_AMT, VAT_AMT
      ,TAX_SALE_AMT + NVL(NO_TAX_SALE_AMT,0) - REAL_SALE_AMT AS 과세면세차
      ,'9024' AS RESULT_CD
  FROM TB_SL_SALE_HDR
 WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
   AND TAX_SALE_AMT + NVL(NO_TAX_SALE_AMT,0) <> REAL_SALE_AMT
 ORDER BY 1,2,3;

/* ═══ [상세] 과세/면세 분해가 안 맞는 전표의 상세 행 — 면세 상품이 섞였는지 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN
      ,h.REAL_SALE_AMT, h.TAX_SALE_AMT, h.NO_TAX_SALE_AMT
      ,h.TAX_SALE_AMT + NVL(h.NO_TAX_SALE_AMT,0) - h.REAL_SALE_AMT AS 과세면세차
      ,d.BILL_DTL_NO, d.PROD_CD, d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT AS 행_REAL, d.VAT_AMT AS 행_VAT
      ,CASE WHEN d.VAT_AMT = 0 AND d.REAL_SALE_AMT <> 0 THEN '면세?' END AS 비고
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_DTL d
    ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND h.TAX_SALE_AMT + NVL(h.NO_TAX_SALE_AMT,0) <> h.REAL_SALE_AMT
 ORDER BY 1, 2, 3, 9;`
},

qh5:{ tag:"H-5", kind:"SELECT", scope:"대상 본사", name:"★ 세 곳 모두 VAT 0 (VAT00) — 상호대사가 못 잡는 유형",
  desc:"[판별] 실매출≠0 · 과세매출≠0 인데 헤더 VAT 0 (VAT00). 헤더·상세·결제 세 곳이 모두 0 이면 9003 도 8002 도 전부 통과하므로 상호대사로는 절대 못 잡는 유형입니다. 0903 5건 전부 배달(가승인 18) = 케이스 4 대상. [상세] 그 전표의 상세 행(기대 VAT 포함)·PAY_SEQ 행·가승인 행을 한 번에.",
  sql:
`/* ═══ [판별] ★ 세 곳 모두 VAT 0 (VAT00) — 상호대사가 못 잡는 유형 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN, h.DLVR_YN
      ,h.TOT_SALE_AMT, h.TOT_DC_AMT, h.REAL_SALE_AMT
      ,h.TAX_SALE_AMT, h.NO_TAX_SALE_AMT, h.NET_SALE_AMT, h.VAT_AMT
      ,(SELECT SUM(d.VAT_AMT) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
           AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)          AS 상세VAT합
      ,(SELECT SUM(s.VAT_AMT) FROM TB_SL_SALE_PAY_SEQ s
         WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE
           AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO)          AS 결제VAT합
      ,(SELECT LISTAGG(s.PAY_CD,',') WITHIN GROUP (ORDER BY s.PAY_SEQ)
          FROM TB_SL_SALE_PAY_SEQ s
         WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE
           AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO)          AS 결제수단
      ,'VAT00' AS RESULT_CD
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   AND h.REAL_SALE_AMT <> 0
   AND NVL(h.TAX_SALE_AMT,0) <> 0          /* 과세매출이 있는데 */
   AND NVL(h.VAT_AMT,0) = 0                /* 부가세가 0        */
 ORDER BY h.STORE_CD, h.POS_NO, h.BILL_NO;

/* ═══ [상세] VAT 0 전표의 상세 행 · 결제 행 · 가승인 행 — 케이스 4 대상 확정용 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.DLVR_YN, h.REAL_SALE_AMT AS 헤더_REAL, h.VAT_AMT AS 헤더_VAT
      ,'DTL' 구분, d.BILL_DTL_NO 행, d.PROD_CD 코드, d.REAL_SALE_AMT 금액, d.VAT_AMT AS VAT
      ,SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11) AS 기대VAT
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_DTL d ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0 AND NVL(h.TAX_SALE_AMT,0) <> 0 AND NVL(h.VAT_AMT,0) = 0
UNION ALL
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.DLVR_YN, h.REAL_SALE_AMT, h.VAT_AMT
      ,'PAY_SEQ', TO_CHAR(s.PAY_SEQ), s.PAY_CD, s.PAY_AMT, s.VAT_AMT, NULL
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0 AND NVL(h.TAX_SALE_AMT,0) <> 0 AND NVL(h.VAT_AMT,0) = 0
UNION ALL
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.DLVR_YN, h.REAL_SALE_AMT, h.VAT_AMT
      ,'가승인', t.LINE_NO, t.TEMPORARY_PAY_CD, t.SALE_AMT, t.VAT_AMT, NULL
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_PAY_TEMPORARY t ON t.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND t.STORE_CD=h.STORE_CD AND t.SALE_DATE=h.SALE_DATE AND t.POS_NO=h.POS_NO AND t.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0 AND NVL(h.TAX_SALE_AMT,0) <> 0 AND NVL(h.VAT_AMT,0) = 0
 ORDER BY 1, 2, 3, 7, 8;`
},

qh6:{ tag:"H-6", kind:"SELECT", scope:"대상 본사", name:"헤더 vs 상세 합계 (9001 ~ 9004)",
  desc:"[판별] 헤더 vs TB_SL_SALE_DTL 합계. 9001 총매출 · 9002 총할인 · 9003 부가세(20210206 이전은 ABS) · 9004 실매출. DIFF 가 1~2원이면 반올림, 상품 단가만큼이면 행 누락/중복. 케이스 3 할인 이동은 총액 불변이라 9002/9004 에 안 걸려야 정상. [상세] 걸린 전표의 상세 행 전부와 행합계(윈도우) 를 나란히.",
  sql:
`/* ═══ [판별] 헤더 vs 상세 합계 (9001 ~ 9004) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_SALE_AMT, TOT_DC_AMT, VAT_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
D AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
          ,SUM(SALE_AMT) SALE_AMT, SUM(DC_AMT) DC_AMT, SUM(REAL_SALE_AMT) REAL_AMT, SUM(VAT_AMT) VAT_AMT
      FROM TB_SL_SALE_DTL
     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
     GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO
)
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,B.TOT_SALE_AMT , D.SALE_AMT, B.TOT_SALE_AMT  - D.SALE_AMT AS DIFF_9001
      ,B.TOT_DC_AMT   , D.DC_AMT  , B.TOT_DC_AMT    - D.DC_AMT   AS DIFF_9002
      ,B.VAT_AMT      , D.VAT_AMT AS DTL_VAT_AMT, B.VAT_AMT - D.VAT_AMT  AS DIFF_9003
      ,B.REAL_SALE_AMT, D.REAL_AMT, B.REAL_SALE_AMT - D.REAL_AMT AS DIFF_9004
      ,CASE WHEN B.TOT_SALE_AMT  <> D.SALE_AMT THEN '9001'
            WHEN B.TOT_DC_AMT    <> D.DC_AMT   THEN '9002'
            WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
              OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
            WHEN B.REAL_SALE_AMT <> D.REAL_AMT THEN '9004'
       END AS RESULT_CD
  FROM BILLS B, D
 WHERE D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
   AND (  B.TOT_SALE_AMT  <> D.SALE_AMT
       OR B.TOT_DC_AMT    <> D.DC_AMT
       OR B.REAL_SALE_AMT <> D.REAL_AMT
       OR (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
       OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) )
 ORDER BY B.SALE_DATE, B.STORE_CD, B.POS_NO, B.BILL_NO;

/* ═══ [상세] 헤더 vs DTL 합계가 다른 전표의 상세 행 전부 — 어느 행이 빠졌거나 중복인지 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN
      ,h.TOT_SALE_AMT, h.TOT_DC_AMT, h.VAT_AMT AS 헤더VAT, h.REAL_SALE_AMT
      ,d.BILL_DTL_NO, d.PROD_CD, d.SALE_QTY, d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT AS 행_REAL, d.VAT_AMT AS 행_VAT
      ,d.SALE_YN AS 행_SALE_YN, NVL(d.SIDE_P_DTL_NO,'-') AS SIDE_P
      ,SUM(d.SALE_AMT) OVER (PARTITION BY h.STORE_CD,h.SALE_DATE,h.POS_NO,h.BILL_NO) AS 행합_SALE
      ,SUM(d.DC_AMT)   OVER (PARTITION BY h.STORE_CD,h.SALE_DATE,h.POS_NO,h.BILL_NO) AS 행합_DC
      ,SUM(d.VAT_AMT)  OVER (PARTITION BY h.STORE_CD,h.SALE_DATE,h.POS_NO,h.BILL_NO) AS 행합_VAT
      ,SUM(d.REAL_SALE_AMT) OVER (PARTITION BY h.STORE_CD,h.SALE_DATE,h.POS_NO,h.BILL_NO) AS 행합_REAL
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_DTL d ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND EXISTS (SELECT 1 FROM TB_SL_SALE_DTL x
                WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO
                GROUP BY x.STORE_CD
               HAVING h.TOT_SALE_AMT <> SUM(x.SALE_AMT) OR h.TOT_DC_AMT <> SUM(x.DC_AMT)
                   OR h.REAL_SALE_AMT <> SUM(x.REAL_SALE_AMT)
                   OR (h.SALE_DATE >  '20210206' AND h.VAT_AMT <> SUM(x.VAT_AMT))
                   OR (h.SALE_DATE <= '20210206' AND ABS(h.VAT_AMT) <> ABS(SUM(x.VAT_AMT))))
 ORDER BY 1, 2, 3, 9;`
},

qh7:{ tag:"H-7", kind:"SELECT", scope:"대상 본사", name:"헤더 vs 결제시퀀스 (8001 · 8801 · 8002 · 8003) + 8801 재분류",
  desc:"[판별] 헤더 vs TB_SL_SALE_PAY_SEQ. PAY_CD 05/12 는 할인, 나머지는 결제로 나눠 합칩니다. 8801(벤슨) = TOT_DC ≠ SEQ_DC + ETC, ETC 는 HDR_DC 에서 DC_CD 02/12/05 외 할인 합(쿠폰류만 결제행을 만드는 벤슨 관행). 8002 VAT, 8003 실매출. 원본 결함: ETC 를 SUM 으로 구해 02/12/05 외 행이 없으면 NULL 이라 8801 통과 → NVL 로 잡음. 0903 8801 32건 전부 DC_CD 02 진짜 누락(케이스 1→2), 0902 8002 39건은 케이스 4 B-4. [상세①] 걸린 전표의 PAY_SEQ 행 전부. [상세②] 8801 재분류 — 검사대상 DC_CD 인데 PAY_SEQ 05/12 가 없는 할인행을 DC_CD 별로, 쿠폰테이블 행 유무까지.",
  sql:
`/* ═══ [판별] 헤더 vs 결제시퀀스 (8001 · 8801 · 8002 · 8003) + 8801 재분류 ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, HQ_OFFICE_CD, TOT_DC_AMT, VAT_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
S AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
          ,SUM(DECODE(PAY_CD,'05',0,'12',0,PAY_AMT))       SEQ_REAL
          ,SUM(DECODE(PAY_CD,'05',PAY_AMT,'12',PAY_AMT,0)) SEQ_DC
          ,SUM(VAT_AMT)                                    SEQ_VAT
      FROM TB_SL_SALE_PAY_SEQ
     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
     GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO
),
E AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SUM(DC_AMT) ETC_DC
      FROM TB_SL_SALE_HDR_DC
     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       AND DC_CD NOT IN ('02','12','05')
     GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO
)
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,B.TOT_DC_AMT, S.SEQ_DC, NVL(E.ETC_DC,0) AS ETC_DC
      ,B.TOT_DC_AMT - S.SEQ_DC                  AS DIFF_8001
      ,B.TOT_DC_AMT - (S.SEQ_DC + NVL(E.ETC_DC,0)) AS DIFF_8801
      ,B.VAT_AMT      , S.SEQ_VAT , B.VAT_AMT       - S.SEQ_VAT  AS DIFF_8002
      ,B.REAL_SALE_AMT, S.SEQ_REAL, B.REAL_SALE_AMT - S.SEQ_REAL AS DIFF_8003
      ,CASE WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.SEQ_DC           THEN '8001'
            WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.SEQ_DC
             AND B.TOT_DC_AMT <> S.SEQ_DC + NVL(E.ETC_DC,0)                                     THEN '8801'
            WHEN B.VAT_AMT       <> S.SEQ_VAT  THEN '8002'
            WHEN B.REAL_SALE_AMT <> S.SEQ_REAL THEN '8003'
       END AS RESULT_CD
      ,CASE WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.SEQ_DC AND E.ETC_DC IS NULL
            THEN 'N (ETC SUM NULL → 통과)' ELSE 'Y' END AS ORIG_DETECT
  FROM BILLS B
  JOIN S ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
  LEFT JOIN E ON E.STORE_CD=B.STORE_CD AND E.SALE_DATE=B.SALE_DATE AND E.POS_NO=B.POS_NO AND E.BILL_NO=B.BILL_NO
 WHERE (B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.SEQ_DC)
    OR (B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.SEQ_DC AND B.TOT_DC_AMT <> S.SEQ_DC + NVL(E.ETC_DC,0))
    OR B.VAT_AMT       <> S.SEQ_VAT
    OR B.REAL_SALE_AMT <> S.SEQ_REAL
 ORDER BY B.SALE_DATE, B.STORE_CD, B.POS_NO, B.BILL_NO;

/* ═══ [상세 ①] 8001/8801/8002/8003 전표의 PAY_SEQ 행 전부 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN, h.TOT_DC_AMT, h.VAT_AMT AS 헤더VAT, h.REAL_SALE_AMT
      ,s.PAY_SEQ, s.LINE_NO, s.PAY_CD
      ,CASE WHEN s.PAY_CD IN ('05','12') THEN '할인' ELSE '결제' END AS 성격
      ,s.PAY_AMT, s.TAX_AMT, s.NO_TAX_AMT, s.VAT_AMT AS 행VAT, s.APPR_PROC_FG
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ x
                WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO
                GROUP BY x.STORE_CD
               HAVING h.VAT_AMT <> SUM(x.VAT_AMT)
                   OR h.REAL_SALE_AMT <> SUM(DECODE(x.PAY_CD,'05',0,'12',0,x.PAY_AMT))
                   OR (h.TOT_DC_AMT <> SUM(DECODE(x.PAY_CD,'05',x.PAY_AMT,'12',x.PAY_AMT,0))
                       AND h.TOT_DC_AMT <> SUM(DECODE(x.PAY_CD,'05',x.PAY_AMT,'12',x.PAY_AMT,0))
                                         + NVL((SELECT SUM(e.DC_AMT) FROM TB_SL_SALE_HDR_DC e
                                                 WHERE e.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND e.STORE_CD=h.STORE_CD AND e.SALE_DATE=h.SALE_DATE
                                                   AND e.POS_NO=h.POS_NO AND e.BILL_NO=h.BILL_NO AND e.DC_CD NOT IN ('02','12','05')),0)))
 ORDER BY 1, 2, 3, 8;

/* ═══ [상세 ②] 8801 재분류 — 검사대상 DC_CD(02/12/05)인데 PAY_SEQ 05/12 행이 없는 할인행을 DC_CD 별로 · 쿠폰테이블 행 유무 ═══ */
SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.DC_CD, d.DC_AMT, d.DC_REASON_CD
      ,NVL(d.APP_DC_DESC,'(NULL)') AS APP_DC_DESC
      ,(SELECT NVL(SUM(s.PAY_AMT),0) FROM TB_SL_SALE_PAY_SEQ s
         WHERE s.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND s.STORE_CD=d.STORE_CD AND s.SALE_DATE=d.SALE_DATE
           AND s.POS_NO=d.POS_NO AND s.BILL_NO=d.BILL_NO AND s.PAY_CD IN ('05','12'))          AS PAY_SEQ할인
      ,(SELECT COUNT(*) FROM TB_SL_SALE_PAY_COUPN c
         WHERE c.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND c.STORE_CD=d.STORE_CD AND c.SALE_DATE=d.SALE_DATE
           AND c.POS_NO=d.POS_NO AND c.BILL_NO=d.BILL_NO)                                       AS 쿠폰테이블행
      ,h.TOT_DC_AMT AS 헤더할인계
      ,CASE WHEN d.DC_CD IN ('02','12','05') THEN '검사대상 → 케이스 1·2' ELSE 'ETC(면제)' END AS 분류
  FROM TB_SL_SALE_HDR_DC d
  JOIN TB_SL_SALE_HDR h ON h.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND h.STORE_CD=d.STORE_CD AND h.SALE_DATE=d.SALE_DATE AND h.POS_NO=d.POS_NO AND h.BILL_NO=d.BILL_NO
 WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.{{OPT:datecond}}
   {{LINE:store:d}}
   {{LINE:extra:d}}
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
        WHERE s.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND s.STORE_CD=d.STORE_CD AND s.SALE_DATE=d.SALE_DATE
          AND s.POS_NO=d.POS_NO AND s.BILL_NO=d.BILL_NO AND s.PAY_CD IN ('05','12'))
 ORDER BY 분류, d.STORE_CD, d.POS_NO, d.BILL_NO, d.DC_CD;`
},

qh8:{ tag:"H-8", kind:"SELECT", scope:"대상 본사", name:"헤더 vs HDR_PAY · HDR_DC · DTL_DC (7001 · 6001 · 6002)",
  desc:"[판별] 7001 실매출 ≠ HDR_PAY 합 · 6001 총할인 ≠ HDR_DC 합 · 6002 총할인 ≠ DTL_DC 합. 원본은 HDR_PAY 가 없으면 SUM NULL 로 7001 통과, 헤더 할인 0 이면 할인 테이블을 아예 안 읽어 \"헤더 0 / 상세 금액 있음\" 역방향을 못 잡습니다. 여기선 NVL 로 항상 비교. [상세] 걸린 전표의 HDR_PAY · HDR_DC · DTL_DC 행 전부.",
  sql:
`/* ═══ [판별] 헤더 vs HDR_PAY · HDR_DC · DTL_DC (7001 · 6001 · 6002) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_DC_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(PAY_AMT) AMT FROM TB_SL_SALE_HDR_PAY
        WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(DC_AMT)  AMT FROM TB_SL_SALE_HDR_DC
        WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(DC_AMT)  AMT FROM TB_SL_SALE_DTL_DC
        WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO)
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,B.REAL_SALE_AMT, NVL(HP.AMT,0) AS HDR_PAY_AMT, B.REAL_SALE_AMT - NVL(HP.AMT,0) AS DIFF_7001
      ,B.TOT_DC_AMT   , NVL(HD.AMT,0) AS HDR_DC_AMT , B.TOT_DC_AMT    - NVL(HD.AMT,0) AS DIFF_6001
      ,                 NVL(DD.AMT,0) AS DTL_DC_AMT , B.TOT_DC_AMT    - NVL(DD.AMT,0) AS DIFF_6002
      ,CASE WHEN B.REAL_SALE_AMT <> NVL(HP.AMT,0) THEN '7001'
            WHEN B.TOT_DC_AMT    <> NVL(HD.AMT,0) THEN '6001'
            WHEN B.TOT_DC_AMT    <> NVL(DD.AMT,0) THEN '6002'
       END AS RESULT_CD
      ,CASE WHEN HP.AMT IS NULL AND B.REAL_SALE_AMT <> 0     THEN 'N (HDR_PAY 없음 → NULL 통과)'
            WHEN B.TOT_DC_AMT = 0
             AND (NVL(HD.AMT,0)<>0 OR NVL(DD.AMT,0)<>0)      THEN 'N (헤더할인 0 → 미조회)'
            ELSE 'Y' END AS ORIG_DETECT
  FROM BILLS B
  LEFT JOIN HP ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
  LEFT JOIN HD ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
  LEFT JOIN DD ON DD.STORE_CD=B.STORE_CD AND DD.SALE_DATE=B.SALE_DATE AND DD.POS_NO=B.POS_NO AND DD.BILL_NO=B.BILL_NO
 WHERE B.REAL_SALE_AMT <> NVL(HP.AMT,0)
    OR B.TOT_DC_AMT    <> NVL(HD.AMT,0)
    OR B.TOT_DC_AMT    <> NVL(DD.AMT,0)
 ORDER BY B.SALE_DATE, B.STORE_CD, B.POS_NO, B.BILL_NO;

/* ═══ [상세] 7001/6001/6002 전표의 HDR_PAY · HDR_DC · DTL_DC 행 전부 ═══ */
WITH BAD AS (
    SELECT h.HQ_OFFICE_CD, h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.TOT_DC_AMT, h.REAL_SALE_AMT
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
       {{LINE:store:h}}
       {{LINE:extra:h}}
       AND (  h.REAL_SALE_AMT <> NVL((SELECT SUM(PAY_AMT) FROM TB_SL_SALE_HDR_PAY x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO),0)
           OR h.TOT_DC_AMT    <> NVL((SELECT SUM(DC_AMT)  FROM TB_SL_SALE_HDR_DC  x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO),0)
           OR h.TOT_DC_AMT    <> NVL((SELECT SUM(DC_AMT)  FROM TB_SL_SALE_DTL_DC  x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO),0) )
)
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, B.REAL_SALE_AMT AS 헤더_REAL, B.TOT_DC_AMT AS 헤더_DC
      ,'HDR_PAY' 테이블, x.PAY_CD 코드, NULL 행, x.PAY_AMT 금액
  FROM BAD B JOIN TB_SL_SALE_HDR_PAY x ON x.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND x.STORE_CD=B.STORE_CD AND x.SALE_DATE=B.SALE_DATE AND x.POS_NO=B.POS_NO AND x.BILL_NO=B.BILL_NO
UNION ALL
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, B.REAL_SALE_AMT, B.TOT_DC_AMT
      ,'HDR_DC', x.DC_CD, TO_CHAR(x.REG_SEQ), x.DC_AMT
  FROM BAD B JOIN TB_SL_SALE_HDR_DC x ON x.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND x.STORE_CD=B.STORE_CD AND x.SALE_DATE=B.SALE_DATE AND x.POS_NO=B.POS_NO AND x.BILL_NO=B.BILL_NO
UNION ALL
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, B.REAL_SALE_AMT, B.TOT_DC_AMT
      ,'DTL_DC', x.DC_CD, x.BILL_DTL_NO, x.DC_AMT
  FROM BAD B JOIN TB_SL_SALE_DTL_DC x ON x.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND x.STORE_CD=B.STORE_CD AND x.SALE_DATE=B.SALE_DATE AND x.POS_NO=B.POS_NO AND x.BILL_NO=B.BILL_NO
 ORDER BY 1, 2, 3, 6, 7, 8;`
},

qh9:{ tag:"H-9", kind:"SELECT", scope:"대상 본사", name:"개별 금액 규칙 (6103 · 6102 · 6303 · 6305 · 6405 · 6505)",
  desc:"[판별] 프로시저 CHECK_SUM_DATA 말미, 순서 6103→6102→6303→6305→6405→6505. 6103 포인트(04) VAT≠0(20250207 이후) · 6102 매출 전표(헤더 SALE_YN=Y)인데 상세 VAT 음수 행 · 6303 상세 실매출 음수 · 6305 상세 할인 음수 · 6405 |SALE|<|DC| (SALE_YN 무관) · 6505 총매출 ≠ ERP 전송금액(LYNK 는 ERP_SEND_AMT). SALE_YN 조건은 헤더 값이고 상세 행은 전부 셉니다(프로시저와 동일). 0903 6102 2건은 T0000776 실매출 양수·VAT 음수 = 케이스 4 로 안 잡히는 새 유형. [상세] 원인 상세 행에 코드를 붙여 보여 주고 6103 은 PAY_SEQ 04 행.",
  sql:
`/* ═══ [판별] 개별 금액 규칙 (6103 · 6102 · 6303 · 6305 · 6405 · 6505) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN, TOT_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
S AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, SUM(DECODE(PAY_CD,'04',VAT_AMT,0)) POINT_VAT
        FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
D AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO
            ,SUM(CASE WHEN VAT_AMT       < 0 THEN 1 ELSE 0 END)             MINUS_VAT_CNT
            ,SUM(CASE WHEN REAL_SALE_AMT < 0 THEN 1 ELSE 0 END)             MINUS_REAL_CNT
            ,SUM(CASE WHEN DC_AMT        < 0 THEN 1 ELSE 0 END)             MINUS_DC_CNT
            ,SUM(CASE WHEN ABS(SALE_AMT) < ABS(DC_AMT) THEN 1 ELSE 0 END)   OVER_DC_CNT
            ,SUM(DECODE(SUBSTRB(PROD_CD,1,4),'LYNK',ERP_SEND_AMT,SALE_AMT)) ERP_SEND_AMT
        FROM TB_SL_SALE_DTL WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO)
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
      ,NVL(S.POINT_VAT,0) AS POINT_VAT
      ,D.MINUS_VAT_CNT, D.MINUS_REAL_CNT, D.MINUS_DC_CNT, D.OVER_DC_CNT
      ,B.TOT_SALE_AMT, D.ERP_SEND_AMT, NVL(B.TOT_SALE_AMT,0) - NVL(D.ERP_SEND_AMT,0) AS DIFF_6505
      ,CASE WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
            WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0              THEN '6102'
            WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0              THEN '6303'
            WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0              THEN '6305'
            WHEN D.OVER_DC_CNT > 0                                   THEN '6405'
            WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)      THEN '6505'
       END AS RESULT_CD
  FROM BILLS B
  LEFT JOIN S ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
  LEFT JOIN D ON D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
 WHERE (NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207')
    OR (B.SALE_YN='Y' AND (D.MINUS_VAT_CNT > 0 OR D.MINUS_REAL_CNT > 0 OR D.MINUS_DC_CNT > 0))
    OR D.OVER_DC_CNT > 0
    OR NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)
 ORDER BY B.SALE_DATE, B.STORE_CD, B.POS_NO, B.BILL_NO;

/* ═══ [상세] 개별 규칙에 걸린 원인 행 — 어느 상세 행 / 어느 포인트 결제행이 문제인지 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN
      ,'DTL' 구분, d.BILL_DTL_NO 행, d.PROD_CD 코드, d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT AS 행_REAL, d.VAT_AMT AS 행_VAT
      ,SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11) AS 기대VAT
      ,CASE WHEN h.SALE_YN='Y' AND d.VAT_AMT < 0        THEN '6102 음수VAT'
            WHEN h.SALE_YN='Y' AND d.REAL_SALE_AMT < 0  THEN '6303 음수실매출'
            WHEN h.SALE_YN='Y' AND d.DC_AMT < 0         THEN '6305 음수할인'
            WHEN ABS(d.SALE_AMT) < ABS(d.DC_AMT)        THEN '6405 할인>상품금액'
            ELSE '6505 ERP금액 참고' END AS 원인
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_DTL d ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND (  (h.SALE_YN='Y' AND (d.VAT_AMT < 0 OR d.REAL_SALE_AMT < 0 OR d.DC_AMT < 0))
       OR ABS(d.SALE_AMT) < ABS(d.DC_AMT)
       OR EXISTS (SELECT 1 FROM TB_SL_SALE_DTL x
                   WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO
                   GROUP BY x.STORE_CD
                  HAVING NVL(h.TOT_SALE_AMT,0) <> NVL(SUM(DECODE(SUBSTRB(x.PROD_CD,1,4),'LYNK',x.ERP_SEND_AMT,x.SALE_AMT)),0)) )
UNION ALL
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN
      ,'PAY_SEQ', TO_CHAR(s.PAY_SEQ), s.PAY_CD, s.PAY_AMT, NULL, s.TAX_AMT, s.VAT_AMT, NULL
      ,'6103 포인트 VAT ≠ 0'
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND h.SALE_DATE > '20250207' AND s.PAY_CD = '04' AND s.VAT_AMT <> 0
 ORDER BY 1, 2, 3, 5, 6;`
},

qh10:{ tag:"H-10", kind:"SELECT", scope:"대상 본사", isNew:true, name:"부호 규칙 양방향 — 상세행·결제행 자신의 SALE_YN 기준 (6102 · 6112 · 6303 · 6313 · 3211 · 3212)",
  desc:"[판별] 헤더가 아니라 상세행·결제행 자신의 SALE_YN 을 기준으로 부호를 양방향으로 봅니다. 프로시저의 6102/6303 은 헤더 SALE_YN=Y 일 때만, 한 방향만 보고 반품 쪽(반품인데 양수)은 안 봅니다. 여기서 만든 코드: 6112 반품행인데 VAT 양수 · 6313 반품행인데 REAL 양수 · 3211 매출 결제행인데 PAY_AMT 음수 · 3212 반품 결제행인데 PAY_AMT 양수(케이스 2 부호 규칙 위반). 비고 MIX 는 헤더와 상세 SALE_YN 이 섞인 전표. 헤더 레벨의 같은 검사(9211/9212)는 H-3. 0903 6102 2건(T0000776)이 여기서 행 단위로 보입니다. [상세①] 상세행별 코드와 기대 VAT. [상세②] 결제행별 코드.",
  sql:
`/* ═══ [판별] 부호 규칙 양방향 — 전표별로 어느 코드가 몇 행인지 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN AS 헤더SALE_YN, h.REAL_SALE_AMT AS 헤더REAL, h.VAT_AMT AS 헤더VAT
      ,SUM(CASE WHEN d.SALE_YN='Y' AND d.VAT_AMT       < 0 THEN 1 ELSE 0 END) AS "6102_매출VAT음수"
      ,SUM(CASE WHEN d.SALE_YN='N' AND d.VAT_AMT       > 0 THEN 1 ELSE 0 END) AS "6112_반품VAT양수"
      ,SUM(CASE WHEN d.SALE_YN='Y' AND d.REAL_SALE_AMT < 0 THEN 1 ELSE 0 END) AS "6303_매출REAL음수"
      ,SUM(CASE WHEN d.SALE_YN='N' AND d.REAL_SALE_AMT > 0 THEN 1 ELSE 0 END) AS "6313_반품REAL양수"
      ,(SELECT COUNT(*) FROM TB_SL_SALE_PAY_SEQ s
         WHERE s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
           AND s.SALE_YN='Y' AND s.PAY_AMT < 0)                                AS "3211_매출PAY음수"
      ,(SELECT COUNT(*) FROM TB_SL_SALE_PAY_SEQ s
         WHERE s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
           AND s.SALE_YN='N' AND s.PAY_AMT > 0)                                AS "3212_반품PAY양수"
      ,CASE WHEN h.SALE_YN <> MIN(d.SALE_YN) OR h.SALE_YN <> MAX(d.SALE_YN) THEN 'MIX 헤더/상세 SALE_YN 불일치' END AS 비고
  FROM TB_SL_SALE_HDR h
  JOIN TB_SL_SALE_DTL d
    ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
{{LINE:store:h}}
{{LINE:extra:h}}
 GROUP BY h.HQ_OFFICE_CD, h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.SALE_YN, h.REAL_SALE_AMT, h.VAT_AMT
HAVING SUM(CASE WHEN (d.SALE_YN='Y' AND (d.VAT_AMT < 0 OR d.REAL_SALE_AMT < 0))
                  OR (d.SALE_YN='N' AND (d.VAT_AMT > 0 OR d.REAL_SALE_AMT > 0)) THEN 1 ELSE 0 END) > 0
    OR EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
                WHERE s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
                  AND ((s.SALE_YN='Y' AND s.PAY_AMT < 0) OR (s.SALE_YN='N' AND s.PAY_AMT > 0)))
    OR h.SALE_YN <> MIN(d.SALE_YN) OR h.SALE_YN <> MAX(d.SALE_YN)
 ORDER BY 1, 2, 3;

/* ═══ [상세 ①] 상세행 — 자신의 SALE_YN 기준 VAT / REAL 부호 (6102 · 6112 · 6303 · 6313) ═══ */
SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.BILL_DTL_NO, d.PROD_CD
      ,h.SALE_YN AS 헤더SALE_YN, d.SALE_YN AS 상세SALE_YN, d.SALE_FG
      ,d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT, d.VAT_AMT
      ,SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11) AS 기대VAT
      ,CASE WHEN d.SALE_YN='Y' AND d.VAT_AMT       < 0 THEN '6102 매출인데 VAT 음수'
            WHEN d.SALE_YN='N' AND d.VAT_AMT       > 0 THEN '6112 반품인데 VAT 양수'
            WHEN d.SALE_YN='Y' AND d.REAL_SALE_AMT < 0 THEN '6303 매출인데 REAL 음수'
            WHEN d.SALE_YN='N' AND d.REAL_SALE_AMT > 0 THEN '6313 반품인데 REAL 양수'
       END AS RESULT_CD
  FROM TB_SL_SALE_DTL d
  JOIN TB_SL_SALE_HDR h
    ON h.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND h.STORE_CD=d.STORE_CD AND h.SALE_DATE=d.SALE_DATE
   AND h.POS_NO=d.POS_NO     AND h.BILL_NO=d.BILL_NO
 WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.{{OPT:datecond}}
{{LINE:store:d}}
{{LINE:extra:d}}
   AND (  (d.SALE_YN='Y' AND (d.VAT_AMT < 0 OR d.REAL_SALE_AMT < 0))
       OR (d.SALE_YN='N' AND (d.VAT_AMT > 0 OR d.REAL_SALE_AMT > 0)) )
 ORDER BY 1, 2, 3, 4;

/* ═══ [상세 ②] 결제행 — 자신의 SALE_YN 기준 PAY_AMT 부호 (3211 · 3212). 케이스 2 부호 규칙: 반품 PAY_SEQ 는 음수 ═══ */
SELECT s.STORE_CD, s.POS_NO, s.BILL_NO, s.PAY_SEQ, s.LINE_NO, s.PAY_CD
      ,h.SALE_YN AS 헤더SALE_YN, s.SALE_YN AS 결제SALE_YN, s.SALE_FG
      ,s.PAY_AMT, s.TAX_AMT, s.VAT_AMT
      ,CASE WHEN s.SALE_YN='Y' AND s.PAY_AMT < 0 THEN '3211 매출인데 PAY_AMT 음수'
            WHEN s.SALE_YN='N' AND s.PAY_AMT > 0 THEN '3212 반품인데 PAY_AMT 양수'
       END AS RESULT_CD
  FROM TB_SL_SALE_PAY_SEQ s
  JOIN TB_SL_SALE_HDR h
    ON h.HQ_OFFICE_CD=s.HQ_OFFICE_CD AND h.STORE_CD=s.STORE_CD AND h.SALE_DATE=s.SALE_DATE
   AND h.POS_NO=s.POS_NO     AND h.BILL_NO=s.BILL_NO
 WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.{{OPT:datecond}}
{{LINE:store:s}}
{{LINE:extra:s}}
   AND (  (s.SALE_YN='Y' AND s.PAY_AMT < 0)
       OR (s.SALE_YN='N' AND s.PAY_AMT > 0) )
 ORDER BY 1, 2, 3, 4;`
},

qp1:{ tag:"P-1", kind:"SELECT", scope:"대상 본사", name:"★ 결제수단별 상세 대사 (3001 · 3002 · 3003 · 3004 · 3009)",
  desc:"[판별] 가장 중요한 대사. PAY_SEQ 한 행마다 PAY_CD 에 맞는 상세 테이블(16개 UNION) 의 같은 LINE_NO 행과 비교. 05/12 는 할인금액(3001, 12 는 COUPN.DC_AMT×SALE_FG), 그 외는 SALE_AMT(3002)·VAT_AMT(3003). PAY_AMT=0 행은 프로시저처럼 제외. 3004 상세 행 없음 · 3009 미지원 PAY_CD 는 신규코드 — 원본은 여기서 ORA-20001 로 죽고 WHEN OTHERS 에 삼켜져 로그가 사라지므로(TB_LOG_BENSON_BILL_CHECK 누락 주원인) 프로시저로는 점검 불가였던 건. 케이스 1·2 가 넣은 쿠폰행·PAY12 행의 1:1 이 여기서 검증됩니다. [상세] 걸린 전표의 PAY_SEQ 전체 행(주력 결제수단 기준).",
  sql:
`/* ═══ [판별] ★ 결제수단별 상세 대사 (3001 · 3002 · 3003 · 3004 · 3009) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
PAYDTL AS (
    SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'01' PAY_CD, SALE_AMT AM_PAY, DC_AMT AM_DC, VAT_AMT AM_VAT
      FROM TB_SL_SALE_PAY_CARD      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'02',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_CASH      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'03',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_PAYCO     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'04',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_VPOINT    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'05',0,NVL(VCOUPN_DC_AMT,0),0
      FROM TB_SL_SALE_PAY_VCOUPN    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'06',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_VCHARGE   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'07',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_MPAY      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'08',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_MCOUPN    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'10',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_PREPAID   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'11',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_POSTPAID  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'12',0,NVL(DC_AMT,0)*SALE_FG,0
      FROM TB_SL_SALE_PAY_COUPN     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'13',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_GIFT      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'14',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_FSTMP     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'17',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_EMP_CARD  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'18',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_TEMPORARY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
    UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'19',SALE_AMT,0,VAT_AMT
      FROM TB_SL_SALE_PAY_VORDER    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
),
SEQ AS (
    SELECT S.STORE_CD, S.SALE_DATE, S.POS_NO, S.BILL_NO, S.PAY_SEQ, S.LINE_NO, S.PAY_CD
          ,S.PAY_AMT SEQ_PAY_AMT, S.VAT_AMT SEQ_VAT_AMT
      FROM TB_SL_SALE_PAY_SEQ S, BILLS B
     WHERE S.HQ_OFFICE_CD = '{{HQ}}' AND S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
       AND S.PAY_AMT <> 0
)
SELECT Q.STORE_CD, Q.SALE_DATE, Q.POS_NO, Q.BILL_NO, Q.PAY_SEQ, Q.LINE_NO, Q.PAY_CD
      ,Q.SEQ_PAY_AMT, P.AM_PAY, P.AM_DC
      ,Q.SEQ_VAT_AMT, P.AM_VAT
      ,CASE WHEN Q.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
                                                                            THEN '3009'
            WHEN P.PAY_CD IS NULL                                           THEN '3004'
            WHEN Q.PAY_CD IN ('05','12')     AND Q.SEQ_PAY_AMT <> P.AM_DC   THEN '3001'
            WHEN Q.PAY_CD NOT IN ('05','12') AND Q.SEQ_PAY_AMT <> P.AM_PAY  THEN '3002'
            WHEN Q.PAY_CD NOT IN ('05','12') AND Q.SEQ_VAT_AMT <> P.AM_VAT  THEN '3003'
       END AS RESULT_CD
      ,CASE WHEN Q.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
              OR P.PAY_CD IS NULL THEN 'N (프로시저 ORA-20001 로 사망)' ELSE 'Y' END AS ORIG_DETECT
  FROM SEQ Q
  LEFT JOIN PAYDTL P
    ON  P.STORE_CD=Q.STORE_CD AND P.SALE_DATE=Q.SALE_DATE AND P.POS_NO=Q.POS_NO
    AND P.BILL_NO =Q.BILL_NO  AND P.LINE_NO  =Q.LINE_NO   AND P.PAY_CD=Q.PAY_CD
 WHERE Q.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
    OR P.PAY_CD IS NULL
    OR (Q.PAY_CD IN ('05','12')     AND Q.SEQ_PAY_AMT <> P.AM_DC)
    OR (Q.PAY_CD NOT IN ('05','12') AND (Q.SEQ_PAY_AMT <> P.AM_PAY OR Q.SEQ_VAT_AMT <> P.AM_VAT))
 ORDER BY Q.SALE_DATE, Q.STORE_CD, Q.POS_NO, Q.BILL_NO, Q.PAY_SEQ;

/* ═══ [상세] 3001~3009 에 걸린 전표의 PAY_SEQ 전체 행과 상세 테이블 짝 — 그 전표의 결제가 전체적으로 어떻게 생겼는지 ═══ */
WITH BAD AS (
    SELECT DISTINCT S.HQ_OFFICE_CD, S.STORE_CD, S.SALE_DATE, S.POS_NO, S.BILL_NO
      FROM TB_SL_SALE_PAY_SEQ S
     WHERE S.HQ_OFFICE_CD = '{{HQ}}' AND S.{{OPT:datecond}}
       {{LINE:store:S}}
       {{LINE:extra:S}}
       AND S.PAY_AMT <> 0
       AND (  S.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
           OR (S.PAY_CD='01' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_CARD      x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND x.SALE_AMT=S.PAY_AMT AND x.VAT_AMT=S.VAT_AMT))
           OR (S.PAY_CD='02' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_CASH      x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND x.SALE_AMT=S.PAY_AMT AND x.VAT_AMT=S.VAT_AMT))
           OR (S.PAY_CD='12' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_COUPN     x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND NVL(x.DC_AMT,0)*x.SALE_FG=S.PAY_AMT))
           OR (S.PAY_CD='05' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_VCOUPN    x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND NVL(x.VCOUPN_DC_AMT,0)=S.PAY_AMT))
           OR (S.PAY_CD='18' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_TEMPORARY x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND x.SALE_AMT=S.PAY_AMT AND x.VAT_AMT=S.VAT_AMT))
           OR (S.PAY_CD='08' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_MCOUPN    x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND x.SALE_AMT=S.PAY_AMT AND x.VAT_AMT=S.VAT_AMT))
           OR (S.PAY_CD='07' AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_MPAY      x WHERE x.HQ_OFFICE_CD=S.HQ_OFFICE_CD AND x.STORE_CD=S.STORE_CD AND x.SALE_DATE=S.SALE_DATE AND x.POS_NO=S.POS_NO AND x.BILL_NO=S.BILL_NO AND x.LINE_NO=S.LINE_NO AND x.SALE_AMT=S.PAY_AMT AND x.VAT_AMT=S.VAT_AMT)) )
)
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, h.SALE_YN, h.TOT_SALE_AMT, h.REAL_SALE_AMT, h.VAT_AMT AS 헤더VAT
      ,s.PAY_SEQ, s.LINE_NO, s.PAY_CD, s.PAY_AMT, s.VAT_AMT AS 행VAT, s.APPR_PROC_FG
  FROM BAD B
  JOIN TB_SL_SALE_HDR h ON h.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND h.STORE_CD=B.STORE_CD AND h.SALE_DATE=B.SALE_DATE AND h.POS_NO=B.POS_NO AND h.BILL_NO=B.BILL_NO
  JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND s.STORE_CD=B.STORE_CD AND s.SALE_DATE=B.SALE_DATE AND s.POS_NO=B.POS_NO AND s.BILL_NO=B.BILL_NO
 ORDER BY 1, 2, 3, 8;
/* 벤슨 주력 결제수단(01/02/05/07/08/12/18)만 상세 짝을 봅니다. 다른 코드는 [판별] 결과로 충분합니다. */`
},

qp2:{ tag:"P-2", kind:"SELECT", scope:"대상 본사", name:"결제상세 → PAY_SEQ 역방향 누락 (3005)",
  desc:"[판별] P-1 의 반대 방향(3005). 상세 테이블 16개에 행이 있는데 PAY_SEQ 에 같은 LINE_NO/PAY_CD 가 없음. \"쿠폰행은 있는데 PAY12 가 없다\"(케이스 2) 가 정확히 이 방향. [상세] 그 전표의 헤더와 PAY_SEQ 전체 행, 현재 MAX(PAY_SEQ) — 케이스 2 [C2] 가 어디에 끼워 넣을지.",
  sql:
`/* ═══ [판별] 결제상세 → PAY_SEQ 역방향 누락 (3005) ═══ */
WITH PD AS (
  SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'01' PAY_CD,SALE_AMT AMT FROM TB_SL_SALE_PAY_CARD      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'02',SALE_AMT FROM TB_SL_SALE_PAY_CASH       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'03',SALE_AMT FROM TB_SL_SALE_PAY_PAYCO      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'04',SALE_AMT FROM TB_SL_SALE_PAY_VPOINT     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'05',NVL(VCOUPN_DC_AMT,0) FROM TB_SL_SALE_PAY_VCOUPN WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'06',SALE_AMT FROM TB_SL_SALE_PAY_VCHARGE    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'07',SALE_AMT FROM TB_SL_SALE_PAY_MPAY       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'08',SALE_AMT FROM TB_SL_SALE_PAY_MCOUPN     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'10',SALE_AMT FROM TB_SL_SALE_PAY_PREPAID    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'11',SALE_AMT FROM TB_SL_SALE_PAY_POSTPAID   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'12',NVL(DC_AMT,0)*SALE_FG FROM TB_SL_SALE_PAY_COUPN WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'13',SALE_AMT FROM TB_SL_SALE_PAY_GIFT       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'14',SALE_AMT FROM TB_SL_SALE_PAY_FSTMP      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'17',SALE_AMT FROM TB_SL_SALE_PAY_EMP_CARD   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'18',SALE_AMT FROM TB_SL_SALE_PAY_TEMPORARY  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
  UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'19',SALE_AMT FROM TB_SL_SALE_PAY_VORDER     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}})
SELECT P.STORE_CD, P.POS_NO, P.BILL_NO, P.LINE_NO, P.PAY_CD, P.AMT
      ,'3005' AS RESULT_CD, '결제상세 있는데 PAY_SEQ 없음' AS 설명
  FROM PD P
 WHERE NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ S
        WHERE S.HQ_OFFICE_CD='{{HQ}}'
          AND S.HQ_OFFICE_CD = '{{HQ}}' AND S.STORE_CD=P.STORE_CD AND S.SALE_DATE=P.SALE_DATE
          AND S.POS_NO=P.POS_NO     AND S.BILL_NO=P.BILL_NO
          AND S.LINE_NO=P.LINE_NO   AND S.PAY_CD=P.PAY_CD)
 ORDER BY 1,2,3,4;

/* ═══ [상세] 상세만 있고 PAY_SEQ 없는 전표의 PAY_SEQ 전체 행 + 헤더 — 어디에 끼워 넣어야 하는지 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN, h.TOT_SALE_AMT, h.TOT_DC_AMT, h.REAL_SALE_AMT
      ,s.PAY_SEQ, s.LINE_NO, s.PAY_CD, s.PAY_AMT
      ,(SELECT NVL(MAX(x.PAY_SEQ),0) FROM TB_SL_SALE_PAY_SEQ x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO) AS 현재_MAX_PAY_SEQ
  FROM TB_SL_SALE_HDR h
  LEFT JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND EXISTS (
        SELECT 1 FROM TB_SL_SALE_PAY_COUPN c
         WHERE c.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND c.STORE_CD=h.STORE_CD AND c.SALE_DATE=h.SALE_DATE AND c.POS_NO=h.POS_NO AND c.BILL_NO=h.BILL_NO
           AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ q WHERE q.HQ_OFFICE_CD=c.HQ_OFFICE_CD AND q.STORE_CD=c.STORE_CD AND q.SALE_DATE=c.SALE_DATE AND q.POS_NO=c.POS_NO AND q.BILL_NO=c.BILL_NO AND q.LINE_NO=c.LINE_NO AND q.PAY_CD='12')
        UNION ALL
        SELECT 1 FROM TB_SL_SALE_PAY_TEMPORARY c
         WHERE c.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND c.STORE_CD=h.STORE_CD AND c.SALE_DATE=h.SALE_DATE AND c.POS_NO=h.POS_NO AND c.BILL_NO=h.BILL_NO
           AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ q WHERE q.HQ_OFFICE_CD=c.HQ_OFFICE_CD AND q.STORE_CD=c.STORE_CD AND q.SALE_DATE=c.SALE_DATE AND q.POS_NO=c.POS_NO AND q.BILL_NO=c.BILL_NO AND q.LINE_NO=c.LINE_NO AND q.PAY_CD='18')
        UNION ALL
        SELECT 1 FROM TB_SL_SALE_PAY_CARD c
         WHERE c.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND c.STORE_CD=h.STORE_CD AND c.SALE_DATE=h.SALE_DATE AND c.POS_NO=h.POS_NO AND c.BILL_NO=h.BILL_NO
           AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ q WHERE q.HQ_OFFICE_CD=c.HQ_OFFICE_CD AND q.STORE_CD=c.STORE_CD AND q.SALE_DATE=c.SALE_DATE AND q.POS_NO=c.POS_NO AND q.BILL_NO=c.BILL_NO AND q.LINE_NO=c.LINE_NO AND q.PAY_CD='01')
        UNION ALL
        SELECT 1 FROM TB_SL_SALE_PAY_CASH c
         WHERE c.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND c.STORE_CD=h.STORE_CD AND c.SALE_DATE=h.SALE_DATE AND c.POS_NO=h.POS_NO AND c.BILL_NO=h.BILL_NO
           AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ q WHERE q.HQ_OFFICE_CD=c.HQ_OFFICE_CD AND q.STORE_CD=c.STORE_CD AND q.SALE_DATE=c.SALE_DATE AND q.POS_NO=c.POS_NO AND q.BILL_NO=c.BILL_NO AND q.LINE_NO=c.LINE_NO AND q.PAY_CD='02')
       )
 ORDER BY 1, 2, 3, 8;
/* 상세 테이블 중 벤슨 주력 4개(쿠폰/가승인/카드/현금)만 봅니다. 나머지 12개는 [판별] 결과로 충분합니다. */`
},

qp3:{ tag:"P-3", kind:"SELECT", scope:"대상 본사", name:"PAY_SEQ 행 항등식 PAY_AMT = TAX + NO_TAX (PAY01)",
  desc:"[판별] PAY_SEQ 한 행 안의 항등식 PAY_AMT = TAX_AMT + NO_TAX_AMT (PAY01, 05/12 제외). 0903 5건 = H-5 와 같은 전표, PAY_CD 18 행의 TAX/NO_TAX/VAT 전부 0. [상세] 같은 LINE_NO 의 가승인 값과 헤더 과세/면세를 붙여 케이스 4 B-4 대상인지 판정.",
  sql:
`/* ═══ [판별] PAY_SEQ 행 항등식 PAY_AMT = TAX + NO_TAX (PAY01) ═══ */
SELECT STORE_CD, POS_NO, BILL_NO, PAY_SEQ, PAY_CD, LINE_NO
      ,PAY_AMT, TAX_AMT, NO_TAX_AMT, VAT_AMT
      ,PAY_AMT - (NVL(TAX_AMT,0) + NVL(NO_TAX_AMT,0)) AS 차이
      ,'PAY01' AS RESULT_CD
  FROM TB_SL_SALE_PAY_SEQ
 WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
   AND PAY_CD NOT IN ('05','12')
   AND PAY_AMT <> NVL(TAX_AMT,0) + NVL(NO_TAX_AMT,0)
 ORDER BY STORE_CD, POS_NO, BILL_NO, PAY_SEQ;

/* ═══ [상세] PAY01 행의 가승인/상세 테이블 원본값 — 어느 값을 채워야 하는지 (PAY_CD 18 은 케이스 4 B-4) ═══ */
SELECT s.STORE_CD, s.POS_NO, s.BILL_NO, s.PAY_SEQ, s.LINE_NO, s.PAY_CD
      ,s.PAY_AMT, s.TAX_AMT, s.NO_TAX_AMT, s.VAT_AMT
      ,s.PAY_AMT - (NVL(s.TAX_AMT,0) + NVL(s.NO_TAX_AMT,0)) AS 차이
      ,h.VAT_AMT AS 헤더VAT, h.TAX_SALE_AMT AS 헤더과세, h.NO_TAX_SALE_AMT AS 헤더면세
      ,t.SALE_AMT AS 가승인_SALE, t.TAX_AMT AS 가승인_TAX, t.VAT_AMT AS 가승인_VAT
      ,CASE WHEN s.PAY_CD='18' AND t.LINE_NO IS NOT NULL AND t.VAT_AMT <> 0 THEN '케이스 4 B-4 대상'
            WHEN s.PAY_CD='18' THEN '가승인 미매칭/VAT 0 → 케이스 4 0-C 확인'
            ELSE '수기 확인' END AS 조치
  FROM TB_SL_SALE_PAY_SEQ s
  JOIN TB_SL_SALE_HDR h ON h.HQ_OFFICE_CD=s.HQ_OFFICE_CD AND h.STORE_CD=s.STORE_CD AND h.SALE_DATE=s.SALE_DATE AND h.POS_NO=s.POS_NO AND h.BILL_NO=s.BILL_NO
  LEFT JOIN TB_SL_SALE_PAY_TEMPORARY t ON t.HQ_OFFICE_CD=s.HQ_OFFICE_CD AND t.STORE_CD=s.STORE_CD AND t.SALE_DATE=s.SALE_DATE AND t.POS_NO=s.POS_NO AND t.BILL_NO=s.BILL_NO AND t.LINE_NO=s.LINE_NO
 WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.{{OPT:datecond}}
   {{LINE:store:s}}
   {{LINE:extra:s}}
   AND s.PAY_CD NOT IN ('05','12')
   AND s.PAY_AMT <> NVL(s.TAX_AMT,0) + NVL(s.NO_TAX_AMT,0)
 ORDER BY 1, 2, 3, 4;`
},

qp4:{ tag:"P-4", kind:"SELECT", scope:"대상 본사", name:"PAY_CD 별 합계 PAY_SEQ vs HDR_PAY vs DTL_PAY · 양방향 (3101 · 3102 · 3103 · 3201 · 3202 · 3203)",
  desc:"[판별] PAY_CD 별 합계를 PAY_SEQ · HDR_PAY · DTL_PAY 세 테이블에서 뽑아 양방향으로 대사합니다. 3101 PAY_SEQ 에 있는데 HDR_PAY 없음 · 3102 금액 불일치 · 3103 HDR_PAY 에만 있음(신규·역방향) · 3201/3202/3203 은 DTL_PAY 쪽 같은 뜻. HDR_CD / DTL_CD 두 열로 따로 보여 주고 RESULT_CD 는 둘을 '+' 로 합친 것(S-0 집계용). 원본 수정 내역: ① 05(상품권)/12(쿠폰)는 할인성 결제라 HDR_PAY/DTL_PAY 에 원래 안 들어가는데(전사 3일 실측 0%, 나머지 코드는 100%) 제외를 안 해 0902 43건이 전부 3101 오탐이었음 → 제외. ② NVL(subquery,-1) 로 '행 없음' 을 표현했는데 반품 결제합이 정확히 -1원인 조합이 실재(전사 3일 4건) → NOT EXISTS/LEFT JOIN 으로 분리. ③ PAY_SEQ 기준 단방향 → 세 테이블 키 합집합(K) 기준 양방향. ④ PAY_AMT<>0 필터 비대칭 → 행 필터 없애고 '세 값 모두 0' 조합만 제외. ⑤ BILLS 조인으로 고아 PAY_SEQ 배제. 수정 후 0902 0건. [상세] 걸린 전표의 세 테이블 행을 1.PAY_SEQ / 2.HDR_PAY / 3.DTL_PAY 순으로 나란히. 2~4원 차이는 DTL_PAY 끝의 잔액 라인, 부호 반대는 반품 처리가 덜 된 것.",
  sql:
`/* ═══ [판별] PAY_CD 별 합계 대사 PAY_SEQ vs HDR_PAY vs DTL_PAY — 양방향 (3101 · 3102 · 3103 · 3201 · 3202 · 3203) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
{{LINE:store:h}}
{{LINE:extra:h}}
),
S AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_PAY_SEQ X
        JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
         AND X.PAY_CD NOT IN ('05','12')             /* ★ 할인성 결제 제외 — HDR_PAY/DTL_PAY 에 원래 없음 */
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
HP AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_HDR_PAY X
        JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
         AND X.PAY_CD NOT IN ('05','12')
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
DP AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_DTL_PAY X
        JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
         AND X.PAY_CD NOT IN ('05','12')
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
/* 세 테이블에 등장하는 모든 (전표 + PAY_CD) 조합 — 양방향 대사의 기준 */
K AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM S
      UNION SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM HP
      UNION SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM DP)
SELECT K.STORE_CD, K.SALE_DATE, K.POS_NO, K.BILL_NO, K.PAY_CD
      ,S.AMT  AS SEQ_AMT
      ,HP.AMT AS HDR_PAY_AMT
      ,DP.AMT AS DTL_PAY_AMT
      ,S.AMT - HP.AMT AS DIFF_HDR
      ,S.AMT - DP.AMT AS DIFF_DTL
      ,CASE WHEN S.PAY_CD  IS NULL THEN '3103'
            WHEN HP.PAY_CD IS NULL THEN '3101'
            WHEN S.AMT <> HP.AMT   THEN '3102' END AS HDR_CD
      ,CASE WHEN S.PAY_CD  IS NULL THEN '3203'
            WHEN DP.PAY_CD IS NULL THEN '3201'
            WHEN S.AMT <> DP.AMT   THEN '3202' END AS DTL_CD
      ,TRIM('+' FROM NVL(CASE WHEN S.PAY_CD IS NULL THEN '3103' WHEN HP.PAY_CD IS NULL THEN '3101' WHEN S.AMT <> HP.AMT THEN '3102' END,'')
                  || '+' ||
                  NVL(CASE WHEN S.PAY_CD IS NULL THEN '3203' WHEN DP.PAY_CD IS NULL THEN '3201' WHEN S.AMT <> DP.AMT THEN '3202' END,''))
                                                                                    AS RESULT_CD   /* HDR+DTL 합친 코드 (S-0 집계용) */
  FROM K
  LEFT JOIN S  ON S.STORE_CD =K.STORE_CD AND S.SALE_DATE =K.SALE_DATE AND S.POS_NO =K.POS_NO AND S.BILL_NO =K.BILL_NO AND S.PAY_CD =K.PAY_CD
  LEFT JOIN HP ON HP.STORE_CD=K.STORE_CD AND HP.SALE_DATE=K.SALE_DATE AND HP.POS_NO=K.POS_NO AND HP.BILL_NO=K.BILL_NO AND HP.PAY_CD=K.PAY_CD
  LEFT JOIN DP ON DP.STORE_CD=K.STORE_CD AND DP.SALE_DATE=K.SALE_DATE AND DP.POS_NO=K.POS_NO AND DP.BILL_NO=K.BILL_NO AND DP.PAY_CD=K.PAY_CD
 WHERE (   S.PAY_CD  IS NULL
        OR HP.PAY_CD IS NULL
        OR DP.PAY_CD IS NULL
        OR S.AMT <> HP.AMT
        OR S.AMT <> DP.AMT )
   AND (NVL(S.AMT,0) <> 0 OR NVL(HP.AMT,0) <> 0 OR NVL(DP.AMT,0) <> 0)  /* 세 값 모두 0 인 조합 제외 */
 ORDER BY K.STORE_CD, K.SALE_DATE, K.POS_NO, K.BILL_NO, K.PAY_CD;

/* ═══ [상세] 걸린 전표의 세 테이블 행을 나란히 — 1.PAY_SEQ / 2.HDR_PAY / 3.DTL_PAY 순서로 PAY_CD 안에서 정렬 ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
{{LINE:store:h}}
{{LINE:extra:h}}
),
S AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_PAY_SEQ X
        JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
       WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.PAY_CD NOT IN ('05','12')
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
HP AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_HDR_PAY X
        JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
       WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.PAY_CD NOT IN ('05','12')
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
DP AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_DTL_PAY X
        JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
       WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.PAY_CD NOT IN ('05','12')
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
K AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM S
      UNION SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM HP
      UNION SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM DP),
BAD AS (
    SELECT DISTINCT K.STORE_CD, K.SALE_DATE, K.POS_NO, K.BILL_NO
      FROM K
      LEFT JOIN S  ON S.STORE_CD =K.STORE_CD AND S.SALE_DATE =K.SALE_DATE AND S.POS_NO =K.POS_NO AND S.BILL_NO =K.BILL_NO AND S.PAY_CD =K.PAY_CD
      LEFT JOIN HP ON HP.STORE_CD=K.STORE_CD AND HP.SALE_DATE=K.SALE_DATE AND HP.POS_NO=K.POS_NO AND HP.BILL_NO=K.BILL_NO AND HP.PAY_CD=K.PAY_CD
      LEFT JOIN DP ON DP.STORE_CD=K.STORE_CD AND DP.SALE_DATE=K.SALE_DATE AND DP.POS_NO=K.POS_NO AND DP.BILL_NO=K.BILL_NO AND DP.PAY_CD=K.PAY_CD
     WHERE (   S.PAY_CD IS NULL OR HP.PAY_CD IS NULL OR DP.PAY_CD IS NULL
            OR S.AMT <> HP.AMT  OR S.AMT <> DP.AMT )
       AND (NVL(S.AMT,0) <> 0 OR NVL(HP.AMT,0) <> 0 OR NVL(DP.AMT,0) <> 0))
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,'1.PAY_SEQ' AS 테이블, s.PAY_CD, TO_CHAR(s.PAY_SEQ) AS 행, s.PAY_AMT AS 금액
  FROM BAD B
  JOIN TB_SL_SALE_PAY_SEQ s
    ON s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=B.STORE_CD AND s.SALE_DATE=B.SALE_DATE AND s.POS_NO=B.POS_NO AND s.BILL_NO=B.BILL_NO
UNION ALL
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,'2.HDR_PAY', p.PAY_CD, NULL, p.PAY_AMT
  FROM BAD B
  JOIN TB_SL_SALE_HDR_PAY p
    ON p.HQ_OFFICE_CD = '{{HQ}}' AND p.STORE_CD=B.STORE_CD AND p.SALE_DATE=B.SALE_DATE AND p.POS_NO=B.POS_NO AND p.BILL_NO=B.BILL_NO
UNION ALL
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,'3.DTL_PAY', p.PAY_CD, p.BILL_DTL_NO, p.PAY_AMT
  FROM BAD B
  JOIN TB_SL_SALE_DTL_PAY p
    ON p.HQ_OFFICE_CD = '{{HQ}}' AND p.STORE_CD=B.STORE_CD AND p.SALE_DATE=B.SALE_DATE AND p.POS_NO=B.POS_NO AND p.BILL_NO=B.BILL_NO
 ORDER BY 1, 2, 3, 4, 6, 5, 7;`
},

qp5:{ tag:"P-5", kind:"SELECT", scope:"대상 본사", name:"TB_SL_SALE_PAY vs PAY_SEQ — 학습한 (본사, PAY_CD) 만 검사 (P01 ~ P03)",
  desc:"[판별] TB_SL_SALE_PAY 는 전 전표 필수 테이블이 아닙니다. 0902 전사 실측: H0387/H0616 100%, H0393 99.9%, H0344 80%, 00000 25%, A0001·H0268 등 0%. 본사마다 쓰는 PAY_CD 도 달라 고정 목록으로 못 가리므로, 학습기간 동안 PAY_SEQ 의 (본사,PAY_CD) 가 TB_SL_SALE_PAY 에도 있었던 비율을 세서 표본 30건 이상·95% 이상인 조합(USE_CD)만 검사합니다. P01 TB_SL_SALE_PAY 없음 · P02 PAY_SEQ 없음 · P03 금액 불일치. 원본 수정 내역: ① PAY_CD 를 안 가려 0903 38건이 전부 12(쿠폰) P01 오탐(H0665 는 01/18/02/08/07 이 100%, 12 만 0%) → 학습 MAP. ② [상세] BAD 에 DISTINCT 가 없어 불일치 PAY_CD 가 N 개인 전표는 상세가 N 배 복제(전사 0902 7,612전표) → DISTINCT. ③ 한쪽만 0원인 조합이 P01/P02 로 잡힘 → 양쪽 0 제외. ④ BILLS 조인으로 고아 배제. FULL OUTER JOIN 양방향은 원래 맞음. 수정 후 0903 0건, H0393 0건. 학습기간은 옵션(기본 20260821 부터 조회일 전날까지 — 조회일을 학습에 넣으면 그날 대량 누락이 난 코드가 스스로 '제외' 로 학습돼 못 잡음). 짧으면 표본 30건을 못 채워 검사대상이 비니 2주 이상. 검사대상이 하나도 없으면 이 카드는 항상 0건 = 이 본사엔 성립 안 하는 대사 (E-4 로 확인). [상세] 걸린 전표의 두 테이블 행 전부. TB_SL_SALE_PAY 는 전표+PAY_CD 당 1행이라 행 번호가 없습니다.",
  sql:
`/* ═══ [판별] TB_SL_SALE_PAY vs PAY_SEQ — 실데이터로 학습한 (본사, PAY_CD) 만 검사 (P01 · P02 · P03) ═══ */
WITH MAP AS (
    SELECT k.HQ_OFFICE_CD, k.PAY_CD, COUNT(*) CNT
          ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
                 WHERE p.STORE_CD=k.STORE_CD AND p.SALE_DATE=k.SALE_DATE
                   AND p.POS_NO=k.POS_NO AND p.BILL_NO=k.BILL_NO
                   AND p.PAY_CD=k.PAY_CD) THEN 1 ELSE 0 END) OK_CNT
      FROM (SELECT DISTINCT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO, PAY_CD
              FROM TB_SL_SALE_PAY_SEQ
             WHERE HQ_OFFICE_CD = '{{HQ}}'
               AND {{OPT:learncond}}                          /* ← 학습기간 (옵션) */
               AND PAY_AMT <> 0) k
     GROUP BY k.HQ_OFFICE_CD, k.PAY_CD),
USE_CD AS (
    SELECT HQ_OFFICE_CD, PAY_CD FROM MAP
     WHERE CNT >= 30 AND OK_CNT / CNT >= 0.95),             /* 표본 30건 이상 · 95% 이상 동반한 조합만 */
BILLS AS (
    SELECT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
{{LINE:store:h}}
{{LINE:extra:h}}
),
P AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_PAY X
        JOIN BILLS  B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
        JOIN USE_CD U ON U.HQ_OFFICE_CD=X.HQ_OFFICE_CD AND U.PAY_CD=X.PAY_CD
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
S AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_PAY_SEQ X
        JOIN BILLS  B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
        JOIN USE_CD U ON U.HQ_OFFICE_CD=X.HQ_OFFICE_CD AND U.PAY_CD=X.PAY_CD
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD)
SELECT NVL(p.STORE_CD,s.STORE_CD)   AS STORE_CD
      ,NVL(p.SALE_DATE,s.SALE_DATE) AS SALE_DATE
      ,NVL(p.POS_NO,s.POS_NO)       AS POS_NO
      ,NVL(p.BILL_NO,s.BILL_NO)     AS BILL_NO
      ,NVL(p.PAY_CD,s.PAY_CD)       AS PAY_CD
      ,p.AMT AS PAY금액, s.AMT AS PAY_SEQ금액
      ,NVL(s.AMT,0) - NVL(p.AMT,0)  AS 차이
      ,CASE WHEN p.PAY_CD IS NULL THEN 'P01 TB_SL_SALE_PAY 없음'
            WHEN s.PAY_CD IS NULL THEN 'P02 TB_SL_SALE_PAY_SEQ 없음'
            ELSE 'P03 금액 불일치' END AS RESULT_CD
  FROM P p
  FULL OUTER JOIN S s
    ON  s.STORE_CD=p.STORE_CD AND s.SALE_DATE=p.SALE_DATE
    AND s.POS_NO  =p.POS_NO   AND s.BILL_NO  =p.BILL_NO   AND s.PAY_CD=p.PAY_CD
 WHERE (p.PAY_CD IS NULL OR s.PAY_CD IS NULL OR p.AMT <> s.AMT)
   AND (NVL(p.AMT,0) <> 0 OR NVL(s.AMT,0) <> 0)          /* 0원 조합 제외 */
 ORDER BY 1, 2, 3, 4, 5;

/* ═══ [상세] 걸린 전표의 두 테이블 행 전부 — BAD 를 전표 단위로 DISTINCT (팬아웃 차단) ═══ */
WITH MAP AS (
    SELECT k.HQ_OFFICE_CD, k.PAY_CD, COUNT(*) CNT
          ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
                 WHERE p.STORE_CD=k.STORE_CD AND p.SALE_DATE=k.SALE_DATE
                   AND p.POS_NO=k.POS_NO AND p.BILL_NO=k.BILL_NO
                   AND p.PAY_CD=k.PAY_CD) THEN 1 ELSE 0 END) OK_CNT
      FROM (SELECT DISTINCT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO, PAY_CD
              FROM TB_SL_SALE_PAY_SEQ
             WHERE HQ_OFFICE_CD = '{{HQ}}'
               AND {{OPT:learncond}}
               AND PAY_AMT <> 0) k
     GROUP BY k.HQ_OFFICE_CD, k.PAY_CD),
USE_CD AS (SELECT HQ_OFFICE_CD, PAY_CD FROM MAP WHERE CNT >= 30 AND OK_CNT/CNT >= 0.95),
BILLS AS (
    SELECT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
{{LINE:store:h}}
{{LINE:extra:h}}
),
P AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_PAY X
        JOIN BILLS  B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
        JOIN USE_CD U ON U.HQ_OFFICE_CD=X.HQ_OFFICE_CD AND U.PAY_CD=X.PAY_CD
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
S AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
        FROM TB_SL_SALE_PAY_SEQ X
        JOIN BILLS  B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
        JOIN USE_CD U ON U.HQ_OFFICE_CD=X.HQ_OFFICE_CD AND U.PAY_CD=X.PAY_CD
       WHERE X.HQ_OFFICE_CD = '{{HQ}}'
       GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
BAD AS (
    SELECT DISTINCT                                        /* ★ 팬아웃 차단 */
           NVL(p.STORE_CD,s.STORE_CD)   AS STORE_CD
          ,NVL(p.SALE_DATE,s.SALE_DATE) AS SALE_DATE
          ,NVL(p.POS_NO,s.POS_NO)       AS POS_NO
          ,NVL(p.BILL_NO,s.BILL_NO)     AS BILL_NO
      FROM P p
      FULL OUTER JOIN S s
        ON  s.STORE_CD=p.STORE_CD AND s.SALE_DATE=p.SALE_DATE
        AND s.POS_NO  =p.POS_NO   AND s.BILL_NO  =p.BILL_NO   AND s.PAY_CD=p.PAY_CD
     WHERE (p.PAY_CD IS NULL OR s.PAY_CD IS NULL OR p.AMT <> s.AMT)
       AND (NVL(p.AMT,0) <> 0 OR NVL(s.AMT,0) <> 0))
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,'1.TB_SL_SALE_PAY' AS 테이블
      ,x.PAY_CD
      ,NULL               AS 행          /* PAY_SEQ / LINE_NO 컬럼이 없다 (전표+PAY_CD 당 1행) */
      ,x.PAY_AMT          AS 금액
      ,x.TAX_AMT, x.VAT_AMT, x.SALE_YN
  FROM BAD B
  JOIN TB_SL_SALE_PAY x
    ON x.HQ_OFFICE_CD = '{{HQ}}' AND x.STORE_CD=B.STORE_CD AND x.SALE_DATE=B.SALE_DATE AND x.POS_NO=B.POS_NO AND x.BILL_NO=B.BILL_NO
UNION ALL
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,'2.TB_SL_SALE_PAY_SEQ'
      ,x.PAY_CD
      ,TO_CHAR(x.PAY_SEQ)
      ,x.PAY_AMT
      ,x.TAX_AMT, x.VAT_AMT, x.SALE_YN
  FROM BAD B
  JOIN TB_SL_SALE_PAY_SEQ x
    ON x.HQ_OFFICE_CD = '{{HQ}}' AND x.STORE_CD=B.STORE_CD AND x.SALE_DATE=B.SALE_DATE AND x.POS_NO=B.POS_NO AND x.BILL_NO=B.BILL_NO
 ORDER BY 1, 2, 3, 4, 6, 5, 7;`
},

qp6:{ tag:"P-6", kind:"SELECT", scope:"대상 본사", name:"상세행 결제 배분 (D001)",
  desc:"[판별] 상세행 단위 결제 배분. DTL.REAL_SALE_AMT ≠ SUM(DTL_PAY) (D001). P-4 는 전표+PAY_CD 단위라 상세행 어긋남을 못 보고, 프로시저의 5002 는 주석 처리 상태라 어디에도 없는 검사. [상세] 그 상세행의 DTL_PAY 배분 행.",
  sql:
`/* ═══ [판별] 상세행 결제 배분 (D001) ═══ */
SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.BILL_DTL_NO, d.PROD_CD
      ,d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT
      ,NVL(p.AMT,0) AS DTL_PAY합, d.REAL_SALE_AMT - NVL(p.AMT,0) AS 차이
      ,'D001' AS RESULT_CD
  FROM TB_SL_SALE_DTL d
  LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO,SUM(PAY_AMT) AMT
               FROM TB_SL_SALE_DTL_PAY
              WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO) p
    ON  p.STORE_CD=d.STORE_CD AND p.SALE_DATE=d.SALE_DATE AND p.POS_NO=d.POS_NO
    AND p.BILL_NO=d.BILL_NO   AND p.BILL_DTL_NO=d.BILL_DTL_NO
 WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.{{OPT:datecond}}
   AND d.REAL_SALE_AMT <> NVL(p.AMT,0)
 ORDER BY 1,2,3,4;

/* ═══ [상세] D001 상세행의 DTL_PAY 행 전부 — 어느 결제수단으로 얼마가 배분됐는지 ═══ */
SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.BILL_DTL_NO, d.PROD_CD, d.REAL_SALE_AMT AS 행_REAL
      ,p.PAY_CD, p.PAY_AMT AS 배분금액
      ,SUM(p.PAY_AMT) OVER (PARTITION BY d.STORE_CD,d.SALE_DATE,d.POS_NO,d.BILL_NO,d.BILL_DTL_NO) AS 배분합
  FROM TB_SL_SALE_DTL d
  LEFT JOIN TB_SL_SALE_DTL_PAY p ON p.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND p.STORE_CD=d.STORE_CD AND p.SALE_DATE=d.SALE_DATE AND p.POS_NO=d.POS_NO AND p.BILL_NO=d.BILL_NO AND p.BILL_DTL_NO=d.BILL_DTL_NO
 WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.{{OPT:datecond}}
   {{LINE:store:d}}
   {{LINE:extra:d}}
   AND d.REAL_SALE_AMT <> NVL((SELECT SUM(x.PAY_AMT) FROM TB_SL_SALE_DTL_PAY x WHERE x.HQ_OFFICE_CD=d.HQ_OFFICE_CD AND x.STORE_CD=d.STORE_CD AND x.SALE_DATE=d.SALE_DATE AND x.POS_NO=d.POS_NO AND x.BILL_NO=d.BILL_NO AND x.BILL_DTL_NO=d.BILL_DTL_NO),0)
 ORDER BY 1, 2, 3, 4, 7;`
},

qp7:{ tag:"P-7", kind:"SELECT", scope:"대상 본사", name:"현금영수증만 있고 현금결제 없음 (RCP01)",
  desc:"[판별] 현금영수증(TB_SL_SALE_CASH_RCP) 행은 있는데 PAY_SEQ 에 현금(02) 결제가 없음 (RCP01). NO_SALE_YN=Y 면 비매출 자진발급일 수 있어 단정하지 않습니다. 0903 1건. [상세] 그 전표의 CASH_RCP 행과 PAY_SEQ 행 전부.",
  sql:
`/* ═══ [판별] 현금영수증만 있고 현금결제 없음 (RCP01) ═══ */
SELECT r.STORE_CD, r.POS_NO, r.BILL_NO, r.PAY_SEQ, r.PAY_CD
      ,r.PAY_AMT AS 영수증금액, r.SALE_YN, r.NO_SALE_YN
      ,(SELECT LISTAGG(s.PAY_CD||':'||s.PAY_AMT, ' / ') WITHIN GROUP (ORDER BY s.PAY_SEQ)
          FROM TB_SL_SALE_PAY_SEQ s
         WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=r.STORE_CD AND s.SALE_DATE=r.SALE_DATE
           AND s.POS_NO=r.POS_NO AND s.BILL_NO=r.BILL_NO)     AS 실제결제내역
      ,'RCP01' AS RESULT_CD
  FROM TB_SL_SALE_CASH_RCP r
 WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
        WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=r.STORE_CD AND s.SALE_DATE=r.SALE_DATE
          AND s.POS_NO=r.POS_NO AND s.BILL_NO=r.BILL_NO
          AND s.PAY_CD='02')
 ORDER BY 1,2,3;

/* ═══ [상세] 현금영수증 전표의 CASH_RCP 행과 PAY_SEQ 행 전부 ═══ */
SELECT r.STORE_CD, r.POS_NO, r.BILL_NO, 'CASH_RCP' 테이블, TO_CHAR(r.PAY_SEQ) 행, r.PAY_CD, r.PAY_AMT 금액, r.SALE_YN, r.NO_SALE_YN AS 비매출YN
  FROM TB_SL_SALE_CASH_RCP r
 WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
   {{LINE:store:r}}
   {{LINE:extra:r}}
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s WHERE s.HQ_OFFICE_CD=r.HQ_OFFICE_CD AND s.STORE_CD=r.STORE_CD AND s.SALE_DATE=r.SALE_DATE AND s.POS_NO=r.POS_NO AND s.BILL_NO=r.BILL_NO AND s.PAY_CD='02')
UNION ALL
SELECT s.STORE_CD, s.POS_NO, s.BILL_NO, 'PAY_SEQ', TO_CHAR(s.PAY_SEQ), s.PAY_CD, s.PAY_AMT, s.SALE_YN, NULL
  FROM TB_SL_SALE_PAY_SEQ s
 WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.{{OPT:datecond}}
   {{LINE:store:s}}
   {{LINE:extra:s}}
   AND EXISTS (SELECT 1 FROM TB_SL_SALE_CASH_RCP r WHERE r.HQ_OFFICE_CD=s.HQ_OFFICE_CD AND r.STORE_CD=s.STORE_CD AND r.SALE_DATE=s.SALE_DATE AND r.POS_NO=s.POS_NO AND r.BILL_NO=s.BILL_NO)
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ q WHERE q.HQ_OFFICE_CD=s.HQ_OFFICE_CD AND q.STORE_CD=s.STORE_CD AND q.SALE_DATE=s.SALE_DATE AND q.POS_NO=s.POS_NO AND q.BILL_NO=s.BILL_NO AND q.PAY_CD='02')
 ORDER BY 1, 2, 3, 4, 5;`
},

qd1:{ tag:"D-1", kind:"SELECT", scope:"대상 본사", name:"상세 행 항등식 · 할인 근거 (5001 · 5003)",
  desc:"[판별] 프로시저 CHECK_DTL_DATA 행 단위. 5001 SALE_AMT − DC_AMT ≠ REAL_SALE_AMT · 5003 DTL.DC_AMT ≠ BILL_DTL_NO 별 SUM(DTL_DC). 원본은 DTL_DC 행이 없으면 NULL 비교로 통과(\"할인은 있는데 근거행 없음\" 을 못 잡음) → NVL 로 잡고 DTL_DC_CNT=0 으로 구분. 원문 쿼리는 콤마 조인+ANSI JOIN 혼용으로 ORA-00904 가 나서 조인을 고쳤습니다. 케이스 3 A-2~A-5 결과가 여기서 검증됩니다. [상세] 그 행의 DTL_DC 근거행 전부(DC_CD·REG_SEQ 별).",
  sql:
`/* ═══ [판별] 상세 행 항등식 · 할인 근거 (5001 · 5003) ═══ */
SELECT A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO, A.PROD_CD
      ,A.SALE_AMT, A.DC_AMT, A.REAL_SALE_AMT
      ,A.SALE_AMT - A.DC_AMT      AS EXPECT_REAL
      ,NVL(DD.SUM_DC_AMT,0)       AS DTL_DC_SUM
      ,NVL(DD.CNT,0)              AS DTL_DC_CNT
      ,CASE WHEN A.SALE_AMT - A.DC_AMT <> A.REAL_SALE_AMT THEN '5001'
            WHEN A.DC_AMT <> NVL(DD.SUM_DC_AMT,0)         THEN '5003' END AS RESULT_CD
      ,CASE WHEN A.SALE_AMT - A.DC_AMT = A.REAL_SALE_AMT AND NVL(DD.CNT,0) = 0
            THEN 'N (DTL_DC 없음 -> NULL 통과)' ELSE 'Y' END AS ORIG_DETECT
  FROM TB_SL_SALE_DTL A
  LEFT JOIN (SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, BILL_DTL_NO
                   ,SUM(DC_AMT) SUM_DC_AMT, COUNT(*) CNT
               FROM TB_SL_SALE_DTL_DC
              WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO, BILL_DTL_NO) DD
    ON  DD.STORE_CD    = A.STORE_CD  AND DD.SALE_DATE = A.SALE_DATE
    AND DD.POS_NO      = A.POS_NO    AND DD.BILL_NO   = A.BILL_NO
    AND DD.BILL_DTL_NO = A.BILL_DTL_NO
 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
   AND (  A.SALE_AMT - A.DC_AMT <> A.REAL_SALE_AMT
       OR A.DC_AMT <> NVL(DD.SUM_DC_AMT,0) )
 ORDER BY A.STORE_CD, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO;

/* ═══ [상세] 5001/5003 행의 DTL_DC 근거행 전부 — 할인이 어느 DC_CD 로 어떻게 쪼개져 있는지 ═══ */
SELECT a.STORE_CD, a.POS_NO, a.BILL_NO, a.BILL_DTL_NO, a.PROD_CD
      ,a.SALE_AMT, a.DC_AMT AS DTL_DC, a.REAL_SALE_AMT
      ,c.DC_CD, c.REG_SEQ, c.DC_AMT AS DTLDC_DC, c.DC_REASON_CD, NVL(c.APP_DC_DESC,'-') AS APP_DC_DESC
      ,SUM(c.DC_AMT) OVER (PARTITION BY a.STORE_CD,a.SALE_DATE,a.POS_NO,a.BILL_NO,a.BILL_DTL_NO) AS DTLDC_합
  FROM TB_SL_SALE_DTL a
  LEFT JOIN TB_SL_SALE_DTL_DC c ON c.HQ_OFFICE_CD=a.HQ_OFFICE_CD AND c.STORE_CD=a.STORE_CD AND c.SALE_DATE=a.SALE_DATE AND c.POS_NO=a.POS_NO AND c.BILL_NO=a.BILL_NO AND c.BILL_DTL_NO=a.BILL_DTL_NO
 WHERE a.HQ_OFFICE_CD = '{{HQ}}' AND a.{{OPT:datecond}}
   {{LINE:store:a}}
   {{LINE:extra:a}}
   AND (  a.SALE_AMT - a.DC_AMT <> a.REAL_SALE_AMT
       OR a.DC_AMT <> NVL((SELECT SUM(x.DC_AMT) FROM TB_SL_SALE_DTL_DC x WHERE x.HQ_OFFICE_CD=a.HQ_OFFICE_CD AND x.STORE_CD=a.STORE_CD AND x.SALE_DATE=a.SALE_DATE AND x.POS_NO=a.POS_NO AND x.BILL_NO=a.BILL_NO AND x.BILL_DTL_NO=a.BILL_DTL_NO),0) )
 ORDER BY 1, 2, 3, 4, 9, 10;`
},

qd2:{ tag:"D-2", kind:"SELECT", scope:"대상 본사", name:"할인 상세 정합 (2404 · 2504 · 2405 · 2406)",
  desc:"[판별] 프로시저 CHECK_DC_DTL_DATA. 2404 상세 SALE_YN=Y 이면서 DC<0 또는 REAL<0(v3 부터 H-9 의 6303/6305 가 먼저 잡아 도달 불가) · 2504 DTL_DC.DC_AMT > DTL.SALE_AMT · 2405 DTL_DC 에는 있는데 DTL 에 없는 고아 할인행 · 2406 BILL_DTL_NO 별 합계 불일치. 원본은 헤더 할인 0 이면 블록 자체를 건너뛰고, 2405 검출 후 RETURN 이 없어 오판정, 2406 메시지의 BILL_DTL_NO 가 치환되지 않았습니다. [상세] 걸린 전표의 DTL 행과 DTL_DC 행 전부.",
  sql:
`/* ═══ [판별] 할인 상세 정합 (2404 · 2504 · 2405 · 2406) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_DC_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
)
-- 2404 : DTL 마이너스
SELECT '2404' RESULT_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
      ,A.PROD_CD, A.SALE_AMT, A.DC_AMT AS DC_AMT_DTL, NULL AS DC_AMT_DTLDC, A.REAL_SALE_AMT
      ,'6303/6305 선점 → 2404 도달 불가' AS ORIG_DETECT
  FROM TB_SL_SALE_DTL A, BILLS B
 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
   AND A.SALE_YN='Y' AND (A.DC_AMT < 0 OR A.REAL_SALE_AMT < 0)
UNION ALL
-- 2504 : 할인 > 상품금액
SELECT '2504', A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
      ,D.PROD_CD, D.SALE_AMT, D.DC_AMT, A.DC_AMT, D.REAL_SALE_AMT
      ,CASE WHEN B.TOT_DC_AMT = 0 THEN 'N (헤더할인 0 → 블록 미실행)' ELSE 'Y' END
  FROM TB_SL_SALE_DTL_DC A, TB_SL_SALE_DTL D, BILLS B
 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
   AND D.HQ_OFFICE_CD = '{{HQ}}' AND D.STORE_CD=A.STORE_CD AND D.SALE_DATE=A.SALE_DATE AND D.POS_NO=A.POS_NO AND D.BILL_NO=A.BILL_NO
   AND D.BILL_DTL_NO=A.BILL_DTL_NO
   AND A.SALE_YN='Y' AND A.DC_AMT > D.SALE_AMT
UNION ALL
-- 2405 / 2406 : 고아 할인행 / BILL_DTL_NO 별 합계 불일치
SELECT CASE WHEN D.BILL_DTL_NO IS NULL THEN '2405' ELSE '2406' END
      ,X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.BILL_DTL_NO
      ,D.PROD_CD, D.SALE_AMT, D.DC_AMT, X.SUM_DC_AMT, D.REAL_SALE_AMT
      ,CASE WHEN B.TOT_DC_AMT = 0        THEN 'N (헤더할인 0 → 블록 미실행)'
            WHEN D.BILL_DTL_NO IS NULL   THEN 'N (2405 후 RETURN 누락으로 오판정)'
            ELSE 'Y' END
  FROM (SELECT A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO,A.BILL_DTL_NO, SUM(A.DC_AMT) SUM_DC_AMT
          FROM TB_SL_SALE_DTL_DC A, BILLS B
         WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
         GROUP BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO,A.BILL_DTL_NO) X
  JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
  LEFT JOIN TB_SL_SALE_DTL D
    ON D.HQ_OFFICE_CD = '{{HQ}}' AND D.STORE_CD=X.STORE_CD AND D.SALE_DATE=X.SALE_DATE AND D.POS_NO=X.POS_NO AND D.BILL_NO=X.BILL_NO
   AND D.BILL_DTL_NO=X.BILL_DTL_NO
 WHERE D.BILL_DTL_NO IS NULL OR X.SUM_DC_AMT <> D.DC_AMT
 ORDER BY 3,2,4,5,6;

/* ═══ [상세] 2404~2406 전표의 DTL 행과 DTL_DC 행 전부 나란히 ═══ */
WITH BAD AS (
    SELECT DISTINCT A.HQ_OFFICE_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO
      FROM TB_SL_SALE_DTL_DC A
     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
       {{LINE:store:A}}
       {{LINE:extra:A}}
       AND (  NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL D WHERE D.HQ_OFFICE_CD=A.HQ_OFFICE_CD AND D.STORE_CD=A.STORE_CD AND D.SALE_DATE=A.SALE_DATE AND D.POS_NO=A.POS_NO AND D.BILL_NO=A.BILL_NO AND D.BILL_DTL_NO=A.BILL_DTL_NO)
           OR EXISTS (SELECT 1 FROM TB_SL_SALE_DTL D WHERE D.HQ_OFFICE_CD=A.HQ_OFFICE_CD AND D.STORE_CD=A.STORE_CD AND D.SALE_DATE=A.SALE_DATE AND D.POS_NO=A.POS_NO AND D.BILL_NO=A.BILL_NO AND D.BILL_DTL_NO=A.BILL_DTL_NO
                        AND (A.SALE_YN='Y' AND A.DC_AMT > D.SALE_AMT)) )
    UNION
    SELECT DISTINCT A.HQ_OFFICE_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO
      FROM TB_SL_SALE_DTL A
     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
       {{LINE:store:A}}
       {{LINE:extra:A}}
       AND (  (A.SALE_YN='Y' AND (A.DC_AMT < 0 OR A.REAL_SALE_AMT < 0))
           OR A.DC_AMT <> NVL((SELECT SUM(x.DC_AMT) FROM TB_SL_SALE_DTL_DC x WHERE x.HQ_OFFICE_CD=A.HQ_OFFICE_CD AND x.STORE_CD=A.STORE_CD AND x.SALE_DATE=A.SALE_DATE AND x.POS_NO=A.POS_NO AND x.BILL_NO=A.BILL_NO AND x.BILL_DTL_NO=A.BILL_DTL_NO),0) )
)
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, 'DTL' 테이블, d.BILL_DTL_NO 행, d.PROD_CD 코드, d.SALE_YN, d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT
  FROM BAD B JOIN TB_SL_SALE_DTL d ON d.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND d.STORE_CD=B.STORE_CD AND d.SALE_DATE=B.SALE_DATE AND d.POS_NO=B.POS_NO AND d.BILL_NO=B.BILL_NO
UNION ALL
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, 'DTL_DC', c.BILL_DTL_NO, c.DC_CD, c.SALE_YN, NULL, c.DC_AMT, NULL
  FROM BAD B JOIN TB_SL_SALE_DTL_DC c ON c.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND c.STORE_CD=B.STORE_CD AND c.SALE_DATE=B.SALE_DATE AND c.POS_NO=B.POS_NO AND c.BILL_NO=B.BILL_NO
 ORDER BY 1, 2, 3, 5, 4;`
},

qd3:{ tag:"D-3", kind:"SELECT", scope:"대상 본사", name:"배달할인 APP_DC_DESC 누락 (APP01)",
  desc:"[판별] 배달할인 설명 누락 (APP01). HDR_DC.APP_DC_DESC IS NULL. 0903 34건 = DC_CD 02 33건 + 06 1건, 배달주문(DLVR_ORDER_FG=1)인데 NULL, 17 5건은 값 있음. 어떤 값을 넣을지는 D-4 참고.",
  sql:
`SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.SALE_YN, d.DC_CD, d.DC_AMT
      ,d.DLVR_ORDER_FG, d.DLVR_IN_FG, d.DLVR_IN_SVC_NM
      ,NVL(d.APP_DC_DESC,'(NULL)') AS APP_DC_DESC
