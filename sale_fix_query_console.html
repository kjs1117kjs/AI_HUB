},

c10:{ tag:'C-10', kind:'SELECT', scope:'대상 본사', isNew:true, name:'헤더 vs PAY_SEQ 합계 요약 (8001 / 8002 / 8003 건수)',
  desc:'케이스 5 [H-7] 의 요약판. B-4 뒤 8002 는 사라지고 8001(쿠폰 외 할인행 없음) 만 남아야 합니다. 8001 은 별개 문제라 여기서 안 다룹니다.',
  sql:
`WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, HQ_OFFICE_CD,
           TOT_DC_AMT, VAT_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}'
       {{LINE:store:h}}
       {{LINE:date:h}}
       {{LINE:extra:h}}
),
S AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
          ,SUM(DECODE(PAY_CD,'05',0,'12',0,PAY_AMT))       SEQ_REAL
          ,SUM(DECODE(PAY_CD,'05',PAY_AMT,'12',PAY_AMT,0)) SEQ_DC
          ,SUM(VAT_AMT)                                    SEQ_VAT
      FROM TB_SL_SALE_PAY_SEQ q
     WHERE q.HQ_OFFICE_CD = '{{HQ}}'
       {{LINE:store:q}}
       {{LINE:date:q}}
     GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO
)
SELECT CASE WHEN B.HQ_OFFICE_CD <> 'H0393' AND B.TOT_DC_AMT <> S.SEQ_DC THEN '8001 할인'
            WHEN B.VAT_AMT       <> S.SEQ_VAT  THEN '8002 부가세'
            WHEN B.REAL_SALE_AMT <> S.SEQ_REAL THEN '8003 실판매'
       END AS RESULT_CD,
       COUNT(*)                                 AS 전표수,
       SUM(B.VAT_AMT - S.SEQ_VAT)               AS VAT차이합,
       SUM(B.TOT_DC_AMT - S.SEQ_DC)             AS 할인차이합
  FROM BILLS B, S
 WHERE S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE
   AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
   AND (  (B.HQ_OFFICE_CD <> 'H0393' AND B.TOT_DC_AMT <> S.SEQ_DC)
       OR B.VAT_AMT       <> S.SEQ_VAT
       OR B.REAL_SALE_AMT <> S.SEQ_REAL )
 GROUP BY CASE WHEN B.HQ_OFFICE_CD <> 'H0393' AND B.TOT_DC_AMT <> S.SEQ_DC THEN '8001 할인'
               WHEN B.VAT_AMT       <> S.SEQ_VAT  THEN '8002 부가세'
               WHEN B.REAL_SALE_AMT <> S.SEQ_REAL THEN '8003 실판매'
          END
 ORDER BY 1;`
},

c11:{ tag:'C-11', kind:'SELECT', scope:'대상 본사', isNew:true, name:'4개 테이블 VAT 정합 : 헤더 = 상세합 = 가승인합 = PAY_SEQ합',
  desc:"PAY_CD='18' 이 있는 전표만. 네 열이 같아야 합니다. 다르면 어느 테이블이 어긋났는지 바로 보입니다.",
  sql:
`SELECT h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO,
       h.VAT_AMT                                                        AS 헤더VAT,
       (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD
           AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO
           AND d.BILL_NO=h.BILL_NO)                                     AS 상세VAT합,
       (SELECT NVL(SUM(p.VAT_AMT),0) FROM TB_SL_SALE_PAY_TEMPORARY p
         WHERE p.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND p.STORE_CD=h.STORE_CD
           AND p.SALE_DATE=h.SALE_DATE AND p.POS_NO=h.POS_NO
           AND p.BILL_NO=h.BILL_NO)                                     AS 가승인VAT합,
       (SELECT NVL(SUM(q.VAT_AMT),0) FROM TB_SL_SALE_PAY_SEQ q
         WHERE q.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND q.STORE_CD=h.STORE_CD
           AND q.SALE_DATE=h.SALE_DATE AND q.POS_NO=h.POS_NO
           AND q.BILL_NO=h.BILL_NO)                                     AS PAYSEQ_VAT합
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ q
                WHERE q.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND q.STORE_CD=h.STORE_CD
                  AND q.SALE_DATE=h.SALE_DATE AND q.POS_NO=h.POS_NO
                  AND q.BILL_NO=h.BILL_NO AND q.PAY_CD='18')
 ORDER BY h.STORE_CD, h.POS_NO, h.BILL_NO;`
},

c12:{ tag:'C-12', kind:'SELECT', scope:'집계 대조', isNew:true, name:'B-4 트리거 영향 : 집계가 변하지 않아야 정상',
  desc:'TR_SL_SALE_PAY_SEQ_01 은 VAT_AMT/TAX_AMT 를 참조하는 라인이 0 이고 PAY_AMT 는 안 바뀝니다. B-4 전후로 집계 실판매·부가세가 그대로여야 합니다.',
  sql:
`SELECT t.STORE_CD, t.SALE_DATE, t.REAL_SALE_AMT AS 집계_실판매, t.VAT_AMT AS 집계_부가세,
       (SELECT SUM(h.REAL_SALE_AMT) FROM TB_SL_SALE_HDR h
         WHERE h.HQ_OFFICE_CD=t.HQ_OFFICE_CD AND h.STORE_CD=t.STORE_CD
           AND h.SALE_DATE=t.SALE_DATE)                                 AS 헤더_실판매합,
       (SELECT SUM(h.VAT_AMT) FROM TB_SL_SALE_HDR h
         WHERE h.HQ_OFFICE_CD=t.HQ_OFFICE_CD AND h.STORE_CD=t.STORE_CD
           AND h.SALE_DATE=t.SALE_DATE)                                 AS 헤더_부가세합
  FROM TB_SL_DAILY_TOTAL t
 WHERE t.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:t}}
{{LINE:date:t}}
 ORDER BY t.STORE_CD, t.SALE_DATE;`
},

x1:{ tag:'X-1', kind:'SELECT', scope:'대상 본사', name:'헤더 레벨 불일치 : 계산값 <> 실제값 (구분 ①②③)',
  desc:'기존 [0-B] 에서 VAT_AMT = 0 조건을 빼고 TRUNC(REAL/11) 과 다른 전표를 전부 봅니다. ① VAT 0원 = 이슈5 보정대상, ② 절사누적 차이 = 라인합과 일치하는 정상, ③ 헤더-라인합 불일치 = 이상.',
  sql:
`SELECT h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.SALE_YN, h.SALE_FG,
       h.TOT_SALE_AMT, h.TOT_DC_AMT, h.REAL_SALE_AMT,
       h.VAT_AMT                                                    AS 실제VAT,
       SIGN(h.REAL_SALE_AMT)*TRUNC(ABS(h.REAL_SALE_AMT)/11)         AS 계산_TRUNC11,
       SIGN(h.REAL_SALE_AMT)*ROUND(ABS(h.REAL_SALE_AMT)/11)         AS 계산_ROUND11,
       (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
           AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
           AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)           AS 라인VAT합,
       h.VAT_AMT - SIGN(h.REAL_SALE_AMT)*TRUNC(ABS(h.REAL_SALE_AMT)/11)
                                                                    AS 차이,
       CASE WHEN h.VAT_AMT = 0 THEN '① VAT 0원 (이슈5 보정대상)'
            WHEN h.VAT_AMT = (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                               WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                                 AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                                 AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)
                 THEN '② 절사누적 차이 (라인합과는 일치 / 정상)'
            ELSE '③ 헤더-라인합 불일치 (이상)' END                  AS 구분,
       h.TAX_SALE_AMT, h.NET_SALE_AMT, h.DLVR_YN, h.DLVR_IN_FG,
       (SELECT COUNT(*) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD
           AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
           AND d.REAL_SALE_AMT <> 0)                                AS 금액있는_상세라인,
       (SELECT COUNT(*) FROM TB_SL_SALE_PAY_TEMPORARY t
         WHERE t.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND t.STORE_CD=h.STORE_CD
           AND t.SALE_DATE=h.SALE_DATE AND t.POS_NO=h.POS_NO AND t.BILL_NO=h.BILL_NO)
                                                                    AS 가승인_행수
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0
   AND h.VAT_AMT <> SIGN(h.REAL_SALE_AMT)*TRUNC(ABS(h.REAL_SALE_AMT)/11)   /* ← 불일치만 */
 ORDER BY 구분,
          ABS(h.VAT_AMT - SIGN(h.REAL_SALE_AMT)*TRUNC(ABS(h.REAL_SALE_AMT)/11)) DESC,
          h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO;`
},

x2:{ tag:'X-2', kind:'SELECT', scope:'대상 본사', name:'요약 : 구분별 건수와 후보식 일치율',
  desc:'실측 501 전표 = VAT 값있음 462 (TRUNC 361 · ROUND 63 · 라인합 462 = 100%) + VAT 0원 39. 값이 있는 전표는 라인합 규칙을 100% 지킵니다.',
  sql:
`SELECT CASE WHEN h.VAT_AMT = 0 THEN '① VAT 0원 (이슈5)'
            ELSE '② VAT 값있음' END                                  AS 구분,
       COUNT(*)                                                      AS 전표수,
       SUM(CASE WHEN h.VAT_AMT = SIGN(h.REAL_SALE_AMT)*TRUNC(ABS(h.REAL_SALE_AMT)/11)
                THEN 1 ELSE 0 END)                                   AS TRUNC11_일치,
       SUM(CASE WHEN h.VAT_AMT = SIGN(h.REAL_SALE_AMT)*ROUND(ABS(h.REAL_SALE_AMT)/11)
                THEN 1 ELSE 0 END)                                   AS ROUND11_일치,
       SUM(CASE WHEN h.VAT_AMT = (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                                   WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                                     AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                                     AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)
                THEN 1 ELSE 0 END)                                   AS 라인합_일치
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0
 GROUP BY CASE WHEN h.VAT_AMT = 0 THEN '① VAT 0원 (이슈5)' ELSE '② VAT 값있음' END
 ORDER BY 1;`
},

x3:{ tag:'X-3', kind:'SELECT', scope:'대상 본사', name:'차이 크기 분포 : 절사 누적이 얼마나 벌어지나',
  desc:'VAT 값이 있는 전표만. 실측 -3:10 · -2:16 · -1:72 · 0:361 · +1:2 · +3:1 (음수 98 / 양수 3). 이 분포가 B-1b 적용 여부 판단 근거입니다.',
  sql:
`SELECT 차이, COUNT(*) AS 전표수, SUM(ABS(차이)) AS 차이합
  FROM (SELECT h.VAT_AMT - SIGN(h.REAL_SALE_AMT)*TRUNC(ABS(h.REAL_SALE_AMT)/11) AS 차이
          FROM TB_SL_SALE_HDR h
         WHERE h.HQ_OFFICE_CD = '{{HQ}}'
           {{LINE:store:h}}
           {{LINE:date:h}}
           {{LINE:extra:h}}
           AND h.REAL_SALE_AMT <> 0
           AND h.VAT_AMT <> 0)
 GROUP BY 차이
 ORDER BY 차이;`
},

x4:{ tag:'X-4', kind:'SELECT', scope:'대상 본사', name:'상세 라인 레벨 불일치 : 어느 라인에서 어긋나는지',
  desc:'헤더 차이의 원인 라인을 찾을 때 씁니다. 상품구분(일반/세트메인/사이드)을 같이 보여 케이스 3 과 연결됩니다.',
  sql:
`SELECT d.STORE_CD, d.SALE_DATE, d.POS_NO, d.BILL_NO, d.BILL_DTL_NO,
       d.PROD_CD, d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT,
       d.VAT_AMT                                                    AS 실제VAT,
       SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11)         AS 계산_TRUNC11,
       SIGN(d.REAL_SALE_AMT)*ROUND(ABS(d.REAL_SALE_AMT)/11)         AS 계산_ROUND11,
       d.VAT_AMT - SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11)
                                                                    AS 차이,
       NVL(d.SIDE_P_DTL_NO,'(NULL)')                                AS SIDE_P_DTL_NO,
       CASE WHEN d.SIDE_P_DTL_NO IS NULL         THEN '일반'
            WHEN d.SIDE_P_DTL_NO = d.BILL_DTL_NO THEN '세트메인'
            ELSE '사이드' END                                        AS 상품구분
  FROM TB_SL_SALE_DTL d
 WHERE d.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:d}}
{{LINE:date:d}}
{{LINE:extra:d}}
   AND d.REAL_SALE_AMT <> 0
   AND d.VAT_AMT <> SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11)   /* ← 불일치만 */
 ORDER BY ABS(d.VAT_AMT - SIGN(d.REAL_SALE_AMT)*TRUNC(ABS(d.REAL_SALE_AMT)/11)) DESC,
          d.STORE_CD, d.SALE_DATE, d.POS_NO, d.BILL_NO, d.BILL_DTL_NO;`
},

x5:{ tag:'X-5', kind:'SELECT', scope:'대상 본사', name:'★ 진짜 이상 : 헤더 VAT <> 상세 VAT 합계',
  desc:'[H-5] 구분 ③. 정상 데이터에선 0 건이어야 합니다 (20260901 정상 304/304 일치). 여기에 걸리는 전표는 절사 차이가 아니라 별도 원인이므로 B-1/B-2 로 덮기 전에 따로 확인하세요.',
  sql:
`SELECT h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.SALE_YN,
       h.REAL_SALE_AMT, h.VAT_AMT AS 헤더VAT,
       (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
           AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
           AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)           AS 라인VAT합,
       h.VAT_AMT - (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                     WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                       AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                       AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)  AS 차이
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0
   AND h.VAT_AMT <> (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                      WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                        AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                        AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)
 ORDER BY ABS(h.VAT_AMT - (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                            WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                              AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                              AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)) DESC,
          h.STORE_CD, h.POS_NO, h.BILL_NO;`
},

b1:{ tag:'B-1', kind:'UPDATE', scope:'대상 본사', name:'TB_SL_SALE_DTL : 라인별 부가세 계산',
  desc:'보정 대상 전표(헤더 VAT=0)의 상세 라인만. 반품은 REAL_SALE_AMT 가 음수라 VAT 도 음수로 들어갑니다.',

b1b:{ tag:'B-1b', kind:'MERGE', scope:'대상 본사', name:'(선택) 라인별 절사 잔액 보정',
  when: p => p.opts.b1b === 'apply',
  desc:'B-1 은 라인마다 독립 절사라 SUM(라인 VAT) 가 헤더 REAL 기준값보다 작아집니다 (실측 9전표 13원). 그 차액을 마지막 유효 라인에 몰아줍니다. B-1 직후 실행.',
  sql:
`MERGE INTO TB_SL_SALE_DTL t
USING (
    SELECT h.HQ_OFFICE_CD, h.HQ_BRAND_CD, h.STORE_CD, h.SALE_DATE,
           h.POS_NO, h.BILL_NO,
           (SELECT MAX(x.BILL_DTL_NO) FROM TB_SL_SALE_DTL x
             WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.HQ_BRAND_CD=h.HQ_BRAND_CD
               AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE
               AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO
               AND x.REAL_SALE_AMT <> 0)                     AS TARGET_DTL_NO,
           {{OPT:vat_h}}
             - (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                 WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                   AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                   AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)  AS ADJ_AMT
      FROM TB_SL_SALE_HDR h
     WHERE h.HQ_OFFICE_CD = '{{HQ}}'
       {{LINE:store:h}}
       {{LINE:date:h}}
       {{LINE:extra:h}}
       AND h.REAL_SALE_AMT <> 0
) s
ON (    t.HQ_OFFICE_CD = s.HQ_OFFICE_CD
    AND t.HQ_BRAND_CD  = s.HQ_BRAND_CD
    AND t.STORE_CD     = s.STORE_CD
    AND t.SALE_DATE    = s.SALE_DATE
    AND t.POS_NO       = s.POS_NO
    AND t.BILL_NO      = s.BILL_NO
    AND t.BILL_DTL_NO  = s.TARGET_DTL_NO)
WHEN MATCHED THEN UPDATE SET
       t.VAT_AMT = t.VAT_AMT + s.ADJ_AMT,
       t.MOD_DT  = TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS'),
       t.MOD_ID  = USER
 WHERE s.ADJ_AMT <> 0;`
},

b2:{ tag:'B-2', kind:'UPDATE', scope:'대상 본사', name:'TB_SL_SALE_HDR : 상세 합계로 부가세 / 과세 / 순매출 갱신',
  desc:'VAT_AMT = SUM(상세 VAT), TAX_SALE_AMT = REAL_SALE_AMT, NET_SALE_AMT = REAL_SALE_AMT - VAT. 대상은 VAT=0 인 전표만.',
  sql:
`UPDATE TB_SL_SALE_HDR h
   SET h.VAT_AMT      = (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d

                        - (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                            WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                              AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                              AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO),
       h.MOD_DT       = TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS'),
       h.MOD_ID       = USER
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0
   AND h.VAT_AMT = 0;`
},

b3:{ tag:'B-3', kind:'MERGE', scope:'대상 본사', name:'TB_SL_SALE_PAY_TEMPORARY : 부가세 / 과세금액 갱신',
  desc:'헤더 VAT 를 SALE_AMT 비율로 안분하고 반올림 잔액은 마지막 행에 몰아 SUM(VAT_AMT) = 헤더 VAT 를 보장합니다. TAX_AMT = SALE_AMT. 2단계 상관 서브쿼리는 Oracle 이 해석 못 해서 MERGE + 분석함수로 썼습니다.',
  sql:
`MERGE INTO TB_SL_SALE_PAY_TEMPORARY t
USING (
    SELECT q.HQ_OFFICE_CD, q.HQ_BRAND_CD, q.STORE_CD, q.SALE_DATE,
           q.POS_NO, q.BILL_NO, q.LINE_NO, q.LINE_SEQ_NO, q.REG_SEQ,
           q.SALE_AMT,
           q.BASE_VAT
             + CASE WHEN q.RN = q.CNT
                    THEN q.HDR_VAT - SUM(q.BASE_VAT) OVER (
                             PARTITION BY q.HQ_OFFICE_CD, q.HQ_BRAND_CD, q.STORE_CD,
                                          q.SALE_DATE, q.POS_NO, q.BILL_NO)
                    ELSE 0 END                                   AS NEW_VAT
      FROM (
            SELECT w.HQ_OFFICE_CD, w.HQ_BRAND_CD, w.STORE_CD, w.SALE_DATE,
                   w.POS_NO, w.BILL_NO, w.LINE_NO, w.LINE_SEQ_NO, w.REG_SEQ,
                   w.SALE_AMT, w.HDR_VAT,
                   ROUND(w.HDR_VAT * w.SALE_AMT / NULLIF(w.BILL_SUM,0))  AS BASE_VAT,
                   ROW_NUMBER() OVER (
                       PARTITION BY w.HQ_OFFICE_CD, w.HQ_BRAND_CD, w.STORE_CD,
                                    w.SALE_DATE, w.POS_NO, w.BILL_NO
                           ORDER BY w.LINE_NO, w.LINE_SEQ_NO, w.REG_SEQ)  AS RN,
                   COUNT(*) OVER (
                       PARTITION BY w.HQ_OFFICE_CD, w.HQ_BRAND_CD, w.STORE_CD,
                                    w.SALE_DATE, w.POS_NO, w.BILL_NO)     AS CNT
              FROM (
                    SELECT t2.HQ_OFFICE_CD, t2.HQ_BRAND_CD, t2.STORE_CD, t2.SALE_DATE,
                           t2.POS_NO, t2.BILL_NO, t2.LINE_NO, t2.LINE_SEQ_NO, t2.REG_SEQ,
                           NVL(t2.SALE_AMT,0)                             AS SALE_AMT,
                           h.VAT_AMT                                      AS HDR_VAT,
                           SUM(NVL(t2.SALE_AMT,0)) OVER (
                               PARTITION BY t2.HQ_OFFICE_CD, t2.HQ_BRAND_CD, t2.STORE_CD,
                                            t2.SALE_DATE, t2.POS_NO, t2.BILL_NO)
                                                                          AS BILL_SUM
                      FROM TB_SL_SALE_PAY_TEMPORARY t2
                      JOIN TB_SL_SALE_HDR h
                        ON  h.HQ_OFFICE_CD = t2.HQ_OFFICE_CD
                        AND h.HQ_BRAND_CD  = t2.HQ_BRAND_CD
                        AND h.STORE_CD     = t2.STORE_CD
                        AND h.SALE_DATE    = t2.SALE_DATE
                        AND h.POS_NO       = t2.POS_NO
                        AND h.BILL_NO      = t2.BILL_NO
                     WHERE t2.HQ_OFFICE_CD = '{{HQ}}'
                       {{LINE:store:t2}}
                       {{LINE:date:t2}}
                       {{LINE:extra:t2}}
                       AND h.REAL_SALE_AMT <> 0
                   ) w
           ) q
) s
ON (    t.HQ_OFFICE_CD = s.HQ_OFFICE_CD
    AND t.HQ_BRAND_CD  = s.HQ_BRAND_CD
    AND t.STORE_CD     = s.STORE_CD
    AND t.SALE_DATE    = s.SALE_DATE
    AND t.POS_NO       = s.POS_NO
    AND t.BILL_NO      = s.BILL_NO
    AND t.LINE_NO      = s.LINE_NO
    AND t.LINE_SEQ_NO  = s.LINE_SEQ_NO
    AND t.REG_SEQ      = s.REG_SEQ)
WHEN MATCHED THEN UPDATE SET
       t.VAT_AMT = s.NEW_VAT,
       t.TAX_AMT = s.SALE_AMT,
       t.MOD_DT  = TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS'),
       t.MOD_ID  = USER;`
},

{{LINE:store:h}}

c5:{ tag:'C-5', kind:'SELECT', scope:'대상 본사', name:'헤더 VAT = 상세 VAT 합계 / 순매출식 / 부호',
  desc:'확정된 유일한 규칙(헤더 VAT = 상세 합계)과 TAX·NET 식, VAT 부호 = REAL 부호를 한 번에 봅니다. RULE_OK = N 이 위로 정렬됩니다.',
  sql:
`SELECT h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.SALE_YN,
       h.REAL_SALE_AMT, h.VAT_AMT, h.TAX_SALE_AMT, h.NET_SALE_AMT,
       (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
           AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
           AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)          AS 상세VAT합,
       CASE WHEN h.VAT_AMT = (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                               WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                                 AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                                 AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)
             AND h.TAX_SALE_AMT = h.REAL_SALE_AMT
             AND h.NET_SALE_AMT = h.REAL_SALE_AMT - h.VAT_AMT
             AND SIGN(h.VAT_AMT) = SIGN(h.REAL_SALE_AMT)
            THEN 'Y' ELSE 'N' END                                  AS RULE_OK
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0
 ORDER BY RULE_OK, h.STORE_CD, h.POS_NO, h.BILL_NO;`
},

c6:{ tag:'C-6', kind:'SELECT', scope:'대상 본사', name:'가승인 검증 : TAX_AMT = SALE_AMT, VAT 합 = 헤더 VAT',
  desc:'전표당 행이 2개인 경우(실측 3건)도 안분 잔액 처리로 VAT 합이 헤더와 같아야 합니다.',
  sql:
`SELECT t.STORE_CD, t.SALE_DATE, t.POS_NO, t.BILL_NO,
       COUNT(*)              AS 가승인행수,
       SUM(t.SALE_AMT)       AS SALE합,
       SUM(t.TAX_AMT)        AS TAX합,
       SUM(t.VAT_AMT)        AS VAT합,
       MAX(h.VAT_AMT)        AS 헤더VAT,
       CASE WHEN SUM(t.TAX_AMT) = SUM(t.SALE_AMT)
             AND SUM(t.VAT_AMT) = MAX(h.VAT_AMT)
            THEN 'Y' ELSE 'N' END AS RULE_OK
  FROM TB_SL_SALE_PAY_TEMPORARY t
  JOIN TB_SL_SALE_HDR h
    ON  h.HQ_OFFICE_CD=t.HQ_OFFICE_CD AND h.HQ_BRAND_CD=t.HQ_BRAND_CD
    AND h.STORE_CD=t.STORE_CD AND h.SALE_DATE=t.SALE_DATE
    AND h.POS_NO=t.POS_NO AND h.BILL_NO=t.BILL_NO
 WHERE t.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:t}}
{{LINE:date:t}}
{{LINE:extra:t}}
 GROUP BY t.STORE_CD, t.SALE_DATE, t.POS_NO, t.BILL_NO
 ORDER BY RULE_OK, t.STORE_CD, t.POS_NO, t.BILL_NO;`
},

c7:{ tag:'C-7', kind:'SELECT', scope:'집계 대조', name:'트리거가 갱신한 집계 대조 : 헤더 합계 = TB_SL_DAILY_TOTAL',
  desc:'이번엔 집계 부가세가 실제로 늘어나 헤더 합계와 같아져야 정상입니다.',

  FROM TB_SL_SALE_HDR h

{{LINE:extra:h}}
 GROUP BY h.HQ_OFFICE_CD, h.STORE_CD, h.SALE_DATE
 ORDER BY h.STORE_CD, h.SALE_DATE;`

c8:{ tag:'C-8', kind:'SELECT', scope:'대상 본사', name:'절사 잔액 점검 : 라인 VAT 합 vs 헤더 REAL 기준',
  desc:'B-1b 미적용이면 차이가 남는 게 정상(시스템 표준과 동일), 적용했으면 전건 0 이어야 합니다. 차이 큰 순으로 정렬됩니다.',
  sql:
`SELECT h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.SALE_YN,
       h.REAL_SALE_AMT,
       (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
           AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
           AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)          AS 라인VAT합,
       {{OPT:vat_h}}                                                 AS 헤더REAL기준,
       (SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
         WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
           AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
           AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)
       - {{OPT:vat_h}}                                               AS 차이
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}'
{{LINE:store:h}}
{{LINE:date:h}}
{{LINE:extra:h}}
   AND h.REAL_SALE_AMT <> 0
 ORDER BY ABS((SELECT NVL(SUM(d.VAT_AMT),0) FROM TB_SL_SALE_DTL d
                WHERE d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.HQ_BRAND_CD=h.HQ_BRAND_CD
                  AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE
                  AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO)
              - {{OPT:vat_h}}) DESC,
          h.STORE_CD, h.POS_NO, h.BILL_NO;`
}

  },
  opt(p){
    const F = {
      trunc: a => 'SIGN(' + a + '.REAL_SALE_AMT) * TRUNC(ABS(' + a + '.REAL_SALE_AMT)/11)',
      round: a => 'ROUND(' + a + '.REAL_SALE_AMT/11)',
      net  : a => a + '.REAL_SALE_AMT - ROUND(' + a + '.REAL_SALE_AMT/1.1)'
    };
    const f = F[p.opts.vat] || F.trunc;
    return { vat_d: f('d'), vat_h: f('h'), ref_hq: (p.opts.ref_hq || 'H0393').trim() };

};

qs0:{ tag:"S-0", kind:"SELECT", scope:"대상 본사", isNew:true, name:"★ 전 카드 건수 요약 — 오늘 뭐가 걸렸나 (30장 한 번에)",
  desc:"하루치를 한 번에 봅니다. 카드 29장의 [판별] 결과를 카드·코드별 건수로 요약한 한 장이라, 건수가 있는 카드로만 들어가면 됩니다. 0건 카드도 '(0건)' 으로 한 줄 나와 \"돌긴 돌았다\" 가 보입니다. 읽을 때 세 가지: ① 세로 합산 금지 — 비고 열 'S-3 안' 카드(H-1·H-3·H-6·H-7·H-8·H-9·D-1)는 S-3 가 이미 품은 룰이라 같은 전표가 두 번 잡힘. ② 단위를 같이 읽을 것 — D-3 할인행 54 는 전표 54 가 아니라 매장 1~2곳의 배달할인. ③ S-3 = 0 을 '정상' 으로 읽지 말 것 — S-3 는 전표당 첫 매칭 코드 1개만 내고(8801 과 6102 가 같이 있으면 8801 만), P-6·P-7·D-3·H-2·H-4·H-5·H-10·P-1~P-5·R·A 는 S-3 룰에 없음. 0902 실측: S-3 453건 전부 0000 인데 P-6 2 · P-7 6 · D-3 54 · A-5 37(참고). S-3/H-9 의 6102·6303·6305 는 프로시저 재현이라 헤더 SALE_YN 기준이고 H-10 은 행 기준 양방향이라 서로 다른 답을 낼 수 있습니다(전사 7일 SALE_YN 혼재 전표 15건). A-5 NE01 은 벤슨에선 프로시저가 안 돌리므로 코드가 'NE01(참고)' 로 나옵니다. S-3 는 FIXED_CD 별, R-1 은 OK 를 제외한 R01~R06 만 셉니다. E-1~E-5(설계·전사) 와 D-4(참고) 는 뺐고, S-1/S-2 는 이 카드에 포함되는 정보라 뺐습니다. 하루치 한 본사면 몇 초, 기간을 넓히면 P-1(16테이블) 이 가장 무겁습니다. 코드 뜻과 이동은 바로 위 [색인] 카드.",
  sql:
`/* ═══ S-0 · 전 카드 건수 요약 — 카드 29장의 [판별] 을 각각 COUNT 로 감싸 UNION ALL. 0건 카드도 '(0건)' 한 줄로 나옵니다. E-1~E-5(설계·전사) 와 D-4(참고) 는 제외.
   읽는 법 ① 세로 합산 금지 — S-3 는 H-1·H-3·H-6·H-7·H-8·H-9·D-1 의 룰을 이미 품고 있어 같은 전표가 양쪽에 잡힘(비고 열 참고).
           ② 단위를 같이 읽을 것 — 할인행 54 는 전표 54 가 아님.
           ③ S-3 = 0 이 '정상' 은 아님 — S-3 는 전표당 코드 1개(첫 매칭)만 내고, 3xxx/5Pxx/P-6·P-7·D-3·H-2·H-4·H-5·H-10·R·A 는 S-3 룰에 없음.
   DUAL LEFT JOIN 없이 인라인 뷰 + UNION ALL 로 감쌌습니다(ORA-00918 회피). 판별 안의 조인은 원래대로. H0393 급 대형 본사(17만 전표/일)에는 S-3·H-1 이 무거우니 매장이나 기간을 잘라서 ═══ */
SELECT 카드, 코드, 건수, 단위, 비고
  FROM (
  /* ───── S-3 ───── */
  SELECT  1 AS 순번, 'S-3' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 대표판정' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT FIXED_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, HQ_OFFICE_CD, SALE_YN
                      ,TOT_SALE_AMT, TOT_DC_AMT, VAT_AMT, NET_SALE_AMT, REAL_SALE_AMT
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            ),
            D AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
                        ,SUM(SALE_AMT) SALE_AMT, SUM(DC_AMT) DC_AMT, SUM(REAL_SALE_AMT) REAL_AMT, SUM(VAT_AMT) VAT_AMT
                        ,SUM(CASE WHEN VAT_AMT       < 0 THEN 1 ELSE 0 END)                 MINUS_VAT_CNT
                        ,SUM(CASE WHEN REAL_SALE_AMT < 0 THEN 1 ELSE 0 END)                 MINUS_REAL_CNT
                        ,SUM(CASE WHEN DC_AMT        < 0 THEN 1 ELSE 0 END)                 MINUS_DC_CNT
                        ,SUM(CASE WHEN ABS(SALE_AMT) < ABS(DC_AMT) THEN 1 ELSE 0 END)       OVER_DC_CNT
                        ,SUM(CASE WHEN SALE_AMT - DC_AMT <> REAL_SALE_AMT THEN 1 ELSE 0 END) ERR_5001
                        ,SUM(DECODE(SUBSTRB(PROD_CD,1,4),'LYNK',ERP_SEND_AMT,SALE_AMT))     ERP_SEND_AMT
                    FROM TB_SL_SALE_DTL WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                   GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            DD5003 AS (
                SELECT A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO
                      ,SUM(CASE WHEN X.SUM_DC IS NOT NULL AND A.DC_AMT <> X.SUM_DC THEN 1 ELSE 0 END) ERR_ORIG
                      ,SUM(CASE WHEN A.DC_AMT <> NVL(X.SUM_DC,0) THEN 1 ELSE 0 END)                   ERR_FIXED
                  FROM TB_SL_SALE_DTL A
                  LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO,SUM(DC_AMT) SUM_DC
                               FROM TB_SL_SALE_DTL_DC WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                              GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO) X
                    ON X.STORE_CD=A.STORE_CD AND X.SALE_DATE=A.SALE_DATE AND X.POS_NO=A.POS_NO AND X.BILL_NO=A.BILL_NO
                   AND X.BILL_DTL_NO=A.BILL_DTL_NO
                 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
                 GROUP BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO),
            S AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
                        ,SUM(DECODE(PAY_CD,'05',0,'12',0,PAY_AMT))       REAL_AMT
                        ,SUM(DECODE(PAY_CD,'05',PAY_AMT,'12',PAY_AMT,0)) DC_AMT
                        ,SUM(VAT_AMT)                                    VAT_AMT
                        ,SUM(DECODE(PAY_CD,'04',VAT_AMT,0))              POINT_VAT
                        ,SUM(PAY_AMT)                                    PAY_ALL
                    FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                   GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            E AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, SUM(DC_AMT) ETC_DC
                    FROM TB_SL_SALE_HDR_DC
                   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} AND DC_CD NOT IN ('02','12','05')
                   GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_HDR_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            DP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_DTL_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_HDR_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            DD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_DTL_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            JUDGE AS (
                SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
                      ,B.TOT_SALE_AMT, B.TOT_DC_AMT, B.VAT_AMT, B.NET_SALE_AMT, B.REAL_SALE_AMT
                      ,D.SALE_AMT DTL_SALE, D.DC_AMT DTL_DC, D.VAT_AMT DTL_VAT, D.REAL_AMT DTL_REAL
                      ,S.REAL_AMT SEQ_REAL, S.DC_AMT SEQ_DC, S.VAT_AMT SEQ_VAT, E.ETC_DC
                      ,HP.AMT HDRPAY_AMT, HD.AMT HDRDC_AMT, DD.AMT DTLDC_AMT
                      -- ---------------- 원본 프로시저 판정 (결함 그대로) ----------------
                      ,CASE
                         WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'
                         WHEN D.CNT IS NULL                                   THEN '4404'
                         WHEN S.CNT IS NULL                                   THEN '3404'
                         WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
                         WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
                         WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
                         WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
                         WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
                         WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
                         WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
                         WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
                           OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
                         WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
                         WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
                         WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
                          AND E.ETC_DC IS NOT NULL                                              -- NULL 이면 통과(결함)
                          AND B.TOT_DC_AMT <> S.DC_AMT + E.ETC_DC              THEN '8801'
                         WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
                         WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
                         WHEN HP.AMT IS NOT NULL AND B.REAL_SALE_AMT <> HP.AMT THEN '7001'      -- NULL 이면 통과(결함)
                         WHEN B.TOT_DC_AMT <> 0 AND B.TOT_DC_AMT <> NVL(HD.AMT,0) THEN '6001'   -- 할인 0 이면 미조회(결함)
                         WHEN B.TOT_DC_AMT <> 0 AND B.TOT_DC_AMT <> NVL(DD.AMT,0) THEN '6002'
                         WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
                         WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
                         WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
                         WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
                         WHEN D.OVER_DC_CNT > 0                               THEN '6405'
                         WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
                         WHEN D.ERR_5001 > 0                                  THEN '5001'
                         WHEN Z.ERR_ORIG > 0                                  THEN '5003'
                         WHEN B.HQ_OFFICE_CD = 'A0001'
                          AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                             OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                             OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
                         ELSE '0000' END AS ORIG_CD
                      -- ---------------- 결함 제거 판정 ----------------
                      ,CASE
                         WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'
                         WHEN D.CNT IS NULL                                   THEN '4404'
                         WHEN S.CNT IS NULL                                   THEN '3404'
                         WHEN HP.CNT IS NULL                                  THEN '4414'
                         WHEN DP.CNT IS NULL                                  THEN '5404'
                         WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
                         WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
                         WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
                         WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
                         WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
                         WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
                         WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
                         WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
                           OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
                         WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
                         WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
                         WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
                          AND B.TOT_DC_AMT <> S.DC_AMT + NVL(E.ETC_DC,0)      THEN '8801'
                         WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
                         WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
                         WHEN B.REAL_SALE_AMT <> NVL(HP.AMT,0)                THEN '7001'
                         WHEN B.TOT_DC_AMT    <> NVL(HD.AMT,0)                THEN '6001'
                         WHEN B.TOT_DC_AMT    <> NVL(DD.AMT,0)                THEN '6002'
                         WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
                         WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
                         WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
                         WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
                         WHEN D.OVER_DC_CNT > 0                               THEN '6405'
                         WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
                         WHEN D.ERR_5001 > 0                                  THEN '5001'
                         WHEN Z.ERR_FIXED > 0                                 THEN '5003'
                         WHEN B.HQ_OFFICE_CD = 'A0001'
                          AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                             OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                             OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
                         ELSE '0000' END AS FIXED_CD
                  FROM BILLS B
                  LEFT JOIN D      ON D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO

                  LEFT JOIN S      ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO

            SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN

                      ,(SELECT COUNT(*) FROM TB_SL_SALE_HDR_PAY X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) HPAY_CNT
                      ,(SELECT COUNT(*) FROM TB_SL_SALE_DTL_PAY X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) DPAY_CNT
                      ,(SELECT COUNT(*) FROM TB_SL_SALE_HDR_DC  X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) HDC_CNT
                      ,(SELECT COUNT(*) FROM TB_SL_SALE_DTL_DC  X WHERE X.HQ_OFFICE_CD = '{{HQ}}' AND X.STORE_CD=B.STORE_CD AND X.SALE_DATE=B.SALE_DATE AND X.POS_NO=B.POS_NO AND X.BILL_NO=B.BILL_NO) DDC_CNT

            SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
                  ,B.TOT_SALE_AMT, B.TOT_DC_AMT, B.REAL_SALE_AMT
                  ,C.DTL_CNT, C.SEQ_CNT, C.HPAY_CNT, C.DPAY_CNT, C.HDC_CNT, C.DDC_CNT
                  ,CASE WHEN B.TOT_SALE_AMT IS NULL                  THEN '1404'

                        WHEN C.SEQ_CNT  = 0                          THEN '3404'

                        WHEN C.DPAY_CNT = 0                          THEN '5404'

   WHERE 코드 IS NOT NULL OR 카드총건수 = 0

             WHERE x.HQ_OFFICE_CD = '{{HQ}}' AND x.{{OPT:datecond}} AND NOT EXISTS

   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-3 ───── */
  SELECT  4 AS 순번, 'H-3' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 안 (중복 집계)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (

                  ,NET_SALE_AMT + VAT_AMT AS NET_PLUS_VAT
                  ,(NET_SALE_AMT + VAT_AMT) - REAL_SALE_AMT AS DIFF
                  ,CASE WHEN SALE_YN='Y' AND REAL_SALE_AMT < 0 THEN '9211'

             WHERE HQ_OFFICE_CD = '{{HQ}}'

               {{LINE:store:}}
               {{LINE:extra:}}
               AND (  (SALE_YN='Y' AND REAL_SALE_AMT < 0)

                   OR (NET_SALE_AMT + VAT_AMT <> REAL_SALE_AMT) )
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-4 ───── */
  SELECT  5 AS 순번, 'H-4' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고

           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-5 ───── */
  SELECT  6 AS 순번, 'H-5' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고

                       AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO)          AS 결제VAT합

   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-6 ───── */
  SELECT  7 AS 순번, 'H-6' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 안 (중복 집계)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_SALE_AMT, TOT_DC_AMT, VAT_AMT, REAL_SALE_AMT

                 WHERE HQ_OFFICE_CD = '{{HQ}}'

                   {{LINE:store:}}
                   {{LINE:extra:}}

            D AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO

                 WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                 GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO
            )
            SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
                  ,B.TOT_SALE_AMT , D.SALE_AMT, B.TOT_SALE_AMT  - D.SALE_AMT AS DIFF_9001
                  ,B.TOT_DC_AMT   , D.DC_AMT  , B.TOT_DC_AMT    - D.DC_AMT   AS DIFF_9002
                  ,B.VAT_AMT      , D.VAT_AMT AS DTL_VAT_AMT, B.VAT_AMT - D.VAT_AMT  AS DIFF_9003
                  ,B.REAL_SALE_AMT, D.REAL_AMT, B.REAL_SALE_AMT - D.REAL_AMT AS DIFF_9004
                  ,CASE WHEN B.TOT_SALE_AMT  <> D.SALE_AMT THEN '9001'
                        WHEN B.TOT_DC_AMT    <> D.DC_AMT   THEN '9002'
                        WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)

                        WHEN B.REAL_SALE_AMT <> D.REAL_AMT THEN '9004'
                   END AS RESULT_CD
              FROM BILLS B, D
             WHERE D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
               AND (  B.TOT_SALE_AMT  <> D.SALE_AMT
                   OR B.TOT_DC_AMT    <> D.DC_AMT
                   OR B.REAL_SALE_AMT <> D.REAL_AMT

  /* ───── H-7 ───── */

                  FROM TB_SL_SALE_HDR_DC
                 WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
