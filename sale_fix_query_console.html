            SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
                  ,B.TOT_DC_AMT, S.SEQ_DC, NVL(E.ETC_DC,0) AS ETC_DC
                  ,B.TOT_DC_AMT - S.SEQ_DC                  AS DIFF_8001
                  ,B.TOT_DC_AMT - (S.SEQ_DC + NVL(E.ETC_DC,0)) AS DIFF_8801
                  ,B.VAT_AMT      , S.SEQ_VAT , B.VAT_AMT       - S.SEQ_VAT  AS DIFF_8002
                  ,B.REAL_SALE_AMT, S.SEQ_REAL, B.REAL_SALE_AMT - S.SEQ_REAL AS DIFF_8003
                  ,CASE WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.SEQ_DC           THEN '8001'
                        WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.SEQ_DC
                         AND B.TOT_DC_AMT <> S.SEQ_DC + NVL(E.ETC_DC,0)                                     THEN '8801'
                        WHEN B.VAT_AMT       <> S.SEQ_VAT  THEN '8002'
                        WHEN B.REAL_SALE_AMT <> S.SEQ_REAL THEN '8003'
                   END AS RESULT_CD
                  ,CASE WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.SEQ_DC AND E.ETC_DC IS NULL
                        THEN 'N (ETC SUM NULL → 통과)' ELSE 'Y' END AS ORIG_DETECT
              FROM BILLS B
              JOIN S ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
              LEFT JOIN E ON E.STORE_CD=B.STORE_CD AND E.SALE_DATE=B.SALE_DATE AND E.POS_NO=B.POS_NO AND E.BILL_NO=B.BILL_NO
             WHERE (B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.SEQ_DC)
                OR (B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.SEQ_DC AND B.TOT_DC_AMT <> S.SEQ_DC + NVL(E.ETC_DC,0))
                OR B.VAT_AMT       <> S.SEQ_VAT
                OR B.REAL_SALE_AMT <> S.SEQ_REAL
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-8 ───── */
  SELECT  9 AS 순번, 'H-8' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 안 (중복 집계)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_DC_AMT, REAL_SALE_AMT
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            ),
            HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(PAY_AMT) AMT FROM TB_SL_SALE_HDR_PAY
                    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(DC_AMT)  AMT FROM TB_SL_SALE_HDR_DC
                    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            DD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(DC_AMT)  AMT FROM TB_SL_SALE_DTL_DC
                    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO)
            SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
                  ,B.REAL_SALE_AMT, NVL(HP.AMT,0) AS HDR_PAY_AMT, B.REAL_SALE_AMT - NVL(HP.AMT,0) AS DIFF_7001
                  ,B.TOT_DC_AMT   , NVL(HD.AMT,0) AS HDR_DC_AMT , B.TOT_DC_AMT    - NVL(HD.AMT,0) AS DIFF_6001
                  ,                 NVL(DD.AMT,0) AS DTL_DC_AMT , B.TOT_DC_AMT    - NVL(DD.AMT,0) AS DIFF_6002
                  ,CASE WHEN B.REAL_SALE_AMT <> NVL(HP.AMT,0) THEN '7001'
                        WHEN B.TOT_DC_AMT    <> NVL(HD.AMT,0) THEN '6001'
                        WHEN B.TOT_DC_AMT    <> NVL(DD.AMT,0) THEN '6002'
                   END AS RESULT_CD
                  ,CASE WHEN HP.AMT IS NULL AND B.REAL_SALE_AMT <> 0     THEN 'N (HDR_PAY 없음 → NULL 통과)'
                        WHEN B.TOT_DC_AMT = 0
                         AND (NVL(HD.AMT,0)<>0 OR NVL(DD.AMT,0)<>0)      THEN 'N (헤더할인 0 → 미조회)'
                        ELSE 'Y' END AS ORIG_DETECT
              FROM BILLS B
              LEFT JOIN HP ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
              LEFT JOIN HD ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
              LEFT JOIN DD ON DD.STORE_CD=B.STORE_CD AND DD.SALE_DATE=B.SALE_DATE AND DD.POS_NO=B.POS_NO AND DD.BILL_NO=B.BILL_NO
             WHERE B.REAL_SALE_AMT <> NVL(HP.AMT,0)
                OR B.TOT_DC_AMT    <> NVL(HD.AMT,0)
                OR B.TOT_DC_AMT    <> NVL(DD.AMT,0)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-9 ───── */
  SELECT 10 AS 순번, 'H-9' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 안 (중복 집계)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN, TOT_SALE_AMT
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            ),
            S AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, SUM(DECODE(PAY_CD,'04',VAT_AMT,0)) POINT_VAT
                    FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                   GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            D AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO
                        ,SUM(CASE WHEN VAT_AMT       < 0 THEN 1 ELSE 0 END)             MINUS_VAT_CNT
                        ,SUM(CASE WHEN REAL_SALE_AMT < 0 THEN 1 ELSE 0 END)             MINUS_REAL_CNT
                        ,SUM(CASE WHEN DC_AMT        < 0 THEN 1 ELSE 0 END)             MINUS_DC_CNT
                        ,SUM(CASE WHEN ABS(SALE_AMT) < ABS(DC_AMT) THEN 1 ELSE 0 END)   OVER_DC_CNT
                        ,SUM(DECODE(SUBSTRB(PROD_CD,1,4),'LYNK',ERP_SEND_AMT,SALE_AMT)) ERP_SEND_AMT
                    FROM TB_SL_SALE_DTL WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                   GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO)
            SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
                  ,NVL(S.POINT_VAT,0) AS POINT_VAT
                  ,D.MINUS_VAT_CNT, D.MINUS_REAL_CNT, D.MINUS_DC_CNT, D.OVER_DC_CNT
                  ,B.TOT_SALE_AMT, D.ERP_SEND_AMT, NVL(B.TOT_SALE_AMT,0) - NVL(D.ERP_SEND_AMT,0) AS DIFF_6505
                  ,CASE WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
                        WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0              THEN '6102'
                        WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0              THEN '6303'
                        WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0              THEN '6305'
                        WHEN D.OVER_DC_CNT > 0                                   THEN '6405'
                        WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)      THEN '6505'
                   END AS RESULT_CD
              FROM BILLS B
              LEFT JOIN S ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
              LEFT JOIN D ON D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
             WHERE (NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207')
                OR (B.SALE_YN='Y' AND (D.MINUS_VAT_CNT > 0 OR D.MINUS_REAL_CNT > 0 OR D.MINUS_DC_CNT > 0))
                OR D.OVER_DC_CNT > 0
                OR NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── H-10 ───── */
  SELECT 11 AS 순번, 'H-10' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT 'SIGN' AS 코드 FROM (
            SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.SALE_YN AS 헤더SALE_YN, h.REAL_SALE_AMT AS 헤더REAL, h.VAT_AMT AS 헤더VAT
                  ,SUM(CASE WHEN d.SALE_YN='Y' AND d.VAT_AMT       < 0 THEN 1 ELSE 0 END) AS "6102_매출VAT음수"
                  ,SUM(CASE WHEN d.SALE_YN='N' AND d.VAT_AMT       > 0 THEN 1 ELSE 0 END) AS "6112_반품VAT양수"
                  ,SUM(CASE WHEN d.SALE_YN='Y' AND d.REAL_SALE_AMT < 0 THEN 1 ELSE 0 END) AS "6303_매출REAL음수"
                  ,SUM(CASE WHEN d.SALE_YN='N' AND d.REAL_SALE_AMT > 0 THEN 1 ELSE 0 END) AS "6313_반품REAL양수"
                  ,(SELECT COUNT(*) FROM TB_SL_SALE_PAY_SEQ s
                     WHERE s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
                       AND s.SALE_YN='Y' AND s.PAY_AMT < 0)                                AS "3211_매출PAY음수"
                  ,(SELECT COUNT(*) FROM TB_SL_SALE_PAY_SEQ s
                     WHERE s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
                       AND s.SALE_YN='N' AND s.PAY_AMT > 0)                                AS "3212_반품PAY양수"
                  ,CASE WHEN h.SALE_YN <> MIN(d.SALE_YN) OR h.SALE_YN <> MAX(d.SALE_YN) THEN 'MIX 헤더/상세 SALE_YN 불일치' END AS 비고
              FROM TB_SL_SALE_HDR h
              JOIN TB_SL_SALE_DTL d
                ON d.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND d.STORE_CD=h.STORE_CD AND d.SALE_DATE=h.SALE_DATE AND d.POS_NO=h.POS_NO AND d.BILL_NO=h.BILL_NO
             WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
            {{LINE:store:h}}
            {{LINE:extra:h}}
             GROUP BY h.HQ_OFFICE_CD, h.STORE_CD, h.SALE_DATE, h.POS_NO, h.BILL_NO, h.SALE_YN, h.REAL_SALE_AMT, h.VAT_AMT
            HAVING SUM(CASE WHEN (d.SALE_YN='Y' AND (d.VAT_AMT < 0 OR d.REAL_SALE_AMT < 0))
                              OR (d.SALE_YN='N' AND (d.VAT_AMT > 0 OR d.REAL_SALE_AMT > 0)) THEN 1 ELSE 0 END) > 0
                OR EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
                            WHERE s.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND s.STORE_CD=h.STORE_CD AND s.SALE_DATE=h.SALE_DATE AND s.POS_NO=h.POS_NO AND s.BILL_NO=h.BILL_NO
                              AND ((s.SALE_YN='Y' AND s.PAY_AMT < 0) OR (s.SALE_YN='N' AND s.PAY_AMT > 0)))
                OR h.SALE_YN <> MIN(d.SALE_YN) OR h.SALE_YN <> MAX(d.SALE_YN)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-1 ───── */
  SELECT 12 AS 순번, 'P-1' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '결제행' AS 단위, 'S-3 밖 (행 단위)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            ),
            PAYDTL AS (
                SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'01' PAY_CD, SALE_AMT AM_PAY, DC_AMT AM_DC, VAT_AMT AM_VAT
                  FROM TB_SL_SALE_PAY_CARD      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'02',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_CASH      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'03',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_PAYCO     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'04',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_VPOINT    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'05',0,NVL(VCOUPN_DC_AMT,0),0
                  FROM TB_SL_SALE_PAY_VCOUPN    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'06',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_VCHARGE   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'07',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_MPAY      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'08',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_MCOUPN    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'10',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_PREPAID   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'11',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_POSTPAID  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'12',0,NVL(DC_AMT,0)*SALE_FG,0
                  FROM TB_SL_SALE_PAY_COUPN     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'13',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_GIFT      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'14',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_FSTMP     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'17',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_EMP_CARD  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'18',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_TEMPORARY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'19',SALE_AMT,0,VAT_AMT
                  FROM TB_SL_SALE_PAY_VORDER    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
            ),
            SEQ AS (
                SELECT S.STORE_CD, S.SALE_DATE, S.POS_NO, S.BILL_NO, S.PAY_SEQ, S.LINE_NO, S.PAY_CD
                      ,S.PAY_AMT SEQ_PAY_AMT, S.VAT_AMT SEQ_VAT_AMT
                  FROM TB_SL_SALE_PAY_SEQ S, BILLS B
                 WHERE S.HQ_OFFICE_CD = '{{HQ}}' AND S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
                   AND S.PAY_AMT <> 0
            )
            SELECT Q.STORE_CD, Q.SALE_DATE, Q.POS_NO, Q.BILL_NO, Q.PAY_SEQ, Q.LINE_NO, Q.PAY_CD
                  ,Q.SEQ_PAY_AMT, P.AM_PAY, P.AM_DC
                  ,Q.SEQ_VAT_AMT, P.AM_VAT
                  ,CASE WHEN Q.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
                                                                                        THEN '3009'
                        WHEN P.PAY_CD IS NULL                                           THEN '3004'
                        WHEN Q.PAY_CD IN ('05','12')     AND Q.SEQ_PAY_AMT <> P.AM_DC   THEN '3001'
                        WHEN Q.PAY_CD NOT IN ('05','12') AND Q.SEQ_PAY_AMT <> P.AM_PAY  THEN '3002'
                        WHEN Q.PAY_CD NOT IN ('05','12') AND Q.SEQ_VAT_AMT <> P.AM_VAT  THEN '3003'
                   END AS RESULT_CD
                  ,CASE WHEN Q.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
                          OR P.PAY_CD IS NULL THEN 'N (프로시저 ORA-20001 로 사망)' ELSE 'Y' END AS ORIG_DETECT
              FROM SEQ Q
              LEFT JOIN PAYDTL P
                ON  P.STORE_CD=Q.STORE_CD AND P.SALE_DATE=Q.SALE_DATE AND P.POS_NO=Q.POS_NO
                AND P.BILL_NO =Q.BILL_NO  AND P.LINE_NO  =Q.LINE_NO   AND P.PAY_CD=Q.PAY_CD
             WHERE Q.PAY_CD NOT IN ('01','02','03','04','05','06','07','08','10','11','12','13','14','17','18','19')
                OR P.PAY_CD IS NULL
                OR (Q.PAY_CD IN ('05','12')     AND Q.SEQ_PAY_AMT <> P.AM_DC)
                OR (Q.PAY_CD NOT IN ('05','12') AND (Q.SEQ_PAY_AMT <> P.AM_PAY OR Q.SEQ_VAT_AMT <> P.AM_VAT))
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-2 ───── */
  SELECT 13 AS 순번, 'P-2' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '결제상세행' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH PD AS (
              SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'01' PAY_CD,SALE_AMT AMT FROM TB_SL_SALE_PAY_CARD      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'02',SALE_AMT FROM TB_SL_SALE_PAY_CASH       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'03',SALE_AMT FROM TB_SL_SALE_PAY_PAYCO      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'04',SALE_AMT FROM TB_SL_SALE_PAY_VPOINT     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'05',NVL(VCOUPN_DC_AMT,0) FROM TB_SL_SALE_PAY_VCOUPN WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'06',SALE_AMT FROM TB_SL_SALE_PAY_VCHARGE    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'07',SALE_AMT FROM TB_SL_SALE_PAY_MPAY       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'08',SALE_AMT FROM TB_SL_SALE_PAY_MCOUPN     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'10',SALE_AMT FROM TB_SL_SALE_PAY_PREPAID    WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'11',SALE_AMT FROM TB_SL_SALE_PAY_POSTPAID   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'12',NVL(DC_AMT,0)*SALE_FG FROM TB_SL_SALE_PAY_COUPN WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'13',SALE_AMT FROM TB_SL_SALE_PAY_GIFT       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'14',SALE_AMT FROM TB_SL_SALE_PAY_FSTMP      WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'17',SALE_AMT FROM TB_SL_SALE_PAY_EMP_CARD   WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'18',SALE_AMT FROM TB_SL_SALE_PAY_TEMPORARY  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              UNION ALL SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,LINE_NO,'19',SALE_AMT FROM TB_SL_SALE_PAY_VORDER     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}})
            SELECT P.STORE_CD, P.POS_NO, P.BILL_NO, P.LINE_NO, P.PAY_CD, P.AMT
                  ,'3005' AS RESULT_CD, '결제상세 있는데 PAY_SEQ 없음' AS 설명
              FROM PD P
             WHERE NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ S
                    WHERE S.HQ_OFFICE_CD='{{HQ}}'
                      AND S.HQ_OFFICE_CD = '{{HQ}}' AND S.STORE_CD=P.STORE_CD AND S.SALE_DATE=P.SALE_DATE
                      AND S.POS_NO=P.POS_NO     AND S.BILL_NO=P.BILL_NO
                      AND S.LINE_NO=P.LINE_NO   AND S.PAY_CD=P.PAY_CD)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-3 ───── */
  SELECT 14 AS 순번, 'P-3' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '결제행' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT STORE_CD, POS_NO, BILL_NO, PAY_SEQ, PAY_CD, LINE_NO
                  ,PAY_AMT, TAX_AMT, NO_TAX_AMT, VAT_AMT
                  ,PAY_AMT - (NVL(TAX_AMT,0) + NVL(NO_TAX_AMT,0)) AS 차이
                  ,'PAY01' AS RESULT_CD
              FROM TB_SL_SALE_PAY_SEQ
             WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
               AND PAY_CD NOT IN ('05','12')
               AND PAY_AMT <> NVL(TAX_AMT,0) + NVL(NO_TAX_AMT,0)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-4 ───── */
  SELECT 15 AS 순번, 'P-4' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표·PAY_CD' AS 단위, 'S-3 밖 (행 단위)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO
                  FROM TB_SL_SALE_HDR h
                 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
            {{LINE:store:h}}
            {{LINE:extra:h}}
            ),
            S AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
                    FROM TB_SL_SALE_PAY_SEQ X
                    JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
                   WHERE X.HQ_OFFICE_CD = '{{HQ}}'
                     AND X.PAY_CD NOT IN ('05','12')             /* ★ 할인성 결제 제외 — HDR_PAY/DTL_PAY 에 원래 없음 */
                   GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
            HP AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
                    FROM TB_SL_SALE_HDR_PAY X
                    JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
                   WHERE X.HQ_OFFICE_CD = '{{HQ}}'
                     AND X.PAY_CD NOT IN ('05','12')
                   GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
            DP AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
                    FROM TB_SL_SALE_DTL_PAY X
                    JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
                   WHERE X.HQ_OFFICE_CD = '{{HQ}}'
                     AND X.PAY_CD NOT IN ('05','12')
                   GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
            /* 세 테이블에 등장하는 모든 (전표 + PAY_CD) 조합 — 양방향 대사의 기준 */
            K AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM S
                  UNION SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM HP
                  UNION SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,PAY_CD FROM DP)
            SELECT K.STORE_CD, K.SALE_DATE, K.POS_NO, K.BILL_NO, K.PAY_CD
                  ,S.AMT  AS SEQ_AMT
                  ,HP.AMT AS HDR_PAY_AMT
                  ,DP.AMT AS DTL_PAY_AMT
                  ,S.AMT - HP.AMT AS DIFF_HDR
                  ,S.AMT - DP.AMT AS DIFF_DTL
                  ,CASE WHEN S.PAY_CD  IS NULL THEN '3103'
                        WHEN HP.PAY_CD IS NULL THEN '3101'
                        WHEN S.AMT <> HP.AMT   THEN '3102' END AS HDR_CD
                  ,CASE WHEN S.PAY_CD  IS NULL THEN '3203'
                        WHEN DP.PAY_CD IS NULL THEN '3201'
                        WHEN S.AMT <> DP.AMT   THEN '3202' END AS DTL_CD
                  ,TRIM('+' FROM NVL(CASE WHEN S.PAY_CD IS NULL THEN '3103' WHEN HP.PAY_CD IS NULL THEN '3101' WHEN S.AMT <> HP.AMT THEN '3102' END,'')
                              || '+' ||
                              NVL(CASE WHEN S.PAY_CD IS NULL THEN '3203' WHEN DP.PAY_CD IS NULL THEN '3201' WHEN S.AMT <> DP.AMT THEN '3202' END,''))
                                                                                                AS RESULT_CD   /* HDR+DTL 합친 코드 (S-0 집계용) */
              FROM K
              LEFT JOIN S  ON S.STORE_CD =K.STORE_CD AND S.SALE_DATE =K.SALE_DATE AND S.POS_NO =K.POS_NO AND S.BILL_NO =K.BILL_NO AND S.PAY_CD =K.PAY_CD
              LEFT JOIN HP ON HP.STORE_CD=K.STORE_CD AND HP.SALE_DATE=K.SALE_DATE AND HP.POS_NO=K.POS_NO AND HP.BILL_NO=K.BILL_NO AND HP.PAY_CD=K.PAY_CD
              LEFT JOIN DP ON DP.STORE_CD=K.STORE_CD AND DP.SALE_DATE=K.SALE_DATE AND DP.POS_NO=K.POS_NO AND DP.BILL_NO=K.BILL_NO AND DP.PAY_CD=K.PAY_CD
             WHERE (   S.PAY_CD  IS NULL
                    OR HP.PAY_CD IS NULL
                    OR DP.PAY_CD IS NULL
                    OR S.AMT <> HP.AMT
                    OR S.AMT <> DP.AMT )
               AND (NVL(S.AMT,0) <> 0 OR NVL(HP.AMT,0) <> 0 OR NVL(DP.AMT,0) <> 0)  /* 세 값 모두 0 인 조합 제외 */
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-5 ───── */
  SELECT 16 AS 순번, 'P-5' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표·PAY_CD' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH MAP AS (
                SELECT k.HQ_OFFICE_CD, k.PAY_CD, COUNT(*) CNT
                      ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
                             WHERE p.STORE_CD=k.STORE_CD AND p.SALE_DATE=k.SALE_DATE
                               AND p.POS_NO=k.POS_NO AND p.BILL_NO=k.BILL_NO
                               AND p.PAY_CD=k.PAY_CD) THEN 1 ELSE 0 END) OK_CNT
                  FROM (SELECT DISTINCT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO, PAY_CD
                          FROM TB_SL_SALE_PAY_SEQ
                         WHERE HQ_OFFICE_CD = '{{HQ}}'
                           AND {{OPT:learncond}}                          /* ← 학습기간 (옵션) */
                           AND PAY_AMT <> 0) k
                 GROUP BY k.HQ_OFFICE_CD, k.PAY_CD),
            USE_CD AS (
                SELECT HQ_OFFICE_CD, PAY_CD FROM MAP
                 WHERE CNT >= 30 AND OK_CNT / CNT >= 0.95),             /* 표본 30건 이상 · 95% 이상 동반한 조합만 */
            BILLS AS (
                SELECT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO
                  FROM TB_SL_SALE_HDR h
                 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
            {{LINE:store:h}}
            {{LINE:extra:h}}
            ),
            P AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
                    FROM TB_SL_SALE_PAY X
                    JOIN BILLS  B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
                    JOIN USE_CD U ON U.HQ_OFFICE_CD=X.HQ_OFFICE_CD AND U.PAY_CD=X.PAY_CD
                   WHERE X.HQ_OFFICE_CD = '{{HQ}}'
                   GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD),
            S AS (SELECT X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD, SUM(X.PAY_AMT) AMT
                    FROM TB_SL_SALE_PAY_SEQ X
                    JOIN BILLS  B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
                    JOIN USE_CD U ON U.HQ_OFFICE_CD=X.HQ_OFFICE_CD AND U.PAY_CD=X.PAY_CD
                   WHERE X.HQ_OFFICE_CD = '{{HQ}}'
                   GROUP BY X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.PAY_CD)
            SELECT NVL(p.STORE_CD,s.STORE_CD)   AS STORE_CD
                  ,NVL(p.SALE_DATE,s.SALE_DATE) AS SALE_DATE
                  ,NVL(p.POS_NO,s.POS_NO)       AS POS_NO
                  ,NVL(p.BILL_NO,s.BILL_NO)     AS BILL_NO
                  ,NVL(p.PAY_CD,s.PAY_CD)       AS PAY_CD
                  ,p.AMT AS PAY금액, s.AMT AS PAY_SEQ금액
                  ,NVL(s.AMT,0) - NVL(p.AMT,0)  AS 차이
                  ,CASE WHEN p.PAY_CD IS NULL THEN 'P01 TB_SL_SALE_PAY 없음'
                        WHEN s.PAY_CD IS NULL THEN 'P02 TB_SL_SALE_PAY_SEQ 없음'
                        ELSE 'P03 금액 불일치' END AS RESULT_CD
              FROM P p
              FULL OUTER JOIN S s
                ON  s.STORE_CD=p.STORE_CD AND s.SALE_DATE=p.SALE_DATE
                AND s.POS_NO  =p.POS_NO   AND s.BILL_NO  =p.BILL_NO   AND s.PAY_CD=p.PAY_CD
             WHERE (p.PAY_CD IS NULL OR s.PAY_CD IS NULL OR p.AMT <> s.AMT)
               AND (NVL(p.AMT,0) <> 0 OR NVL(s.AMT,0) <> 0)          /* 0원 조합 제외 */
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-6 ───── */
  SELECT 17 AS 순번, 'P-6' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '상세행' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.BILL_DTL_NO, d.PROD_CD
                  ,d.SALE_AMT, d.DC_AMT, d.REAL_SALE_AMT
                  ,NVL(p.AMT,0) AS DTL_PAY합, d.REAL_SALE_AMT - NVL(p.AMT,0) AS 차이
                  ,'D001' AS RESULT_CD
              FROM TB_SL_SALE_DTL d
              LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO,SUM(PAY_AMT) AMT
                           FROM TB_SL_SALE_DTL_PAY
                          WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                          GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO) p
                ON  p.STORE_CD=d.STORE_CD AND p.SALE_DATE=d.SALE_DATE AND p.POS_NO=d.POS_NO
                AND p.BILL_NO=d.BILL_NO   AND p.BILL_DTL_NO=d.BILL_DTL_NO
             WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.{{OPT:datecond}}
               AND d.REAL_SALE_AMT <> NVL(p.AMT,0)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── P-7 ───── */
  SELECT 18 AS 순번, 'P-7' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '영수증행' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT r.STORE_CD, r.POS_NO, r.BILL_NO, r.PAY_SEQ, r.PAY_CD
                  ,r.PAY_AMT AS 영수증금액, r.SALE_YN, r.NO_SALE_YN
                  ,(SELECT LISTAGG(s.PAY_CD||':'||s.PAY_AMT, ' / ') WITHIN GROUP (ORDER BY s.PAY_SEQ)
                      FROM TB_SL_SALE_PAY_SEQ s
                     WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=r.STORE_CD AND s.SALE_DATE=r.SALE_DATE
                       AND s.POS_NO=r.POS_NO AND s.BILL_NO=r.BILL_NO)     AS 실제결제내역
                  ,'RCP01' AS RESULT_CD
              FROM TB_SL_SALE_CASH_RCP r
             WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
               AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
                    WHERE s.HQ_OFFICE_CD = '{{HQ}}' AND s.STORE_CD=r.STORE_CD AND s.SALE_DATE=r.SALE_DATE
                      AND s.POS_NO=r.POS_NO AND s.BILL_NO=r.BILL_NO
                      AND s.PAY_CD='02')
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── D-1 ───── */
  SELECT 19 AS 순번, 'D-1' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '상세행' AS 단위, 'S-3 안 (중복 집계)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO, A.PROD_CD
                  ,A.SALE_AMT, A.DC_AMT, A.REAL_SALE_AMT
                  ,A.SALE_AMT - A.DC_AMT      AS EXPECT_REAL
                  ,NVL(DD.SUM_DC_AMT,0)       AS DTL_DC_SUM
                  ,NVL(DD.CNT,0)              AS DTL_DC_CNT
                  ,CASE WHEN A.SALE_AMT - A.DC_AMT <> A.REAL_SALE_AMT THEN '5001'
                        WHEN A.DC_AMT <> NVL(DD.SUM_DC_AMT,0)         THEN '5003' END AS RESULT_CD
                  ,CASE WHEN A.SALE_AMT - A.DC_AMT = A.REAL_SALE_AMT AND NVL(DD.CNT,0) = 0
                        THEN 'N (DTL_DC 없음 -> NULL 통과)' ELSE 'Y' END AS ORIG_DETECT
              FROM TB_SL_SALE_DTL A
              LEFT JOIN (SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, BILL_DTL_NO
                               ,SUM(DC_AMT) SUM_DC_AMT, COUNT(*) CNT
                           FROM TB_SL_SALE_DTL_DC
                          WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                          GROUP BY STORE_CD, SALE_DATE, POS_NO, BILL_NO, BILL_DTL_NO) DD
                ON  DD.STORE_CD    = A.STORE_CD  AND DD.SALE_DATE = A.SALE_DATE
                AND DD.POS_NO      = A.POS_NO    AND DD.BILL_NO   = A.BILL_NO
                AND DD.BILL_DTL_NO = A.BILL_DTL_NO
             WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
               AND (  A.SALE_AMT - A.DC_AMT <> A.REAL_SALE_AMT
                   OR A.DC_AMT <> NVL(DD.SUM_DC_AMT,0) )
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── D-2 ───── */
  SELECT 20 AS 순번, 'D-2' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '할인행' AS 단위, 'S-3 밖 (행 단위)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_DC_AMT
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            )
            -- 2404 : DTL 마이너스
            SELECT '2404' RESULT_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
                  ,A.PROD_CD, A.SALE_AMT, A.DC_AMT AS DC_AMT_DTL, NULL AS DC_AMT_DTLDC, A.REAL_SALE_AMT
                  ,'6303/6305 선점 → 2404 도달 불가' AS ORIG_DETECT
              FROM TB_SL_SALE_DTL A, BILLS B
             WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
               AND A.SALE_YN='Y' AND (A.DC_AMT < 0 OR A.REAL_SALE_AMT < 0)
            UNION ALL
            -- 2504 : 할인 > 상품금액
            SELECT '2504', A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
                  ,D.PROD_CD, D.SALE_AMT, D.DC_AMT, A.DC_AMT, D.REAL_SALE_AMT
                  ,CASE WHEN B.TOT_DC_AMT = 0 THEN 'N (헤더할인 0 → 블록 미실행)' ELSE 'Y' END
              FROM TB_SL_SALE_DTL_DC A, TB_SL_SALE_DTL D, BILLS B
             WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
               AND D.HQ_OFFICE_CD = '{{HQ}}' AND D.STORE_CD=A.STORE_CD AND D.SALE_DATE=A.SALE_DATE AND D.POS_NO=A.POS_NO AND D.BILL_NO=A.BILL_NO
               AND D.BILL_DTL_NO=A.BILL_DTL_NO
               AND A.SALE_YN='Y' AND A.DC_AMT > D.SALE_AMT
            UNION ALL
            -- 2405 / 2406 : 고아 할인행 / BILL_DTL_NO 별 합계 불일치
            SELECT CASE WHEN D.BILL_DTL_NO IS NULL THEN '2405' ELSE '2406' END
                  ,X.STORE_CD, X.SALE_DATE, X.POS_NO, X.BILL_NO, X.BILL_DTL_NO
                  ,D.PROD_CD, D.SALE_AMT, D.DC_AMT, X.SUM_DC_AMT, D.REAL_SALE_AMT
                  ,CASE WHEN B.TOT_DC_AMT = 0        THEN 'N (헤더할인 0 → 블록 미실행)'
                        WHEN D.BILL_DTL_NO IS NULL   THEN 'N (2405 후 RETURN 누락으로 오판정)'
                        ELSE 'Y' END
              FROM (SELECT A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO,A.BILL_DTL_NO, SUM(A.DC_AMT) SUM_DC_AMT
                      FROM TB_SL_SALE_DTL_DC A, BILLS B
                     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
                     GROUP BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO,A.BILL_DTL_NO) X
              JOIN BILLS B ON B.STORE_CD=X.STORE_CD AND B.SALE_DATE=X.SALE_DATE AND B.POS_NO=X.POS_NO AND B.BILL_NO=X.BILL_NO
              LEFT JOIN TB_SL_SALE_DTL D
                ON D.HQ_OFFICE_CD = '{{HQ}}' AND D.STORE_CD=X.STORE_CD AND D.SALE_DATE=X.SALE_DATE AND D.POS_NO=X.POS_NO AND D.BILL_NO=X.BILL_NO
               AND D.BILL_DTL_NO=X.BILL_DTL_NO
             WHERE D.BILL_DTL_NO IS NULL OR X.SUM_DC_AMT <> D.DC_AMT
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── D-3 ───── */
  SELECT 21 AS 순번, 'D-3' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '할인행' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT d.STORE_CD, d.POS_NO, d.BILL_NO, d.SALE_YN, d.DC_CD, d.DC_AMT
                  ,d.DLVR_ORDER_FG, d.DLVR_IN_FG, d.DLVR_IN_SVC_NM
                  ,NVL(d.APP_DC_DESC,'(NULL)') AS APP_DC_DESC
                  ,h.DLVR_YN, h.REAL_SALE_AMT
                  ,'APP01' AS RESULT_CD
              FROM TB_SL_SALE_HDR_DC d
              JOIN TB_SL_SALE_HDR h
                ON h.HQ_OFFICE_CD = '{{HQ}}' AND h.STORE_CD=d.STORE_CD AND h.SALE_DATE=d.SALE_DATE
               AND h.POS_NO=d.POS_NO     AND h.BILL_NO=d.BILL_NO
             WHERE d.HQ_OFFICE_CD = '{{HQ}}' AND d.{{OPT:datecond}}
               AND d.APP_DC_DESC IS NULL
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── D-5 ───── */
  SELECT 22 AS 순번, 'D-5' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '상세행' AS 단위, 'S-3 밖 (행 단위)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            )
            -- 5P04 : 마스터에 없는 상품
            SELECT '5P04' RESULT_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
                  ,A.PROD_CD, A.SIDE_P_DTL_NO, A.SDSEL_CLASS_CD, 'Y' AS ORIG_DETECT
              FROM TB_SL_SALE_DTL A, BILLS B
             WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
               AND A.SALE_YN='Y'
               AND NOT EXISTS (SELECT 1 FROM TB_MS_PRODUCT P WHERE P.STORE_CD=A.STORE_CD AND P.PROD_CD=A.PROD_CD)
            UNION ALL
            -- 5P12 : 구성상품인데 CLASS_CD 없음   (원본 프로시저 : 한 번도 검출된 적 없음)
            SELECT '5P12', A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
                  ,A.PROD_CD, A.SIDE_P_DTL_NO, A.SDSEL_CLASS_CD, 'N (변수 미대입 → 항상 0건)'
              FROM TB_SL_SALE_DTL A, BILLS B
             WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
               AND A.SIDE_P_DTL_NO IS NOT NULL
               AND A.SIDE_P_DTL_NO <> A.BILL_DTL_NO
               AND A.SDSEL_CLASS_CD IS NULL
            UNION ALL
            -- 5P33 : 모상품은 있는데 구성상품 없음
            SELECT '5P33', A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
                  ,A.PROD_CD, A.SIDE_P_DTL_NO, A.SDSEL_CLASS_CD
                  ,CASE WHEN ROW_NUMBER() OVER (PARTITION BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO ORDER BY A.BILL_DTL_NO) = 1
                        THEN 'Y' ELSE 'N (카운터 미초기화 → 2번째 이후 미검사)' END
              FROM TB_SL_SALE_DTL A, TB_MS_PRODUCT P, BILLS B
             WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
               AND P.STORE_CD=A.STORE_CD AND P.PROD_CD=A.PROD_CD
               AND P.SDSEL_GRP_CD IS NOT NULL
               AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL C
                                WHERE C.HQ_OFFICE_CD = '{{HQ}}' AND C.STORE_CD=A.STORE_CD AND C.SALE_DATE=A.SALE_DATE AND C.POS_NO=A.POS_NO AND C.BILL_NO=A.BILL_NO
                                  AND C.SIDE_P_DTL_NO=A.BILL_DTL_NO AND C.BILL_DTL_NO<>A.BILL_DTL_NO)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── R-1 ───── */
  SELECT 23 AS 순번, 'R-1' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '반품전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT CASE WHEN RESULT_CD<>'OK' THEN RESULT_CD END AS 코드 FROM (
            SELECT r.STORE_CD, r.POS_NO, r.BILL_NO, r.SALE_YN, r.REAL_SALE_AMT, r.REG_ID, r.REG_DT
                  ,NVL(r.ORG_BILL_NO,'(없음)') AS ORG_BILL_NO
                  ,o.BILL_NO AS 원거래BILL, o.SALE_YN AS 원거래SALE_YN, o.REAL_SALE_AMT AS 원거래금액
                  ,CASE WHEN r.ORG_BILL_NO IS NULL THEN 'R01 원거래키 없음'
                        WHEN o.BILL_NO IS NULL     THEN 'R02 원거래가 실재하지 않음'
                        WHEN o.SALE_YN = 'N'       THEN 'R03 원거래도 반품행'
                        WHEN o.ORG_BILL_NO IS NULL THEN 'R04 원거래 역링크 미설정'
                        WHEN o.ORG_BILL_NO <> r.STORE_CD||r.SALE_DATE||r.POS_NO||r.BILL_NO
                                                   THEN 'R05 역링크 불일치'
                        WHEN r.REAL_SALE_AMT <> -o.REAL_SALE_AMT
                                                   THEN 'R06 금액 부호/크기 불일치'
                        ELSE 'OK' END AS RESULT_CD
              FROM TB_SL_SALE_HDR r
              LEFT JOIN TB_SL_SALE_HDR o
                ON  o.STORE_CD  = SUBSTR(r.ORG_BILL_NO, 1, LENGTH(r.ORG_BILL_NO)-14)
                AND o.SALE_DATE = SUBSTR(r.ORG_BILL_NO, -14, 8)
                AND o.POS_NO    = SUBSTR(r.ORG_BILL_NO, -6, 2)
                AND o.BILL_NO   = SUBSTR(r.ORG_BILL_NO, -4)
             WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
               AND r.SALE_YN = 'N'
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── R-2 ───── */
  SELECT 24 AS 순번, 'R-2' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT o.STORE_CD, o.POS_NO, o.BILL_NO, o.SALE_YN, o.REAL_SALE_AMT, o.ORG_BILL_NO
                  ,'R07' AS RESULT_CD
              FROM TB_SL_SALE_HDR o
             WHERE o.HQ_OFFICE_CD = '{{HQ}}' AND o.{{OPT:datecond}}
               AND o.SALE_YN = 'Y' AND o.ORG_BILL_NO IS NOT NULL
               AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR r
                    WHERE r.STORE_CD  = SUBSTR(o.ORG_BILL_NO, 1, LENGTH(o.ORG_BILL_NO)-14)
                      AND r.SALE_DATE = SUBSTR(o.ORG_BILL_NO, -14, 8)
                      AND r.POS_NO    = SUBSTR(o.ORG_BILL_NO, -6, 2)
                      AND r.BILL_NO   = SUBSTR(o.ORG_BILL_NO, -4))
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── A-1 ───── */
  SELECT 25 AS 순번, 'A-1' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '매장' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT t.STORE_CD, t.SALE_DATE
                  ,t.REAL_SALE_AMT AS 집계_실판매, x.H_REAL AS 헤더_실판매, t.REAL_SALE_AMT-x.H_REAL AS 실판매차
                  ,t.VAT_AMT       AS 집계_부가세, x.H_VAT  AS 헤더_부가세, t.VAT_AMT-x.H_VAT        AS 부가세차
                  ,t.BILL_CNT      AS 집계_전표수, x.H_CNT  AS 헤더_전표수, t.BILL_CNT-x.H_CNT       AS 전표수차
                  ,'AGG01' AS RESULT_CD
              FROM TB_SL_DAILY_TOTAL t
              JOIN (SELECT STORE_CD, SALE_DATE, SUM(REAL_SALE_AMT) H_REAL, SUM(VAT_AMT) H_VAT, COUNT(*) H_CNT
                      FROM TB_SL_SALE_HDR WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                     GROUP BY STORE_CD, SALE_DATE) x ON x.STORE_CD = t.STORE_CD AND x.SALE_DATE = t.SALE_DATE
             WHERE t.HQ_OFFICE_CD = '{{HQ}}' AND t.{{OPT:datecond}}
               AND (t.REAL_SALE_AMT <> x.H_REAL OR t.VAT_AMT <> x.H_VAT OR t.BILL_CNT <> x.H_CNT)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── A-2 ───── */
  SELECT 26 AS 순번, 'A-2' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.TOT_GUEST_CNT
                  ,NVL(g.G,0) AS GUEST_합, h.TOT_GUEST_CNT - NVL(g.G,0) AS 차이
                  ,'GST01' AS RESULT_CD
              FROM TB_SL_SALE_HDR h
              LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO
                               ,SUM(NVL(GUEST_CNT_1,0)+NVL(GUEST_CNT_2,0)+NVL(GUEST_CNT_3,0)
                                   +NVL(GUEST_CNT_4,0)+NVL(GUEST_CNT_5,0)+NVL(GUEST_CNT_6,0)) G
                           FROM TB_SL_SALE_HDR_GUEST
                          WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                          GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO) g
                ON g.STORE_CD=h.STORE_CD AND g.SALE_DATE=h.SALE_DATE
               AND g.POS_NO=h.POS_NO     AND g.BILL_NO=h.BILL_NO
             WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
               AND h.TOT_GUEST_CNT <> NVL(g.G,0)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── A-3 ───── */
  SELECT 27 AS 순번, 'A-3' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, 'POS' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT STORE_CD, SALE_DATE, POS_NO, COUNT(*) AS 전표수
                  ,MIN(BILL_NO) AS MIN_BILL, MAX(BILL_NO) AS MAX_BILL
                  ,TO_NUMBER(MAX(BILL_NO)) - TO_NUMBER(MIN(BILL_NO)) + 1 - COUNT(*) AS 결번수
                  ,COUNT(*) - COUNT(DISTINCT BILL_NO) AS 중복수
                  ,'SEQ01' AS RESULT_CD
              FROM TB_SL_SALE_HDR
             WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
             GROUP BY STORE_CD, SALE_DATE, POS_NO
            HAVING TO_NUMBER(MAX(BILL_NO)) - TO_NUMBER(MIN(BILL_NO)) + 1 <> COUNT(*)
                OR COUNT(*) <> COUNT(DISTINCT BILL_NO)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── A-4 ───── */
  SELECT 28 AS 순번, 'A-4' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, 'S-3 밖 (추가 검사)' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            SELECT STORE_CD, POS_NO, BILL_NO, SALE_DATE, BILL_DT, REG_DT, REG_ID
                  ,CASE WHEN BILL_DT IS NULL                                  THEN 'DT01 BILL_DT NULL'
                        WHEN BILL_DT > TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS')    THEN 'DT02 미래시각'
                        ELSE 'DT03 영업일과 2일 이상 차이' END AS RESULT_CD
              FROM TB_SL_SALE_HDR
             WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
               AND (BILL_DT IS NULL
                 OR BILL_DT > TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS')
                 OR SUBSTR(BILL_DT,1,8) NOT IN
                    (SALE_DATE, TO_CHAR(TO_DATE(SALE_DATE,'YYYYMMDD')+1,'YYYYMMDD')))
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  UNION ALL
  /* ───── A-5 ───── */
  SELECT 29 AS 순번, 'A-5' AS 카드, NVL(코드,'(0건)') AS 코드, 건수, '전표' AS 단위, '참고 · 벤슨 미실행' AS 비고
    FROM (SELECT 코드, COUNT(코드) AS 건수, SUM(COUNT(코드)) OVER () AS 카드총건수
            FROM (SELECT RESULT_CD AS 코드 FROM (
            WITH BILLS AS (
                SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_SALE_AMT
                  FROM TB_SL_SALE_HDR
                 WHERE HQ_OFFICE_CD = '{{HQ}}'
                   AND {{OPT:datecond}}
                   {{LINE:store:}}
                   {{LINE:extra:}}
            ),
            HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(PAY_AMT)  AMT FROM TB_SL_SALE_HDR_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(DC_AMT)   AMT FROM TB_SL_SALE_HDR_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            S  AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(PAY_AMT)  AMT FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
            D  AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(SALE_AMT) AMT FROM TB_SL_SALE_DTL     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO)
            SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
                  ,B.TOT_SALE_AMT
                  ,NVL(HP.AMT,0) + NVL(HD.AMT,0) AS PAY_PLUS_DC
                  ,NVL(S.AMT,0)  AS PAY_SEQ_AMT
                  ,NVL(D.AMT,0)  AS DTL_AMT
                  ,CASE WHEN '{{HQ}}' = 'A0001' THEN 'NE01' ELSE 'NE01(참고)' END AS RESULT_CD   /* 프로시저는 A0001 만 실행 */
              FROM BILLS B
              LEFT JOIN HP ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
              LEFT JOIN HD ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
              LEFT JOIN S  ON S.STORE_CD =B.STORE_CD AND S.SALE_DATE =B.SALE_DATE AND S.POS_NO =B.POS_NO AND S.BILL_NO =B.BILL_NO
              LEFT JOIN D  ON D.STORE_CD =B.STORE_CD AND D.SALE_DATE =B.SALE_DATE AND D.POS_NO =B.POS_NO AND D.BILL_NO =B.BILL_NO
             WHERE B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                OR B.TOT_SALE_AMT <> NVL(S.AMT,0)
                OR B.TOT_SALE_AMT <> NVL(D.AMT,0)
                  )
                  UNION ALL SELECT NULL FROM DUAL)          /* 0건이어도 한 줄 나오게 */
           GROUP BY 코드)
   WHERE 코드 IS NOT NULL OR 카드총건수 = 0
  )
 ORDER BY 순번, 코드;`
},

qs1:{ tag:"S-1", kind:"SELECT", scope:"대상 본사", name:"요약 · 정상/오류 2분류",
  desc:"정상/오류 전표 수. ERR_CNT 가 0 이면 아래 대부분 건너뛰어도 됩니다. ERR_MISSED_BY_PROC = 프로시저는 0000 으로 통과시켰지만 결함 제거 판정에서는 오류인 전표 수(원본이 놓치던 건). SEND_DOORAY_TODAY_SUMMARY 가 만들던 요약과 같은 형태.",
  sql:
`WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, HQ_OFFICE_CD, SALE_YN
          ,TOT_SALE_AMT, TOT_DC_AMT, VAT_AMT, NET_SALE_AMT, REAL_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
D AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
            ,SUM(SALE_AMT) SALE_AMT, SUM(DC_AMT) DC_AMT, SUM(REAL_SALE_AMT) REAL_AMT, SUM(VAT_AMT) VAT_AMT
            ,SUM(CASE WHEN VAT_AMT       < 0 THEN 1 ELSE 0 END)                 MINUS_VAT_CNT
            ,SUM(CASE WHEN REAL_SALE_AMT < 0 THEN 1 ELSE 0 END)                 MINUS_REAL_CNT
            ,SUM(CASE WHEN DC_AMT        < 0 THEN 1 ELSE 0 END)                 MINUS_DC_CNT
            ,SUM(CASE WHEN ABS(SALE_AMT) < ABS(DC_AMT) THEN 1 ELSE 0 END)       OVER_DC_CNT
            ,SUM(CASE WHEN SALE_AMT - DC_AMT <> REAL_SALE_AMT THEN 1 ELSE 0 END) ERR_5001
            ,SUM(DECODE(SUBSTRB(PROD_CD,1,4),'LYNK',ERP_SEND_AMT,SALE_AMT))     ERP_SEND_AMT
        FROM TB_SL_SALE_DTL WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DD5003 AS (
    SELECT A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO
          ,SUM(CASE WHEN X.SUM_DC IS NOT NULL AND A.DC_AMT <> X.SUM_DC THEN 1 ELSE 0 END) ERR_ORIG
          ,SUM(CASE WHEN A.DC_AMT <> NVL(X.SUM_DC,0) THEN 1 ELSE 0 END)                   ERR_FIXED
      FROM TB_SL_SALE_DTL A
      LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO,SUM(DC_AMT) SUM_DC
                   FROM TB_SL_SALE_DTL_DC WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
                  GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO,BILL_DTL_NO) X
        ON X.STORE_CD=A.STORE_CD AND X.SALE_DATE=A.SALE_DATE AND X.POS_NO=A.POS_NO AND X.BILL_NO=A.BILL_NO
       AND X.BILL_DTL_NO=A.BILL_DTL_NO
     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
     GROUP BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO),
S AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
            ,SUM(DECODE(PAY_CD,'05',0,'12',0,PAY_AMT))       REAL_AMT
            ,SUM(DECODE(PAY_CD,'05',PAY_AMT,'12',PAY_AMT,0)) DC_AMT
            ,SUM(VAT_AMT)                                    VAT_AMT
            ,SUM(DECODE(PAY_CD,'04',VAT_AMT,0))              POINT_VAT
            ,SUM(PAY_AMT)                                    PAY_ALL
        FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
E AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, SUM(DC_AMT) ETC_DC
        FROM TB_SL_SALE_HDR_DC
       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} AND DC_CD NOT IN ('02','12','05')
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_HDR_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_DTL_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_HDR_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_DTL_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
JUDGE AS (
    SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
          ,B.TOT_SALE_AMT, B.TOT_DC_AMT, B.VAT_AMT, B.NET_SALE_AMT, B.REAL_SALE_AMT
          ,D.SALE_AMT DTL_SALE, D.DC_AMT DTL_DC, D.VAT_AMT DTL_VAT, D.REAL_AMT DTL_REAL
          ,S.REAL_AMT SEQ_REAL, S.DC_AMT SEQ_DC, S.VAT_AMT SEQ_VAT, E.ETC_DC
          ,HP.AMT HDRPAY_AMT, HD.AMT HDRDC_AMT, DD.AMT DTLDC_AMT
          -- ---------------- 원본 프로시저 판정 (결함 그대로) ----------------
          ,CASE
             WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'
             WHEN D.CNT IS NULL                                   THEN '4404'
             WHEN S.CNT IS NULL                                   THEN '3404'
             WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
             WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
             WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
             WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
             WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
             WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
             WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
             WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
               OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
             WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
             WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
             WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
              AND E.ETC_DC IS NOT NULL                                              -- NULL 이면 통과(결함)
              AND B.TOT_DC_AMT <> S.DC_AMT + E.ETC_DC              THEN '8801'
             WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
             WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
             WHEN HP.AMT IS NOT NULL AND B.REAL_SALE_AMT <> HP.AMT THEN '7001'      -- NULL 이면 통과(결함)
             WHEN B.TOT_DC_AMT <> 0 AND B.TOT_DC_AMT <> NVL(HD.AMT,0) THEN '6001'   -- 할인 0 이면 미조회(결함)
             WHEN B.TOT_DC_AMT <> 0 AND B.TOT_DC_AMT <> NVL(DD.AMT,0) THEN '6002'
             WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
             WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
             WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
             WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
             WHEN D.OVER_DC_CNT > 0                               THEN '6405'
             WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
             WHEN D.ERR_5001 > 0                                  THEN '5001'
             WHEN Z.ERR_ORIG > 0                                  THEN '5003'
             WHEN B.HQ_OFFICE_CD = 'A0001'
              AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                 OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                 OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
             ELSE '0000' END AS ORIG_CD
          -- ---------------- 결함 제거 판정 ----------------
          ,CASE
             WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'
             WHEN D.CNT IS NULL                                   THEN '4404'
             WHEN S.CNT IS NULL                                   THEN '3404'
             WHEN HP.CNT IS NULL                                  THEN '4414'
             WHEN DP.CNT IS NULL                                  THEN '5404'
             WHEN B.TOT_DC_AMT <> 0 AND HD.CNT IS NULL            THEN '6404'
             WHEN B.TOT_DC_AMT <> 0 AND DD.CNT IS NULL            THEN '7404'
             WHEN B.SALE_YN='Y' AND B.REAL_SALE_AMT < 0           THEN '9211'
             WHEN B.SALE_YN='N' AND B.REAL_SALE_AMT > 0           THEN '9212'
             WHEN B.NET_SALE_AMT + B.VAT_AMT <> B.REAL_SALE_AMT   THEN '9023'
             WHEN B.TOT_SALE_AMT  <> D.SALE_AMT                   THEN '9001'
             WHEN B.TOT_DC_AMT    <> D.DC_AMT                     THEN '9002'
             WHEN (B.SALE_DATE >  '20210206' AND B.VAT_AMT <> D.VAT_AMT)
               OR (B.SALE_DATE <= '20210206' AND ABS(B.VAT_AMT) <> ABS(D.VAT_AMT)) THEN '9003'
             WHEN B.REAL_SALE_AMT <> D.REAL_AMT                   THEN '9004'
             WHEN B.HQ_OFFICE_CD NOT IN ('H0393','H0665') AND B.TOT_DC_AMT <> S.DC_AMT THEN '8001'
             WHEN B.HQ_OFFICE_CD = 'H0665' AND B.TOT_DC_AMT <> S.DC_AMT
              AND B.TOT_DC_AMT <> S.DC_AMT + NVL(E.ETC_DC,0)      THEN '8801'
             WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'
             WHEN B.REAL_SALE_AMT <> S.REAL_AMT                   THEN '8003'
             WHEN B.REAL_SALE_AMT <> NVL(HP.AMT,0)                THEN '7001'
             WHEN B.TOT_DC_AMT    <> NVL(HD.AMT,0)                THEN '6001'
             WHEN B.TOT_DC_AMT    <> NVL(DD.AMT,0)                THEN '6002'
             WHEN NVL(S.POINT_VAT,0) <> 0 AND B.SALE_DATE > '20250207' THEN '6103'
             WHEN B.SALE_YN='Y' AND D.MINUS_VAT_CNT  > 0          THEN '6102'
             WHEN B.SALE_YN='Y' AND D.MINUS_REAL_CNT > 0          THEN '6303'
             WHEN B.SALE_YN='Y' AND D.MINUS_DC_CNT   > 0          THEN '6305'
             WHEN D.OVER_DC_CNT > 0                               THEN '6405'
             WHEN NVL(B.TOT_SALE_AMT,0) <> NVL(D.ERP_SEND_AMT,0)  THEN '6505'
             WHEN D.ERR_5001 > 0                                  THEN '5001'
             WHEN Z.ERR_FIXED > 0                                 THEN '5003'
             WHEN B.HQ_OFFICE_CD = 'A0001'
              AND ( B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
                 OR B.TOT_SALE_AMT <> NVL(S.PAY_ALL,0)
                 OR B.TOT_SALE_AMT <> NVL(D.SALE_AMT,0) )         THEN 'NE01'
             ELSE '0000' END AS FIXED_CD
      FROM BILLS B
      LEFT JOIN D      ON D.STORE_CD=B.STORE_CD AND D.SALE_DATE=B.SALE_DATE AND D.POS_NO=B.POS_NO AND D.BILL_NO=B.BILL_NO
      LEFT JOIN DD5003 Z ON Z.STORE_CD=B.STORE_CD AND Z.SALE_DATE=B.SALE_DATE AND Z.POS_NO=B.POS_NO AND Z.BILL_NO=B.BILL_NO
      LEFT JOIN S      ON S.STORE_CD=B.STORE_CD AND S.SALE_DATE=B.SALE_DATE AND S.POS_NO=B.POS_NO AND S.BILL_NO=B.BILL_NO
      LEFT JOIN E      ON E.STORE_CD=B.STORE_CD AND E.SALE_DATE=B.SALE_DATE AND E.POS_NO=B.POS_NO AND E.BILL_NO=B.BILL_NO
      LEFT JOIN HP     ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
      LEFT JOIN DP     ON DP.STORE_CD=B.STORE_CD AND DP.SALE_DATE=B.SALE_DATE AND DP.POS_NO=B.POS_NO AND DP.BILL_NO=B.BILL_NO
      LEFT JOIN HD     ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
      LEFT JOIN DD     ON DD.STORE_CD=B.STORE_CD AND DD.SALE_DATE=B.SALE_DATE AND DD.POS_NO=B.POS_NO AND DD.BILL_NO=B.BILL_NO
)
SELECT SALE_DATE
      ,SUM(CASE WHEN FIXED_CD = '0000' THEN 1 ELSE 0 END) AS OK_CNT
      ,SUM(CASE WHEN FIXED_CD <> '0000' THEN 1 ELSE 0 END) AS ERR_CNT
      ,SUM(CASE WHEN ORIG_CD = '0000' AND FIXED_CD <> '0000' THEN 1 ELSE 0 END) AS ERR_MISSED_BY_PROC
      ,COUNT(*) AS TOT_CNT
  FROM JUDGE
 GROUP BY SALE_DATE
 ORDER BY SALE_DATE;`
},

qs2:{ tag:"S-2", kind:"SELECT", scope:"대상 본사", name:"요약 · 코드별 건수",
  desc:"코드별 건수. SAME_AS_ORIG 는 프로시저도 같은 코드를 냈을 건수, NEWLY_FOUND 는 프로시저는 정상으로 봤는데 여기서 잡힌 건수. 코드 뜻은 맨 아래 [코드] 카드.",
  sql:

            ,SUM(CASE WHEN REAL_SALE_AMT < 0 THEN 1 ELSE 0 END)                 MINUS_REAL_CNT
            ,SUM(CASE WHEN DC_AMT        < 0 THEN 1 ELSE 0 END)                 MINUS_DC_CNT
            ,SUM(CASE WHEN ABS(SALE_AMT) < ABS(DC_AMT) THEN 1 ELSE 0 END)       OVER_DC_CNT
            ,SUM(CASE WHEN SALE_AMT - DC_AMT <> REAL_SALE_AMT THEN 1 ELSE 0 END) ERR_5001

DD5003 AS (
    SELECT A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO
          ,SUM(CASE WHEN X.SUM_DC IS NOT NULL AND A.DC_AMT <> X.SUM_DC THEN 1 ELSE 0 END) ERR_ORIG

     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
     GROUP BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO),
S AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, COUNT(*) CNT
            ,SUM(DECODE(PAY_CD,'05',0,'12',0,PAY_AMT))       REAL_AMT
            ,SUM(DECODE(PAY_CD,'05',PAY_AMT,'12',PAY_AMT,0)) DC_AMT
            ,SUM(VAT_AMT)                                    VAT_AMT
            ,SUM(DECODE(PAY_CD,'04',VAT_AMT,0))              POINT_VAT
            ,SUM(PAY_AMT)                                    PAY_ALL
        FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
E AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO, SUM(DC_AMT) ETC_DC
        FROM TB_SL_SALE_HDR_DC
       WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} AND DC_CD NOT IN ('02','12','05')
       GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_HDR_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
DP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(PAY_AMT) AMT FROM TB_SL_SALE_DTL_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,COUNT(*) CNT,SUM(DC_AMT)  AMT FROM TB_SL_SALE_HDR_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),

    SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO, B.SALE_YN
          ,B.TOT_SALE_AMT, B.TOT_DC_AMT, B.VAT_AMT, B.NET_SALE_AMT, B.REAL_SALE_AMT

          ,HP.AMT HDRPAY_AMT, HD.AMT HDRDC_AMT, DD.AMT DTLDC_AMT

             WHEN B.VAT_AMT       <> S.VAT_AMT                    THEN '8002'

          ,CASE
             WHEN B.TOT_SALE_AMT IS NULL                          THEN '1404'

             WHEN HP.CNT IS NULL                                  THEN '4414'
