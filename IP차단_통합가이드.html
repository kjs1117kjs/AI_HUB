<section id=&quot;s2&quot;>
  <h2><span class=&quot;step&quot;>2</span>GeoLite2 데이터 다운로드 · CSV 준비</h2>
  <h3>2-1. 작업 폴더 준비 및 다운로드</h3>
  <pre>:: 작업 폴더 (예시 경로 — 환경에 맞게 변경)
E:\_work\GeoLite2\oracle_chk

:: 위 다운로드 URL로 zip 수령 → 압축 해제 → 모든 파일을 작업 폴더로 이동
:: 압축 안에 들어있는 주요 파일:
::   GeoLite2-Country-Blocks-IPv4.csv     (network CIDR, geoname_id, ...)
::   GeoLite2-Country-Locations-en.csv    (geoname_id, country_iso_code, country_name, ...)</pre>

  <h3>2-2. prepare_csv.py — 적재용 CSV 생성</h3>
  <p>CIDR(<code>1.0.0.0/24</code>)을 시작/끝 숫자로 풀고 국가 정보를 조인하여 <code>geoip_ranges.csv</code>를 만듭니다.</p>
  <pre>> cd E:\_work\GeoLite2\oracle_chk
> python prepare_csv.py
→ geoip_ranges.csv 생성됨</pre>
  <pre># prepare_csv.py — GeoLite2 Country CSV → Oracle 적재용 CSV 변환
# 출력: geoip_ranges.csv (NETWORK, START_IP_NUM, END_IP_NUM, COUNTRY_CODE, COUNTRY_NAME)
import csv, ipaddress

BLOCKS = 'GeoLite2-Country-Blocks-IPv4.csv'
LOCS   = 'GeoLite2-Country-Locations-en.csv'
OUT    = 'geoip_ranges.csv'

# 1) geoname_id → (국가코드, 국가명) 매핑
loc = {}
with open(LOCS, encoding='utf-8') as f:
    for r in csv.DictReader(f):
        loc[r['geoname_id']] = (r['country_iso_code'], r['country_name'])

# 2) 블록 CSV 변환
cnt = 0
with open(BLOCKS, encoding='utf-8') as f, \
     open(OUT, 'w', newline='', encoding='utf-8') as o:
    w = csv.writer(o)
    w.writerow(['NETWORK', 'START_IP_NUM', 'END_IP_NUM', 'COUNTRY_CODE', 'COUNTRY_NAME'])
    for r in csv.DictReader(f):
        # geoname_id 없으면 registered_country_geoname_id 로 대체
        gid = r['geoname_id'] or r['registered_country_geoname_id']
        if not gid or gid not in loc:
            continue
        net = ipaddress.ip_network(r['network'])
        cc, cn = loc[gid]
        w.writerow([r['network'],
                    int(net.network_address),
                    int(net.broadcast_address),
                    cc, cn])
        cnt += 1
print(f'완료: {cnt}건 → {OUT}')</pre>
  <div class=&quot;box-info&quot;>
    <strong>참고</strong>
    GeoLite2 Country IPv4 블록은 보통 30~50만 행입니다. 대역은 서로 겹치지 않으며 START_IP_NUM 기준 정렬 상태 — 이후 &quot;내림차순 첫 행&quot; 조회 최적화의 전제가 됩니다.
  </div>

<section id=&quot;s3&quot;>
  <h2><span class=&quot;step&quot;>3</span>Oracle 테이블 생성 (A/B 이중화 + 시노님)</h2>
  <p>재적재 중에도 서비스가 끊기지 않도록 물리 테이블 2개를 두고, 애플리케이션은 시노님 하나만 바라봅니다.</p>
  <pre>-- 물리 테이블 2개 (컬럼 구조 동일)
CREATE TABLE TB_CM_GEOIP_RANGE_A (
    NETWORK        VARCHAR2(30),
    START_IP_NUM   NUMBER,
    END_IP_NUM     NUMBER,
    COUNTRY_CODE   VARCHAR2(10),
    COUNTRY_NAME   VARCHAR2(100)
) TABLESPACE TS_NEO_DAT;

CREATE TABLE TB_CM_GEOIP_RANGE_B (
    NETWORK        VARCHAR2(30),
    START_IP_NUM   NUMBER,
    END_IP_NUM     NUMBER,
    COUNTRY_CODE   VARCHAR2(10),
    COUNTRY_NAME   VARCHAR2(100)
) TABLESPACE TS_NEO_DAT;

CREATE INDEX TB_CM_GEOIP_RANGE_A_X01 ON TB_CM_GEOIP_RANGE_A (START_IP_NUM, END_IP_NUM) TABLESPACE TS_NEO_IDX;
CREATE INDEX TB_CM_GEOIP_RANGE_B_X01 ON TB_CM_GEOIP_RANGE_B (START_IP_NUM, END_IP_NUM) TABLESPACE TS_NEO_IDX;

-- 애플리케이션/함수는 이 이름만 참조
CREATE OR REPLACE SYNONYM TB_CM_GEOIP_RANGE FOR TB_CM_GEOIP_RANGE_A;

<section id=&quot;s5&quot;>
  <h2><span class=&quot;step&quot;>5</span>검증 · 통계수집 · 시노님 스위치</h2>
  <p><b>순서가 중요합니다: 적재 → 건수 검증 → 통계수집 → 스위치.</b> 통계수집을 빠뜨리면 옵티마이저가 dynamic sampling에 의존해 조회가 수 초씩 걸릴 수 있습니다 (실제 겪은 이슈).</p>
  <pre>-- 1) 건수 검증 (신규가 기존의 90% 미만이면 데이터 이상으로 보고 중단)
DECLARE
    v_new_cnt NUMBER;
    v_old_cnt NUMBER;
BEGIN
    SELECT COUNT(*) INTO v_new_cnt FROM TB_CM_GEOIP_RANGE_A;   -- 이번에 적재한 테이블
    SELECT COUNT(*) INTO v_old_cnt FROM TB_CM_GEOIP_RANGE_B;   -- 기존 테이블

    IF v_old_cnt > 0 AND v_new_cnt &amp;lt; v_old_cnt * 0.9 THEN
        RAISE_APPLICATION_ERROR(-20001, '신규 GeoIP 데이터 건수 이상 - 스위치 중단');
    END IF;
END;
/

-- 2) 통계수집 (★ 필수 — 재적재 때마다)
EXEC DBMS_STATS.GATHER_TABLE_STATS(USER, 'TB_CM_GEOIP_RANGE_A', CASCADE =&amp;gt; TRUE);

-- 3) 시노님 스위치 (CREATE OR REPLACE SYNONYM은 원자적/즉시 적용 — 무중단)
CREATE OR REPLACE SYNONYM TB_CM_GEOIP_RANGE FOR TB_CM_GEOIP_RANGE_A;

-- 4) 확인
SELECT COUNT(*) FROM TB_CM_GEOIP_RANGE;</pre>

<section id=&quot;s6&quot;>
  <h2><span class=&quot;step&quot;>6</span>IP_TO_NUM — IP 문자열 → 숫자 변환 함수</h2>
  <pre>CREATE OR REPLACE FUNCTION IP_TO_NUM(p_ip IN VARCHAR2) RETURN NUMBER IS
BEGIN
    RETURN
        TO_NUMBER(REGEXP_SUBSTR(p_ip, '[0-9]+', 1, 1)) * 16777216 +
        TO_NUMBER(REGEXP_SUBSTR(p_ip, '[0-9]+', 1, 2)) * 65536 +
        TO_NUMBER(REGEXP_SUBSTR(p_ip, '[0-9]+', 1, 3)) * 256 +
        TO_NUMBER(REGEXP_SUBSTR(p_ip, '[0-9]+', 1, 4));
EXCEPTION WHEN OTHERS THEN
    RETURN NULL;   -- IPv6·형식 오류 등은 NULL (호출측에서 매칭실패 처리)
END;
/

SELECT IP_TO_NUM('8.8.8.8') FROM DUAL;   -- 134744072 이면 정상</pre>
</section>

<!-- ======================================================================= -->
<section id=&quot;s7&quot;>
  <h2><span class=&quot;step&quot;>7</span>IS_KOREA_IP — 한국 IP 여부 판정</h2>
  <div class=&quot;box-info&quot;>
    <strong>성능 핵심 — &quot;내림차순 첫 행&quot; 패턴</strong>
    <code>BETWEEN START_IP_NUM AND END_IP_NUM</code> 방식은 후보 구간을 거의 다 훑어야 해서 느립니다 (223.x대 IP에서 3초 발생 사례).
    GeoIP 대역은 겹치지 않으므로 &quot;v 이하의 START_IP_NUM 중 최대값 1건&quot;만 집어 END를 확인하는 방식으로 재작성 — 어떤 IP든 인덱스 접근이 사실상 1건으로 고정됩니다.
  </div>
  <pre>CREATE OR REPLACE FUNCTION IS_KOREA_IP(
    p_ip IN VARCHAR2                 -- 체크할 IP 문자열
) RETURN VARCHAR2                    -- 'Y' = 한국, 'N' = 한국 아님(매칭 실패 포함)
IS
    v_country_code  VARCHAR2(10);
    v_num           NUMBER;
BEGIN
    v_num := IP_TO_NUM(p_ip);        -- 한 번만 변환해 상수화
    IF v_num IS NULL THEN
        RETURN 'N';                  -- 변환 실패(IPv6·형식오류)
    END IF;

    -- 내림차순 첫 행: v_num 이하 START 중 최대 1건 → 그 대역이 v_num 포함하는지 확인
    -- ※ end_ip_num 조건은 반드시 ROWNUM 바깥에 — 안에 넣으면 다시 전체 필터로 회귀
    SELECT country_code
    INTO   v_country_code
    FROM (
        SELECT country_code, end_ip_num
        FROM   TB_CM_GEOIP_RANGE
        WHERE  start_ip_num &amp;lt;= v_num
        ORDER BY start_ip_num DESC
    )
    WHERE ROWNUM = 1
    AND   end_ip_num &amp;gt;= v_num;

    RETURN CASE WHEN v_country_code = 'KR' THEN 'Y' ELSE 'N' END;
EXCEPTION
    WHEN NO_DATA_FOUND THEN RETURN 'N';   -- 사설 IP·미할당·대역 사이 빈 구간
    WHEN OTHERS       THEN RETURN 'N';
END;
/

SELECT IS_KOREA_IP('223.62.180.1') FROM DUAL;   -- 'Y'
SELECT IS_KOREA_IP('8.8.8.8')      FROM DUAL;   -- 'N'</pre>
</section>

<section id=&quot;s9&quot;>
  <h2><span class=&quot;step&quot;>9</span>IS_LOGIN_ALLOWED — 허용 여부 판정 함수</h2>
  <p>한국 IP이거나 허용테이블에 등재돼 있으면 'Y', 그 외 'N'. GeoIP 조회는 7장과 동일한 내림차순 방식입니다.</p>
  <pre>CREATE OR REPLACE FUNCTION IS_LOGIN_ALLOWED(
    p_user_id IN VARCHAR2,           -- 로그인 시도 사용자 ID
    p_ip      IN VARCHAR2            -- 로그인 시도 IP (실제 IP — XFF 추출 후)
) RETURN VARCHAR2                    -- 'Y' = 허용, 'N' = 차단
IS
    v_country_code  VARCHAR2(10);
    v_allow_cnt     NUMBER;
    v_num           NUMBER;
    v_now           VARCHAR2(14) := TO_CHAR(SYSDATE, 'YYYYMMDDHH24MISS');
BEGIN
    v_num := IP_TO_NUM(p_ip);

    -- 1) 한국 IP 확인 (내림차순 첫 행 방식)
    IF v_num IS NOT NULL THEN
        BEGIN
            SELECT country_code
            INTO   v_country_code
            FROM (
                SELECT country_code, end_ip_num
                FROM   TB_CM_GEOIP_RANGE
                WHERE  start_ip_num &amp;lt;= v_num
                ORDER BY start_ip_num DESC
            )
            WHERE ROWNUM = 1
            AND   end_ip_num &amp;gt;= v_num;
        EXCEPTION WHEN NO_DATA_FOUND THEN
            v_country_code := NULL;             -- 사설 IP / 미할당 등
        END;

        IF v_country_code = 'KR' THEN
            RETURN 'Y';
        END IF;
    END IF;

    -- 2) 한국이 아니면 허용 테이블 확인 (USER_ID + IP 정확 일치, 기간·사용여부 체크)
    SELECT COUNT(*)
    INTO   v_allow_cnt
    FROM   TB_CM_IP_ALLOW
    WHERE  USER_ID  = p_user_id
    AND    ALLOW_IP = p_ip
    AND    USE_YN   = 'Y'
    AND    (START_DT IS NULL OR v_now &amp;gt;= START_DT)
    AND    (END_DT   IS NULL OR v_now &amp;lt;= END_DT);

    RETURN CASE WHEN v_allow_cnt &amp;gt; 0 THEN 'Y' ELSE 'N' END;

EXCEPTION
    WHEN OTHERS THEN
        RETURN 'N';
END;
/

SET TIMING ON
SELECT IS_LOGIN_ALLOWED('hong123', '223.62.180.1') FROM DUAL;   -- 'Y' (즉시 응답이어야 정상)
SELECT IS_LOGIN_ALLOWED('hong123', '8.8.8.8')      FROM DUAL;   -- 'N'</pre>
</section>

<section id=&quot;s11&quot;>
  <h2><span class=&quot;step&quot;>11</span>공용 판정 함수 FN_CHK_LOGIN_BLOCK</h2>
  <p>판정 + 이력 기록 + 모드 스위치를 모두 담당하는 공용 함수입니다. 트리거·메뉴 함수 등 어디서든 호출하며, <b>함수 안의 상수 스위치 2개만 바꾸면 모든 호출처에 일괄 적용</b>됩니다.</p>
  <table>
    <thead><tr><th style=&quot;width:18%&quot;>스위치</th><th style=&quot;width:10%&quot;>값</th><th>의미</th></tr></thead>
    <tbody>
      <tr><td rowspan=&quot;2&quot;><code>C_BLOCK_MODE</code></td><td><code>'N'</code></td><td><b>관찰 모드</b> — 차단 대상이어도 통과('M'), 이력만 기록</td></tr>
      <tr><td><code>'Y'</code></td><td><b>차단 모드</b> — 차단 대상은 'N' 리턴 → 호출측(트리거)에서 RAISE</td></tr>
      <tr><td rowspan=&quot;2&quot;><code>C_CHK_TARGET</code></td><td><code>'S'</code></td><td><b>SMS 등록자만 검사</b> — 미등록자는 판정·이력 없이 즉시 'Y'</td></tr>
      <tr><td><code>'A'</code></td><td><b>전체 사용자 검사</b> — 미등록자도 판정·이력·차단 대상</td></tr>
    </tbody>
  </table>
  <table>
    <thead><tr><th style=&quot;width:14%&quot;>리턴값</th><th>의미</th></tr></thead>
    <tbody>
      <tr><td><span class=&quot;ok&quot;>'Y'</span></td><td>허용 (검사 제외 대상 / 한국 IP / 허용테이블 등재)</td></tr>
      <tr><td><b>'M'</b></td><td>차단 대상이지만 관찰 모드라 허용 (이력만 기록)</td></tr>
      <tr><td><span class=&quot;block&quot;>'N'</span></td><td>차단 (이력 기록됨 — 호출측에서 RAISE 등 차단 처리)</td></tr>
    </tbody>
  </table>
  <pre>CREATE OR REPLACE FUNCTION FN_CHK_LOGIN_BLOCK
/* ***********************************************************************************************
   국가 기반 로그인 제한 판정 (트리거·프로시저·화면 등 공용)
     1) 검사 대상 확인 — C_CHK_TARGET='S' 이면 SMS 미등록자는 즉시 'Y' (검사·이력 없음)
                        C_CHK_TARGET='A' 이면 전체 사용자 검사 진행
     2) 한국 IP                            → 'Y'
     3) TB_CM_IP_ALLOW 등재                → 'Y'
     4) 그 외 = 차단 대상 → 이력 기록 [CC=..][SMS=Y/N]
        - 관찰 모드(C_BLOCK_MODE='N')       → 'M' (이력만 기록, 허용)
        - 차단 모드(C_BLOCK_MODE='Y')       → 'N' (이력 기록, 호출측에서 차단)
   ★ 스위치 변경 후 함수만 재컴파일 (호출처 수정 불필요)
*********************************************************************************************** */
(
    p_proc_fg       IN VARCHAR2                     -- I/U/D/C (트리거 외 호출 시 'I' 권장)
,   p_seq           IN NUMBER       DEFAULT NULL
,   p_user_id       IN VARCHAR2                     -- 필수
,   p_login_ip      IN VARCHAR2                     -- 필수 (XFF 체인 원본 그대로)
,   p_stat_cd       IN VARCHAR2     DEFAULT NULL    -- ↓ 이하 이력 기록용
,   p_login_orgn    IN VARCHAR2     DEFAULT NULL
,   p_brwsr_info    IN VARCHAR2     DEFAULT NULL
,   p_login_date    IN VARCHAR2     DEFAULT NULL
,   p_login_dt      IN VARCHAR2     DEFAULT NULL
,   p_v_user_id     IN VARCHAR2     DEFAULT NULL
,   p_orgn_cd       IN VARCHAR2     DEFAULT NULL
,   p_session_id    IN VARCHAR2     DEFAULT NULL
,   p_log_yn        IN VARCHAR2     DEFAULT 'Y'     -- 차단 대상 시 이력 INSERT 여부
) RETURN VARCHAR2
IS
    -- ★★★ 스위치 1 : 차단 활성화 — 'N' 관찰(현재) / 'Y' 차단 ★★★
    C_BLOCK_MODE    CONSTANT VARCHAR2(1) := 'N';

    -- ★★★ 스위치 2 : 검사 대상 — 'S' SMS 등록자만 / 'A' 전체 사용자 ★★★
    C_CHK_TARGET    CONSTANT VARCHAR2(1) := 'A';

    V_SMS_CNT       NUMBER;
    V_REAL_IP       VARCHAR2(  45);
    V_IP_NUM        NUMBER;
    V_COUNTRY_CODE  VARCHAR2(  10);
    V_ALLOW_YN      VARCHAR2(   1);
    V_BLOCK_REASON  VARCHAR2( 200);

    -- 차단 이력 INSERT (AUTONOMOUS — 호출측 롤백과 무관하게 커밋)
    PROCEDURE SUB_SP_INSERT_BLOCK_HIST
    IS
        PRAGMA AUTONOMOUS_TRANSACTION;
    BEGIN
        INSERT INTO TB_WB_LOGIN_HIST_BLOCK
        (
                PROC_DT, PROC_FG, SEQ, USER_ID, STAT_CD, LOGIN_ORGN
        ,       LOGIN_IP, REAL_IP, COUNTRY_CODE, BLOCK_REASON
        ,       BRWSR_INFO, LOGIN_DATE, LOGIN_DT, V_USER_ID, ORGN_CD, SESSION_ID
        ,       USERENV_SESSIONID, USERENV_OS_USER, USERENV_SESSION_USER
        ,       USERENV_MODULE, USERENV_HOST, USERENV_DB_NAME
        ,       USERENV_INSTANCE_NAME, USERENV_SID, USERENV_TERMINAL, USERENV_IP_ADDRESS
        )
        VALUES
        (
                TO_CHAR(SYSTIMESTAMP, 'YYYYMMDDHH24MISSFF')
        ,       p_proc_fg, p_seq, p_user_id, p_stat_cd, p_login_orgn
        ,       p_login_ip, V_REAL_IP, V_COUNTRY_CODE, V_BLOCK_REASON
        ,       p_brwsr_info, p_login_date, p_login_dt, p_v_user_id, p_orgn_cd, p_session_id
        ,       SYS_CONTEXT('USERENV','SESSIONID'),  SYS_CONTEXT('USERENV','OS_USER')
        ,       SYS_CONTEXT('USERENV','SESSION_USER'), SYS_CONTEXT('USERENV','MODULE')
        ,       SYS_CONTEXT('USERENV','HOST'), SYS_CONTEXT('USERENV','DB_NAME')
        ,       SYS_CONTEXT('USERENV','INSTANCE_NAME'), SYS_CONTEXT('USERENV','SID')
        ,       SYS_CONTEXT('USERENV','TERMINAL'), SYS_CONTEXT('USERENV','IP_ADDRESS')
        );
        COMMIT;
    END SUB_SP_INSERT_BLOCK_HIST;

BEGIN
    -- 1) SMS 사용등록 여부 확인 (검사 대상 판단 + 이력 태그용)
    SELECT  COUNT(*)
    INTO    V_SMS_CNT
    FROM    TB_CM_SMS_USER_REGIST A
    WHERE   A.USER_ID   =   p_user_id
    AND     ROWNUM      =   1;

    -- ★ C_CHK_TARGET='S' : SMS 미등록자는 검사·이력 없이 즉시 허용
    --   C_CHK_TARGET='A' : 통과하지 않고 전원 검사 진행
    IF C_CHK_TARGET = 'S' AND V_SMS_CNT = 0 THEN
        RETURN 'Y';
    END IF;

    -- 2) 실제 클라이언트 IP 추출 (XFF 체인 대응 — 콤마 있으면 마지막 토큰)
    V_REAL_IP := TRIM(p_login_ip);
    IF INSTR(V_REAL_IP, ',') &amp;gt; 0 THEN
        V_REAL_IP := TRIM(SUBSTR(V_REAL_IP, INSTR(V_REAL_IP, ',', -1) + 1));
    END IF;

    -- 3) 허용 여부 판정
    V_ALLOW_YN := IS_LOGIN_ALLOWED(p_user_id, V_REAL_IP);
    IF V_ALLOW_YN = 'Y' THEN
        RETURN 'Y';
    END IF;

    -- 4) 차단 대상 : 국가코드 조회(이력용) → 이력 INSERT
    V_IP_NUM := IP_TO_NUM(V_REAL_IP);
    IF V_IP_NUM IS NOT NULL THEN
        BEGIN
            SELECT  COUNTRY_CODE
            INTO    V_COUNTRY_CODE
            FROM    (
                        SELECT  COUNTRY_CODE, END_IP_NUM
                        FROM    TB_CM_GEOIP_RANGE
                        WHERE   START_IP_NUM &amp;lt;= V_IP_NUM
                        ORDER   BY START_IP_NUM DESC
                    )
            WHERE   ROWNUM = 1
            AND     END_IP_NUM &amp;gt;= V_IP_NUM;
        EXCEPTION WHEN NO_DATA_FOUND THEN
            V_COUNTRY_CODE := NULL;
        END;
    END IF;

    V_BLOCK_REASON := CASE WHEN C_BLOCK_MODE = 'Y' THEN 'BLOCKED' ELSE 'MONITOR' END
                      || ' - Not Korea IP / Not Allowed'
                      || ' [CC='  || NVL(V_COUNTRY_CODE, 'UNKNOWN') || ']'
                      || ' [SMS=' || CASE WHEN V_SMS_CNT &amp;gt; 0 THEN 'Y' ELSE 'N' END || ']';

    IF p_log_yn = 'Y' THEN
        SUB_SP_INSERT_BLOCK_HIST;
    END IF;

    -- 5) 모드에 따른 최종 리턴
    RETURN CASE WHEN C_BLOCK_MODE = 'Y' THEN 'N' ELSE 'M' END;

EXCEPTION
    WHEN OTHERS THEN
        RETURN 'Y';   -- 판정 오류로 전체 로그인이 막히는 사고 방지 (허용 우선)
                      -- 차단 전환 후 보안 우선 정책이면 'N' 으로 변경
END;
/</pre>
  <h3>단독 테스트</h3>
  <pre>SELECT FN_CHK_LOGIN_BLOCK('I', NULL, 'hong123',     '223.62.180.1', p_log_yn =&amp;gt; 'N') FROM DUAL;  -- 'Y' (한국 IP)
SELECT FN_CHK_LOGIN_BLOCK('I', NULL, 'hong123',     '8.8.8.8',      p_log_yn =&amp;gt; 'N') FROM DUAL;  -- 'M' (관찰모드)
SELECT FN_CHK_LOGIN_BLOCK('I', NULL, 'sms미등록ID', '8.8.8.8',      p_log_yn =&amp;gt; 'N') FROM DUAL;  -- TARGET='A': 'M' / 'S': 'Y'</pre>
</section>

<section id=&quot;s12&quot;>
  <h2><span class=&quot;step&quot;>12</span>로그인 트리거 TR_TB_WB_LOGIN_HIST_R90</h2>
  <p>트리거는 함수 호출 + 결과 'N'일 때 RAISE만 담당하는 얇은 구조입니다.</p>
  <pre>CREATE OR REPLACE
TRIGGER SBPORA.TR_TB_WB_LOGIN_HIST_R90
/* ***********************************************************************************************
   국가 기반 로그인 제한 — 판정은 FN_CHK_LOGIN_BLOCK 위임
     'Y' 허용 / 'M' 관찰모드 허용(이력만) / 'N' 차단(RAISE)
   차단 활성화 : FN_CHK_LOGIN_BLOCK 의 C_BLOCK_MODE 'N'→'Y' (트리거 수정 불필요)
*********************************************************************************************** */
       AFTER INSERT ON &quot;SBPORA&quot;.&quot;TB_WB_LOGIN_HIST&quot; FOR EACH ROW
DECLARE
    V_TRG_NM        VARCHAR2(  50) := 'TR_TB_WB_LOGIN_HIST_R90';
    V_USER_DEF_EXP  EXCEPTION;
    V_ERR_MSG       VARCHAR2(1000);
    V_LINE_NM       VARCHAR2(   4);
    V_PROC_FG       VARCHAR2(   1);
    V_CHK_RESULT    VARCHAR2(   1);
BEGIN
    IF INSERTING THEN
        V_PROC_FG := 'I';
        V_LINE_NM := 'CHK';

        V_CHK_RESULT := FN_CHK_LOGIN_BLOCK(
                            p_proc_fg       =&amp;gt;  V_PROC_FG
                        ,   p_seq           =&amp;gt;  :new.SEQ
                        ,   p_user_id       =&amp;gt;  :new.USER_ID
                        ,   p_login_ip      =&amp;gt;  :new.LOGIN_IP
                        ,   p_stat_cd       =&amp;gt;  :new.STAT_CD
                        ,   p_login_orgn    =&amp;gt;  :new.LOGIN_ORGN
                        ,   p_brwsr_info    =&amp;gt;  :new.BRWSR_INFO
                        ,   p_login_date    =&amp;gt;  :new.LOGIN_DATE
                        ,   p_login_dt      =&amp;gt;  :new.LOGIN_DT
                        ,   p_v_user_id     =&amp;gt;  :new.V_USER_ID
                        ,   p_orgn_cd       =&amp;gt;  :new.ORGN_CD
                        ,   p_session_id    =&amp;gt;  :new.SESSION_ID
                        );

        -- 'N' 일 때만 차단. 'Y'·'M' 은 통과
        IF V_CHK_RESULT = 'N' THEN
            V_ERR_MSG := 'Login Blocked: Country Restriction'
                         ||','|| :new.USER_ID
                         ||','|| :new.LOGIN_IP
                         ||','|| :new.STAT_CD
                         ||','|| :new.SESSION_ID
                         ||','|| TO_CHAR(SYSTIMESTAMP, 'YYYYMMDDHH24MISS');
            RAISE V_USER_DEF_EXP;
        END IF;
    END IF;

EXCEPTION
    WHEN V_USER_DEF_EXP THEN
        V_ERR_MSG := '[' || V_TRG_NM || ' : ' || V_LINE_NM || ']-' ||'['||V_ERR_MSG||']-'|| SQLERRM;
        RAISE_APPLICATION_ERROR(-20001, V_ERR_MSG);
    WHEN OTHERS THEN
        V_ERR_MSG := '[' || V_TRG_NM || ' : ' || V_LINE_NM || ']-' ||'['||V_ERR_MSG||']-'|| SQLERRM;
        RAISE_APPLICATION_ERROR(-20002, V_ERR_MSG);
END;
/</pre>
  <div class=&quot;box-info&quot;>
    <strong>같은 테이블에 다른 트리거(R98 등)가 이미 있다면</strong>
    동일 타이밍 트리거 간 실행 순서는 보장되지 않습니다. 순서가 중요하면 <code>FOLLOWS TR_TB_WB_LOGIN_HIST_R98</code> 절을 추가하세요.
  </div>
</section>

<section id=&quot;s13&quot;>
  <h2><span class=&quot;step&quot;>13</span>메뉴 이동 함수 연동 (FN_GET_MENU_CHK_YN2)</h2>
  <p>기존 메뉴 체크 함수 본문 마지막(기존 차단 STEP들 뒤, <code>V_RET_STR := V_USE_YN;</code> 앞)에 아래 블록을 추가하고, DECLARE에 변수 하나를 선언합니다.</p>
  <pre>-- DECLARE 에 추가
V_GEO_CHK       VARCHAR2(   1); -- 국외 IP 차단 판정 결과 (Y/M/N)</pre>
  <pre>/* -----------------------------------------------------------------------------------------
   STEP 6. 국외 IP 차단 (FN_CHK_LOGIN_BLOCK 공용 함수 호출)
   - p_log_yn =&amp;gt; 'N' : 메뉴 이동은 호출 빈도가 높아 이력 INSERT 생략 (판정만)
     로그인 시점 이력은 트리거(R90)가 이미 남김
   - 이미 V_USE_YN = 'N' 이면 추가 판정 스킵 (불필요한 GeoIP 조회 방지)
   - 차단 활성화는 FN_CHK_LOGIN_BLOCK 의 C_BLOCK_MODE 로 일괄 제어 — 이 함수 수정 불필요
----------------------------------------------------------------------------------------- */
IF  V_USE_YN &amp;lt;&amp;gt; 'N' THEN

    V_GEO_CHK := FN_CHK_LOGIN_BLOCK(
                     p_proc_fg      =&amp;gt;  'C'                 -- 메뉴 접근 체크
                 ,   p_user_id      =&amp;gt;  S_USER_ID
                 ,   p_login_ip     =&amp;gt;  S_USER_IP           -- 원본 그대로 (XFF 추출은 함수 내부)
                 ,   p_brwsr_info   =&amp;gt;  S_RESRCE_CD_URL     -- 이력 기록 시 URL 식별용
                 ,   p_log_yn       =&amp;gt;  'N'                 -- 판정만
                 );

    IF V_GEO_CHK = 'N' THEN
        V_USE_YN := 'N';
    END IF;

END IF;</pre>
</section>

<section id=&quot;s14&quot;>
  <h2><span class=&quot;step&quot;>14</span>운영 — 관찰 모드 → 차단 전환</h2>
  <h3>14-0. 스위치 조합별 동작</h3>
  <p>국외 IP + 허용테이블 미등재인 경우 기준. 한국 IP·허용테이블 등재자는 어떤 조합에서도 항상 허용(이력 없음)입니다.</p>
  <table>
    <thead><tr><th style=&quot;width:16%&quot;>조합</th><th style=&quot;width:28%&quot;>SMS 등록자</th><th style=&quot;width:28%&quot;>SMS 미등록자</th><th>용도</th></tr></thead>
    <tbody>
      <tr><td><code>N</code> + <code>S</code></td><td class=&quot;ok&quot;>통과 + 이력 [SMS=Y]</td><td class=&quot;ok&quot;>통과, 이력 없음</td><td>등록자만 관찰</td></tr>
      <tr style=&quot;background:#fff9dd;&quot;><td><code>N</code> + <code>A</code></td><td class=&quot;ok&quot;>통과 + 이력 [SMS=Y]</td><td class=&quot;ok&quot;>통과 + 이력 [SMS=N]</td><td><b>전체 관찰 (현재 설정)</b></td></tr>
      <tr><td><code>Y</code> + <code>S</code></td><td class=&quot;block&quot;>차단 + 이력</td><td class=&quot;ok&quot;>통과, 이력 없음</td><td>등록자만 차단</td></tr>
      <tr><td><code>Y</code> + <code>A</code></td><td class=&quot;block&quot;>차단 + 이력</td><td class=&quot;block&quot;>차단 + 이력</td><td>전체 차단 (최종 목표)</td></tr>
    </tbody>
  </table>

  <h3>14-1. 관찰 기간 (권장 1~2주 이상)</h3>
  <p><code>C_BLOCK_MODE = 'N'</code> 상태에서는 아무도 차단되지 않고 <code>TB_WB_LOGIN_HIST_BLOCK</code>에 <code>MONITOR - ...</code> 이력만 쌓입니다. 주기적으로 오탐을 점검합니다.</p>
  <pre>-- SMS 등록/미등록 구분 집계 (차단 전환 시 영향 범위 확인)
SELECT  CASE WHEN BLOCK_REASON LIKE '%[SMS=Y]%' THEN 'SMS등록' ELSE '미등록' END AS SMS_DIV
,       COUNT(*)                AS CNT
,       COUNT(DISTINCT USER_ID) AS USER_CNT
FROM    TB_WB_LOGIN_HIST_BLOCK
GROUP
BY      CASE WHEN BLOCK_REASON LIKE '%[SMS=Y]%' THEN 'SMS등록' ELSE '미등록' END
;</pre>
  <pre>-- 차단 예정 건 집계 (오탐 점검)
SELECT  USER_ID
,       REAL_IP
,       COUNTRY_CODE
,       COUNT(*)            AS CNT
,       MIN(LOGIN_DATE)     AS FIRST_TRY
,       MAX(LOGIN_DATE)     AS LAST_TRY
FROM    TB_WB_LOGIN_HIST_BLOCK
GROUP
BY      USER_ID, REAL_IP, COUNTRY_CODE
ORDER
BY      CNT DESC
;

-- 사설 IP·매칭 실패 건만 (내부망 유입 오탐 후보 — 반드시 확인)
SELECT  USER_ID, REAL_IP, COUNT(*) AS CNT
FROM    TB_WB_LOGIN_HIST_BLOCK
WHERE   COUNTRY_CODE IS NULL
GROUP   BY USER_ID, REAL_IP
ORDER   BY CNT DESC
;</pre>
  <ul>
    <li>정상 사용자(출장자·해외법인)는 <code>TB_CM_IP_ALLOW</code>에 승인 절차와 함께 등록</li>
    <li>사설 IP 유입(내부망 이슈)이 확인되면 허용테이블 등록 또는 사설 대역(10.x, 172.16~31.x, 192.168.x) 예외 정책 결정</li>
  </ul>

  <h3>14-2. 차단 활성화 — 수정할 곳은 함수 상수 스위치뿐</h3>
  <pre>-- FN_CHK_LOGIN_BLOCK 함수 내
C_BLOCK_MODE    CONSTANT VARCHAR2(1) := 'N';   -- 'N' 관찰 (현재) / 'Y' 차단
C_CHK_TARGET    CONSTANT VARCHAR2(1) := 'A';   -- 'S' SMS 등록자만 / 'A' 전체 (현재)
-- → 함수만 재컴파일하면 로그인 트리거·메뉴 함수 모두 동시 적용</pre>
  <div class=&quot;box-info&quot;>
    <strong>권장 전환 순서</strong>
    ① <code>N + A</code> (현재) — 전체 국외 접속 현황 수집 →
    ② 이력의 <code>[SMS=Y]</code> 건 검토, 정당한 해외 사용자는 허용테이블 등재 →
    ③ <code>Y + S</code> — 등록자부터 차단 개시 (※ 이 조합에서는 미등록자 이력도 남지 않음 — 미등록자 이력 유지가 필요하면 이 단계를 건너뜀) →
    ④ <code>Y + A</code> — 전체 차단.
  </div>

  <h3>14-3. 전환 후 사용자별 결과 (Y + A 전체 차단 기준)</h3>
  <table>
    <thead><tr><th>사용자</th><th style=&quot;width:30%&quot;>로그인</th><th style=&quot;width:24%&quot;>메뉴 이동</th></tr></thead>
    <tbody>
      <tr><td>국내 접속 (SMS 등록 무관)</td><td class=&quot;ok&quot;>정상</td><td class=&quot;ok&quot;>정상</td></tr>
      <tr><td>해외 접속 + 허용 등록됨</td><td class=&quot;ok&quot;>정상</td><td class=&quot;ok&quot;>정상</td></tr>
      <tr><td>해외 접속 + 미등록 (SMS 등록 무관)</td><td class=&quot;block&quot;>ORA-20001 로그인 실패</td><td class=&quot;block&quot;>차단('N')</td></tr>
      <tr><td>사설 IP 유입</td><td class=&quot;block&quot;>차단됨 — 주의</td><td class=&quot;block&quot;>차단됨 — 주의</td></tr>
    </tbody>
  </table>
  <p style=&quot;font-size:13px; color:#777;&quot;>※ <code>Y + S</code> 조합이면 위 표에서 &quot;SMS 미등록자&quot;는 전부 정상 통과(이력 없음)로 바뀝니다.</p>
  <div class=&quot;box-warn&quot;>
    <strong>전환 전 필수 확인 2가지</strong>
    ① 차단 시 트리거의 <code>ORA-20001</code>을 WAS가 어떻게 표시하는지 테스트 계정으로 확인 — 처리 없으면 일반 &quot;시스템 오류&quot; 화면이 뜰 수 있으므로, 필요 시 &quot;해외 IP 접속이 제한되었습니다&quot; 안내로 변환.<br>
    ② 차단된 로그인은 <code>TB_WB_LOGIN_HIST</code>에 남지 않고(롤백) <code>TB_WB_LOGIN_HIST_BLOCK</code>에만 남음 — 이후 추적은 BLOCK 테이블 기준.
  </div>
</section>

<!-- ======================================================================= -->
<section id=&quot;s15&quot;>
  <h2><span class=&quot;step&quot;>15</span>운영 — 월간 GeoIP 재적재 절차 (A/B 무중단 스위칭)</h2>
  <p>GeoLite2는 주기적으로 갱신됩니다(주 2회 배포, 월 1회 재적재 권장). 현재 시노님이 A를 가리키면 B에 적재하고, B를 가리키면 A에 적재합니다.</p>
  <pre>-- 0) 현재 시노님 대상 확인 → 반대쪽이 &quot;대기 테이블&quot;
SELECT table_name FROM user_synonyms WHERE synonym_name = 'TB_CM_GEOIP_RANGE';

-- 1) 최신 zip 다운로드 → 압축해제 → prepare_csv.py 실행 (2장과 동일)

-- 2) 대기 테이블 비우고 적재 (예: 현재 A 사용 중 → B에 적재)
TRUNCATE TABLE TB_CM_GEOIP_RANGE_B;
--   sqlldr USERID=... CONTROL=geoipB.ctl SKIP=1

-- 3) 건수 검증 (신규 &amp;lt; 기존×0.9 이면 중단)
DECLARE
    v_new_cnt NUMBER;
    v_old_cnt NUMBER;
BEGIN
    SELECT COUNT(*) INTO v_new_cnt FROM TB_CM_GEOIP_RANGE_B;
    SELECT COUNT(*) INTO v_old_cnt FROM TB_CM_GEOIP_RANGE_A;
    IF v_new_cnt &amp;lt; v_old_cnt * 0.9 THEN
        RAISE_APPLICATION_ERROR(-20001, '신규 GeoIP 데이터 건수 이상 - 스위치 중단');
    END IF;
END;
/

-- 4) 통계수집 (★ 재적재 때마다 필수 — 누락 시 조회 성능 급락)
EXEC DBMS_STATS.GATHER_TABLE_STATS(USER, 'TB_CM_GEOIP_RANGE_B', CASCADE =&amp;gt; TRUE);

-- 5) 검증 통과 후에만 스위치 (원자적/즉시 적용 — 무중단)
CREATE OR REPLACE SYNONYM TB_CM_GEOIP_RANGE FOR TB_CM_GEOIP_RANGE_B;

-- 6) 스위치 후 동작 확인
SELECT COUNT(*) FROM TB_CM_GEOIP_RANGE;
SELECT IS_KOREA_IP('223.62.180.1') FROM DUAL;   -- 'Y'
SELECT IS_KOREA_IP('8.8.8.8')      FROM DUAL;   -- 'N'</pre>
  <div class=&quot;box-info&quot;>
    <strong>체크리스트 요약</strong>
    ☐ 대기 테이블 확인 → ☐ 다운로드·CSV 변환 → ☐ TRUNCATE + sqlldr → ☐ geoip.log/.bad 확인 →
    ☐ 건수 검증 → ☐ <b>DBMS_STATS 수집</b> → ☐ 시노님 스위치 → ☐ IS_KOREA_IP 동작·속도 확인
  </div>
</section>

<p class=&quot;subtitle&quot;>국외 IP 로그인 차단 — 판정 함수 운영 모드 가이드 (작성일 2026.08.28)</p>

<h2>1. 스위치 2개</h2>
<table>
  <thead>

    <tr>

      <td><code>'N'</code></td>
      <td><b>관찰 모드</b> — 차단 대상이어도 통과('M'), 이력만 기록</td>
    </tr>
    <tr>
      <td><code>'Y'</code></td>
      <td><b>차단 모드</b> — 차단 대상은 'N' 리턴 → 트리거가 RAISE (로그인 실패)</td>
    </tr>
    <tr>
      <td rowspan=&quot;2&quot;><code>C_CHK_TARGET</code></td>
      <td><code>'S'</code></td>

<p>국외 IP + 허용테이블(TB_CM_IP_ALLOW) 미등재인 경우 기준.</p>
<table>

      <td><code>N</code> + <code>S</code></td>
      <td class=&quot;pass&quot;>통과 + 이력 <code>[SMS=Y]</code></td>

    </tr>
    <tr class=&quot;current&quot;>

      <td class=&quot;pass&quot;>통과 + 이력 <code>[SMS=N]</code></td>
      <td><b>전체 관찰</b> — 아무도 차단되지 않음</td>
    </tr>
    <tr>

  </tbody>

<h2>3. 조합과 무관하게 항상 동일한 것</h2>
<ul>
  <li><b>한국 IP</b> → 무조건 'Y' 허용, 이력 없음</li>
  <li><b>TB_CM_IP_ALLOW 등재자</b> (기간·USE_YN 유효) → 국외여도 'Y' 허용, 이력 없음</li>
  <li><b>판정 중 오류 발생</b> → 'Y' 허용 (전체 로그인 장애 방지 — fail-open)</li>
  <li><b>메뉴 접근</b> (FN_GET_MENU_CHK_YN2, <code>p_log_yn=&amp;gt;'N'</code>) → 판정은 동일하게 수행, 이력만 생략</li>
  <li>이력 라벨: 관찰 모드 <code>MONITOR - ...</code>, 차단 모드 <code>BLOCKED - ...</code></li>
</ul>

<div class=&quot;note warn&quot;>

</div>

<h2>4. 리턴값 의미</h2>
<table>

  <li><b><code>Y</code> + <code>S</code></b> — 등록자부터 차단 개시

  <li><b><code>Y</code> + <code>A</code></b> — 전체 차단</li>
</ol>

<div class=&quot;note&quot;>

<section id=&quot;s1&quot;>
<h2>1. 무엇이 바뀌었나</h2>
<p>이전에는 같은 IP 차단 목록(클라우드 대역 180줄, 개인 계정+IP 쌍, H0268 직원 체크, XFF 추출)이 <code>TR_TB_WB_LOGIN_HIST_R98</code>과 <code>FN_GET_MENU_CHK_YN2</code>에 각각 들어 있어서, 한쪽만 고치면 로그인과 메뉴의 차단 기준이 어긋났습니다.</p>
<p>지금은 규칙이 공용 함수 안의 <b>상수 목록</b>에 한 번만 존재하고, 트리거와 메뉴 함수는 그 함수를 호출해 결과만 받습니다. 대상을 추가할 때 트리거나 메뉴 함수를 열 일은 없습니다.</p>

<div class=&quot;cards&quot;>
  <div class=&quot;card&quot;><div class=&quot;n&quot;>로그인 시점</div><div class=&quot;f&quot;>TR_TB_WB_LOGIN_HIST_R98</div><p>결과가 <span class=&quot;badge b-n&quot;>N</span>이면 이력 INSERT 후 RAISE → 로그인 실패. 임시 차단 쌍은 09~18시에 실제 차단.</p></div>
  <div class=&quot;card&quot;><div class=&quot;n&quot;>메뉴 클릭 시점</div><div class=&quot;f&quot;>FN_GET_MENU_CHK_YN2</div><p>결과가 <span class=&quot;badge b-n&quot;>N</span>이면 USE_YN='N'. <span class=&quot;badge b-t&quot;>T</span>면 과호출 카운트 가중과 조회 딜레이만.</p></div>
</div>
</section>

<!-- ============================================================ -->
<section id=&quot;s2&quot;>
<h2>2. 객체 구조</h2>
<div class=&quot;tree&quot;>FN_GET_REAL_IP ──────┬──▶ FN_GET_CLOUD_IP_LABEL ──▶ FN_CHK_CLOUD_IP_YN
                     │            │
                     │            ▼
                     └──▶ FN_CHK_LOGIN_IP_BLOCK ◀── FN_CHK_BLOCK_TARGET_USER_YN
                                   │
                   ┌───────────────┴───────────────┐
                   ▼                               ▼
   TR_TB_WB_LOGIN_HIST_R98               FN_GET_MENU_CHK_YN2
   (S_TEMP_BLOCK_YN = 'Y')               (S_TEMP_BLOCK_YN = 'N')</div>

<table>
<tr><th>객체</th><th>역할</th><th>DB 접근</th><th>관리하는 목록</th></tr>
<tr><td><code>FN_GET_REAL_IP</code></td><td>XFF 체인 <code>'10.1.0.177, 112.216.111.58'</code>에서 실제 IP(맨 뒤) 추출</td><td>없음</td><td>—</td></tr>
<tr><td><code>FN_GET_CLOUD_IP_LABEL</code></td><td>클라우드·HostRoyale 대역 판정. 해당하면 라벨('AWS','GCP','HostRoyale'), 아니면 NULL</td><td>없음</td><td><code>C_CIDR_LIST</code></td></tr>
<tr><td><code>FN_CHK_CLOUD_IP_YN</code></td><td>위 함수의 Y/N 래퍼</td><td>없음</td><td>—</td></tr>
<tr><td><code>FN_CHK_BLOCK_TARGET_USER_YN</code></td><td>감시 대상 계정 여부. 개별 계정 / 본사 코드 소속 / 매장 코드 소속</td><td><code>TB_HQ_EMPLOYEE</code>, <code>TB_MS_EMPLOYEE</code> COUNT</td><td><code>C_TARGET_USERS</code> <code>C_TARGET_HQ_CDS</code> <code>C_TARGET_STORE_CDS</code></td></tr>
<tr><td><code>FN_CHK_LOGIN_IP_BLOCK</code></td><td><b>메인 판정.</b> 계정+IP 확정 차단 → 클라우드 대역 → 임시 차단 순으로 검사</td><td>위 함수 경유만</td><td><code>C_HARD_LIST</code> <code>C_TEMP_LIST</code> 시간대 상수</td></tr>
</table>
<p>공용 함수 5개 모두 INSERT/UPDATE가 없습니다. 그래서 SELECT 문 안에서 바로 호출해 점검할 수 있고, 메뉴 함수가 SELECT 안에서 불려도 ORA-14551이 나지 않습니다. 차단 이력 INSERT는 예전처럼 트리거·메뉴 함수가 자기 AUTONOMOUS 프로시저로 남깁니다.</p>
</section>

<!-- ============================================================ -->
<section id=&quot;s3&quot;>
<h2>3. 판정 흐름</h2>
<p><code>FN_CHK_LOGIN_IP_BLOCK(계정, IP, 임시차단적용YN)</code>은 아래 순서로 검사하고, 먼저 걸리는 단계에서 바로 결과를 돌려줍니다.</p>

<div class=&quot;ladder&quot;>
  <div class=&quot;step&quot;><span class=&quot;no&quot;>0</span><span class=&quot;what&quot;>운영 시간대·요일 밖<small>C_BLOCK_HH_FROM~TO (현재 00~23), C_BLOCK_DAYS (현재 전 요일) — 지금은 항상 통과</small></span><span class=&quot;badge b-y&quot;>Y</span></div>
  <div class=&quot;step&quot;><span class=&quot;no&quot;>1</span><span class=&quot;what&quot;>계정 + IP 확정 차단 목록에 있음<small>C_HARD_LIST · 감시 대상 계정이 아니어도 적용</small></span><span class=&quot;badge b-n&quot;>N</span></div>
  <div class=&quot;step&quot;><span class=&quot;no&quot;>2</span><span class=&quot;what&quot;>클라우드/호스팅 대역이고, 감시 대상 계정임<small>C_CIDR_LIST 먼저 → 해당할 때만 DB 조회</small></span><span class=&quot;badge b-n&quot;>N</span></div>
  <div class=&quot;step&quot;><span class=&quot;no&quot;>3</span><span class=&quot;what&quot;>임시 차단 쌍이고, 임시차단적용='Y'이고, 09~18시<small>C_TEMP_LIST · 로그인 트리거만 'Y'로 호출</small></span><span class=&quot;badge b-n&quot;>N</span></div>
  <div class=&quot;step&quot;><span class=&quot;no&quot;>3'</span><span class=&quot;what&quot;>임시 차단 쌍이지만 위 조건 미충족<small>메뉴 함수는 이 값으로 +5/+15 가중, 딜레이 +1.5초</small></span><span class=&quot;badge b-t&quot;>T</span></div>
  <div class=&quot;step&quot;><span class=&quot;no&quot;>4</span><span class=&quot;what&quot;>해당 없음</span><span class=&quot;badge b-y&quot;>Y</span></div>
</div>

<table>
<tr><th>결과</th><th>로그인 트리거</th><th>메뉴 함수</th></tr>
<tr><td><span class=&quot;badge b-n&quot;>N</span> 차단</td><td>TB_WB_LOGIN_HIST_CHK INSERT → RAISE_APPLICATION_ERROR(-20001)</td><td>USE_YN = 'N'</td></tr>
<tr><td><span class=&quot;badge b-t&quot;>T</span> 임시 대상</td><td>로그인 통과</td><td>1분 요청 카운트 +5 (09~18시 +15 추가), 특정 화면 조회 시 1.5초 추가 대기</td></tr>
<tr><td><span class=&quot;badge b-y&quot;>Y</span> 허용</td><td>통과</td><td>통과 (이후 국외 IP 판정 FN_CHK_LOGIN_BLOCK 은 별도)</td></tr>
</table>
</section>

<!-- ============================================================ -->
<section id=&quot;s4&quot;>
<h2>4. 대상 관리 — 어디를 고치나</h2>
<p>추가하려는 것이 무엇인지에 따라 아래 표에서 한 곳만 고치고, 그 함수만 다시 컴파일합니다.</p>

<table>
<tr><th>추가하려는 것</th><th>파일 / 상수</th><th>한 줄 형식</th></tr>
<tr><td>감시 대상 <b>계정</b> 하나</td><td><code>03 · C_TARGET_USERS</code></td><td><code>'userid'</code></td></tr>
<tr><td>특정 <b>본사</b> 소속 직원 전체</td><td><code>03 · C_TARGET_HQ_CDS</code></td><td><code>'H0268'</code> (TB_HQ_EMPLOYEE.HQ_OFFICE_CD)</td></tr>
<tr><td>특정 <b>매장</b> 소속 직원 전체</td><td><code>03 · C_TARGET_STORE_CDS</code></td><td><code>'DS00001'</code> (TB_MS_EMPLOYEE.STORE_CD)</td></tr>
<tr><td>클라우드/호스팅 <b>IP 대역</b></td><td><code>02 · C_CIDR_LIST</code></td><td><code>'167.160.96.0/19|HostRoyale'</code></td></tr>
<tr><td>단일 IP를 대역처럼</td><td><code>02 · C_CIDR_LIST</code></td><td><code>'44.196.52.83/32|AWS'</code></td></tr>
<tr><td><b>계정 + IP 쌍</b> 확정 차단</td><td><code>04 · C_HARD_LIST</code></td><td><code>'h0268|34.47.98.37|설명'</code></td></tr>
<tr><td>계정 + IP 쌍 <b>임시 차단</b> (잦은 접속)</td><td><code>04 · C_TEMP_LIST</code></td><td><code>'h0268|58.123.54.42|설명'</code></td></tr>
<tr><td>차단 시간대 · 요일</td><td><code>04 · C_BLOCK_HH_*, C_TEMP_HH_*, C_BLOCK_DAYS</code></td><td><code>'09'</code> / <code>'1234567'</code></td></tr>
<tr><td>특정 <b>URL</b> 차단 (메뉴 전용)</td><td><code>06 · STEP 2</code></td><td>기존 IF 문에 추가 — 트리거에 없는 규칙이라 예외적으로 여기서 관리</td></tr>
</table>

<h3>어느 목록에 넣을지 판단</h3>
<ul>
  <li><b>&quot;이 계정은 어느 IP로 오든 지켜봐야 한다&quot;</b> → <code>C_TARGET_USERS</code>. 넣는 순간 클라우드 IP 차단, 1분 60회 제한, 접근 이력 INSERT, 특정 화면 2초 딜레이가 모두 적용됩니다.</li>
  <li><b>&quot;이 IP 대역은 감시 대상 계정이 쓰면 무조건 막는다&quot;</b> → <code>C_CIDR_LIST</code>. 일반 계정에는 영향 없음.</li>
  <li><b>&quot;이 계정이 이 IP로 오면 막는다&quot;</b> → <code>C_HARD_LIST</code>. 감시 대상이 아니어도 동작.</li>
  <li><b>&quot;국내 통신사 IP인데 특정 계정만 과하게 접속&quot;</b> → <code>C_TEMP_LIST</code>. 대역에는 절대 넣지 말 것(9절).</li>
</ul>

<h3>예시 — HostRoyale 대역 하나 추가</h3>
<pre><span class=&quot;c&quot;>-- 02_FN_GET_CLOUD_IP_LABEL.sql 의 C_CIDR_LIST 끝에</span>
    ,   <span class=&quot;s&quot;>'45.10.192.0/21|HostRoyale'</span>
    ,   <span class=&quot;s&quot;>'203.0.113.0/24|HostRoyale'</span>     <span class=&quot;c&quot;>-- ← 추가. 형식: 네트워크/프리픽스|라벨</span>
    );</pre>
<p>예전처럼 <code>/24</code>를 <code>LIKE '203.0.113.%'</code> 256줄로 풀 필요 없고, <code>/19</code>·<code>/21</code>처럼 옥텟 경계에 안 맞는 대역도 한 줄입니다.</p>

<h3>예시 — 계정 + IP 확정 차단 추가</h3>
<pre><span class=&quot;c&quot;>-- 04_FN_CHK_LOGIN_IP_BLOCK.sql 의 C_HARD_LIST</span>
    ,   <span class=&quot;s&quot;>'momse12345|203.0.113.7|2026.09 비정상 접속 확인'</span>   <span class=&quot;c&quot;>-- 설명은 판정에 안 쓰임, 이력용</span></pre>
</section>

<!-- ============================================================ -->
<section id=&quot;s5&quot;>
<h2>5. 변경 배포 절차</h2>
<ol>
  <li><b>어느 상수를 고칠지 4절 표에서 확인</b>하고 해당 <code>.sql</code> 파일만 수정합니다.</li>
  <li>수정한 함수를 <code>CREATE OR REPLACE</code>로 컴파일합니다. 의존 객체(트리거·메뉴 함수)는 Oracle이 자동 재검증합니다.</li>
  <li>컴파일 직후 INVALID 객체가 없는지 확인합니다.
<pre><span class=&quot;k&quot;>SELECT</span> OBJECT_NAME, OBJECT_TYPE, STATUS
<span class=&quot;k&quot;>FROM</span>   USER_OBJECTS
<span class=&quot;k&quot;>WHERE</span>  OBJECT_NAME <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'FN_GET_REAL_IP'</span>,<span class=&quot;s&quot;>'FN_GET_CLOUD_IP_LABEL'</span>,<span class=&quot;s&quot;>'FN_CHK_CLOUD_IP_YN'</span>,
                       <span class=&quot;s&quot;>'FN_CHK_BLOCK_TARGET_USER_YN'</span>,<span class=&quot;s&quot;>'FN_CHK_LOGIN_IP_BLOCK'</span>,
                       <span class=&quot;s&quot;>'FN_GET_MENU_CHK_YN2'</span>,<span class=&quot;s&quot;>'TR_TB_WB_LOGIN_HIST_R98'</span>);
<span class=&quot;c&quot;>-- 전부 VALID 여야 함. INVALID 면 ALTER ... COMPILE 후 SHOW ERRORS</span></pre></li>
  <li>추가한 대상이 실제로 걸리는지 SELECT로 확인합니다.
<pre><span class=&quot;k&quot;>SELECT</span> FN_CHK_LOGIN_IP_BLOCK(<span class=&quot;s&quot;>'momse12345'</span>, <span class=&quot;s&quot;>'203.0.113.7'</span>) <span class=&quot;k&quot;>FROM</span> DUAL;  <span class=&quot;c&quot;>-- N 기대</span>
<span class=&quot;k&quot;>SELECT</span> FN_GET_CLOUD_IP_LABEL(<span class=&quot;s&quot;>'203.0.113.200'</span>)              <span class=&quot;k&quot;>FROM</span> DUAL;  <span class=&quot;c&quot;>-- HostRoyale 기대</span>
<span class=&quot;k&quot;>SELECT</span> FN_CHK_BLOCK_TARGET_USER_YN(<span class=&quot;s&quot;>'대상계정'</span>)               <span class=&quot;k&quot;>FROM</span> DUAL;  <span class=&quot;c&quot;>-- Y 기대</span></pre></li>
  <li>정상 계정이 영향받지 않는지 반대 케이스도 한 번 봅니다 (국내 IP + 일반 계정 → Y).</li>
  <li>배포 후 10~30분 <code>TB_WB_LOGIN_HIST_CHK</code>를 보며 예상 밖 계정이 차단되지 않는지 확인합니다 (6절 첫 쿼리).</li>
</ol>

<div class=&quot;note&quot;><b>전체 최초 설치</b>는 의존 순서 때문에 파일 번호 순(01 → 06)으로 컴파일해야 합니다. <code>ALL_IN_ONE.sql</code>이 그 순서로 합쳐져 있습니다.</div>
</section>

<!-- ============================================================ -->
<section id=&quot;s6&quot;>
<h2>6. 정기 점검 쿼리</h2>

<h3>오늘 차단된 로그인 (트리거)</h3>
<pre><span class=&quot;k&quot;>SELECT</span> A.PROC_DT, A.USER_ID, A.LOGIN_IP, FN_GET_REAL_IP(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> REAL_IP,
       FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> CLOUD, A.STAT_CD, A.BRWSR_INFO
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_CHK A
<span class=&quot;k&quot;>WHERE</span>  A.PROC_FG <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'I'</span>,<span class=&quot;s&quot;>'U'</span>)
<span class=&quot;k&quot;>AND</span>    A.PROC_DT >= TO_CHAR(SYSDATE, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>ORDER  BY</span> A.PROC_DT <span class=&quot;k&quot;>DESC</span>;</pre>

<h3>최근 7일 클라우드 대역에서 온 로그인 시도 (차단 여부 무관)</h3>
<pre><span class=&quot;k&quot;>SELECT</span> A.LOGIN_DATE, A.USER_ID, A.LOGIN_IP,
       FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP)          <span class=&quot;k&quot;>AS</span> CLOUD,
       FN_CHK_BLOCK_TARGET_USER_YN(A.USER_ID)     <span class=&quot;k&quot;>AS</span> TARGET_YN,
       FN_CHK_LOGIN_IP_BLOCK(A.USER_ID, A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> BLOCK_NOW
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST A
<span class=&quot;k&quot;>WHERE</span>  TO_DATE(A.LOGIN_DATE, <span class=&quot;s&quot;>'YYYYMMDD'</span>) >= TRUNC(SYSDATE) - 7
<span class=&quot;k&quot;>AND</span>    FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP) <span class=&quot;k&quot;>IS NOT NULL</span>
<span class=&quot;k&quot;>ORDER  BY</span> A.LOGIN_DATE <span class=&quot;k&quot;>DESC</span>, A.LOGIN_DT <span class=&quot;k&quot;>DESC</span>;
<span class=&quot;c&quot;>-- TARGET_YN='N' 인데 클라우드 IP 가 반복되면 → C_TARGET_USERS 추가 검토</span></pre>

<h3>계정 · IP 별 집계 (감시 후보 찾기)</h3>
<pre><span class=&quot;k&quot;>SELECT</span> A.USER_ID, FN_GET_REAL_IP(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> REAL_IP, COUNT(*) CNT,
       MIN(A.LOGIN_DATE) FIRST_DT, MAX(A.LOGIN_DATE) LAST_DT,
       FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> CLOUD
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST A
<span class=&quot;k&quot;>WHERE</span>  TO_DATE(A.LOGIN_DATE, <span class=&quot;s&quot;>'YYYYMMDD'</span>) >= TRUNC(SYSDATE) - 7
<span class=&quot;k&quot;>GROUP  BY</span> A.USER_ID, FN_GET_REAL_IP(A.LOGIN_IP), FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP)
<span class=&quot;k&quot;>HAVING</span> COUNT(*) >= 50
<span class=&quot;k&quot;>ORDER  BY</span> CNT <span class=&quot;k&quot;>DESC</span>;</pre>

<h3>1분 60회 초과로 막힌 메뉴 호출</h3>
<pre><span class=&quot;k&quot;>SELECT</span> A.PROC_DT, A.USER_ID, A.LOGIN_IP
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_CHK A
<span class=&quot;k&quot;>WHERE</span>  A.PROC_FG = <span class=&quot;s&quot;>'C'</span> <span class=&quot;k&quot;>AND</span> A.BRWSR_INFO <span class=&quot;k&quot;>LIKE</span> <span class=&quot;s&quot;>'60%'</span>
<span class=&quot;k&quot;>AND</span>    A.PROC_DT >= TO_CHAR(SYSDATE - 1, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>ORDER  BY</span> A.PROC_DT <span class=&quot;k&quot;>DESC</span>;</pre>

<h3>현재 감시 대상 전체 명단</h3>
<pre><span class=&quot;k&quot;>SELECT</span> A.USER_ID, <span class=&quot;s&quot;>'HQ:'</span> || A.HQ_OFFICE_CD <span class=&quot;k&quot;>AS</span> SRC <span class=&quot;k&quot;>FROM</span> TB_HQ_EMPLOYEE A <span class=&quot;k&quot;>WHERE</span> A.HQ_OFFICE_CD <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'H0268'</span>,<span class=&quot;s&quot;>'DS001'</span>)
<span class=&quot;k&quot;>UNION ALL</span>
<span class=&quot;k&quot;>SELECT</span> A.USER_ID, <span class=&quot;s&quot;>'MS:'</span> || A.STORE_CD     <span class=&quot;k&quot;>AS</span> SRC <span class=&quot;k&quot;>FROM</span> TB_MS_EMPLOYEE A <span class=&quot;k&quot;>WHERE</span> A.STORE_CD     <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'DS00001'</span>,<span class=&quot;s&quot;>'DS00002'</span>);
<span class=&quot;c&quot;>-- 여기에 C_TARGET_USERS 4개(h0268, momse09686, kjsun1117, kjsun11177) 를 더한 것이 전체</span></pre>

<h3>이력 테이블 크기 관리</h3>
<p><code>TB_WB_LOGIN_HIST_CHK</code>는 감시 대상 계정의 메뉴 클릭마다 한 행씩 쌓입니다(PROC_FG='C'). 감시 대상이 늘면 증가 속도도 늘어나니 월 1회 정도 30일 이전 데이터를 정리합니다. 1분 카운트에는 최근 1분만 쓰이므로 삭제해도 판정에 영향 없습니다.</p>
<pre><span class=&quot;k&quot;>DELETE FROM</span> TB_WB_LOGIN_HIST_CHK
<span class=&quot;k&quot;>WHERE</span>  PROC_FG = <span class=&quot;s&quot;>'C'</span> <span class=&quot;k&quot;>AND</span> PROC_DT < TO_CHAR(SYSDATE - 30, <span class=&quot;s&quot;>'YYYYMMDD'</span>);
<span class=&quot;c&quot;>-- I/U(로그인 차단 이력) 는 보안 감사용이니 별도 보관 정책에 따를 것</span></pre>
</section>

<!-- ============================================================ -->
<section id=&quot;s7&quot;>
<h2>7. 장애 대응</h2>

<h3>정상 사용자가 로그인이 안 된다고 한다</h3>
<ol>
  <li>에러 메시지에 <code>Login Blocked: Security Violation,계정,IP,...</code>가 있으면 이 트리거가 막은 것입니다. 없으면 다른 원인.</li>
  <li>왜 걸렸는지 확인:
<pre><span class=&quot;k&quot;>SELECT</span> FN_GET_REAL_IP(<span class=&quot;s&quot;>'에러메시지의 IP'</span>)               <span class=&quot;k&quot;>AS</span> REAL_IP,
       FN_GET_CLOUD_IP_LABEL(<span class=&quot;s&quot;>'에러메시지의 IP'</span>)        <span class=&quot;k&quot;>AS</span> CLOUD,       <span class=&quot;c&quot;>-- NULL 아니면 대역 차단</span>
       FN_CHK_BLOCK_TARGET_USER_YN(<span class=&quot;s&quot;>'계정'</span>)             <span class=&quot;k&quot;>AS</span> TARGET,      <span class=&quot;c&quot;>-- Y 면 감시 대상</span>
       FN_CHK_LOGIN_IP_BLOCK(<span class=&quot;s&quot;>'계정'</span>, <span class=&quot;s&quot;>'IP'</span>, <span class=&quot;s&quot;>'Y'</span>)        <span class=&quot;k&quot;>AS</span> RESULT
<span class=&quot;k&quot;>FROM</span>   DUAL;</pre></li>
  <li>대역 오탐(국내 통신사인데 CLOUD가 찍힘)이면 <code>C_CIDR_LIST</code>에서 해당 대역을 빼고 02 재컴파일. 계정 오탐이면 <code>C_TARGET_USERS</code>·본사/매장 코드 확인.</li>
  <li>급하게 특정 계정만 풀어야 하면 <code>C_HARD_LIST</code>/<code>C_TEMP_LIST</code>에서 그 줄을 지우고 04 재컴파일. 재컴파일은 수 초.</li>
</ol>

<h3>메뉴가 열리지 않는다 (USE_YN='N')</h3>
<p>원인이 네 가지입니다. 위 쿼리로 <b>RESULT</b>가 N이면 IP 차단, Y인데도 막히면 ① 1분 60회 초과(6절 쿼리), ② 메뉴 함수 STEP 2 URL 규칙, ③ 국외 IP <code>FN_CHK_LOGIN_BLOCK</code> 순으로 봅니다.</p>

<h3>전체 차단을 잠시 꺼야 한다</h3>
<p>04의 <code>C_BLOCK_HH_FROM</code>/<code>TO</code>를 <code>'25'</code>/<code>'25'</code>처럼 만족 불가능한 값으로 바꾸고 재컴파일하면 STEP 0에서 전부 Y가 되어 판정이 꺼집니다. 다시 켤 때 <code>'00'</code>/<code>'23'</code>. 이 방법은 공용 함수만 건드리므로 트리거를 DISABLE하는 것보다 안전합니다(트리거 DISABLE은 이력 INSERT도 함께 멈춤).</p>

<h3>ORA-04068 / 함수 INVALID</h3>
<p>상수 목록만 바꿔도 함수 재컴파일이라, 접속 중인 세션에서 첫 호출 시 <code>ORA-04068 existing state of packages has been discarded</code>가 한 번 뜰 수 있습니다. 패키지가 아닌 standalone 함수라 보통 안 나지만, 나면 WAS 재시도로 해소됩니다. INVALID가 남으면 <code>ALTER FUNCTION ... COMPILE</code> 후 <code>SHOW ERRORS</code>.</p>

<h3>트리거 에러로 로그인 자체가 전부 실패</h3>
<p>공용 함수가 예외를 던지면 트리거 <code>WHEN OTHERS</code>가 -20002로 올려 모든 로그인이 막힙니다. 배포 직후 로그인이 전부 실패하면 즉시 이전 버전 파일로 롤백 컴파일하고 원인(대개 오타·컬럼명)을 찾습니다. 그래서 5절 3~5단계를 건너뛰지 않는 게 중요합니다.</p>
</section>

<!-- ============================================================ -->
<section id=&quot;s8&quot;>
<h2>8. 성능 · 인덱스</h2>
<table>
<tr><th>구간</th><th>비용</th><th>비고</th></tr>
<tr><td>XFF 추출 · CIDR 판정</td><td>&amp;lt; 1ms</td><td>순수 연산, DB 미접근. 예전 OR LIKE 180개보다 가벼움</td></tr>
<tr><td>감시 대상 판정</td><td>COUNT 최대 4회</td><td>메뉴 요청마다 1회 호출. 클라우드 IP 일 때만 추가 1회</td></tr>
<tr><td>메뉴 함수 기존 로직</td><td>변동 없음</td><td>60회 COUNT, 30분 COUNT, DBMS_LOCK.SLEEP 은 그대로</td></tr>
</table>
<div class=&quot;note warn&quot;><b>TB_MS_EMPLOYEE 인덱스 확인 필수.</b> 매장 코드 감시는 이번에 새로 생긴 조회라, <code>USER_ID</code>를 포함한 인덱스가 없으면 메뉴 요청마다 풀스캔 2회가 발생합니다.</div>
<pre><span class=&quot;k&quot;>SELECT</span> TABLE_NAME, INDEX_NAME, COLUMN_NAME, COLUMN_POSITION
<span class=&quot;k&quot;>FROM</span>   USER_IND_COLUMNS
<span class=&quot;k&quot;>WHERE</span>  TABLE_NAME <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'TB_HQ_EMPLOYEE'</span>, <span class=&quot;s&quot;>'TB_MS_EMPLOYEE'</span>)
<span class=&quot;k&quot;>ORDER  BY</span> 1,2,4;

<span class=&quot;c&quot;>-- USER_ID 선두 인덱스가 없을 때만</span>
<span class=&quot;k&quot;>CREATE INDEX</span> IDX_TB_HQ_EMPLOYEE_USER <span class=&quot;k&quot;>ON</span> TB_HQ_EMPLOYEE (USER_ID, HQ_OFFICE_CD);
<span class=&quot;k&quot;>CREATE INDEX</span> IDX_TB_MS_EMPLOYEE_USER <span class=&quot;k&quot;>ON</span> TB_MS_EMPLOYEE (USER_ID, STORE_CD);</pre>
<p>본사·매장 코드가 10개를 넘어가면 03의 루프를 <code>IN</code> 절 한 번으로 바꾸는 편이 낫습니다. 그 전까지는 현재 구조로 충분합니다.</p>
</section>

<!-- ============================================================ -->
<section id=&quot;s9&quot;>
<h2>9. 하지 말아야 할 것</h2>
<ul class=&quot;checklist&quot;>
  <li><b>국내 통신사 대역을 C_CIDR_LIST에 넣지 않는다.</b> 58.123.54.42(SK브로드밴드 58.120.0.0/13), 182.208.192.55(182.208.0.0/12) 같은 IP는 가입자 회선이라 대역으로 막으면 정상 매장이 통째로 차단된다. 특정 계정만 문제면 <code>C_TEMP_LIST</code>에 쌍으로.</li>
  <li><b>공용 함수 5개에 INSERT/UPDATE를 넣지 않는다.</b> 메뉴 함수가 SELECT 안에서 호출되므로 ORA-14551이 난다. 이력이 필요하면 호출부의 AUTONOMOUS 프로시저에서.</li>
  <li><b>트리거·메뉴 함수 안에 IP 목록을 다시 쓰지 않는다.</b> 그 순간 이번 작업 이전으로 돌아간다. URL 기반 규칙만 06 STEP 2 예외.</li>
  <li><b>C_TARGET_HQ_CDS / STORE_CDS에 큰 본사·매장을 넣기 전에 명단 크기를 본다.</b> 감시 대상이 되는 계정은 메뉴 클릭마다 이력 INSERT + 60회 제한 + 특정 화면 2초 딜레이를 받는다. 수백 명이 갑자기 대상이 되면 <code>TB_WB_LOGIN_HIST_CHK</code>가 급증하고 체감 속도가 떨어진다.</li>
  <li><b>C_HARD_LIST와 C_TEMP_LIST에 같은 쌍을 두지 않는다.</b> 확정 차단이 먼저 걸려 임시 차단이 의미 없어진다. (현재 momse09686/39.115.138.12가 양쪽에 있는데, 원본 트리거 동작 유지를 위해 남겼다. 임시로 낮추려면 HARD에서 제거.)</li>
  <li><b>요일 조건을 좁힐 때 NLS를 확인한다.</b> <code>TO_CHAR(SYSDATE,'D')</code>는 NLS_TERRITORY에 따라 1이 일요일일 수도 월요일일 수도 있다.</li>
</ul>
</section>

    <p class=&quot;group-desc&quot;>아침에 한 번. 어제~오늘 실제로 차단된 건과, 관찰 모드로 쌓인 국외 접속 이력을 확인합니다.</p>

    <article class=&quot;qcard&quot; data-freq=&quot;daily&quot;>
      <div class=&quot;qhead&quot;><h3>오늘 차단된 로그인 (클라우드·계정+IP 차단)</h3><span class=&quot;badge daily&quot;>Daily</span></div>
      <p class=&quot;qdesc&quot;>트리거 R98이 실제로 막은 건. 예상 밖 계정이 있으면 대역 오탐부터 의심합니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_CHK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> A.PROC_DT, A.USER_ID, A.LOGIN_IP, FN_GET_REAL_IP(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> REAL_IP,
       FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> CLOUD, A.STAT_CD, A.BRWSR_INFO
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_CHK A
<span class=&quot;k&quot;>WHERE</span>  A.PROC_FG <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'I'</span>,<span class=&quot;s&quot;>'U'</span>)
<span class=&quot;k&quot;>AND</span>    A.PROC_DT &amp;gt;= TO_CHAR(SYSDATE, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> A.PROC_DT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>CLOUD가 NULL인데 차단됐다면 계정+IP 확정 차단(C_HARD_LIST) 건. 국내 통신사 IP에 CLOUD 라벨이 찍히면 대역 오탐 — C_CIDR_LIST에서 제거.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;daily&quot;>
      <div class=&quot;qhead&quot;><h3>오늘 쌓인 국외 접속 관찰 이력</h3><span class=&quot;badge daily&quot;>Daily</span></div>
      <p class=&quot;qdesc&quot;>관찰 모드(C_BLOCK_MODE='N')에서 차단 대상으로 판정돼 MONITOR로 기록된 건. 차단 전환 시 이 사람들이 막힙니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_BLOCK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> A.PROC_DT, A.PROC_FG, A.USER_ID, A.REAL_IP, A.COUNTRY_CODE, A.BLOCK_REASON
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_BLOCK A
<span class=&quot;k&quot;>WHERE</span>  A.PROC_DT &amp;gt;= TO_CHAR(SYSDATE, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> A.PROC_DT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>정당한 해외 사용자(출장·해외법인)는 TB_CM_IP_ALLOW에 승인 절차와 함께 등록. COUNTRY_CODE가 NULL이면 사설 IP 유입 후보 — 아래 국외 IP 점검의 오탐 쿼리로 확인.</div>
    </article>
  </section>

  <!-- ============ 2. 주간 점검 ============ -->
  <section class=&quot;group&quot; data-group>
    <div class=&quot;group-head&quot;><h2>2 · 주간 점검</h2><span class=&quot;cnt&quot;></span></div>
    <p class=&quot;group-desc&quot;>주 1회. 클라우드 대역 접속 추이와 감시 후보 계정을 찾습니다.</p>

    <article class=&quot;qcard&quot; data-freq=&quot;weekly&quot;>
      <div class=&quot;qhead&quot;><h3>최근 7일 클라우드 대역 로그인 (차단 여부 무관)</h3><span class=&quot;badge weekly&quot;>Weekly</span></div>
      <p class=&quot;qdesc&quot;>AWS·GCP·HostRoyale 대역에서 온 모든 시도. 감시 대상이 아닌 계정의 반복 접속을 잡아냅니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> A.LOGIN_DATE, A.USER_ID, A.LOGIN_IP,
       FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP)            <span class=&quot;k&quot;>AS</span> CLOUD,
       FN_CHK_BLOCK_TARGET_USER_YN(A.USER_ID)       <span class=&quot;k&quot;>AS</span> TARGET_YN,
       FN_CHK_LOGIN_IP_BLOCK(A.USER_ID, A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> BLOCK_NOW
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST A
<span class=&quot;k&quot;>WHERE</span>  A.LOGIN_DATE &amp;gt;= TO_CHAR(TRUNC(SYSDATE) - 7, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>AND</span>    FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP) <span class=&quot;k&quot;>IS NOT NULL</span>
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> A.LOGIN_DATE <span class=&quot;k&quot;>DESC</span>, A.LOGIN_DT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>TARGET_YN='N'인데 클라우드 IP가 반복되면 C_TARGET_USERS 추가 검토. <em>날짜 필터는 컬럼 가공 없는 문자열 비교로 바꿔 인덱스를 타도록 수정한 버전입니다.</em></div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;weekly&quot;>
      <div class=&quot;qhead&quot;><h3>계정·IP별 접속 집계 — 감시 후보 찾기</h3><span class=&quot;badge weekly&quot;>Weekly</span></div>
      <p class=&quot;qdesc&quot;>최근 7일간 50회 이상 접속한 계정+IP 조합. 잦은 접속의 임시 차단(C_TEMP_LIST) 후보를 고릅니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> A.USER_ID, FN_GET_REAL_IP(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> REAL_IP, <span class=&quot;k&quot;>COUNT</span>(*) CNT,
       <span class=&quot;k&quot;>MIN</span>(A.LOGIN_DATE) FIRST_DT, <span class=&quot;k&quot;>MAX</span>(A.LOGIN_DATE) LAST_DT,
       FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP) <span class=&quot;k&quot;>AS</span> CLOUD
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST A
<span class=&quot;k&quot;>WHERE</span>  A.LOGIN_DATE &amp;gt;= TO_CHAR(TRUNC(SYSDATE) - 7, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>GROUP</span>  <span class=&quot;k&quot;>BY</span> A.USER_ID, FN_GET_REAL_IP(A.LOGIN_IP), FN_GET_CLOUD_IP_LABEL(A.LOGIN_IP)
<span class=&quot;k&quot;>HAVING</span> <span class=&quot;k&quot;>COUNT</span>(*) &amp;gt;= 50
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> CNT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>국내 통신사 IP는 절대 대역(C_CIDR_LIST)에 넣지 않습니다. 특정 계정만 문제면 C_TEMP_LIST에 쌍으로.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;weekly&quot;>
      <div class=&quot;qhead&quot;><h3>1분 60회 초과로 막힌 메뉴 호출</h3><span class=&quot;badge weekly&quot;>Weekly</span></div>
      <p class=&quot;qdesc&quot;>감시 대상 계정의 과호출 차단 이력. 급증하면 스크립트성 접근을 의심합니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_CHK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> A.PROC_DT, A.USER_ID, A.LOGIN_IP
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_CHK A
<span class=&quot;k&quot;>WHERE</span>  A.PROC_FG = <span class=&quot;s&quot;>'C'</span> <span class=&quot;k&quot;>AND</span> A.BRWSR_INFO <span class=&quot;k&quot;>LIKE</span> <span class=&quot;s&quot;>'60%'</span>
<span class=&quot;k&quot;>AND</span>    A.PROC_DT &amp;gt;= TO_CHAR(SYSDATE - 1, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> A.PROC_DT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>동일 계정이 매일 걸리면 C_HARD_LIST 승격 또는 계정 소유자 확인.</div>
    </article>
  </section>

  <!-- ============ 3. 국외 IP 점검 ============ -->
  <section class=&quot;group&quot; data-group>
    <div class=&quot;group-head&quot;><h2>3 · 국외 IP 점검 (관찰 모드)</h2><span class=&quot;cnt&quot;></span></div>
    <p class=&quot;group-desc&quot;>차단 전환(C_BLOCK_MODE 'N'→'Y') 전에 돌리는 오탐 점검 세트. 관찰 기간 1~2주 동안 주기적으로 확인합니다.</p>

    <article class=&quot;qcard&quot; data-freq=&quot;weekly&quot;>
      <div class=&quot;qhead&quot;><h3>SMS 등록/미등록 구분 집계 — 차단 전환 영향 범위</h3><span class=&quot;badge weekly&quot;>Weekly</span></div>
      <p class=&quot;qdesc&quot;>C_CHK_TARGET을 'S'로 좁힐지 'A'로 갈지 판단하는 근거. [SMS=Y] 건이 차단 1순위 영향권입니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_BLOCK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> <span class=&quot;k&quot;>CASE WHEN</span> BLOCK_REASON <span class=&quot;k&quot;>LIKE</span> <span class=&quot;s&quot;>'%[SMS=Y]%'</span> <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'SMS등록'</span> <span class=&quot;k&quot;>ELSE</span> <span class=&quot;s&quot;>'미등록'</span> <span class=&quot;k&quot;>END</span> <span class=&quot;k&quot;>AS</span> SMS_DIV
,      <span class=&quot;k&quot;>COUNT</span>(*)                <span class=&quot;k&quot;>AS</span> CNT
,      <span class=&quot;k&quot;>COUNT</span>(<span class=&quot;k&quot;>DISTINCT</span> USER_ID) <span class=&quot;k&quot;>AS</span> USER_CNT
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_BLOCK
<span class=&quot;k&quot;>GROUP</span>  <span class=&quot;k&quot;>BY</span> <span class=&quot;k&quot;>CASE WHEN</span> BLOCK_REASON <span class=&quot;k&quot;>LIKE</span> <span class=&quot;s&quot;>'%[SMS=Y]%'</span> <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'SMS등록'</span> <span class=&quot;k&quot;>ELSE</span> <span class=&quot;s&quot;>'미등록'</span> <span class=&quot;k&quot;>END</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>권장 전환 순서: N+A(현재, 전체 관찰) → [SMS=Y] 검토·정당 사용자 허용테이블 등재 → Y+S(등록자 차단) → Y+A(전체 차단).</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;weekly&quot;>
      <div class=&quot;qhead&quot;><h3>차단 예정 건 집계 — 국가별 오탐 점검</h3><span class=&quot;badge weekly&quot;>Weekly</span></div>
      <p class=&quot;qdesc&quot;>차단 전환 시 막힐 사용자·IP·국가 목록. 정당한 사용자를 여기서 걸러 허용테이블로 옮깁니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_BLOCK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> USER_ID, REAL_IP, COUNTRY_CODE
,      <span class=&quot;k&quot;>COUNT</span>(*)        <span class=&quot;k&quot;>AS</span> CNT
,      <span class=&quot;k&quot;>MIN</span>(LOGIN_DATE) <span class=&quot;k&quot;>AS</span> FIRST_TRY
,      <span class=&quot;k&quot;>MAX</span>(LOGIN_DATE) <span class=&quot;k&quot;>AS</span> LAST_TRY
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_BLOCK
<span class=&quot;k&quot;>GROUP</span>  <span class=&quot;k&quot;>BY</span> USER_ID, REAL_IP, COUNTRY_CODE
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> CNT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>출장자·해외법인은 TB_CM_IP_ALLOW에 USER_ID+IP+기간+승인자로 등록. 차단된 로그인은 TB_WB_LOGIN_HIST에 남지 않으므로(롤백) 전환 후 추적은 이 BLOCK 테이블 기준.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;weekly&quot;>
      <div class=&quot;qhead&quot;><h3>사설 IP·매칭 실패 건 — 내부망 오탐 후보</h3><span class=&quot;badge weekly&quot;>Weekly</span></div>
      <p class=&quot;qdesc&quot;>COUNTRY_CODE가 NULL인 건은 GeoIP에 없는 IP(사설·미할당)입니다. 차단 전환 전 반드시 비워야 합니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_BLOCK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> USER_ID, REAL_IP, <span class=&quot;k&quot;>COUNT</span>(*) <span class=&quot;k&quot;>AS</span> CNT
<span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST_BLOCK
<span class=&quot;k&quot;>WHERE</span>  COUNTRY_CODE <span class=&quot;k&quot;>IS NULL</span>
<span class=&quot;k&quot;>GROUP</span>  <span class=&quot;k&quot;>BY</span> USER_ID, REAL_IP
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> CNT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>10.x / 172.16~31.x / 192.168.x가 보이면 내부망 유입 — 허용테이블 등록 또는 사설 대역 예외 정책을 먼저 결정하고 전환.</div>
    </article>
  </section>

  <!-- ============ 4. IP 분류 조회 (고속판) ============ -->
  <section class=&quot;group&quot; data-group>
    <div class=&quot;group-head&quot;><h2>4 · LOGIN_IP 분류 조회 — 고속판</h2><span class=&quot;cnt&quot;></span></div>
    <p class=&quot;group-desc&quot;>국내 / 국외 / 차단대역(클라우드)을 한 번에 보는 쿼리. 함수를 행마다 부르지 않고 <b>고유 IP·계정당 1번</b>만 호출해 원판보다 크게 빠릅니다.</p>

    <article class=&quot;qcard&quot; data-freq=&quot;adhoc&quot;>
      <div class=&quot;qhead&quot;><h3>상세 조회 — 최근 7일, 국내 일반 IP 제외</h3><span class=&quot;badge new&quot;>Fast</span><span class=&quot;badge adhoc&quot;>수시</span></div>
      <p class=&quot;qdesc&quot;>건별로 실제 IP·국내여부·클라우드 라벨·분류를 표시. 전체를 보려면 마지막 WHERE 한 줄만 삭제.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST + IS_KOREA_IP / FN_GET_CLOUD_IP_LABEL</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>WITH</span> H <span class=&quot;k&quot;>AS</span> (
    <span class=&quot;k&quot;>SELECT</span> A.LOGIN_DATE, A.LOGIN_DT, A.USER_ID, A.LOGIN_IP
    <span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST A
    <span class=&quot;k&quot;>WHERE</span>  A.LOGIN_DATE &amp;gt;= TO_CHAR(TRUNC(SYSDATE) - 7, <span class=&quot;s&quot;>'YYYYMMDD'</span>)  <span class=&quot;c&quot;>-- 컬럼 가공 없이 (인덱스)</span>
),
IPS <span class=&quot;k&quot;>AS</span> (    <span class=&quot;c&quot;>-- IP 판정: 고유 IP당 1번</span>
    <span class=&quot;k&quot;>SELECT</span> <span class=&quot;c&quot;>/*+ MATERIALIZE */</span>
           LOGIN_IP
    ,      FN_GET_REAL_IP(LOGIN_IP)              <span class=&quot;k&quot;>AS</span> REAL_IP
    ,      IS_KOREA_IP(FN_GET_REAL_IP(LOGIN_IP)) <span class=&quot;k&quot;>AS</span> KOREA_YN
    ,      FN_GET_CLOUD_IP_LABEL(LOGIN_IP)       <span class=&quot;k&quot;>AS</span> CLOUD_LABEL
    ,      IP_TO_NUM(FN_GET_REAL_IP(LOGIN_IP))   <span class=&quot;k&quot;>AS</span> IP_NUM
    <span class=&quot;k&quot;>FROM</span>   (<span class=&quot;k&quot;>SELECT DISTINCT</span> LOGIN_IP <span class=&quot;k&quot;>FROM</span> H)
),
USERS <span class=&quot;k&quot;>AS</span> (  <span class=&quot;c&quot;>-- 계정 판정: 고유 USER_ID당 1번 (직원테이블 COUNT가 여기서만 실행)</span>
    <span class=&quot;k&quot;>SELECT</span> <span class=&quot;c&quot;>/*+ MATERIALIZE */</span>
           USER_ID
    ,      FN_CHK_BLOCK_TARGET_USER_YN(USER_ID) <span class=&quot;k&quot;>AS</span> TARGET_YN
    <span class=&quot;k&quot;>FROM</span>   (<span class=&quot;k&quot;>SELECT DISTINCT</span> USER_ID <span class=&quot;k&quot;>FROM</span> H)
)
<span class=&quot;k&quot;>SELECT</span> H.LOGIN_DATE, H.LOGIN_DT, H.USER_ID, H.LOGIN_IP
,      I.REAL_IP, I.KOREA_YN, I.CLOUD_LABEL
,      <span class=&quot;k&quot;>CASE</span>
           <span class=&quot;k&quot;>WHEN</span> I.CLOUD_LABEL <span class=&quot;k&quot;>IS NOT NULL</span> <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'차단대역('</span> || I.CLOUD_LABEL || <span class=&quot;s&quot;>')'</span>
           <span class=&quot;k&quot;>WHEN</span> I.KOREA_YN = <span class=&quot;s&quot;>'Y'</span>          <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'국내'</span>
           <span class=&quot;k&quot;>WHEN</span> I.IP_NUM <span class=&quot;k&quot;>IS NULL</span>          <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'판정불가(형식오류/IPv6)'</span>
           <span class=&quot;k&quot;>ELSE</span> <span class=&quot;s&quot;>'국외/사설·미할당'</span>
       <span class=&quot;k&quot;>END</span>                               <span class=&quot;k&quot;>AS</span> IP_CLASS
,      U.TARGET_YN
<span class=&quot;k&quot;>FROM</span>   H
<span class=&quot;k&quot;>JOIN</span>   IPS   I <span class=&quot;k&quot;>ON</span> I.LOGIN_IP = H.LOGIN_IP
<span class=&quot;k&quot;>JOIN</span>   USERS U <span class=&quot;k&quot;>ON</span> U.USER_ID  = H.USER_ID
<span class=&quot;k&quot;>WHERE</span>  <span class=&quot;k&quot;>NOT</span> (I.KOREA_YN = <span class=&quot;s&quot;>'Y'</span> <span class=&quot;k&quot;>AND</span> I.CLOUD_LABEL <span class=&quot;k&quot;>IS NULL</span>)  <span class=&quot;c&quot;>-- 국내 일반 IP 제외 (전체 보려면 삭제)</span>
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> H.LOGIN_DATE <span class=&quot;k&quot;>DESC</span>, H.LOGIN_DT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>IS_KOREA_IP에는 반드시 FN_GET_REAL_IP를 거친 IP를 넣습니다. XFF 체인 원본을 넣으면 맨 앞 사내 프록시(10.x)로 판정됩니다.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;adhoc&quot;>
      <div class=&quot;qhead&quot;><h3>분류별 요약 집계 — 국내/국외/차단대역 분포</h3><span class=&quot;badge new&quot;>Fast</span><span class=&quot;badge adhoc&quot;>수시</span></div>
      <p class=&quot;qdesc&quot;>긴 기간을 볼 때는 상세 대신 이 집계를 사용. 분류별 로그인 수·계정 수·IP 수.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>WITH</span> H <span class=&quot;k&quot;>AS</span> (
    <span class=&quot;k&quot;>SELECT</span> A.USER_ID, A.LOGIN_IP
    <span class=&quot;k&quot;>FROM</span>   TB_WB_LOGIN_HIST A
    <span class=&quot;k&quot;>WHERE</span>  A.LOGIN_DATE &amp;gt;= TO_CHAR(TRUNC(SYSDATE) - 7, <span class=&quot;s&quot;>'YYYYMMDD'</span>)
),
IPS <span class=&quot;k&quot;>AS</span> (
    <span class=&quot;k&quot;>SELECT</span> <span class=&quot;c&quot;>/*+ MATERIALIZE */</span>
           LOGIN_IP
    ,      FN_GET_REAL_IP(LOGIN_IP)              <span class=&quot;k&quot;>AS</span> REAL_IP
    ,      IS_KOREA_IP(FN_GET_REAL_IP(LOGIN_IP)) <span class=&quot;k&quot;>AS</span> KOREA_YN
    ,      FN_GET_CLOUD_IP_LABEL(LOGIN_IP)       <span class=&quot;k&quot;>AS</span> CLOUD_LABEL
    ,      IP_TO_NUM(FN_GET_REAL_IP(LOGIN_IP))   <span class=&quot;k&quot;>AS</span> IP_NUM
    <span class=&quot;k&quot;>FROM</span>   (<span class=&quot;k&quot;>SELECT DISTINCT</span> LOGIN_IP <span class=&quot;k&quot;>FROM</span> H)
)
<span class=&quot;k&quot;>SELECT</span> <span class=&quot;k&quot;>CASE</span>
           <span class=&quot;k&quot;>WHEN</span> I.CLOUD_LABEL <span class=&quot;k&quot;>IS NOT NULL</span> <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'차단대역('</span> || I.CLOUD_LABEL || <span class=&quot;s&quot;>')'</span>
           <span class=&quot;k&quot;>WHEN</span> I.KOREA_YN = <span class=&quot;s&quot;>'Y'</span>          <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'국내'</span>
           <span class=&quot;k&quot;>WHEN</span> I.IP_NUM <span class=&quot;k&quot;>IS NULL</span>          <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'판정불가(형식오류/IPv6)'</span>
           <span class=&quot;k&quot;>ELSE</span> <span class=&quot;s&quot;>'국외/사설·미할당'</span>
       <span class=&quot;k&quot;>END</span>                          <span class=&quot;k&quot;>AS</span> IP_CLASS
,      <span class=&quot;k&quot;>COUNT</span>(*)                     <span class=&quot;k&quot;>AS</span> LOGIN_CNT
,      <span class=&quot;k&quot;>COUNT</span>(<span class=&quot;k&quot;>DISTINCT</span> H.USER_ID)    <span class=&quot;k&quot;>AS</span> USER_CNT
,      <span class=&quot;k&quot;>COUNT</span>(<span class=&quot;k&quot;>DISTINCT</span> I.REAL_IP)    <span class=&quot;k&quot;>AS</span> IP_CNT
<span class=&quot;k&quot;>FROM</span>   H
<span class=&quot;k&quot;>JOIN</span>   IPS I <span class=&quot;k&quot;>ON</span> I.LOGIN_IP = H.LOGIN_IP
<span class=&quot;k&quot;>GROUP</span>  <span class=&quot;k&quot;>BY</span> <span class=&quot;k&quot;>CASE</span>
           <span class=&quot;k&quot;>WHEN</span> I.CLOUD_LABEL <span class=&quot;k&quot;>IS NOT NULL</span> <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'차단대역('</span> || I.CLOUD_LABEL || <span class=&quot;s&quot;>')'</span>
           <span class=&quot;k&quot;>WHEN</span> I.KOREA_YN = <span class=&quot;s&quot;>'Y'</span>          <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'국내'</span>
           <span class=&quot;k&quot;>WHEN</span> I.IP_NUM <span class=&quot;k&quot;>IS NULL</span>          <span class=&quot;k&quot;>THEN</span> <span class=&quot;s&quot;>'판정불가(형식오류/IPv6)'</span>
           <span class=&quot;k&quot;>ELSE</span> <span class=&quot;s&quot;>'국외/사설·미할당'</span>
       <span class=&quot;k&quot;>END</span>
<span class=&quot;k&quot;>ORDER</span>  <span class=&quot;k&quot;>BY</span> LOGIN_CNT <span class=&quot;k&quot;>DESC</span>;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>기간을 30일 이상으로 늘릴 때도 이 구조면 함수 호출이 고유 IP 수만큼만 늘어 부담이 적습니다.</div>
    </article>
  </section>

  <!-- ============ 5. 수시·장애 대응 ============ -->
  <section class=&quot;group&quot; data-group>
    <div class=&quot;group-head&quot;><h2>5 · 수시 · 장애 대응</h2><span class=&quot;cnt&quot;></span></div>
    <p class=&quot;group-desc&quot;>&quot;로그인이 안 된다&quot;는 문의가 오면 이 순서로. 에러 메시지에 Login Blocked가 있어야 이 시스템이 막은 것입니다.</p>

    <article class=&quot;qcard&quot; data-freq=&quot;adhoc&quot;>
      <div class=&quot;qhead&quot;><h3>단건 즉석 판정 — 왜 막혔나</h3><span class=&quot;badge adhoc&quot;>수시</span></div>
      <p class=&quot;qdesc&quot;>에러 메시지의 계정·IP를 넣고 한 번에 판정. 공용 함수는 전부 읽기 전용이라 안심하고 호출.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>DUAL</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> FN_GET_REAL_IP(<span class=&quot;s&quot;>'에러메시지의IP'</span>)                    <span class=&quot;k&quot;>AS</span> REAL_IP
,      FN_GET_CLOUD_IP_LABEL(<span class=&quot;s&quot;>'에러메시지의IP'</span>)             <span class=&quot;k&quot;>AS</span> CLOUD      <span class=&quot;c&quot;>-- NULL 아니면 대역 차단</span>
,      IS_KOREA_IP(FN_GET_REAL_IP(<span class=&quot;s&quot;>'에러메시지의IP'</span>))       <span class=&quot;k&quot;>AS</span> KOREA_YN   <span class=&quot;c&quot;>-- N 이면 국외</span>
,      FN_CHK_BLOCK_TARGET_USER_YN(<span class=&quot;s&quot;>'계정'</span>)                 <span class=&quot;k&quot;>AS</span> TARGET     <span class=&quot;c&quot;>-- Y 면 감시 대상</span>
,      FN_CHK_LOGIN_IP_BLOCK(<span class=&quot;s&quot;>'계정'</span>, <span class=&quot;s&quot;>'에러메시지의IP'</span>, <span class=&quot;s&quot;>'Y'</span>) <span class=&quot;k&quot;>AS</span> RESULT   <span class=&quot;c&quot;>-- N=차단 / T=임시 / Y=허용</span>
,      IS_LOGIN_ALLOWED(<span class=&quot;s&quot;>'계정'</span>, FN_GET_REAL_IP(<span class=&quot;s&quot;>'에러메시지의IP'</span>)) <span class=&quot;k&quot;>AS</span> GEO_ALLOW <span class=&quot;c&quot;>-- 국외차단 관점</span>
<span class=&quot;k&quot;>FROM</span>   DUAL;</pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>RESULT='N'이면 IP 차단. 'Y'인데도 막히면 ① 1분 60회 초과 → ② 메뉴 함수 URL 규칙 → ③ 국외 IP(GEO_ALLOW='N') 순으로 확인. 국외 IP 차단은 로그인(R90) · 메뉴(STEP 7) · <b>SMS 인증(FN_GET_TB_CM_SMS_VFC_CODE C10~C21)</b> 세 곳 공통 — 인증번호 화면에서 <b>'05|허용되지 않은 국가(IP)'</b> 메시지가 떴다면 이 판정입니다. 메뉴·SMS 쪽은 p_log_yn='N'(판정만)이라 <b>BLOCK 이력이 남지 않으니</b> 이력이 없다고 차단이 없었던 게 아닙니다.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;adhoc&quot;>
      <div class=&quot;qhead&quot;><h3>현재 감시 대상 전체 명단</h3><span class=&quot;badge adhoc&quot;>수시</span></div>
      <p class=&quot;qdesc&quot;>본사·매장 코드 소속 + 개별 지정 계정의 합집합이 전체 감시 대상입니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_HQ_EMPLOYEE / TB_MS_EMPLOYEE</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> A.USER_ID, <span class=&quot;s&quot;>'HQ:'</span> || A.HQ_OFFICE_CD <span class=&quot;k&quot;>AS</span> SRC <span class=&quot;k&quot;>FROM</span> TB_HQ_EMPLOYEE A <span class=&quot;k&quot;>WHERE</span> A.HQ_OFFICE_CD <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'H0268'</span>,<span class=&quot;s&quot;>'DS001'</span>)
<span class=&quot;k&quot;>UNION ALL</span>
<span class=&quot;k&quot;>SELECT</span> A.USER_ID, <span class=&quot;s&quot;>'MS:'</span> || A.STORE_CD     <span class=&quot;k&quot;>AS</span> SRC <span class=&quot;k&quot;>FROM</span> TB_MS_EMPLOYEE A <span class=&quot;k&quot;>WHERE</span> A.STORE_CD     <span class=&quot;k&quot;>IN</span> (<span class=&quot;s&quot;>'DS00001'</span>,<span class=&quot;s&quot;>'DS00002'</span>);
<span class=&quot;c&quot;>-- 여기에 C_TARGET_USERS 4개(h0268, momse09686, kjsun1117, kjsun11177)를 더한 것이 전체</span></pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>큰 본사·매장 코드를 추가하기 전에 명단 크기 확인 — 감시 대상은 메뉴 클릭마다 이력 INSERT + 60회 제한 + 화면 딜레이를 받습니다.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;adhoc&quot;>
      <div class=&quot;qhead&quot;><h3>배포 후 INVALID 객체 확인</h3><span class=&quot;badge adhoc&quot;>수시</span></div>
      <p class=&quot;qdesc&quot;>상수 목록을 고치고 재컴파일한 직후 반드시 실행. 전부 VALID여야 합니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>USER_OBJECTS</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>SELECT</span> OBJECT_NAME, OBJECT_TYPE, STATUS

                        <span class=&quot;s&quot;>'FN_CHK_BLOCK_TARGET_USER_YN'</span>,<span class=&quot;s&quot;>'FN_CHK_LOGIN_IP_BLOCK'</span>,
                        <span class=&quot;s&quot;>'FN_GET_MENU_CHK_YN2'</span>,<span class=&quot;s&quot;>'TR_TB_WB_LOGIN_HIST_R98'</span>,
                        <span class=&quot;s&quot;>'IS_KOREA_IP'</span>,<span class=&quot;s&quot;>'IS_LOGIN_ALLOWED'</span>,<span class=&quot;s&quot;>'FN_CHK_LOGIN_BLOCK'</span>,
                        <span class=&quot;s&quot;>'TR_TB_WB_LOGIN_HIST_R90'</span>,<span class=&quot;s&quot;>'FN_GET_TB_CM_SMS_VFC_CODE'</span>);
<span class=&quot;c&quot;>-- INVALID 면 ALTER ... COMPILE 후 SHOW ERRORS</span></pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>배포 직후 로그인이 전부 실패하면 즉시 이전 버전으로 롤백 컴파일. 트리거 WHEN OTHERS가 -20002로 전체 로그인을 막을 수 있습니다.</div>
    </article>
  </section>

  <!-- ============ 6. 월간 ============ -->
  <section class=&quot;group&quot; data-group>
    <div class=&quot;group-head&quot;><h2>6 · 월간</h2><span class=&quot;cnt&quot;></span></div>
    <p class=&quot;group-desc&quot;>이력 테이블 정리와 GeoIP 재적재 후 확인.</p>

    <article class=&quot;qcard&quot; data-freq=&quot;monthly&quot;>
      <div class=&quot;qhead&quot;><h3>메뉴 클릭 이력 정리 (30일 이전)</h3><span class=&quot;badge monthly&quot;>Monthly</span></div>
      <p class=&quot;qdesc&quot;>PROC_FG='C'(메뉴 클릭)만 정리. 1분 카운트는 최근 1분만 쓰므로 삭제해도 판정에 영향 없습니다.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_WB_LOGIN_HIST_CHK</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;k&quot;>DELETE FROM</span> TB_WB_LOGIN_HIST_CHK
<span class=&quot;k&quot;>WHERE</span>  PROC_FG = <span class=&quot;s&quot;>'C'</span>
<span class=&quot;k&quot;>AND</span>    PROC_DT &amp;lt; TO_CHAR(SYSDATE - 30, <span class=&quot;s&quot;>'YYYYMMDD'</span>);
<span class=&quot;k&quot;>COMMIT</span>;
<span class=&quot;c&quot;>-- I/U(로그인 차단 이력)는 보안 감사용 — 별도 보관 정책에 따를 것</span></pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>감시 대상 계정이 늘면 증가 속도도 늘어납니다. 정리 전 건수를 한 번 확인하세요.</div>
    </article>

    <article class=&quot;qcard&quot; data-freq=&quot;monthly&quot;>
      <div class=&quot;qhead&quot;><h3>GeoIP 재적재 후 확인 — 시노님·건수·통계</h3><span class=&quot;badge monthly&quot;>Monthly</span></div>
      <p class=&quot;qdesc&quot;>월간 재적재 후: 건수 검증 → 통계수집 → 시노님 스위치 순서를 지켰는지 확인.</p>
      <div class=&quot;term&quot;>
        <div class=&quot;term-bar&quot;><span class=&quot;tgt&quot;>TB_CM_GEOIP_RANGE</span><button class=&quot;copy&quot; type=&quot;button&quot;>복사</button></div>
<pre><span class=&quot;c&quot;>-- 현재 시노님이 가리키는 테이블</span>
<span class=&quot;k&quot;>SELECT</span> table_name <span class=&quot;k&quot;>FROM</span> user_synonyms <span class=&quot;k&quot;>WHERE</span> synonym_name = <span class=&quot;s&quot;>'TB_CM_GEOIP_RANGE'</span>;

<span class=&quot;c&quot;>-- 건수 (보통 30~50만 행)</span>
<span class=&quot;k&quot;>SELECT COUNT</span>(*) <span class=&quot;k&quot;>FROM</span> TB_CM_GEOIP_RANGE;

<span class=&quot;c&quot;>-- 인덱스 상태 (DIRECT=TRUE 적재 후 UNUSABLE 확인)</span>
<span class=&quot;k&quot;>SELECT</span> index_name, status <span class=&quot;k&quot;>FROM</span> user_indexes <span class=&quot;k&quot;>WHERE</span> table_name <span class=&quot;k&quot;>LIKE</span> <span class=&quot;s&quot;>'TB_CM_GEOIP_RANGE_%'</span>;

<span class=&quot;c&quot;>-- 판정 속도 샘플 (즉시 응답이어야 정상 — 느리면 통계수집 누락 의심)</span>
<span class=&quot;k&quot;>SELECT</span> IS_KOREA_IP(<span class=&quot;s&quot;>'223.62.180.1'</span>) <span class=&quot;k&quot;>FROM</span> DUAL;  <span class=&quot;c&quot;>-- 'Y'</span>
<span class=&quot;k&quot;>SELECT</span> IS_KOREA_IP(<span class=&quot;s&quot;>'8.8.8.8'</span>)      <span class=&quot;k&quot;>FROM</span> DUAL;  <span class=&quot;c&quot;>-- 'N'</span></pre>
      </div>
      <div class=&quot;qfoot&quot;><span class=&quot;arr&quot;>→</span>조회가 수 초 걸리면 DBMS_STATS.GATHER_TABLE_STATS 누락. 통계수집 후 재확인.</div>
    </article>
  </section>

  <!-- ============ 주의 ============ -->
  <div class=&quot;caution&quot;>
    <h2>점검 시 하지 말 것</h2>
    <ul>
      <li><b>FN_CHK_LOGIN_BLOCK을 SELECT 점검에 쓰지 않는다</b> — 차단 대상 판정 시 AUTONOMOUS로 이력을 INSERT하는 함수라, 점검하는 것만으로 TB_WB_LOGIN_HIST_BLOCK에 행이 쌓입니다. 점검은 읽기 전용 함수(IS_KOREA_IP, FN_GET_CLOUD_IP_LABEL, FN_CHK_LOGIN_IP_BLOCK 등)만 사용.</li>
      <li><b>FN_GET_TB_CM_SMS_VFC_CODE도 SELECT 테스트에 주의</b> — AUTONOMOUS 함수라 C10/C20은 호출 즉시 인증번호가 실제 저장·발송되고, C11/C21은 실패 카운트가 올라갑니다. 점검용 호출은 조회성인 CHK/CDI만.</li>
      <li><b>날짜 필터에서 컬럼을 가공하지 않는다</b> — <code>TO_DATE(LOGIN_DATE,…) >= …</code>는 인덱스를 못 탑니다. <code>LOGIN_DATE >= TO_CHAR(…)</code> 형태로.</li>
      <li><b>&quot;국내 제외&quot; WHERE는 속도와 무관</b> — 국내 판정 자체가 함수 호출이라 필터에 넣어도 호출 횟수는 같습니다. 속도는 고유 IP당 1번 호출 구조(4번 그룹)로 해결.</li>
      <li><b>국내 통신사 대역을 C_CIDR_LIST에 넣지 않는다</b> — 가입자 회선이라 정상 매장이 통째로 차단됩니다. 특정 계정만 문제면 C_TEMP_LIST에 쌍으로.</li>
      <li><b>기간 필터 없이 전체 이력에 함수 쿼리를 돌리지 않는다</b> — 긴 기간은 요약 집계 쿼리로.</li>
    </ul>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var chips  = document.querySelectorAll('.chip');
  var search = document.querySelector('.search');
  var cards  = document.querySelectorAll('.qcard');
  var groups = document.querySelectorAll('[data-group]');
  var freq   = 'all';

  function apply(){
    var q = (search.value || '').trim().toLowerCase();
    cards.forEach(function(c){
      var okFreq = (freq === 'all') || (c.dataset.freq === freq);
      var okText = !q || c.textContent.toLowerCase().indexOf(q) !== -1;
      c.classList.toggle('hidden', !(okFreq &amp;&amp; okText));
    });
    groups.forEach(function(g){
      var vis = g.querySelectorAll('.qcard:not(.hidden)').length;
      g.style.display = vis ? '' : 'none';
      var cnt = g.querySelector('.cnt');
      if (cnt) cnt.textContent = vis + '건';
    });
  }

  chips.forEach(function(ch){
    ch.addEventListener('click', function(){
      chips.forEach(function(x){ x.classList.remove('on'); });
      ch.classList.add('on');
      freq = ch.dataset.f;
      apply();
    });
  });
  search.addEventListener('input', apply);
  apply();

  /* 복사 — clipboard API 실패 시 textarea fallback */
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var pre = btn.closest('.term').querySelector('pre');
      var txt = pre.textContent;
      function done(){
        btn.textContent = '복사됨';
        btn.classList.add('done');
        setTimeout(function(){ btn.textContent = '복사'; btn.classList.remove('done'); }, 1600);
      }
      if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(function(){ fallback(); });
      } else { fallback(); }
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = txt;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch(e){}
        document.body.removeChild(ta);
      }
    });
  });
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var tabs  = document.querySelectorAll('.tab');
  var descs = {"build": "국외 IP 로그인 차단 (전체 사용자 대상) — MaxMind GeoIP 적재부터 판정 함수·트리거까지. 적용 지점: 로그인(R90) · 메뉴(STEP 7) · SMS 인증(C10~C21)", "switch": "국외 IP 차단의 운영 모드 — FN_CHK_LOGIN_BLOCK 스위치(C_BLOCK_MODE · C_CHK_TARGET) 조합별 동작. 스위치 하나로 로그인·메뉴·SMS 인증 세 곳 일괄 제어", "ops": "특정 사용자·클라우드 IP 차단 — 감시 대상 계정과 차단 목록(C_HARD_LIST · C_TEMP_LIST · C_CIDR_LIST) 관리, 트리거 R98", "runbook": "두 시스템 공통 점검 — 일일·주간·월간 쿼리, 국외 IP 관찰 확인, LOGIN_IP 국내/국외/차단대역 분류"};
  function activate(key, pushHash){
    tabs.forEach(function(t){
      var on = t.dataset.tab === key;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.pane').forEach(function(p){
      p.classList.toggle('on', p.id === 'pane-' + key);
    });
    var d = document.getElementById('strip-desc');
    if (d) d.textContent = descs[key] || '';
    if (pushHash) { try { history.replaceState(null, '', '#' + key); } catch(e){} }
  }
  tabs.forEach(function(t){
    t.addEventListener('click', function(){ activate(t.dataset.tab, true); });
  });
  var initial = (location.hash || '').replace('#','');
  var valid = Array.prototype.some.call(tabs, function(t){ return t.dataset.tab === initial; });
  activate(valid ? initial : tabs[0].dataset.tab, false);
});
</script>
