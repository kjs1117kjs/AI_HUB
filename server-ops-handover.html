<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Operations Handover</title>
<style>

:root{
  --paper:#f3f5f7;
  --card:#ffffff;
  --ink:#151d26;
  --ink-2:#4a5764;
  --ink-3:#7c8894;
  --rule:#dde3e9;
  --nav:#1b2531;
  --nav-ink:#a9b6c4;
  --accent:#1f4e79;
  --accent-soft:#e8f0f7;
  --amber:#8a5a00;
  --amber-soft:#fdf3dc;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:1rem}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ── nav ───────────────────────────── */
nav{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 40px}
nav .brand{padding:0 20px 18px;border-bottom:1px solid #2b3949;margin-bottom:14px}
nav .brand b{display:block;color:#fff;font-size:15px;letter-spacing:-.01em}
nav .brand span{font-size:11.5px;color:#6f7f90}
nav a{display:block;padding:6px 20px;color:var(--nav-ink);text-decoration:none;font-size:13px;border-left:3px solid transparent}
nav a:hover{color:#fff;background:#232f3d}
nav a.on{color:#fff;border-left-color:#5b91c9;background:#232f3d}
nav .grp{padding:16px 20px 5px;font-size:11px;color:#5d6b7a;letter-spacing:.06em}

/* ── main ──────────────────────────── */
main{padding:34px 40px 90px;max-width:1180px}
header.top{margin-bottom:26px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--ink-3);font-size:13px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 8px;position:sticky;top:0;background:var(--paper);padding:10px 0;z-index:5;border-bottom:1px solid var(--rule)}
#q{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--rule);border-radius:5px;font-family:var(--sans);font-size:13px;background:#fff}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.tool{padding:9px 14px;border:1px solid var(--rule);background:#fff;border-radius:5px;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
button.tool:hover{border-color:var(--accent);color:var(--accent)}
button.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

section{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:22px 24px;margin:20px 0}
section>h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
section>.note{color:var(--ink-3);font-size:12.5px;margin:0 0 16px}
h3{font-size:14px;margin:22px 0 8px;color:var(--accent);font-weight:700}
h3:first-of-type{margin-top:8px}

table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13px}
th{background:#eef2f6;text-align:left;font-weight:600;padding:8px 10px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;font-size:12.5px}
td{padding:8px 10px;border:1px solid var(--rule);vertical-align:top}
tbody tr:nth-child(even) td{background:#fafbfc}
td.c{text-align:center;white-space:nowrap}
.scroll{overflow-x:auto}

code,.m{font-family:var(--mono);font-size:12.5px;background:#eef2f6;padding:1px 5px;border-radius:3px;color:#233242;white-space:nowrap}
pre{font-family:var(--mono);font-size:12.5px;background:#f7f9fb;border:1px solid var(--rule);border-left:3px solid var(--accent);padding:12px 14px;border-radius:5px;overflow-x:auto;line-height:1.55;margin:8px 0}

.pw{font-family:var(--mono);font-size:12.5px;background:var(--amber-soft);color:#5c3d00;padding:1px 6px;border-radius:3px;cursor:pointer;border:1px solid #f0e0b8;white-space:nowrap}
.pw:hover{background:#f8e9c4}
body.masked .pw{color:transparent;text-shadow:0 0 6px rgba(92,61,0,.65)}
.pw.copied{background:#dff3e2;border-color:#b6e0bf;color:#1c5c2c;text-shadow:none}

.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid;white-space:nowrap}
.t-real{color:#8a2b2b;border-color:#e8c4c4;background:#fbeded}
.t-dev{color:#2b5f8a;border-color:#c4d8e8;background:#edf4fb}
.t-warn{color:var(--amber);border-color:#f0e0b8;background:var(--amber-soft)}

.callout{background:var(--amber-soft);border:1px solid #f0e0b8;border-radius:6px;padding:12px 15px;margin:14px 0;font-size:13px;color:#5c3d00}
.callout b{color:#432d00}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
ul{margin:6px 0;padding-left:20px}
li{margin:3px 0}
.hidden{display:none !important}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav{position:static;height:auto}
  main{padding:22px 16px 60px}
}
@media print{
  nav,.tools{display:none}
  body{background:#fff}
  body.masked .pw{color:#5c3d00;text-shadow:none}
  section{break-inside:avoid;border-color:#ccc}
}

/* ── lock screen ───────────────────── */
#gate{position:fixed;inset:0;background:var(--nav);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
#gate .box{width:100%;max-width:340px;text-align:left}
#gate h1{color:#fff;font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
#gate p{color:#7d8b9a;font-size:12.5px;margin:0 0 22px}
#gate .row{display:flex;gap:8px}
#gate input{flex:1;padding:11px 13px;border:1px solid #33445a;border-radius:5px;background:#121a24;color:#fff;font-family:var(--mono);font-size:15px;letter-spacing:.12em}
#gate input:focus{outline:none;border-color:#5b91c9}
#gate button{padding:11px 18px;border:0;border-radius:5px;background:#5b91c9;color:#0d141c;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer}
#gate button:hover{background:#7aabde}
#gate button:disabled{opacity:.5;cursor:default}
#gate .msg{color:#e08f8f;font-size:12.5px;min-height:18px;margin-top:10px}
#gate .msg.busy{color:#7d8b9a}
.layout{display:none}
body.open .layout{display:grid}
body.open #gate{display:none}
</style>
</head>
<body class="masked">

<div id="gate">
  <div class="box">
    <h1>Server Operations Handover</h1>
    <p>비밀번호를 입력하면 문서가 복호화됩니다.</p>
    <div class="row">
      <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••••" autofocus>
      <button id="go">열기</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const B = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const P = JSON.parse(document.getElementById('payload').textContent);
const msg = document.getElementById('msg');
const pw  = document.getElementById('pw');
const go  = document.getElementById('go');

async function unlock() {
  if (!window.crypto || !crypto.subtle) {
    msg.textContent = '이 브라우저에서는 복호화를 지원하지 않습니다. Chrome, Edge, Firefox 최신 버전으로 열어주세요.';
    return;
  }
  go.disabled = true;
  msg.className = 'msg busy';
  msg.textContent = '복호화 중…';
  await new Promise(r => setTimeout(r, 30));
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: B(P.s), iterations: P.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: B(P.i) }, key, B(P.d));
    document.querySelector('.layout').innerHTML = new TextDecoder().decode(plain);
    document.body.classList.add('open');
    document.getElementById('payload').remove();
    init();
  } catch (e) {
    msg.className = 'msg';
    msg.textContent = '비밀번호가 맞지 않습니다.';
    pw.value = '';
    pw.focus();
  } finally {
    go.disabled = false;
  }
}

go.addEventListener('click', unlock);
pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function init() {
// 비밀번호 마스킹 토글
const pwBtn = document.getElementById('pwBtn');
pwBtn.addEventListener('click', () => {
  const masked = document.body.classList.toggle('masked');
  pwBtn.setAttribute('aria-pressed', masked);
  pwBtn.textContent = masked ? '비밀번호 가리기' : '비밀번호 보이기';
});

// 값 클릭 시 복사
document.addEventListener('click', e => {
  const el = e.target.closest('.pw, code');
  if (!el) return;
  navigator.clipboard?.writeText(el.textContent.trim()).then(() => {
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 900);
  });
});

// 검색 — 매칭되는 행/섹션만 표시
const q = document.getElementById('q');
const sections = [...document.querySelectorAll('section')];
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  sections.forEach(sec => {
    const rows = [...sec.querySelectorAll('tbody tr')];
    let hit = !t || sec.textContent.toLowerCase().includes(t);
    rows.forEach(r => {
      r.classList.toggle('hidden', !!t && !r.textContent.toLowerCase().includes(t));
    });
    if (t && rows.length) {
      const anyRow = rows.some(r => !r.classList.contains('hidden'));
      const inProse = [...sec.children].some(c =>
        c.tagName !== 'DIV' || !c.querySelector('table')
          ? c.textContent.toLowerCase().includes(t) && !c.querySelector('tbody')
          : false);
      hit = anyRow || inProse;
    }
    sec.classList.toggle('hidden', !hit);
  });
});

// 현재 위치 표시
const links = [...document.querySelectorAll('nav a')];
const obs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id));
    }
  });
}, { rootMargin: '-10% 0px -80% 0px' });
sections.forEach(s => obs.observe(s));
}
</script>
