<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크 조회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#16181d; --ink-2:#3c4048; --ink-3:#6b7078; --ink-4:#9ba0a8;
  --line:#e4e6ea; --accent:#2456e6; --accent-soft:rgba(36,86,230,.08);
  --danger:#e0453c; --ok:#0d9a5b; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard",sans-serif;background:var(--bg);color:var(--ink-2);font-size:15px;line-height:1.6;font-weight:500;word-break:keep-all;overflow-wrap:break-word;font-feature-settings:"tnum";min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px 80px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.head h1{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.head h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.label{font-size:12px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:block}
input[type=text],input[type=password]{width:100%;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;transition:border-color .15s ease}
input:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:var(--ink-4);font-weight:500}
.btn{font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none;border-radius:10px;padding:11px 20px;transition:all .15s ease}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#2b2f37}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink-3);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink-4);color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;font-size:18px;font-weight:700;letter-spacing:.02em;text-align:center}
.result{margin-top:20px;display:none}
.result.show{display:block;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ticket{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ticket-top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px dashed var(--line)}
.ticket-num{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 10px;white-space:nowrap}
.ticket-name{font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ticket-bottom{padding:14px 18px;background:#fafbfc;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ticket-hint{font-size:12px;color:var(--ink-4);font-weight:600}
.lock-ico{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.msg{margin-top:16px;font-size:13.5px;font-weight:600;padding:12px 16px;border-radius:10px;display:none}
.msg.show{display:block;animation:pop .2s ease}
.msg.err{background:rgba(224,69,60,.08);color:var(--danger)}
.msg.ok{background:rgba(13,154,91,.08);color:var(--ok)}
.overlay{position:fixed;inset:0;background:rgba(22,24,29,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;animation:pop .2s ease}
.modal h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px}
.modal p{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.modal .modal-btns{display:flex;gap:8px;margin-top:16px}
.modal .modal-btns .btn{flex:1}
.modal .pw-err{font-size:12.5px;color:var(--danger);font-weight:600;margin-top:8px;display:none}
.modal .pw-err.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><span class="dot"></span>링크 조회</h1>
  </div>

  <div class="card">
    <label class="label" for="qNum">링크 번호</label>
    <div class="search-row">
      <input type="text" id="qNum" placeholder="번호 입력" inputmode="numeric" autocomplete="off">
      <button class="btn btn-primary" id="btnSearch">조회</button>
    </div>

    <div class="result" id="result">
      <div class="ticket">
        <div class="ticket-top">
          <span class="ticket-num" id="rNum"></span>
          <span class="ticket-name" id="rName"></span>
        </div>
        <div class="ticket-bottom">
          <span class="ticket-hint">
            <svg class="lock-ico" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="2" stroke="#9ba0a8" stroke-width="1.5"/><path d="M5 7V5a3 3 0 016 0v2" stroke="#9ba0a8" stroke-width="1.5"/></svg>
            비밀번호 확인 후 이동합니다
          </span>
          <button class="btn btn-accent btn-sm" id="btnOpen">열기</button>
        </div>
      </div>
    </div>

    <div class="msg" id="searchMsg"></div>
  </div>
</div>

<!-- 비밀번호 모달 -->
<div class="overlay" id="pwOverlay">
  <div class="modal">
    <h3>비밀번호 확인</h3>
    <p>이 링크로 이동하려면 비밀번호를 입력하세요.</p>
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off">
    <div class="pw-err" id="pwErr">비밀번호가 일치하지 않습니다.</div>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="pwCancel">취소</button>
      <button class="btn btn-accent" id="pwConfirm">이동</button>
    </div>
  </div>
</div>

<script>
/* links.json 형식:
   { "entries": [ { "num":"1", "name":"이름", "salt":"b64", "iv":"b64", "data":"b64(암호화된 URL)" } ] }
   URL은 AES-GCM으로 암호화되어 있으며, 키는 PBKDF2(비밀번호, salt)로 유도.
   비밀번호가 맞아야만 복호화 성공 → URL 획득. 평문 비밀번호/URL은 저장소에 없음. */
let entries = [];
let currentHit = null;
let busy = false;
const $ = id => document.getElementById(id);

function showMsg(id, type, text){
  const el = $(id);
  el.className = 'msg show ' + type;
  el.textContent = text;
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className='msg'; }, 3500);
}

/* ---------- 데이터 로드 ---------- */
async function load(){
  try{
    const res = await fetch('links.json', {cache:'no-store'});
    if(!res.ok) throw new Error();
    const data = await res.json();
    entries = Array.isArray(data.entries) ? data.entries : [];
  }catch(e){
    showMsg('searchMsg','err','링크 데이터(links.json)를 불러오지 못했습니다. 관리자에게 문의하세요.');
    return;
  }
  /* 공유 링크로 진입한 경우: ?n=번호 → 자동 조회 + 비밀번호 창 바로 열기 */
  const n = new URLSearchParams(location.search).get('n');
  if(n){
    $('qNum').value = n.trim();
    doSearch();
    if(currentHit) $('btnOpen').click();
  }
}

/* ---------- 조회 ---------- */
$('btnSearch').onclick = doSearch;
$('qNum').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

function doSearch(){
  const q = $('qNum').value.trim();
  $('result').classList.remove('show');
  currentHit = null;
  if(!q){ showMsg('searchMsg','err','링크 번호를 입력하세요.'); return; }
  const hit = entries.find(e => String(e.num) === q);
  if(!hit){ showMsg('searchMsg','err','번호 ' + q + '에 등록된 링크가 없습니다.'); return; }
  currentHit = hit;
  $('rNum').textContent = 'No. ' + hit.num;
  $('rName').textContent = hit.name || '(이름 없음)';
  $('result').classList.add('show');
}

/* ---------- 복호화 ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
}

async function tryDecrypt(hit, pw){
  const key = await deriveKey(pw, b64d(hit.salt));
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(hit.iv)}, key, b64d(hit.data));
  return new TextDecoder().decode(plain);   // 실패하면 예외 발생 (= 비밀번호 불일치)
}

/* ---------- 비밀번호 모달 ---------- */
$('btnOpen').onclick = () => {
  if(!currentHit) return;
  $('pwInput').value = '';
  $('pwErr').classList.remove('show');
  $('pwOverlay').classList.add('show');
  setTimeout(()=>$('pwInput').focus(), 50);
};
$('pwCancel').onclick = () => $('pwOverlay').classList.remove('show');
$('pwOverlay').addEventListener('click', e => { if(e.target === $('pwOverlay')) $('pwOverlay').classList.remove('show'); });
$('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') confirmPw(); });
$('pwConfirm').onclick = confirmPw;

async function confirmPw(){
  if(!currentHit || busy) return;
  busy = true;
  $('pwConfirm').disabled = true;
  $('pwConfirm').textContent = '확인 중…';
  try{
    const url = await tryDecrypt(currentHit, $('pwInput').value);
    $('pwOverlay').classList.remove('show');
    window.open(url, '_blank');
  }catch(e){
    $('pwErr').classList.add('show');
    $('pwInput').value = '';
    $('pwInput').focus();
  }finally{
    busy = false;
    $('pwConfirm').disabled = false;
    $('pwConfirm').textContent = '이동';
  }
}

load();
</script>
</body>
</html>
