<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 블록 조립기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0e1119; --panel:#151925; --panel-2:#1c2130; --line:#2a3040; --line-2:#333a4d;
    --text:#e9ebf2; --muted:#98a0b5; --faint:#69718a;
    --acc:#7c8cff; --acc-2:#59e0c5; --acc-dim:rgba(124,140,255,.14); --acc-line:rgba(124,140,255,.42);
    --green:#5fd39a; --amber:#f0b45a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 60% at 50% -10%, rgba(124,140,255,.10), transparent 55%), var(--bg);
       color:var(--text);font-family:'Pretendard',system-ui,sans-serif;overflow:hidden;}
  .app{height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto;
       border-left:1px solid var(--line);border-right:1px solid var(--line);}

  header.top{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);
             background:linear-gradient(var(--panel),transparent);flex:none;}
  .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#0e1119;
        background:linear-gradient(135deg,var(--acc),var(--acc-2));font-size:15px;}
  .top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .top .cnt{font-size:12px;color:var(--faint);}
  .top .sp{margin-left:auto;}
  .tbtn{font-size:12.5px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
        border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;transition:.14s;}
  .tbtn:hover{border-color:var(--acc-line);color:var(--acc);}

  .toolbar{display:flex;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--panel);
          border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:.15s;}
  .search:focus-within{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-dim);}
  .search svg{width:15px;height:15px;color:var(--faint);flex:none;}
  .search input{flex:1;border:none;outline:none;background:none;color:var(--text);font-family:inherit;font-size:14px;}
  .search input::placeholder{color:var(--faint);}
  .pills{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
        border-radius:20px;padding:6px 12px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap;}
  .pill:hover{border-color:var(--acc-line);}
  .pill.on{background:var(--acc-dim);color:var(--acc);border-color:var(--acc-line);}
  .pill .n{opacity:.6;margin-left:3px;font-size:11px;}

  .main{flex:1;display:flex;min-height:0;}
  .catalog{flex:1;overflow-y:auto;padding:16px 20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .catalog::-webkit-scrollbar{width:9px;}.catalog::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid var(--bg);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;}
  .bcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;
         transition:.14s;position:relative;overflow:hidden;}
  .bcard:hover{border-color:var(--acc-line);background:var(--panel-2);transform:translateY(-1px);}
  .bcard.sel{border-color:var(--acc);background:var(--acc-dim);}
  .bcard .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;}
  .bcard .bn{font-size:13.5px;font-weight:600;vertical-align:middle;}
  .bcard .bd{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;min-height:2.6em;}
  .bcard .add{position:absolute;top:11px;right:11px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
              font-size:13px;color:var(--faint);border:1px solid var(--line);background:var(--bg);transition:.14s;}
  .bcard:hover .add{color:var(--acc);border-color:var(--acc-line);}
  .bcard.sel .add{background:var(--acc);color:#0e1119;border-color:var(--acc);}
  .catcount{grid-column:1/-1;font-size:12px;color:var(--faint);margin:6px 0 -2px;}
  .noresult{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:14px;}

  .builder{width:400px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);}
  .bhead{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none;}
  .bhead b{font-size:13.5px;}
  .bhead .num{font-size:11px;color:#0e1119;background:var(--acc);border-radius:20px;padding:1px 8px;font-weight:700;}
  .bhead .clr{margin-left:auto;font-size:11.5px;color:var(--faint);background:none;border:none;cursor:pointer;font-family:inherit;}
  .bhead .clr:hover{color:var(--amber);}
  .tray{max-height:190px;overflow-y:auto;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;
        scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .tray.empty{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;text-align:center;min-height:90px;padding:16px;}
  .titem{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
         border-radius:9px;padding:7px 9px;margin-bottom:7px;}
  .titem .tn{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .titem .dotc{width:7px;height:7px;border-radius:50%;flex:none;}
  .titem button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);
                color:var(--muted);cursor:pointer;font-size:12px;display:grid;place-items:center;transition:.12s;flex:none;}
  .titem button:hover{color:var(--acc);border-color:var(--acc-line);}
  .titem button.x:hover{color:var(--amber);}
  .titem button:disabled{opacity:.3;cursor:default;}

  .preview-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
  .ptabs{display:flex;align-items:center;border-bottom:1px solid var(--line);flex:none;background:var(--panel-2);}
  .ptab{padding:9px 14px;font-size:12.5px;color:var(--muted);cursor:pointer;border:none;background:none;
        font-family:inherit;border-bottom:2px solid transparent;}
  .ptab.on{color:var(--text);border-bottom-color:var(--acc);}
  .pacts{margin-left:auto;display:flex;gap:6px;padding-right:10px;}
  .pacts button{font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;
                padding:3px 10px;cursor:pointer;font-family:inherit;transition:.13s;}
  .pacts button:hover{color:var(--acc);border-color:var(--acc-line);}
  .pacts button.ok{color:var(--green);border-color:var(--green);}
  #editmode.on{color:#0e1119;background:var(--acc);border-color:var(--acc);font-weight:600;}
  .edithint{flex:none;padding:8px 12px;font-size:11.5px;color:var(--acc-2);background:var(--acc-dim);
            border-bottom:1px solid var(--line);line-height:1.5;}
  .ppane{flex:1;min-height:0;overflow:auto;}
  .ppane.hide{display:none;}
  iframe#prev{width:100%;height:100%;border:none;background:#fff;display:block;}
  pre#codebox{margin:0;padding:14px;white-space:pre;}
  pre#codebox code{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;color:#c6cde0;}
  .emptyprev{height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;text-align:center;padding:20px;}

  @media(max-width:880px){
    .builder{position:fixed;right:0;top:0;bottom:0;width:min(88vw,400px);z-index:20;box-shadow:-10px 0 40px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .25s;}
    .builder.show{transform:none;}
    .fab{display:flex!important;}
  }
  .fab{display:none;position:fixed;right:16px;bottom:16px;z-index:15;align-items:center;gap:7px;
       background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#0e1119;font-weight:700;font-family:inherit;
       border:none;border-radius:24px;padding:12px 18px;cursor:pointer;box-shadow:0 8px 24px rgba(124,140,255,.4);font-size:14px;}

  .themebar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;}
  .themebar .tl{font-size:11.5px;color:var(--faint);margin-right:2px;}
  .swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.13s;padding:0;}
  .swatch:hover{transform:scale(1.12);}
  .swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc-line);}
  .titem.hasopt{flex-wrap:wrap;}
  .gear{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);
        color:var(--muted);cursor:pointer;font-size:12px;display:grid;place-items:center;flex:none;transition:.12s;}
  .gear:hover,.gear.on{color:var(--acc);border-color:var(--acc-line);}
  .optform{flex-basis:100%;margin-top:8px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;}
  .optform .of{margin-bottom:9px;}
  .optform .of:last-child{margin-bottom:0;}
  .optform label{display:block;font-size:11px;color:var(--faint);margin-bottom:4px;}
  .optform input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;
        padding:6px 9px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;}
  .optform input[type=text]:focus{border-color:var(--acc-line);}
  .optform .checks{display:flex;flex-wrap:wrap;gap:4px 12px;}
  .optform .checks label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text);margin:0;cursor:pointer;}

  .tplpanel{padding:11px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--panel-2);}
  .tprow{display:flex;gap:7px;}
  .tprow.gap{margin-top:9px;}
  .tprow input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;
        color:var(--text);font-family:inherit;font-size:13px;outline:none;}
  .tprow input:focus{border-color:var(--acc-line);}
  .tpbtn{background:var(--acc);color:#0e1119;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;
        font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.13s;}
  .tpbtn:hover{filter:brightness(1.08);}
  .tpbtn.ghost{background:var(--panel);color:var(--muted);border:1px solid var(--line);flex:1;}
  .tpbtn.ghost:hover{color:var(--acc);border-color:var(--acc-line);}
  .tpsaved{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .tpitem{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;}
  .tpitem .tpn{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .tpitem .tpn:hover{color:var(--acc);}
  .tpitem button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);
        color:var(--muted);cursor:pointer;font-size:11px;display:grid;place-items:center;transition:.12s;}
  .tpitem .tpload:hover{color:var(--acc);border-color:var(--acc-line);}
  .tpitem .tpdel:hover{color:var(--amber);border-color:var(--amber);}
  .tpempty{font-size:12px;color:var(--faint);padding:4px 2px;}
  .tpimport{margin-top:8px;}
  .tpimport textarea{width:100%;height:52px;resize:none;background:var(--panel);border:1px solid var(--line);
        border-radius:8px;padding:7px 10px;color:var(--text);font-family:ui-monospace,monospace;font-size:11px;outline:none;margin-bottom:6px;}
  .tpmsg{font-size:11.5px;color:var(--acc-2);margin-top:8px;min-height:14px;}
  .tpmsg.warn{color:var(--amber);}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">＋</div>
    <div><h1>HTML 블록 조립기</h1><div class="cnt" id="totalcount"></div></div>
    <span class="sp"></span>
    <button class="tbtn" id="reset">↺ 처음으로</button>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" type="text" placeholder="블록 검색 (예: 회원, 표, 폼, 알림…)">
    </div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="main">
    <div class="catalog"><div class="grid" id="grid"></div></div>

    <aside class="builder" id="builder">
      <div class="bhead">
        <b>내 페이지</b><span class="num" id="selnum">0</span>
        <button class="clr" id="tpltoggle" style="margin-left:auto">💾 템플릿</button>
        <button class="clr" id="clear">전체 비우기</button>
      </div>
      <div class="tplpanel" id="tplpanel" hidden>
        <div class="tprow"><input id="tplname" type="text" placeholder="템플릿 이름 (예: 관리자 대시보드)"><button class="tpbtn" id="tplsave">저장</button></div>
        <div class="tpsaved" id="tplsaved"></div>
        <div class="tprow gap"><button class="tpbtn ghost" id="tplexport">📋 구성 코드 복사</button><button class="tpbtn ghost" id="tplimptoggle">📥 코드로 불러오기</button></div>
        <div class="tpimport" id="tplimport" hidden><textarea id="tplcode" placeholder="복사한 구성 코드를 여기에 붙여넣으세요"></textarea><button class="tpbtn" id="tplimpgo">불러오기</button></div>
        <div class="tpmsg" id="tplmsg"></div>
      </div>
      <div class="tray empty" id="tray">왼쪽에서 블록을 눌러 담아보세요.<br>순서는 화살표로 바꿀 수 있어요.</div>
      <div class="themebar" id="themebar"><span class="tl">색상 테마</span></div>
      <div class="preview-wrap">
        <div class="ptabs">
          <button class="ptab on" data-p="prev">미리보기</button>
          <button class="ptab" data-p="code">코드</button>
          <div class="pacts">
            <button id="editmode">✏️ 직접 편집</button>
            <button id="copy">복사</button>
            <button id="download">다운로드</button>
          </div>
        </div>
        <div class="edithint" id="edithint" hidden>미리보기에서 점선으로 표시된 글자를 클릭해 바로 수정하세요. 블록·순서·색상·옵션을 바꾸면 편집 내용은 초기화됩니다.</div>
        <div class="ppane" id="pane-prev"><div class="emptyprev" id="emptyprev">담은 블록이 여기 조립되어 보여요.</div><iframe id="prev" style="display:none"></iframe></div>
        <div class="ppane hide" id="pane-code"><pre id="codebox"><code></code></pre></div>
      </div>
    </aside>
  </div>
</div>
<button class="fab" id="fab">＋ 내 페이지 <span id="fabn">0</span></button>

<script>
/* ══════════════════════════════════════════════════════════════
   블록 카탈로그 — AI 없음. {id,cat,name,desc,tags,html, js?}
   ══════════════════════════════════════════════════════════════ */
const CATS = {
  input:   {label:"입력·조회", color:"#7c8cff"},
  data:    {label:"데이터 표시", color:"#59e0c5"},
  form:    {label:"폼 · 양식", color:"#f0b45a"},
  layout:  {label:"레이아웃", color:"#e07ce0"},
  feedback:{label:"상태·피드백", color:"#ff8a8a"},
  admin:   {label:"관리자(admin)", color:"#ff9d5c"},
};

const B = [];
const add = (cat,id,name,desc,tags,html,js,opts) => B.push({cat,id,name,desc,tags,html,js,opts});

/* ─────────── 입력·조회 ─────────── */
add("input","member","회원 조회","번호 입력 → 회원 정보 카드 (동작)",["회원","member","조회","고객","번호"],
`  <section class="sec"><h2 class="h2">회원 조회</h2>
    <div class="row"><input id="q" class="inp" placeholder="회원번호 (예: 10001)" inputmode="numeric"><button id="go" class="btn">조회</button></div>
    <div id="out"></div></section>`,
`var MEMBERS={"10001":{name:"김서연",grade:"VIP",email:"seoyeon@example.com",phone:"010-2345-6789",points:48200},"10002":{name:"이준호",grade:"Gold",email:"junho@example.com",phone:"010-8765-4321",points:12750},"10003":{name:"박민지",grade:"Silver",email:"minji@example.com",phone:"010-5555-1212",points:3100}};function lookup(){var id=document.getElementById("q").value.trim();var o=document.getElementById("out");if(!id){o.innerHTML="";return;}var m=MEMBERS[id];if(!m){o.innerHTML="<div class=\\"nf\\">"+id+" 회원을 찾을 수 없습니다.</div>";return;}var h="<div class=\\"info\\">";h+="<h3>"+m.name+"</h3>";h+="<p><b>회원번호</b> "+id+"</p><p><b>등급</b> "+m.grade+"</p><p><b>이메일</b> "+m.email+"</p><p><b>전화</b> "+m.phone+"</p><p><b>포인트</b> "+m.points.toLocaleString()+" P</p></div>";o.innerHTML=h;}document.getElementById("go").onclick=lookup;document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter")lookup();});`);
add("input","search","통합 검색창","아이콘 + 입력 + 버튼",["검색","search"],
`  <section class="sec"><div class="searchbar"><span class="ico">🔍</span><input class="inp flat" placeholder="검색어를 입력하세요"><button class="btn">검색</button></div></section>`);
add("input","login","로그인 폼","아이디·비밀번호 입력",["로그인","login","auth"],
`  <section class="sec narrow"><h2 class="h2">로그인</h2><label class="lb">아이디</label><input class="inp full" placeholder="user@example.com"><label class="lb">비밀번호</label><input class="inp full" type="password" placeholder="••••••••"><button class="btn full mt">로그인</button></section>`);
add("input","filterbar","필터 바","드롭다운으로 목록 거르기",["필터","filter","정렬"],
`  <section class="sec"><div class="filters"><select class="sel"><option>전체 등급</option><option>VIP</option><option>Gold</option></select><select class="sel"><option>전체 상태</option><option>활성</option><option>휴면</option></select><select class="sel"><option>최신순</option><option>이름순</option></select></div></section>`);
add("input","daterange","날짜 범위","시작·종료일 선택",["날짜","date","기간"],
`  <section class="sec"><label class="lb">조회 기간</label><div class="row"><input class="inp" type="date"><span class="tilde">~</span><input class="inp" type="date"><button class="btn">적용</button></div></section>`);
add("input","tagfilter","태그 필터","칩 형태 카테고리",["태그","tag","카테고리"],
`  <section class="sec"><label class="lb">카테고리</label><div class="chips"><span class="chip on">전체</span><span class="chip">공지</span><span class="chip">이벤트</span><span class="chip">FAQ</span><span class="chip">업데이트</span></div></section>`);
add("input","stepper","수량 선택","− 숫자 + 스텝퍼",["수량","quantity","stepper"],
`  <section class="sec"><label class="lb">수량</label><div class="stepper"><button class="stp">−</button><span class="stpv">1</span><button class="stp">＋</button></div></section>`);
add("input","slider","범위 슬라이더","가격·값 범위",["슬라이더","range","가격"],

`;

/* ══════════════════════════════════════════════════════════════
   조립 + UI 로직
   ══════════════════════════════════════════════════════════════ */
const THEMES = {
  indigo:{name:"인디고", a:"#4f46e5", d:"#4338ca", a2:"#7c6cf0", l:"#eef0ff", l2:"#c7ccff", rgb:"79,70,229"},
  teal:  {name:"틸",     a:"#0d9488", d:"#0b5b53", a2:"#2dd4bf", l:"#e3f4f2", l2:"#9fe0d8", rgb:"13,148,136"},
  violet:{name:"바이올렛",a:"#7c3aed", d:"#6d28d9", a2:"#a78bfa", l:"#f0e9ff", l2:"#d6c4ff", rgb:"124,58,237"},
  rose:  {name:"로즈",   a:"#e11d55", d:"#be123c", a2:"#fb7185", l:"#ffe4ec", l2:"#fbb6ca", rgb:"225,29,85"},
  amber: {name:"앰버",   a:"#d97706", d:"#b45309", a2:"#fbbf24", l:"#fef3c7", l2:"#fcd88a", rgb:"217,119,6"},
  slate: {name:"슬레이트",a:"#334155", d:"#1e293b", a2:"#64748b", l:"#e9edf3", l2:"#c3ccd8", rgb:"51,65,85"},
};
let theme = "indigo";

const optVals = {};                 // id -> {key:value}
function optDefaults(b){ const o={}; (b.opts||[]).forEach(op=>o[op.key]=Array.isArray(op.def)?op.def.slice():op.def); return o; }
function getHTML(b){ return (typeof b.html==="function") ? b.html(optVals[b.id]||optDefaults(b)) : b.html; }
function themedCSS(){
  const t=THEMES[theme];
  return CSS.split('#4f46e5').join(t.a).split('#4338ca').join(t.d).split('#7c6cf0').join(t.a2)
            .split('#7c8cff').join(t.a2).split('#eef0ff').join(t.l).split('#c7ccff').join(t.l2)
            .split('#d6dcff').join(t.l2).split('rgba(79,70,229').join('rgba('+t.rgb);
}

function assemble(list){
  const body = list.map(b=>getHTML(b)).join("\n");
  const js = list.map(b=>b.js).filter(Boolean).join("\n");
  const script = js ? ("<script>\n"+js+"\n<\/script>") : "";
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="UTF-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>조립된 페이지</title>\n'+
    '<style>'+themedCSS()+'</style>\n</head>\n<body>\n<div class="page">\n'+body+'\n</div>\n'+script+'\n</body>\n</html>';
}

const byId = {}; B.forEach(b=>byId[b.id]=b);
let selected = [];       // 담긴 블록 id (순서 유지)
let openOpts = {};       // id -> 옵션 패널 열림 여부
let activeCat = "all";
let query = "";
let editMode = false;    // 직접 편집 모드
let editedHTML = null;   // 수동 편집된 결과 HTML (있으면 우선)

const grid = document.getElementById('grid');
const pills = document.getElementById('pills');
const tray = document.getElementById('tray');

document.getElementById('totalcount').textContent = "블록 "+B.length+"개 · 담아서 한 페이지로 조립하세요";

// 카테고리 pills
function renderPills(){
  const counts = {all:B.length};
  B.forEach(b=>counts[b.cat]=(counts[b.cat]||0)+1);
  let html = '<button class="pill'+(activeCat==="all"?" on":"")+'" data-c="all">전체<span class="n">'+counts.all+'</span></button>';
  for(const k in CATS){
    html += '<button class="pill'+(activeCat===k?" on":"")+'" data-c="'+k+'">'+CATS[k].label+'<span class="n">'+(counts[k]||0)+'</span></button>';
  }
  pills.innerHTML = html;
}
pills.addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;activeCat=b.dataset.c;renderPills();renderCatalog();});

// 카탈로그
function renderCatalog(){
  const q = query.trim().toLowerCase();
  const items = B.filter(b=>{
    if(activeCat!=="all" && b.cat!==activeCat) return false;
    if(!q) return true;
    return (b.name+" "+b.desc+" "+b.tags.join(" ")+" "+CATS[b.cat].label).toLowerCase().includes(q);
  });
  if(items.length===0){ grid.innerHTML='<div class="noresult">검색 결과가 없어요. 다른 키워드로 찾아보세요.</div>'; return; }
  grid.innerHTML = items.map(b=>{
    const on = selected.includes(b.id);
    return '<div class="bcard'+(on?" sel":"")+'" data-id="'+b.id+'">'+
      '<div class="add">'+(on?"✓":"＋")+'</div>'+
      '<div><span class="dot" style="background:'+CATS[b.cat].color+'"></span><span class="bn">'+b.name+'</span></div>'+
      '<div class="bd">'+b.desc+'</div></div>';
  }).join('');
}
grid.addEventListener('click',e=>{const c=e.target.closest('.bcard');if(!c)return;toggle(c.dataset.id);});

function toggle(id){
  resetEdits();
  const i = selected.indexOf(id);
  if(i>=0){ selected.splice(i,1); }
  else{ selected.push(id); if(byId[id].opts && !optVals[id]) optVals[id]=optDefaults(byId[id]); }
  renderCatalog(); renderTray(); renderPreview();
}

// 색상 테마 스와치
function renderThemes(){
  const bar=document.getElementById('themebar');
  bar.innerHTML='<span class="tl">색상 테마</span>'+Object.keys(THEMES).map(k=>
    '<button class="swatch'+(theme===k?" on":"")+'" data-t="'+k+'" title="'+THEMES[k].name+'" style="background:'+THEMES[k].a+'"></button>'
  ).join('');
}
document.getElementById('themebar').addEventListener('click',e=>{
  const s=e.target.closest('.swatch'); if(!s)return; resetEdits(); theme=s.dataset.t; renderThemes(); renderPreview();
});

// 트레이(담긴 블록, 순서 조절)
function renderTray(){
  document.getElementById('selnum').textContent = selected.length;
  document.getElementById('fabn').textContent = selected.length;
  if(selected.length===0){
    tray.className='tray empty';
    tray.innerHTML='왼쪽에서 블록을 눌러 담아보세요.<br>순서는 화살표로 바꿀 수 있어요.';
    return;
  }
  tray.className='tray';
  tray.innerHTML = selected.map((id,idx)=>{
    const b=byId[id];
    const has=!!(b.opts&&b.opts.length);
    const opn=has&&openOpts[id];
    let s='<div class="titem'+(has?" hasopt":"")+'"><span class="dotc" style="background:'+CATS[b.cat].color+'"></span>'+
      '<span class="tn">'+b.name+'</span>'+
      (has?'<button class="gear'+(opn?" on":"")+'" data-opt="'+id+'" title="옵션">⚙</button>':'')+
      '<button data-up="'+idx+'"'+(idx===0?" disabled":"")+' title="위로">▲</button>'+
      '<button data-dn="'+idx+'"'+(idx===selected.length-1?" disabled":"")+' title="아래로">▼</button>'+
      '<button class="x" data-rm="'+id+'" title="빼기">✕</button>';
    if(opn) s+=renderOptForm(b);
    return s+'</div>';
  }).join('');
}
function renderOptForm(b){
  const v=optVals[b.id]||optDefaults(b);
  const fields=b.opts.map(op=>{
    if(op.type==="checks"){
      const boxes=op.options.map(o=>{
        const on=(v[op.key]||[]).includes(o);
        return '<label><input type="checkbox" data-optid="'+b.id+'" data-optkey="'+op.key+'" data-val="'+o+'"'+(on?" checked":"")+'> '+o+'</label>';
      }).join('');
      return '<div class="of"><label>'+op.label+'</label><div class="checks">'+boxes+'</div></div>';
    }
    const val=(v[op.key]!==undefined?v[op.key]:op.def);
    return '<div class="of"><label>'+op.label+'</label><input type="text" data-optid="'+b.id+'" data-optkey="'+op.key+'" value="'+String(val).replace(/"/g,'&quot;')+'"></div>';
  }).join('');
  return '<div class="optform">'+fields+'</div>';
}
tray.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.opt!==undefined){ openOpts[b.dataset.opt]=!openOpts[b.dataset.opt]; renderTray(); }
  else if(b.dataset.rm!==undefined){ toggle(b.dataset.rm); }
  else if(b.dataset.up!==undefined){resetEdits();const i=+b.dataset.up;[selected[i-1],selected[i]]=[selected[i],selected[i-1]];renderTray();renderPreview();}
  else if(b.dataset.dn!==undefined){resetEdits();const i=+b.dataset.dn;[selected[i+1],selected[i]]=[selected[i],selected[i+1]];renderTray();renderPreview();}
});
tray.addEventListener('input',e=>{
  const el=e.target; const id=el.dataset.optid, key=el.dataset.optkey; if(!id)return;
  if(!optVals[id]) optVals[id]=optDefaults(byId[id]);
  if(el.type==="checkbox"){
    const arr=optVals[id][key]||[]; const val=el.dataset.val;
    if(el.checked){ if(!arr.includes(val)){ // 원래 순서 유지
        const order=byId[id].opts.find(o=>o.key===key).options;
        optVals[id][key]=order.filter(o=>arr.includes(o)||o===val);
      } }
    else optVals[id][key]=arr.filter(x=>x!==val);
  } else {
    optVals[id][key]=el.value;
  }
  resetEdits(); renderPreview();
});

// 미리보기 / 코드 / 직접 편집
function outputHTML(){ return editedHTML!=null ? editedHTML : (selected.length ? assemble(selected.map(id=>byId[id])) : ''); }
function updateCode(){ document.querySelector('#codebox code').textContent = outputHTML(); }
function renderPreview(){
  const empty=document.getElementById('emptyprev');
  const iframe=document.getElementById('prev');
  if(selected.length===0){ empty.style.display='flex'; iframe.style.display='none'; document.querySelector('#codebox code').textContent=''; return; }
  empty.style.display='none'; iframe.style.display='block'; iframe.onload=null; iframe.srcdoc=outputHTML();
  updateCode();
}
function resetEdits(){ editedHTML=null; if(editMode){ editMode=false; syncEditBtn(); } }

// 탭 전환
function switchTab(p){
  document.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  document.getElementById('pane-prev').classList.toggle('hide',p!=='prev');
  document.getElementById('pane-code').classList.toggle('hide',p!=='code');
  if(p==='code') updateCode();
}
document.querySelectorAll('.ptab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.p)));

// 직접 편집 모드 (미리보기에서 글자 클릭 → 수정 → 코드/다운로드 반영)
function syncEditBtn(){ const b=document.getElementById('editmode'); b.classList.toggle('on',editMode); b.textContent=editMode?'✓ 편집 중':'✏️ 직접 편집'; document.getElementById('edithint').hidden=!editMode; }
function injectEditable(html){
  const st='<style id="__edit">[contenteditable]{outline:1px dashed rgba(124,140,255,.6);outline-offset:2px;border-radius:3px;cursor:text;}[contenteditable]:hover{background:rgba(124,140,255,.06);}[contenteditable]:focus{outline:2px solid #4f46e5;background:rgba(124,140,255,.09);}</style>';
  const sc='<script id="__editjs">(function(){var s="h1,h2,h3,h4,h5,p,span,a,b,strong,em,li,td,th,dt,dd,summary,label,button,.sv,.sk,.hlv,.hlk,.eyebrow,.lead,.pt,.plname,.plprice,.brand,.pn,.pp,.pfn,.pfm";document.querySelectorAll(s).forEach(function(el){if(el.childElementCount===0&&el.id!=="q"&&el.id!=="go"){el.setAttribute("contenteditable","true");}});})();<\/script>';
  return html.replace('</body>', st+sc+'\n</body>');
}
function grabEdited(){
  const iframe=document.getElementById('prev'); let doc;
  try{ doc=iframe.contentDocument; }catch(e){ return null; }
  if(!doc||!doc.documentElement) return null;
  const clone=doc.documentElement.cloneNode(true);
  ['#__edit','#__editjs'].forEach(sel=>{const e=clone.querySelector(sel);if(e)e.remove();});
  clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}
function captureEdits(){ const h=grabEdited(); if(h!=null){ editedHTML=h; updateCode(); } }
document.getElementById('editmode').addEventListener('click',()=>{
  if(selected.length===0) return;
  editMode=!editMode; syncEditBtn();
  const iframe=document.getElementById('prev');
  if(editMode){
    switchTab('prev');
    iframe.onload=function(){ iframe.onload=null; try{ iframe.contentDocument.addEventListener('input',captureEdits); }catch(e){} };
    iframe.srcdoc=injectEditable(outputHTML());
  } else { captureEdits(); renderPreview(); }
});

// 액션
document.getElementById('copy').addEventListener('click',function(){
  if(selected.length===0) return; if(editMode) captureEdits();
  const btn=this;
  navigator.clipboard.writeText(outputHTML()).then(()=>{btn.textContent='복사됨 ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('ok');},1400);});
});
document.getElementById('download').addEventListener('click',function(){
  if(selected.length===0) return; if(editMode) captureEdits();
  const blob=new Blob([outputHTML()],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='page.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
document.getElementById('clear').addEventListener('click',()=>{resetEdits();selected=[];openOpts={};renderCatalog();renderTray();renderPreview();});
document.getElementById('reset').addEventListener('click',()=>{resetEdits();selected=[];openOpts={};theme='indigo';query='';activeCat='all';document.getElementById('q').value='';renderPills();renderThemes();renderCatalog();renderTray();renderPreview();});

// 검색
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;renderCatalog();});

// 모바일: 빌더 열고닫기
const builder=document.getElementById('builder');
document.getElementById('fab').addEventListener('click',()=>builder.classList.toggle('show'));

// ── 저장 / 불러오기 ──────────────────────────────
const TPL_KEY='blockcomposer_templates_v1';
function tplMsg(t,warn){const m=document.getElementById('tplmsg');m.textContent=t||'';m.className='tpmsg'+(warn?' warn':'');}
function loadStore(){ try{ return JSON.parse(localStorage.getItem(TPL_KEY)||'{}'); }catch(e){ return null; } }
function saveStore(o){ try{ localStorage.setItem(TPL_KEY,JSON.stringify(o)); return true; }catch(e){ return false; } }

function currentState(){
  const opts={}; selected.forEach(id=>{ if(optVals[id]) opts[id]=optVals[id]; });
  return {v:1, sel:selected.slice(), theme, opts};
}
function applyState(st){
  if(!st||!Array.isArray(st.sel)) return false;
  selected = st.sel.filter(id=>byId[id]);
  theme = THEMES[st.theme] ? st.theme : 'indigo';
  Object.keys(optVals).forEach(k=>delete optVals[k]);
  if(st.opts) for(const id in st.opts){ if(byId[id]) optVals[id]=st.opts[id]; }
  selected.forEach(id=>{ if(byId[id].opts && !optVals[id]) optVals[id]=optDefaults(byId[id]); });
  openOpts={}; editedHTML=null; editMode=false; syncEditBtn();
  renderThemes(); renderCatalog(); renderTray(); renderPreview();
  return true;
}

function renderSaved(){
  const box=document.getElementById('tplsaved');
  const store=loadStore();
  if(store===null){ box.innerHTML='<div class="tpempty">이 환경에선 브라우저 저장이 막혀 있어요. 아래 "구성 코드"로 저장·복원하세요.</div>'; return; }
  const names=Object.keys(store);
  if(names.length===0){ box.innerHTML='<div class="tpempty">저장된 템플릿이 없어요.</div>'; return; }
  box.innerHTML=names.map(n=>'<div class="tpitem"><span class="tpn" data-load="'+encodeURIComponent(n)+'" title="불러오기">'+n.replace(/</g,'&lt;')+'</span>'+
    '<button class="tpload" data-load="'+encodeURIComponent(n)+'" title="불러오기">↥</button>'+
    '<button class="tpdel" data-del="'+encodeURIComponent(n)+'" title="삭제">✕</button></div>').join('');
}

document.getElementById('tpltoggle').addEventListener('click',()=>{
  const p=document.getElementById('tplpanel'); p.hidden=!p.hidden; if(!p.hidden){ renderSaved(); tplMsg(''); }
});
document.getElementById('tplsave').addEventListener('click',()=>{
  const name=document.getElementById('tplname').value.trim();
  if(!name){ tplMsg('이름을 입력하세요.',true); return; }
  if(selected.length===0){ tplMsg('담은 블록이 없어요.',true); return; }
  const store=loadStore();
  if(store===null){ tplMsg('브라우저 저장이 막혀 있어요. "구성 코드 복사"를 이용하세요.',true); return; }
  store[name]=currentState();
  if(saveStore(store)){ document.getElementById('tplname').value=''; renderSaved(); tplMsg('"'+name+'" 저장됨 ✓'); }
  else tplMsg('저장에 실패했어요.',true);
});
document.getElementById('tplsaved').addEventListener('click',e=>{
  const b=e.target.closest('[data-load],[data-del]'); if(!b) return;
  const store=loadStore(); if(store===null) return;
  if(b.dataset.load!==undefined){ const n=decodeURIComponent(b.dataset.load); if(store[n]&&applyState(store[n])) tplMsg('"'+n+'" 불러옴 ✓'); }
  else if(b.dataset.del!==undefined){ const n=decodeURIComponent(b.dataset.del); delete store[n]; saveStore(store); renderSaved(); tplMsg('"'+n+'" 삭제됨'); }
});
document.getElementById('tplexport').addEventListener('click',function(){
  if(selected.length===0){ tplMsg('담은 블록이 없어요.',true); return; }
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(currentState()))));
  navigator.clipboard.writeText(code).then(()=>tplMsg('구성 코드를 복사했어요. 어디든 붙여넣어 보관하세요 ✓'))
    .catch(()=>{ const ta=document.getElementById('tplcode'); document.getElementById('tplimport').hidden=false; ta.value=code; ta.select(); tplMsg('아래 코드를 직접 복사하세요.',true); });
});
document.getElementById('tplimptoggle').addEventListener('click',()=>{
  const im=document.getElementById('tplimport'); im.hidden=!im.hidden; if(!im.hidden) document.getElementById('tplcode').focus();
});
document.getElementById('tplimpgo').addEventListener('click',()=>{
  const raw=document.getElementById('tplcode').value.trim();
  if(!raw){ tplMsg('코드를 붙여넣으세요.',true); return; }
  try{
    const st=JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(applyState(st)){ tplMsg('구성을 불러왔어요 ✓'); document.getElementById('tplcode').value=''; document.getElementById('tplimport').hidden=true; }
    else tplMsg('올바른 구성 코드가 아니에요.',true);
  }catch(e){ tplMsg('코드를 해석하지 못했어요. 다시 확인해주세요.',true); }
});

// 초기 렌더
renderPills(); renderThemes(); renderCatalog(); renderTray(); renderPreview();
</script>
</body>
</html>
