qd5:{ tag:"D-5", kind:"SELECT", scope:"대상 본사", name:"상품 마스터 · 세트 구성 (5P04 · 5P12 · 5P33)",
  desc:"[판별] 프로시저 CHECK_PROD_INFO. 5P04 매출 상세의 PROD_CD 가 매장 TB_MS_PRODUCT 에 없음(반품 제외) · 5P12 구성상품(SIDE_P_DTL_NO≠BILL_DTL_NO)인데 SDSEL_CLASS_CD NULL · 5P33 모상품(SDSEL_GRP_CD 있음)인데 하위 구성상품 없음. 원본은 5P12 를 값 대입 안 된 변수로 조회해 항상 0건, 5P33 은 카운터 미초기화로 2번째 이후 세트 미검사, 5P11 은 죽은 코드, 5P40 은 주석. [상세] 걸린 전표의 상세 행 전부에 모상품/구성상품/일반/마스터없음 구분.",
  sql:
`/* ═══ [판별] 상품 마스터 · 세트 구성 (5P04 · 5P12 · 5P33) ═══ */
WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, SALE_YN
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
)
-- 5P04 : 마스터에 없는 상품
SELECT '5P04' RESULT_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
      ,A.PROD_CD, A.SIDE_P_DTL_NO, A.SDSEL_CLASS_CD, 'Y' AS ORIG_DETECT
  FROM TB_SL_SALE_DTL A, BILLS B
 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
   AND A.SALE_YN='Y'
   AND NOT EXISTS (SELECT 1 FROM TB_MS_PRODUCT P WHERE P.STORE_CD=A.STORE_CD AND P.PROD_CD=A.PROD_CD)
UNION ALL
-- 5P12 : 구성상품인데 CLASS_CD 없음   (원본 프로시저 : 한 번도 검출된 적 없음)
SELECT '5P12', A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
      ,A.PROD_CD, A.SIDE_P_DTL_NO, A.SDSEL_CLASS_CD, 'N (변수 미대입 → 항상 0건)'
  FROM TB_SL_SALE_DTL A, BILLS B
 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
   AND A.SIDE_P_DTL_NO IS NOT NULL
   AND A.SIDE_P_DTL_NO <> A.BILL_DTL_NO
   AND A.SDSEL_CLASS_CD IS NULL
UNION ALL
-- 5P33 : 모상품은 있는데 구성상품 없음
SELECT '5P33', A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO, A.BILL_DTL_NO
      ,A.PROD_CD, A.SIDE_P_DTL_NO, A.SDSEL_CLASS_CD
      ,CASE WHEN ROW_NUMBER() OVER (PARTITION BY A.STORE_CD,A.SALE_DATE,A.POS_NO,A.BILL_NO ORDER BY A.BILL_DTL_NO) = 1
            THEN 'Y' ELSE 'N (카운터 미초기화 → 2번째 이후 미검사)' END
  FROM TB_SL_SALE_DTL A, TB_MS_PRODUCT P, BILLS B
 WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.STORE_CD=B.STORE_CD AND A.SALE_DATE=B.SALE_DATE AND A.POS_NO=B.POS_NO AND A.BILL_NO=B.BILL_NO
   AND P.STORE_CD=A.STORE_CD AND P.PROD_CD=A.PROD_CD
   AND P.SDSEL_GRP_CD IS NOT NULL
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL C
                    WHERE C.HQ_OFFICE_CD = '{{HQ}}' AND C.STORE_CD=A.STORE_CD AND C.SALE_DATE=A.SALE_DATE AND C.POS_NO=A.POS_NO AND C.BILL_NO=A.BILL_NO
                      AND C.SIDE_P_DTL_NO=A.BILL_DTL_NO AND C.BILL_DTL_NO<>A.BILL_DTL_NO)
 ORDER BY 3,2,4,5,6;

/* ═══ [상세] 5P 전표의 세트 구조 — 모상품(SDSEL_GRP_CD)과 그 밑의 구성상품 행 ═══ */
WITH BAD AS (
    SELECT DISTINCT A.HQ_OFFICE_CD, A.STORE_CD, A.SALE_DATE, A.POS_NO, A.BILL_NO
      FROM TB_SL_SALE_DTL A
     WHERE A.HQ_OFFICE_CD = '{{HQ}}' AND A.{{OPT:datecond}}
       {{LINE:store:A}}
       {{LINE:extra:A}}
       AND (  (A.SALE_YN='Y' AND NOT EXISTS (SELECT 1 FROM TB_MS_PRODUCT P WHERE P.STORE_CD=A.STORE_CD AND P.PROD_CD=A.PROD_CD))
           OR (A.SIDE_P_DTL_NO IS NOT NULL AND A.SIDE_P_DTL_NO <> A.BILL_DTL_NO AND A.SDSEL_CLASS_CD IS NULL)
           OR EXISTS (SELECT 1 FROM TB_MS_PRODUCT P WHERE P.STORE_CD=A.STORE_CD AND P.PROD_CD=A.PROD_CD AND P.SDSEL_GRP_CD IS NOT NULL
                        AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_DTL C WHERE C.HQ_OFFICE_CD=A.HQ_OFFICE_CD AND C.STORE_CD=A.STORE_CD AND C.SALE_DATE=A.SALE_DATE AND C.POS_NO=A.POS_NO AND C.BILL_NO=A.BILL_NO
                                          AND C.SIDE_P_DTL_NO=A.BILL_DTL_NO AND C.BILL_DTL_NO<>A.BILL_DTL_NO)) )
)
SELECT B.STORE_CD, B.POS_NO, B.BILL_NO, d.BILL_DTL_NO, d.PROD_CD, d.SALE_QTY, d.SALE_AMT
      ,NVL(d.SIDE_P_DTL_NO,'-') AS SIDE_P_DTL_NO, NVL(d.SDSEL_CLASS_CD,'-') AS SDSEL_CLASS_CD
      ,P.SDSEL_GRP_CD, CASE WHEN P.PROD_CD IS NULL THEN 'X 마스터없음' WHEN P.SDSEL_GRP_CD IS NOT NULL THEN '모상품' WHEN d.SIDE_P_DTL_NO IS NOT NULL AND d.SIDE_P_DTL_NO<>d.BILL_DTL_NO THEN '구성상품' ELSE '일반' END AS 구분
  FROM BAD B
  JOIN TB_SL_SALE_DTL d ON d.HQ_OFFICE_CD=B.HQ_OFFICE_CD AND d.STORE_CD=B.STORE_CD AND d.SALE_DATE=B.SALE_DATE AND d.POS_NO=B.POS_NO AND d.BILL_NO=B.BILL_NO
  LEFT JOIN TB_MS_PRODUCT P ON P.STORE_CD=d.STORE_CD AND P.PROD_CD=d.PROD_CD
 ORDER BY 1, 2, 3, 4;`
},

qr1:{ tag:"R-1", kind:"SELECT", scope:"대상 본사", name:"반품 ↔ 원거래 (R01 ~ R06)",
  desc:"[판별] 반품 ↔ 원거래 (수기 반품 사고 유형). ORG_BILL_NO = STORE_CD‖SALE_DATE(8)‖POS_NO(2)‖BILL_NO(4), 뒤에서 4/2/8 자리를 떼고 나머지가 STORE_CD. R01 원거래키 없음 · R02 원거래 실재하지 않음 · R03 원거래도 반품 · R04 역링크 미설정 · R05 역링크 불일치 · R06 REAL ≠ −원거래 REAL. 0903 반품 5건 전부 OK. [상세] 반품 전표와 원거래 전표의 PAY_SEQ 행을 나란히 — 부호·금액 대칭 확인(케이스 2 부호 규칙).",
  sql:
`/* ═══ [판별] 반품 ↔ 원거래 (R01 ~ R06) ═══ */
SELECT r.STORE_CD, r.POS_NO, r.BILL_NO, r.SALE_YN, r.REAL_SALE_AMT, r.REG_ID, r.REG_DT
      ,NVL(r.ORG_BILL_NO,'(없음)') AS ORG_BILL_NO
      ,o.BILL_NO AS 원거래BILL, o.SALE_YN AS 원거래SALE_YN, o.REAL_SALE_AMT AS 원거래금액
      ,CASE WHEN r.ORG_BILL_NO IS NULL THEN 'R01 원거래키 없음'
            WHEN o.BILL_NO IS NULL     THEN 'R02 원거래가 실재하지 않음'
            WHEN o.SALE_YN = 'N'       THEN 'R03 원거래도 반품행'
            WHEN o.ORG_BILL_NO IS NULL THEN 'R04 원거래 역링크 미설정'
            WHEN o.ORG_BILL_NO <> r.STORE_CD||r.SALE_DATE||r.POS_NO||r.BILL_NO
                                       THEN 'R05 역링크 불일치'
            WHEN r.REAL_SALE_AMT <> -o.REAL_SALE_AMT
                                       THEN 'R06 금액 부호/크기 불일치'
            ELSE 'OK' END AS RESULT_CD
  FROM TB_SL_SALE_HDR r
  LEFT JOIN TB_SL_SALE_HDR o
    ON  o.STORE_CD  = SUBSTR(r.ORG_BILL_NO, 1, LENGTH(r.ORG_BILL_NO)-14)
    AND o.SALE_DATE = SUBSTR(r.ORG_BILL_NO, -14, 8)
    AND o.POS_NO    = SUBSTR(r.ORG_BILL_NO, -6, 2)
    AND o.BILL_NO   = SUBSTR(r.ORG_BILL_NO, -4)
 WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
   AND r.SALE_YN = 'N'
 ORDER BY r.STORE_CD, r.POS_NO, r.BILL_NO;

/* ═══ [상세] 반품 전표와 원거래 전표의 PAY_SEQ 행 나란히 — 부호와 금액이 대칭인지 ═══ */
SELECT r.STORE_CD, r.POS_NO, r.BILL_NO AS 반품BILL, o.BILL_NO AS 원거래BILL
      ,'반품' 구분, s.PAY_SEQ, s.PAY_CD, s.PAY_AMT, s.VAT_AMT
  FROM TB_SL_SALE_HDR r
  LEFT JOIN TB_SL_SALE_HDR o
    ON  o.HQ_OFFICE_CD=r.HQ_OFFICE_CD AND o.STORE_CD = SUBSTR(r.ORG_BILL_NO, 1, LENGTH(r.ORG_BILL_NO)-14)
    AND o.SALE_DATE = SUBSTR(r.ORG_BILL_NO, -14, 8) AND o.POS_NO = SUBSTR(r.ORG_BILL_NO, -6, 2) AND o.BILL_NO = SUBSTR(r.ORG_BILL_NO, -4)
  JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=r.HQ_OFFICE_CD AND s.STORE_CD=r.STORE_CD AND s.SALE_DATE=r.SALE_DATE AND s.POS_NO=r.POS_NO AND s.BILL_NO=r.BILL_NO
 WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
   {{LINE:store:r}}
   {{LINE:extra:r}}
   AND r.SALE_YN = 'N'
UNION ALL
SELECT r.STORE_CD, r.POS_NO, r.BILL_NO, o.BILL_NO
      ,'원거래', s.PAY_SEQ, s.PAY_CD, s.PAY_AMT, s.VAT_AMT
  FROM TB_SL_SALE_HDR r
  JOIN TB_SL_SALE_HDR o
    ON  o.HQ_OFFICE_CD=r.HQ_OFFICE_CD AND o.STORE_CD = SUBSTR(r.ORG_BILL_NO, 1, LENGTH(r.ORG_BILL_NO)-14)
    AND o.SALE_DATE = SUBSTR(r.ORG_BILL_NO, -14, 8) AND o.POS_NO = SUBSTR(r.ORG_BILL_NO, -6, 2) AND o.BILL_NO = SUBSTR(r.ORG_BILL_NO, -4)
  JOIN TB_SL_SALE_PAY_SEQ s ON s.HQ_OFFICE_CD=o.HQ_OFFICE_CD AND s.STORE_CD=o.STORE_CD AND s.SALE_DATE=o.SALE_DATE AND s.POS_NO=o.POS_NO AND s.BILL_NO=o.BILL_NO
 WHERE r.HQ_OFFICE_CD = '{{HQ}}' AND r.{{OPT:datecond}}
   {{LINE:store:r}}
   {{LINE:extra:r}}
   AND r.SALE_YN = 'N'
 ORDER BY 1, 2, 3, 5 DESC, 6;`
},

qr2:{ tag:"R-2", kind:"SELECT", scope:"대상 본사", name:"고아 역링크 (R07)",
  desc:"[판별] R-1 의 반대 방향 (R07). 매출인데 ORG_BILL_NO 가 가리키는 반품 전표가 실재하지 않음. 반품 헤더만 지워진 흔적.",

qa1:{ tag:"A-1", kind:"SELECT", scope:"대상 본사", name:"헤더 vs 일별집계 TB_SL_DAILY_TOTAL (AGG01)",
  desc:"[판별] 헤더 합계 vs TB_SL_DAILY_TOTAL (AGG01). 실판매·부가세·전표수. 수기 INSERT/UPDATE 뒤 트리거 집계가 어긋나면 여기서. 케이스 1~4 의 C-7/C-12 상시판. [상세] 매장·SALE_YN 별 헤더 합계와 마지막 수정시각 — 어느 쪽(매출/반품)에서 어긋났는지.",
  sql:
`/* ═══ [판별] 헤더 vs 일별집계 TB_SL_DAILY_TOTAL (AGG01) ═══ */
SELECT t.STORE_CD, t.SALE_DATE
      ,t.REAL_SALE_AMT AS 집계_실판매, x.H_REAL AS 헤더_실판매, t.REAL_SALE_AMT-x.H_REAL AS 실판매차
      ,t.VAT_AMT       AS 집계_부가세, x.H_VAT  AS 헤더_부가세, t.VAT_AMT-x.H_VAT        AS 부가세차
      ,t.BILL_CNT      AS 집계_전표수, x.H_CNT  AS 헤더_전표수, t.BILL_CNT-x.H_CNT       AS 전표수차
      ,'AGG01' AS RESULT_CD
  FROM TB_SL_DAILY_TOTAL t
  JOIN (SELECT STORE_CD, SALE_DATE, SUM(REAL_SALE_AMT) H_REAL, SUM(VAT_AMT) H_VAT, COUNT(*) H_CNT
          FROM TB_SL_SALE_HDR WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
         GROUP BY STORE_CD, SALE_DATE) x ON x.STORE_CD = t.STORE_CD AND x.SALE_DATE = t.SALE_DATE
 WHERE t.HQ_OFFICE_CD = '{{HQ}}' AND t.{{OPT:datecond}}
   AND (t.REAL_SALE_AMT <> x.H_REAL OR t.VAT_AMT <> x.H_VAT OR t.BILL_CNT <> x.H_CNT);

/* ═══ [상세] 매장·SALE_YN 별 헤더 합계 — 집계와 어긋난 매장이 매출 쪽인지 반품 쪽인지 ═══ */
SELECT h.STORE_CD, h.SALE_DATE, h.SALE_YN, COUNT(*) 전표수
      ,SUM(h.TOT_SALE_AMT) 총매출, SUM(h.TOT_DC_AMT) 할인, SUM(h.REAL_SALE_AMT) 실판매, SUM(h.VAT_AMT) 부가세
      ,MAX(h.MOD_DT) AS 마지막수정, COUNT(DISTINCT h.MOD_ID) AS 수정자수
  FROM TB_SL_SALE_HDR h
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND EXISTS (SELECT 1 FROM TB_SL_DAILY_TOTAL t
                WHERE t.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND t.STORE_CD=h.STORE_CD AND t.SALE_DATE=h.SALE_DATE
                  AND (t.REAL_SALE_AMT <> (SELECT SUM(x.REAL_SALE_AMT) FROM TB_SL_SALE_HDR x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE)
                    OR t.VAT_AMT <> (SELECT SUM(x.VAT_AMT) FROM TB_SL_SALE_HDR x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE)
                    OR t.BILL_CNT <> (SELECT COUNT(*) FROM TB_SL_SALE_HDR x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE)))
 GROUP BY h.STORE_CD, h.SALE_DATE, h.SALE_YN
 ORDER BY 1, 2, 3 DESC;`
},

qa2:{ tag:"A-2", kind:"SELECT", scope:"대상 본사", name:"헤더 인원수 vs HDR_GUEST (GST01)",
  desc:"[판별] 헤더 TOT_GUEST_CNT vs HDR_GUEST 1~6 합 (GST01). [상세] 그 전표의 HDR_GUEST 행.",
  sql:
`/* ═══ [판별] 헤더 인원수 vs HDR_GUEST (GST01) ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.TOT_GUEST_CNT
      ,NVL(g.G,0) AS GUEST_합, h.TOT_GUEST_CNT - NVL(g.G,0) AS 차이
      ,'GST01' AS RESULT_CD
  FROM TB_SL_SALE_HDR h
  LEFT JOIN (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO
                   ,SUM(NVL(GUEST_CNT_1,0)+NVL(GUEST_CNT_2,0)+NVL(GUEST_CNT_3,0)
                       +NVL(GUEST_CNT_4,0)+NVL(GUEST_CNT_5,0)+NVL(GUEST_CNT_6,0)) G
               FROM TB_SL_SALE_HDR_GUEST
              WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
              GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO) g
    ON g.STORE_CD=h.STORE_CD AND g.SALE_DATE=h.SALE_DATE
   AND g.POS_NO=h.POS_NO     AND g.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   AND h.TOT_GUEST_CNT <> NVL(g.G,0)
 ORDER BY 1,2,3;

/* ═══ [상세] 인원수 불일치 전표의 HDR_GUEST 행 ═══ */
SELECT h.STORE_CD, h.POS_NO, h.BILL_NO, h.TOT_GUEST_CNT
      ,g.GUEST_CNT_1, g.GUEST_CNT_2, g.GUEST_CNT_3, g.GUEST_CNT_4, g.GUEST_CNT_5, g.GUEST_CNT_6
  FROM TB_SL_SALE_HDR h
  LEFT JOIN TB_SL_SALE_HDR_GUEST g ON g.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND g.STORE_CD=h.STORE_CD AND g.SALE_DATE=h.SALE_DATE AND g.POS_NO=h.POS_NO AND g.BILL_NO=h.BILL_NO
 WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
   {{LINE:store:h}}
   {{LINE:extra:h}}
   AND h.TOT_GUEST_CNT <> NVL((SELECT SUM(NVL(x.GUEST_CNT_1,0)+NVL(x.GUEST_CNT_2,0)+NVL(x.GUEST_CNT_3,0)+NVL(x.GUEST_CNT_4,0)+NVL(x.GUEST_CNT_5,0)+NVL(x.GUEST_CNT_6,0))
                                 FROM TB_SL_SALE_HDR_GUEST x WHERE x.HQ_OFFICE_CD=h.HQ_OFFICE_CD AND x.STORE_CD=h.STORE_CD AND x.SALE_DATE=h.SALE_DATE AND x.POS_NO=h.POS_NO AND x.BILL_NO=h.BILL_NO),0)
 ORDER BY 1, 2, 3;`
},

qa3:{ tag:"A-3", kind:"SELECT", scope:"대상 본사", name:"BILL_NO 결번 · 중복 (SEQ01)",
  desc:"[판별] POS 별 BILL_NO 결번·중복 (SEQ01). SP_BENSON_DATA_DAILY_CHECK 의 CHECK_MISS_SALE_INFO(001 영수증누락) 와 같은 검사. [상세] 빠진 번호 목록과 TB_LOG_DAILY_DATA_CHECK 001 등록 여부.",
  sql:
`/* ═══ [판별] BILL_NO 결번 · 중복 (SEQ01) ═══ */
SELECT STORE_CD, SALE_DATE, POS_NO, COUNT(*) AS 전표수
      ,MIN(BILL_NO) AS MIN_BILL, MAX(BILL_NO) AS MAX_BILL
      ,TO_NUMBER(MAX(BILL_NO)) - TO_NUMBER(MIN(BILL_NO)) + 1 - COUNT(*) AS 결번수
      ,COUNT(*) - COUNT(DISTINCT BILL_NO) AS 중복수
      ,'SEQ01' AS RESULT_CD
  FROM TB_SL_SALE_HDR
 WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
 GROUP BY STORE_CD, SALE_DATE, POS_NO
HAVING TO_NUMBER(MAX(BILL_NO)) - TO_NUMBER(MIN(BILL_NO)) + 1 <> COUNT(*)
    OR COUNT(*) <> COUNT(DISTINCT BILL_NO)
 ORDER BY 1,2;

/* ═══ [상세] 빠진 BILL_NO 목록 — POS 별로 어떤 번호가 없는지 (SP_BENSON 001 영수증누락과 같은 방식) ═══ */
SELECT m.STORE_CD, m.POS_NO, n.BILL_NO AS 결번
      ,(SELECT COUNT(*) FROM TB_LOG_DAILY_DATA_CHECK l
         WHERE l.HQ_OFFICE_CD = '{{HQ}}' AND l.STORE_CD=m.STORE_CD AND l.SALE_DATE=m.SALE_DATE AND l.POS_NO=m.POS_NO AND l.BILL_NO=n.BILL_NO AND l.CHECK_CD='001') AS 로그등록
  FROM (SELECT STORE_CD, SALE_DATE, POS_NO, TO_NUMBER(MIN(BILL_NO)) MN, TO_NUMBER(MAX(BILL_NO)) MX
          FROM TB_SL_SALE_HDR h
         WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.{{OPT:datecond}}
           {{LINE:store:h}}
           {{LINE:extra:h}}
         GROUP BY STORE_CD, SALE_DATE, POS_NO
        HAVING TO_NUMBER(MAX(BILL_NO)) - TO_NUMBER(MIN(BILL_NO)) + 1 <> COUNT(*)) m
  CROSS JOIN LATERAL (SELECT TRIM(TO_CHAR(m.MN + LEVEL - 1,'0000')) BILL_NO FROM DUAL CONNECT BY LEVEL <= m.MX - m.MN + 1) n
 WHERE NOT EXISTS (SELECT 1 FROM TB_SL_SALE_HDR h WHERE h.HQ_OFFICE_CD = '{{HQ}}' AND h.STORE_CD=m.STORE_CD AND h.SALE_DATE=m.SALE_DATE AND h.POS_NO=m.POS_NO AND h.BILL_NO=n.BILL_NO)
 ORDER BY 1, 2, 3;`
},

qa4:{ tag:"A-4", kind:"SELECT", scope:"대상 본사", name:"BILL_DT 이상 (DT01 ~ DT03)",
  desc:"[판별] BILL_DT 이상. DT01 NULL · DT02 미래 시각 · DT03 영업일(SALE_DATE 또는 +1일) 과 다름.",
  sql:
`SELECT STORE_CD, POS_NO, BILL_NO, SALE_DATE, BILL_DT, REG_DT, REG_ID
      ,CASE WHEN BILL_DT IS NULL                                  THEN 'DT01 BILL_DT NULL'
            WHEN BILL_DT > TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS')    THEN 'DT02 미래시각'
            ELSE 'DT03 영업일과 2일 이상 차이' END AS RESULT_CD
  FROM TB_SL_SALE_HDR
 WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}}
   AND (BILL_DT IS NULL
     OR BILL_DT > TO_CHAR(SYSDATE,'YYYYMMDDHH24MISS')
     OR SUBSTR(BILL_DT,1,8) NOT IN
        (SALE_DATE, TO_CHAR(TO_DATE(SALE_DATE,'YYYYMMDD')+1,'YYYYMMDD')))
 ORDER BY 1,2,3;`
},

qa5:{ tag:"A-5", kind:"SELECT", scope:"대상 본사", name:"최종 4자 대사 (NE01) — 벤슨 미실행 · 참고",
  desc:"참고용. 프로시저 CHECK_PKG_NEOE 는 v3 부터 본부 A0001 일 때만 호출되어 벤슨은 안 돌립니다. 관계식 TOT_SALE_AMT = HDR_PAY + HDR_DC = PAY_SEQ 합 = DTL 합은 유효한 대사라 남겨 둡니다.",
  sql:
`WITH BILLS AS (
    SELECT STORE_CD, SALE_DATE, POS_NO, BILL_NO, TOT_SALE_AMT
      FROM TB_SL_SALE_HDR
     WHERE HQ_OFFICE_CD = '{{HQ}}'
       AND {{OPT:datecond}}
       {{LINE:store:}}
       {{LINE:extra:}}
),
HP AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(PAY_AMT)  AMT FROM TB_SL_SALE_HDR_PAY WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
HD AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(DC_AMT)   AMT FROM TB_SL_SALE_HDR_DC  WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
S  AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(PAY_AMT)  AMT FROM TB_SL_SALE_PAY_SEQ WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO),
D  AS (SELECT STORE_CD,SALE_DATE,POS_NO,BILL_NO,SUM(SALE_AMT) AMT FROM TB_SL_SALE_DTL     WHERE HQ_OFFICE_CD = '{{HQ}}' AND {{OPT:datecond}} GROUP BY STORE_CD,SALE_DATE,POS_NO,BILL_NO)
SELECT B.STORE_CD, B.SALE_DATE, B.POS_NO, B.BILL_NO
      ,B.TOT_SALE_AMT
      ,NVL(HP.AMT,0) + NVL(HD.AMT,0) AS PAY_PLUS_DC
      ,NVL(S.AMT,0)  AS PAY_SEQ_AMT
      ,NVL(D.AMT,0)  AS DTL_AMT
      ,CASE WHEN '{{HQ}}' = 'A0001' THEN 'NE01' ELSE 'NE01(참고)' END AS RESULT_CD   /* 프로시저는 A0001 만 실행 */
  FROM BILLS B
  LEFT JOIN HP ON HP.STORE_CD=B.STORE_CD AND HP.SALE_DATE=B.SALE_DATE AND HP.POS_NO=B.POS_NO AND HP.BILL_NO=B.BILL_NO
  LEFT JOIN HD ON HD.STORE_CD=B.STORE_CD AND HD.SALE_DATE=B.SALE_DATE AND HD.POS_NO=B.POS_NO AND HD.BILL_NO=B.BILL_NO
  LEFT JOIN S  ON S.STORE_CD =B.STORE_CD AND S.SALE_DATE =B.SALE_DATE AND S.POS_NO =B.POS_NO AND S.BILL_NO =B.BILL_NO
  LEFT JOIN D  ON D.STORE_CD =B.STORE_CD AND D.SALE_DATE =B.SALE_DATE AND D.POS_NO =B.POS_NO AND D.BILL_NO =B.BILL_NO
 WHERE B.TOT_SALE_AMT <> NVL(HP.AMT,0) + NVL(HD.AMT,0)
    OR B.TOT_SALE_AMT <> NVL(S.AMT,0)
    OR B.TOT_SALE_AMT <> NVL(D.AMT,0)
 ORDER BY B.SALE_DATE, B.STORE_CD, B.POS_NO, B.BILL_NO;`
},

qe1:{ tag:"E-1", kind:"SELECT", scope:"전사 표본", name:"ETC 면제 목록 검증 — DC_CD 별 결제행 생성률 (전사)",
  desc:"H-7 의 ETC 면제 목록(DC_CD NOT IN 02/12/05) 검증 (DCR00 / DCR01). 면제 코드인데 생성률 50% 를 넘으면 DCR01 로 표시. DC_CD 별로 PAY_SEQ 05/12 결제행이 생기는 비율. 비율이 높은데 ETC(면제) 로 분류된 코드가 사각지대. 전사 대상이라 HQ 를 걸지 않고, 기간은 종료일 옵션으로 넓혀서. 실측(0828~0903): 09 16,381건 100% · 13 340건 100% 인데 둘 다 면제 → 사각지대. 12 99.8% · 02 64.3% · 05 3.5% · 01 1.1% · 나머지 0%.",
  sql:
`SELECT d.DC_CD
      ,COUNT(*) AS 할인건
      ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
             WHERE s.STORE_CD=d.STORE_CD AND s.SALE_DATE=d.SALE_DATE
               AND s.POS_NO=d.POS_NO AND s.BILL_NO=d.BILL_NO
               AND s.PAY_CD IN ('05','12')) THEN 1 ELSE 0 END) AS 결제행있음
      ,ROUND(100 * SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
             WHERE s.STORE_CD=d.STORE_CD AND s.SALE_DATE=d.SALE_DATE
               AND s.POS_NO=d.POS_NO AND s.BILL_NO=d.BILL_NO
               AND s.PAY_CD IN ('05','12')) THEN 1 ELSE 0 END) / COUNT(*), 1) AS 비율
      ,CASE WHEN d.DC_CD IN ('02','12','05') THEN '검사대상' ELSE 'ETC(면제)' END AS 현재분류
      ,CASE WHEN d.DC_CD NOT IN ('02','12','05')
             AND SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
                   WHERE s.STORE_CD=d.STORE_CD AND s.SALE_DATE=d.SALE_DATE
                     AND s.POS_NO=d.POS_NO AND s.BILL_NO=d.BILL_NO
                     AND s.PAY_CD IN ('05','12')) THEN 1 ELSE 0 END) > COUNT(*) * 0.5
            THEN 'DCR01 면제인데 결제행 생성률 50% 초과' ELSE 'DCR00' END AS RESULT_CD
  FROM TB_SL_SALE_HDR_DC d
 WHERE d.{{OPT:datecond}}      /* ← 기간 조정 */
 GROUP BY d.DC_CD
 ORDER BY 2 DESC;`
},

qe2:{ tag:"E-2", kind:"SELECT", scope:"전사 표본", name:"09 / 13 사각지대 검출 (DC09 · 전사)",
  desc:"E-1 의 사각지대(09/13 만 있고 결제행 없음) 실제 검출 (DC09). 전사. 실측 A0001 4건(금액 0원), H0665 0건. 당장 문제는 아니지만 구멍이라 상시로 둡니다.",
  sql:
`SELECT d.HQ_OFFICE_CD, d.STORE_CD, d.SALE_DATE, d.POS_NO, d.BILL_NO
      ,d.DC_CD, d.DC_AMT, 'DC09' AS RESULT_CD
  FROM TB_SL_SALE_HDR_DC d
 WHERE d.{{OPT:datecond}}
   AND d.DC_CD IN ('09','13')
   AND NOT EXISTS (SELECT 1 FROM TB_SL_SALE_PAY_SEQ s
        WHERE s.STORE_CD=d.STORE_CD AND s.SALE_DATE=d.SALE_DATE
          AND s.POS_NO=d.POS_NO AND s.BILL_NO=d.BILL_NO
          AND s.PAY_CD IN ('05','12'))
 ORDER BY 1,2,3,4,5;`
},

qe3:{ tag:"E-3", kind:"SELECT", scope:"전사 표본", isNew:true, name:"PAY_CD 별 HDR_PAY / DTL_PAY 동반 비율 — P-4 의 05/12 제외가 맞는지 (PYR00 · PYR01 · PYR02)",
  desc:"P-4 가 05/12 를 제외하는 근거를 직접 확인합니다. 비율이 100% 인데 제외 목록이면 사각지대(PYR01), 0% 에 가까운데 검사대상이면 오탐(PYR02). 실측 전사 0831~0902: 01/18/02/19/08/07/03/06/11/17/04/09/14/13/10 전부 100%, 12 · 05 는 0%. 전사 대상이라 HQ 를 걸지 않고 기간은 종료일 옵션으로 넓혀서 주기적으로.",
  sql:
`SELECT s.PAY_CD
      ,COUNT(*) AS PAY_SEQ전표수
      ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_HDR_PAY p
             WHERE p.STORE_CD=s.STORE_CD AND p.SALE_DATE=s.SALE_DATE
               AND p.POS_NO=s.POS_NO AND p.BILL_NO=s.BILL_NO
               AND p.PAY_CD=s.PAY_CD) THEN 1 ELSE 0 END)              AS HDR_PAY있음
      ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_DTL_PAY p
             WHERE p.STORE_CD=s.STORE_CD AND p.SALE_DATE=s.SALE_DATE
               AND p.POS_NO=s.POS_NO AND p.BILL_NO=s.BILL_NO
               AND p.PAY_CD=s.PAY_CD) THEN 1 ELSE 0 END)              AS DTL_PAY있음
      ,ROUND(100 * SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_HDR_PAY p
             WHERE p.STORE_CD=s.STORE_CD AND p.SALE_DATE=s.SALE_DATE
               AND p.POS_NO=s.POS_NO AND p.BILL_NO=s.BILL_NO
               AND p.PAY_CD=s.PAY_CD) THEN 1 ELSE 0 END) / COUNT(*), 1) AS HDR비율
      ,CASE WHEN s.PAY_CD IN ('05','12') THEN '제외대상' ELSE '검사대상' END AS 현재분류
      ,CASE WHEN s.PAY_CD IN ('05','12')
             AND SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_HDR_PAY p
                   WHERE p.STORE_CD=s.STORE_CD AND p.SALE_DATE=s.SALE_DATE
                     AND p.POS_NO=s.POS_NO AND p.BILL_NO=s.BILL_NO AND p.PAY_CD=s.PAY_CD) THEN 1 ELSE 0 END) > 0
            THEN 'PYR01 제외대상인데 HDR_PAY 동반 있음'
            WHEN s.PAY_CD NOT IN ('05','12')
             AND SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_HDR_PAY p
                   WHERE p.STORE_CD=s.STORE_CD AND p.SALE_DATE=s.SALE_DATE
                     AND p.POS_NO=s.POS_NO AND p.BILL_NO=s.BILL_NO AND p.PAY_CD=s.PAY_CD) THEN 1 ELSE 0 END) < COUNT(*) * 0.5
            THEN 'PYR02 검사대상인데 동반률 50% 미만'
            ELSE 'PYR00' END AS RESULT_CD
  FROM (SELECT DISTINCT STORE_CD, SALE_DATE, POS_NO, BILL_NO, PAY_CD
          FROM TB_SL_SALE_PAY_SEQ x
         WHERE x.{{OPT:datecond}}          /* 전사 · 기간은 종료일 옵션으로 */
           AND PAY_AMT <> 0) s
 GROUP BY s.PAY_CD
 ORDER BY 2 DESC;`
},

qe4:{ tag:"E-4", kind:"SELECT", scope:"대상 본사", isNew:true, name:"P-5 학습 결과 — 어떤 (본사, PAY_CD) 가 검사대상인지 (MAP00 · MAP01)",
  desc:"P-5 의 MAP 을 그대로 보여 줍니다. 표본 30건 이상 · 동반 95% 이상이면 MAP01 검사대상, 아니면 MAP00 제외. 검사대상이 하나도 없으면 P-5 는 항상 0건이고 이 본사에는 대사 자체가 성립하지 않는다는 뜻. 실측 H0665: 01 661건 100% · 18 71건 100% · 02 37건 100% · 08 12건(표본 부족) · 07 4건(표본 부족) · 12 76건 0% 제외.",
  sql:
`SELECT k.HQ_OFFICE_CD, k.PAY_CD
      ,COUNT(*) AS 표본
      ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
             WHERE p.STORE_CD=k.STORE_CD AND p.SALE_DATE=k.SALE_DATE
               AND p.POS_NO=k.POS_NO AND p.BILL_NO=k.BILL_NO
               AND p.PAY_CD=k.PAY_CD) THEN 1 ELSE 0 END)          AS 동반
      ,ROUND(100 * SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
             WHERE p.STORE_CD=k.STORE_CD AND p.SALE_DATE=k.SALE_DATE
               AND p.POS_NO=k.POS_NO AND p.BILL_NO=k.BILL_NO
               AND p.PAY_CD=k.PAY_CD) THEN 1 ELSE 0 END) / COUNT(*), 1) AS 비율
      ,CASE WHEN COUNT(*) >= 30
             AND SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
                   WHERE p.STORE_CD=k.STORE_CD AND p.SALE_DATE=k.SALE_DATE
                     AND p.POS_NO=k.POS_NO AND p.BILL_NO=k.BILL_NO
                     AND p.PAY_CD=k.PAY_CD) THEN 1 ELSE 0 END) / COUNT(*) >= 0.95
            THEN 'MAP01 검사대상' ELSE 'MAP00 제외' END           AS RESULT_CD
  FROM (SELECT DISTINCT HQ_OFFICE_CD, STORE_CD, SALE_DATE, POS_NO, BILL_NO, PAY_CD
          FROM TB_SL_SALE_PAY_SEQ
         WHERE HQ_OFFICE_CD = '{{HQ}}'
           AND {{OPT:learncond}}                              /* ← 학습기간 (옵션) */
           AND PAY_AMT <> 0) k
 GROUP BY k.HQ_OFFICE_CD, k.PAY_CD
 ORDER BY 3 DESC;`
},

qe5:{ tag:"E-5", kind:"SELECT", scope:"전사 표본", isNew:true, name:"본사별 TB_SL_SALE_PAY 사용 비율 — 이 대사가 성립하는 본사인가 (USE00 · USE01)",
  desc:"헤더 전표 중 TB_SL_SALE_PAY 행이 있는 비율을 본사별로. 95% 이상이면 USE01(대사 유효), 아니면 USE00. 0902 실측: H0387 100% · H0616 100% · H0393 99.9% · H0344 79.9% · H0168 76.8% · 00000 24.6% · H0115 6.2% · A0001/H0268/H0050/H0132/H0211/H0527/H0007 0%. 전사 대상, 100전표 초과 본사만.",
  sql:
`SELECT h.HQ_OFFICE_CD
      ,COUNT(*) AS 전표수
      ,SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
             WHERE p.STORE_CD=h.STORE_CD AND p.SALE_DATE=h.SALE_DATE
               AND p.POS_NO=h.POS_NO AND p.BILL_NO=h.BILL_NO)
            THEN 1 ELSE 0 END)                                  AS PAY행있음
      ,ROUND(100 * SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
             WHERE p.STORE_CD=h.STORE_CD AND p.SALE_DATE=h.SALE_DATE
               AND p.POS_NO=h.POS_NO AND p.BILL_NO=h.BILL_NO)
            THEN 1 ELSE 0 END) / COUNT(*), 1)                   AS 비율
      ,CASE WHEN SUM(CASE WHEN EXISTS (SELECT 1 FROM TB_SL_SALE_PAY p
             WHERE p.STORE_CD=h.STORE_CD AND p.SALE_DATE=h.SALE_DATE
               AND p.POS_NO=h.POS_NO AND p.BILL_NO=h.BILL_NO) THEN 1 ELSE 0 END) >= COUNT(*) * 0.95
            THEN 'USE01 사용 본사' ELSE 'USE00 미사용/부분' END AS RESULT_CD
  FROM TB_SL_SALE_HDR h
 WHERE h.{{OPT:datecond}}                        /* 전사 · 기간은 종료일 옵션 */
 GROUP BY h.HQ_OFFICE_CD
HAVING COUNT(*) > 100
 ORDER BY 2 DESC;`
},

qcodes:{ tag:"코드", kind:"MEMO", scope:"참고", name:"결과코드 상세 설명 — 뜻 · 비교식 · 원인 · 조치 · 원본 검출",
  desc:"실행할 게 아니라 주석입니다. 코드마다 어느 케이스로 가는지까지 적었습니다. 트랙 전체 복사 시 맨 끝에 붙어 나옵니다.",
  sql:
`/* ==================================================================================================
   결과코드 상세 설명   (카드 / 뜻 / 비교식 / 흔한 원인 / 조치 / 원본 프로시저 검출 : O · △ 조건부 · X · - 미실행 · 신규 = 이 콘솔에서 정의한 코드)
   코드가 없는 카드는 없습니다. S-1~S-3 는 요약(코드를 세는 쪽), D-4/E-1 은 참고·통계라 APP02/DCR00·DCR01 로 표시만 합니다.
   --------------------------------------------------------------------------------------------------
   ■ 존재 여부  [H-1]   프로시저 GET_SALE_DATA. 헤더를 읽고 하위 테이블을 차례로 읽는 단계.
   1404  헤더 없음.            TOT_SALE_AMT IS NULL.  헤더가 아예 없거나 금액 NULL.            원인: POS 전송 누락.        조치: POS 재전송/케이스 6.        O
   4404  DTL 없음.             COUNT(TB_SL_SALE_DTL)=0.  상품 상세가 하나도 없음.               원인: 상세 전송 누락.        조치: 케이스 6.                  O
   3404  PAY_SEQ 없음.         COUNT(TB_SL_SALE_PAY_SEQ)=0.  결제행이 하나도 없음.              원인: 결제 전송 누락.        조치: 케이스 2 계열.             O
   4414  HDR_PAY 없음.         COUNT(TB_SL_SALE_HDR_PAY)=0.  결제수단별 헤더 없음. (신규코드)   원본은 SUM→NULL 이라 못 잡음. 조치: 수기 생성.                X
   5404  DTL_PAY 없음.         COUNT(TB_SL_SALE_DTL_PAY)=0.  상품별 결제 배분 없음.             원본은 SUM→NULL 이라 못 잡음. 조치: 수기 생성.                X
   6404  HDR_DC 없음.          TOT_DC_AMT<>0 인데 COUNT(HDR_DC)=0.  헤더 할인은 있는데 할인행 없음.  조치: 케이스 1 계열.                                    O
   7404  DTL_DC 없음.          TOT_DC_AMT<>0 인데 COUNT(DTL_DC)=0.  상품별 할인행 없음.              조치: 케이스 3 계열.                                    O
   ORPH  고아 자식행 [H-2].    헤더는 없는데 자식 9테이블에 행이 남음.  RESULT_CD 열 = ORPH, 테이블별 행수.  원인: 헤더만 삭제된 수기 작업.  조치: 자식 삭제 또는 헤더 복구.  (프로시저 없음)

   ■ 헤더 항등식  [H-3] [H-4] [H-5]   조인 없이 헤더 한 행만 보는 규칙.
   9211  매출인데 실매출 음수.  SALE_YN='Y' AND REAL_SALE_AMT<0.   원인: 반품을 매출로 저장.   조치: SALE_YN/부호 정정.                                        O
   9212  반품인데 실매출 양수.  SALE_YN='N' AND REAL_SALE_AMT>0.   원인: 반품 부호 반전 누락.  조치: 케이스 2 부호 규칙 참고.                                  O
   9023  공급가+부가세≠실매출.  NET_SALE_AMT + VAT_AMT <> REAL_SALE_AMT.  원인: VAT 만 고치고 NET 안 고침(또는 반대).  조치: 케이스 4 B-2 (NET=REAL-VAT).  O
   9024  과세+면세≠실매출 [H-4]. TAX_SALE_AMT + NO_TAX_SALE_AMT <> REAL_SALE_AMT.  9023 이 안 보는 분해.  원인: 면세 상품 분류/집계 오류.    (프로시저 없음)
   VAT00 세 곳 모두 VAT 0 [H-5]. REAL<>0 AND TAX_SALE_AMT<>0 AND VAT_AMT=0.  헤더·상세·결제가 다 0 이면 9003/8002 가 전부 통과하는 유형.
         원인: 배달(가승인 18) 전표 VAT 미계산.  조치: 케이스 4 (B-1~B-4).  0903 5건.                                                                   (프로시저 없음)

   ■ 헤더 vs 상세 합계  [H-6]   프로시저 CHECK_SUM_DATA.
   9001  총매출≠상세 합.        TOT_SALE_AMT <> SUM(DTL.SALE_AMT).      원인: 상세 누락/중복.  DIFF 가 상품 단가면 행 하나가 빠진 것.  조치: 케이스 6.        O
   9002  총할인≠상세 할인합.    TOT_DC_AMT <> SUM(DTL.DC_AMT).          원인: 할인 배분 누락.  케이스 3 은 총액 불변이라 여기 안 걸려야 정상.                O
   9003  부가세≠상세 VAT합.     VAT_AMT <> SUM(DTL.VAT_AMT) (20210206 이전은 ABS).  원인: 헤더만 VAT 수정.  조치: 케이스 4 B-2 는 상세합으로 맞춤.        O
   9004  실매출≠상세 실매출합.  REAL_SALE_AMT <> SUM(DTL.REAL_SALE_AMT).  원인: 할인 이동 시 REAL 미갱신.  조치: 케이스 3 A-2/A-3 확인.                    O

   ■ 헤더 vs 결제시퀀스  [H-7]   PAY_SEQ 를 할인(05/12) 과 결제(그 외) 로 나눠 합침.
   8001  총할인≠SEQ 할인 (벤슨 외 본부).  TOT_DC_AMT <> SUM(PAY_SEQ 05/12).  벤슨은 이 코드 대신 8801.                                                    O
   8801  총할인≠SEQ 할인+ETC (벤슨).  TOT_DC_AMT <> SUM(PAY_SEQ 05/12) + SUM(HDR_DC DC_CD∉02/12/05).
         쿠폰류(02/12/05) 만 결제행을 만들고 그 외 할인(06/17 등) 은 안 만드는 벤슨 관행을 반영한 판정.
         원인: DC_CD 02 쿠폰이 있는데 PAY_SEQ 12 행도 PAY_COUPN 행도 없음.  조치: 케이스 1 → 케이스 2.  [상세②] 가 DC_CD 별로 갈라 줌.
         원본 결함: ETC 를 SUM 으로 구해 02/12/05 외 행이 없으면 NULL → 통과. 여기선 NVL 로 잡음.  0903 32건 전부 진짜 누락.                    △
   8002  부가세≠SEQ VAT합.     VAT_AMT <> SUM(PAY_SEQ.VAT_AMT).  원인: 헤더·상세는 채웠는데 PAY_SEQ VAT 만 0.  조치: 케이스 4 B-4.  0902 39건.           O
   8003  실매출≠SEQ 결제합.    REAL_SALE_AMT <> SUM(PAY_SEQ 05/12 외).  원인: 결제행 금액 오류/누락.  조치: 케이스 2 [C3-4] 참고.                          O

   ■ 헤더 vs 결제수단 헤더 / 할인 헤더  [H-8]
   7001  실매출≠HDR_PAY 합.    REAL_SALE_AMT <> SUM(HDR_PAY.PAY_AMT).  원본은 HDR_PAY 없으면 NULL → 통과.  조치: HDR_PAY 재생성.                         △
   6001  총할인≠HDR_DC 합.     TOT_DC_AMT <> SUM(HDR_DC.DC_AMT).      원본은 헤더 할인 0 이면 안 봄(역방향 못 잡음).  조치: 케이스 1 [3-1] 참고.           △
   6002  총할인≠DTL_DC 합.     TOT_DC_AMT <> SUM(DTL_DC.DC_AMT).      상동.  조치: 케이스 3 [C-2] 참고.                                                  △

   ■ 개별 금액 규칙  [H-9]   판정 순서 6103→6102→6303→6305→6405→6505.
   6103  포인트 VAT≠0.         SUM(PAY_SEQ PAY_CD 04 의 VAT_AMT)<>0, 20250207 이후.  포인트 결제는 VAT 0 이어야 함.  조치: PAY_SEQ 04 행 VAT 0 처리.     O
   6102  매출인데 상세 VAT 음수. 헤더 SALE_YN='Y' AND 상세에 VAT_AMT<0 행.  원인: POS 계산 오류.  0903 2건(T0000776, 실매출 양수·VAT 만 음수).
         조치: 케이스 4 의 VAT=0 조건으론 안 잡힘 → 상세 VAT 재계산 필요(새 유형).                                                                       O
   6303  매출인데 상세 실매출 음수. SALE_YN='Y' AND REAL_SALE_AMT<0 행. (v3 신규)  원인: 할인 > 판매가.  조치: 케이스 3 계열.                              O
   6305  매출인데 상세 할인 음수.   SALE_YN='Y' AND DC_AMT<0 행. (v3 신규)  원인: 할인 취소가 음수로 남음.                                                   O
   6405  상품금액<할인.         ABS(SALE_AMT) < ABS(DC_AMT) 행.  SALE_YN 무관.  원인: 0원 상품에 할인 배분(케이스 3 이슈4).  조치: 케이스 3.                O
   6505  총매출≠ERP 전송금액.  TOT_SALE_AMT <> SUM(PROD_CD 'LYNK' 면 ERP_SEND_AMT 아니면 SALE_AMT).  메시지는 REAL 을 찍지만 비교는 TOT.                O

   ■ 부호 규칙 양방향  [H-10]   행 자신의 SALE_YN 기준. 프로시저는 헤더 SALE_YN=Y 한 방향만 봄. 6102/6303 외는 여기서 만든 신규코드.
   6102  매출행인데 VAT 음수.    DTL.SALE_YN='Y' AND VAT_AMT<0.  H-9 의 6102 와 같은 뜻이나 헤더가 아닌 행 SALE_YN 기준.  0903 2건.                     (행 기준: 신규)
   6112  반품행인데 VAT 양수.    DTL.SALE_YN='N' AND VAT_AMT>0.  원인: 반품 상세를 부호 반전 없이 복사.  조치: 상세 VAT 부호 정정.                        (신규)
   6303  매출행인데 REAL 음수.   DTL.SALE_YN='Y' AND REAL_SALE_AMT<0.  원인: 할인 > 판매가.  조치: 케이스 3 계열.                                          (행 기준: 신규)
   6313  반품행인데 REAL 양수.   DTL.SALE_YN='N' AND REAL_SALE_AMT>0.  원인: 반품 상세 부호 반전 누락.  헤더 레벨은 9212.                                  (신규)
   3211  매출 결제행인데 PAY_AMT 음수. PAY_SEQ.SALE_YN='Y' AND PAY_AMT<0.  원인: 결제 취소가 매출 전표에 남음.                                              (신규)
   3212  반품 결제행인데 PAY_AMT 양수. PAY_SEQ.SALE_YN='N' AND PAY_AMT>0.  케이스 2 부호 규칙(반품 PAY_SEQ 는 음수, 실측 488/488) 위반.  조치: 케이스 2 [C2] 부호.  (신규)
   MIX   헤더/상세 SALE_YN 불일치. 헤더 SALE_YN 과 상세 행 SALE_YN 이 다름(비고 열).  원인: 부분 반품을 한 전표에 섞음.                                  (신규)

   ■ 결제수단별 상세  [P-1] [P-2] [P-3]   PAY_SEQ 한 행 ↔ PAY_CD 별 상세 테이블(16개) 한 행, LINE_NO 로 매칭.
   3001  할인 금액 불일치.      PAY_CD 05/12: PAY_SEQ.PAY_AMT <> 상세.할인금액 (12 는 COUPN.DC_AMT×SALE_FG).  조치: 케이스 2 부호 규칙.                  O
   3002  결제 금액 불일치.      그 외: PAY_SEQ.PAY_AMT <> 상세.SALE_AMT.                                                                                    O
   3003  결제 VAT 불일치.       그 외: PAY_SEQ.VAT_AMT <> 상세.VAT_AMT.  조치: 케이스 4 B-3(가승인)/B-4(PAY_SEQ) 둘 다 맞아야 함.                          O
   3004  상세 행 없음 (신규).   PAY_SEQ 는 있는데 상세 테이블에 LINE_NO 행 없음.  원본은 NO_DATA_FOUND 로 죽고 WHEN OTHERS 에 삼켜져 로그 없음.        X
   3009  미지원 PAY_CD (신규).  09/15/16 등.  원본은 CASE_NOT_FOUND 로 죽음.  TB_LOG_BENSON_BILL_CHECK 누락의 주원인.                                    X
   3005  역방향 누락 [P-2].     상세 테이블에 행이 있는데 PAY_SEQ 에 같은 LINE_NO/PAY_CD 없음.  케이스 2 유형.  조치: 케이스 2 [C2].               (프로시저 없음)
   PAY01 PAY_SEQ 행 항등식 [P-3]. PAY_AMT <> TAX_AMT + NO_TAX_AMT (05/12 제외).  원인: PAY_CD 18 행의 TAX/NO_TAX/VAT 전부 0.  조치: 케이스 4 B-4.  (프로시저 없음)

   ■ PAY_CD 별 합계  [P-4] [P-5] [P-6] [P-7]
   3101  HDR_PAY 에 PAY_CD 없음.  PAY_SEQ 에 있는 PAY_CD 가 HDR_PAY 에 없음.                                                                             O
   3102  PAY_CD 별 금액 불일치.   SUM(PAY_SEQ) <> HDR_PAY.PAY_AMT.                                                                                        O
   3201  DTL_PAY 에 PAY_CD 없음.                                                                                                                         O
   3202  PAY_CD 별 DTL_PAY 불일치. SUM(PAY_SEQ) <> SUM(DTL_PAY).  원본은 HDR_PAY 가 맞으면 합계 변수를 안 채워 통과.                                     △
   3103  HDR_PAY 에만 있음 (신규). PAY_SEQ 에 없는 PAY_CD 가 HDR_PAY 에 있음. 역방향.                                                                (신규)
   3203  DTL_PAY 에만 있음 (신규). 역방향.                                                                                                             (신규)
         ※ P-4 는 05/12 를 제외합니다. 할인성 결제라 HDR_PAY/DTL_PAY 에 원래 없음(전사 3일 실측 0%). 제외 안 하면 전부 3101 오탐. 근거 확인은 E-3.
   P01~P03 TB_SL_SALE_PAY vs PAY_SEQ [P-5].  프로시저가 안 보는 테이블. P01 PAY 없음 · P02 PAY_SEQ 없음 · P03 금액 불일치.
         ※ TB_SL_SALE_PAY 는 본사에 따라 0~100% 만 채워지는 조건부 테이블. 학습기간 동안 표본 30건·동반 95% 이상인 (본사,PAY_CD) 만 검사. H0665 는 12(쿠폰) 제외.  (프로시저 없음)

const el = id => document.getElementById(id);
const inputs = { hq:el('in-hq'), store:el('in-store'), date:el('in-date'), dc:el('in-dc'), extra:el('in-extra') };
const DEFAULTS = { hq:'H0665', store:'', date:'20260902', datemode:'fixed', dc:'02', extra:'' };
let current = CASES[0];
let optState = {};   // 현재 케이스 옵션값

function params(){
  const mode = document.querySelector('input[name=datemode]:checked').value;
  const dateLit = inputs.date.value.trim();
  return {
    hq   : inputs.hq.value.trim(),
    store: inputs.store.value.trim(),
    date : mode === 'today' ? "TO_CHAR(SYSDATE,'YYYYMMDD')" : "'" + (dateLit || 'YYYYMMDD') + "'",
    dateOp: mode === 'from' ? '>=' : '=',
    dateLabel: mode === 'today' ? '오늘 (SYSDATE)'
             : (dateLit || '(미입력)') + (mode === 'from' ? ' 이후 (>=)' : ''),
    dc   : inputs.dc.value.trim(),
    extra: inputs.extra.value.trim().replace(/;+\s*$/,'').replace(/^\s*AND\s+/i,''),
    opts : optState
  };
}

function storeCond(v){
  if(!v) return '';
  const list = v.split(',').map(x => x.trim()).filter(Boolean);
  if(list.length <= 1) return "@.STORE_CD = '" + list[0] + "'";
  return '@.STORE_CD IN (' + list.map(x => "'" + x + "'").join(',') + ')';
}

function build(sql, p, optMap){
  const lines = {
    hq   : p.hq ? "@.HQ_OFFICE_CD = '" + p.hq + "'" : '',
    store: storeCond(p.store),
    date : '@.SALE_DATE ' + p.dateOp + ' ' + p.date,
    regfg: (p.opts.regfg || '').trim() ? "@.COUPN_REG_FG = '" + p.opts.regfg.trim() + "'" : '',
    extra: p.extra ? '(' + p.extra + ')' : ''
  };
  let out = sql.replace(/^([ \t]*)\{\{LINE:(\w+):(\w*)\}\}\n/gm, (m, indent, key, alias) => {
    const cond = lines[key];
    if(!cond) return '';
    const pad = indent.length ? indent : '   ';
    return pad + 'AND ' + cond.replace(/@\./g, alias ? alias + '.' : '') + '\n';
  });
  out = out.replace(/^([ \t]*)\{\{OPT:(\w+)\}\}\n/gm, (m, indent, k) => {
    if(!optMap || optMap[k] === undefined) return m;
    const v = optMap[k];
    if(v && typeof v === 'object') return (v.raw || '') + '\n';   /* {raw:'...'} : 들여쓰기 없이 그대로 */
    if(v === '') return '';
    const pad = indent.length ? indent : '   ';
    return pad + v + '\n';
  });
  out = out.replace(/\{\{OPT:(\w+)\}\}/g, (m, k) => (optMap && optMap[k] !== undefined) ? optMap[k] : m);
  return out
    .replace(/\{\{HQ\}\}/g,    p.hq || 'HQ_OFFICE_CD')
    .replace(/\{\{STORE\}\}/g, p.store)
    .replace(/\{\{DATE\}\}/g,  p.date)
    .replace(/\{\{DC\}\}/g,    p.dc || 'DC');
}

function mk(tag, cls, text){
  const n = document.createElement(tag);

  if(text !== undefined) n.textContent = text;
  return n;
}

  CASES.forEach(c => {

    b.append(mk('span','no', c.no), mk('i','dot' + (c.status === 'ready' ? ' ready' : '')), mk('span','ttl', c.title));

  const o = {};
  (c.options || []).forEach(op => o[op.key] = op.value);

function renderOptions(){
  const host = el('case-options');
  host.textContent = '';
  if(!current.options || !current.options.length) return;
  const block = mk('div','opt-block');
  block.append(mk('div','lbl', '케이스 ' + current.no + ' 옵션'));
  current.options.forEach(op => {

    if(op.type === 'text'){

      const inp = mk('input'); inp.type = 'text'; inp.id = 'opt-' + op.key; inp.value = optState[op.key] || ''; inp.spellcheck = false;
      inp.addEventListener('input', () => { optState[op.key] = inp.value; renderCase(); });
      f.append(lab, inp);
      if(op.hint) f.append(mk('div','hint', op.hint));
    } else {
      f.append(mk('span','lbl', op.label));
      const ch = mk('div','choice');
      op.choices.forEach(cho => {
        const lab = mk('label');
        const r = mk('input'); r.type = 'radio'; r.name = 'opt-' + op.key; r.value = cho.v; r.checked = optState[op.key] === cho.v;
        r.addEventListener('change', () => { optState[op.key] = cho.v; renderCase(); });
        const sp = mk('span', null, cho.t);
        if(cho.sub) sp.append(mk('span','sub', cho.sub));
        lab.append(r, sp); ch.append(lab);
      });
      f.append(ch);
    }
    block.append(f);
  });
  host.append(block);
}

/* 카드(또는 카드 안의 텍스트 표식)로 스크롤 */
function jumpTo(tag, anchor){
  const t = document.getElementById('q-' + tag);
  if(!t) return false;
  let y = null;
  if(anchor){
    const pre = t.querySelector('pre');
    const node = pre && pre.firstChild;
    const idx = node ? node.textContent.indexOf(anchor) : -1;
    if(idx >= 0){
      const r = document.createRange(); r.setStart(node, idx); r.setEnd(node, idx + anchor.length);
      y = r.getBoundingClientRect().top + window.scrollY - 60;
    }
  }
  if(y === null) t.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block:'start' });
  else window.scrollTo({ top: y, behavior: reduced() ? 'auto' : 'smooth' });
  t.classList.remove('fade'); t.classList.add('hit');
  setTimeout(() => t.classList.add('fade'), 900);
  setTimeout(() => t.classList.remove('hit','fade'), 2000);
  return true;
}

const PHASE_LABEL = { compare:'비교', build:'생성', verify:'검증' };
const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let spyOff = null;

function buildJump(bar, refs){
  if(refs.length < 2) return;

  const first = new Map();                       // 'group|phase' → 스테이지 element
  refs.forEach(r => { if(!first.has(r.key)) first.set(r.key, r); });

  const chips = new Map();
  const multi = new Set(refs.map(r => r.group)).size > 1;
  let lastGroup = null;
  first.forEach((r, key) => {
    if(multi && r.group !== lastGroup){
      lastGroup = r.group;
      bar.append(mk('span','gl', r.glabel));
    }
    const b = mk('button', null, r.plabel || PHASE_LABEL[r.phase] || r.phase);
    b.type = 'button';
    b.title = r.name;
    b.setAttribute('aria-current','false');
    b.addEventListener('click', () =>
      r.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block:'start' }));
    bar.append(b);
    chips.set(key, b);
  });

  const up = mk('button','up','↑ 맨 위');
  up.type = 'button';
  up.addEventListener('click', () =>
    window.scrollTo({ top:0, behavior: reduced() ? 'auto' : 'smooth' }));
  bar.append(up);

  /* 스크롤 위치에 따라 현재 단계 표시 */
  const firstKey = refs[0].key;
  let ticking = false;
  const onScroll = () => {
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      let key = firstKey;
      for(const r of refs){
        if(r.el.getBoundingClientRect().top <= 76) key = r.key;
        else break;
      }
      chips.forEach((b, k) => b.setAttribute('aria-current', String(k === key)));
    });
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
  spyOff = () => window.removeEventListener('scroll', onScroll);
}

let renderedId = null;

function renderCase(){
  const c = current, host = el('main');
  const keepY = (renderedId === c.id) ? window.scrollY : 0;
  renderedId = c.id;
  if(spyOff){ spyOff(); spyOff = null; }
  host.textContent = '';

  const head = mk('div','case-head');
  head.append(mk('div','crumb','케이스 ' + c.no + ' / ' + CASES.length), mk('h3', null, c.title));

  if(c.status !== 'ready'){
    const k = PENDING_KIND[c.pending];
    head.append(mk('p', null, k.lead));
    host.append(head);
    const pd = mk('div','pending');
    pd.append(mk('h4', null, k.head), mk('p', null, k.note));
    const ul = mk('ul'); k.items.forEach(t => ul.append(mk('li', null, t)));
    pd.append(ul); host.append(pd);
    window.scrollTo(0, keepY);
    return;
  }

  head.append(mk('p', null, c.lead));
  host.append(head);

  if(c.warn){
    const w = mk('div','warn');
    w.append(mk('strong', null, c.warn.head));
    const ul = mk('ul'); c.warn.items.forEach(t => ul.append(mk('li', null, t)));
    w.append(ul); host.append(w);
  }

  const p = params();
  const optMap = c.opt ? c.opt(p) : {};
  const all = [];

  const bar = mk('div','toolbar');
  host.append(bar);
  const jump = mk('div','jump');
  host.append(jump);

  const groups = [...new Set(c.stages.map(s => s.group || ''))];
  const refs = [], guides = [], indexes = [];
  c.stages.forEach((st, i) => {
    const s = mk('div','stage'); s.id = 'stage-' + i;
    s.append(mk('span', null, st.name)); host.append(s);
    refs.push({
      el:s, group:st.group || '', phase:st.phase || 'compare',
      key:(st.group || '') + '|' + (st.phase || 'compare'),
      glabel:st.glabel || (st.name.split('—')[0] || st.name).trim(), plabel:st.plabel, name:st.name
    });
    st.items.forEach(key => {
      const q = c.queries[key];
      if(q.when && !q.when(p)) return;
      if(q.guide){ host.append(guideEl(q, c, host)); guides.push({ group:st.group || '', q }); return; }
      if(q.index){ const ph = mk('div'); ph.dataset.indexKey = key; host.append(ph); indexes.push({ ph, q }); return; }
      const kind = typeof q.kind === 'function' ? q.kind(p) : q.kind;
      const sqlText = build(q.sql, p, optMap);
      host.append(cardEl(q, sqlText, kind));
      all.push({ group:st.group || '', kind, tag:q.tag, name:q.name, sql:sqlText });
    });
  });
  indexes.forEach(x => x.ph.replaceWith(indexEl(x.q)));   /* 다른 카드의 pre 가 있어야 앵커 버튼을 만들 수 있어 마지막에 그림 */
  /* 가이드가 가리키는 쿼리를 가이드 그룹 이름으로 복사 목록에 추가 (dup 표시 → 전체/SELECT 복사에서는 제외) */
  guides.forEach(g => {
    const want = [];
    g.q.guide.forEach(step => step.items.forEach(it => { if(it.copy !== false && !want.includes(it.tag)) want.push(it.tag); }));
    want.forEach(tag => {
      const src = all.find(x => x.tag === tag && !x.dup);
      if(src) all.push(Object.assign({}, src, { group:g.group, dup:true }));
    });
  });

  const join = list => list.map(x => '/* ── [' + x.tag + '] ' + x.name + ' ── */\n' + x.sql).join('\n\n\n');
  const addBtn = (label, filter, primary) => {
    const b = mk('button', primary ? 'primary' : null, label); b.type = 'button';
    b.addEventListener('click', () => {
      const list = all.filter(filter);
      copyFrom(b, header(c, p) + join(list), label + ' — ' + list.length + '개를 복사했습니다');
    });
    bar.append(b);
  };
  addBtn('전체 복사', x => !x.dup, true);
  addBtn('SELECT 만', x => x.kind === 'SELECT' && !x.dup);
  if(groups.length > 1) groups.forEach(g => addBtn(g + ' 트랙', x => x.group === g));
  bar.append(mk('span','n', all.filter(x => !x.dup).length + '개 쿼리'));

  buildJump(jump, refs);
  window.scrollTo(0, keepY);
}

function header(c, p){
  const L = [
    '/* [케이스 ' + c.no + '] ' + c.title,
    '   HQ_OFFICE_CD = ' + (p.hq || '(미입력)'),
    '   STORE_CD     = ' + (p.store || '(본사 전체)'),
    '   SALE_DATE    = ' + p.dateLabel,
    '   DC_CD        = ' + (p.dc || '(미입력)')
  ];
  if(p.extra) L.push('   추가조건      = ' + p.extra);
  (c.options || []).forEach(op => {
    const v = p.opts[op.key];
    const label = op.type === 'radio' ? (op.choices.find(x => x.v === v) || {}).t : (v || '(없음)');
    L.push('   ' + op.label + ' = ' + label);
  });
  L.push('   생성 ' + new Date().toLocaleString('ko-KR'));
  L.push('   ※ COMMIT 은 검증 후 직접 */');
  return L.join('\n') + '\n\n';
}

/* ── 복사 ─────────────────────────────────── */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}
let toastTimer;
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copyFrom(btn, text, msg){
  const ok = await copyText(text);
  if(!ok){ toast('복사하지 못했습니다. 쿼리를 직접 선택해 복사하세요'); return; }
  const old = btn.textContent; btn.textContent = '복사됨'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1200);
  toast(msg);
}

/* ── 이벤트 ───────────────────────────────── */
function validate(){
  const v = inputs.date.value.trim();
  inputs.date.classList.toggle('bad', v !== '' && !/^\d{8}$/.test(v));
}
function syncDateMode(){
  const mode = document.querySelector('input[name=datemode]:checked').value;
  inputs.date.disabled = (mode === 'today');
}
Object.values(inputs).forEach(i => i.addEventListener('input', () => { validate(); renderCase(); }));
document.querySelectorAll('input[name=datemode]').forEach(r =>
  r.addEventListener('change', () => { syncDateMode(); renderCase(); }));

el('btn-reset').addEventListener('click', () => {
  inputs.hq.value = DEFAULTS.hq; inputs.store.value = DEFAULTS.store;
  inputs.date.value = DEFAULTS.date; inputs.dc.value = DEFAULTS.dc; inputs.extra.value = DEFAULTS.extra;
  document.querySelector('input[name=datemode][value=' + DEFAULTS.datemode + ']').checked = true;
  optState = initOpts(current);
  syncDateMode(); validate(); renderOptions(); renderCase();
  toast('기본값으로 되돌렸습니다');
});

optState = initOpts(current);
syncDateMode(); renderNav(); renderOptions(); renderCase();
</script>
